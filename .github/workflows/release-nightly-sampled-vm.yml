name: OPL Nightly Sampled VM
run-name: Nightly sampled VM for run ${{ github.event.workflow_run.id }}

on:
  workflow_run:
    workflows:
      - OPL Standard Nightly Release
    types:
      - completed

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: opl-nightly-sampled-vm
  cancel-in-progress: false

jobs:
  resolve-sample:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      sampled: ${{ steps.receipt.outputs.sampled }}
      tag: ${{ steps.receipt.outputs.tag }}
      app_ref: ${{ steps.receipt.outputs.app_ref }}
      shell_ref: ${{ steps.receipt.outputs.shell_ref }}
      framework_ref: ${{ steps.receipt.outputs.framework_ref }}
    steps:
      - name: Bind exact published Nightly and weekly sample
        id: receipt
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > source-run.json
          jq -e --arg run "$SOURCE_RUN_ID" '
            (.id | tostring) == $run
            and .path == ".github/workflows/release-nightly.yml"
            and .event == "schedule"
            and .head_branch == "main"
            and .run_attempt == 1
            and .status == "completed"
            and .conclusion == "success"
          ' source-run.json >/dev/null
          artifact="opl-nightly-publication-${SOURCE_RUN_ID}"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" > artifacts.json
          test "$(jq -r --arg name "$artifact" '[.[]?.artifacts[]? | select(.name == $name and .expired == false)] | length' artifacts.json)" = 1
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir nightly-publication
          receipt=nightly-publication/nightly-publication.json
          jq -e '
            .schema == "opl_standard_nightly_publication_receipt.v1"
            and (.status == "published" or .status == "already_complete")
            and .github_release.prerelease == true
            and .github_release.make_latest == false
            and .heavy_vm_blocking == false
            and (.cohort.app_sha | test("^[0-9a-f]{40}$"))
            and (.cohort.shell_sha | test("^[0-9a-f]{40}$"))
            and (.cohort.framework_sha | test("^[0-9a-f]{40}$"))
          ' "$receipt" >/dev/null
          test "$(jq -r .cohort.app_sha "$receipt")" = "$(jq -r .head_sha source-run.json)"
          sampled=false
          if [ "$(TZ=Asia/Shanghai date +%u)" = 6 ]; then sampled=true; fi
          {
            echo "sampled=$sampled"
            echo "tag=$(jq -er .tag "$receipt")"
            echo "app_ref=$(jq -er .cohort.app_sha "$receipt")"
            echo "shell_ref=$(jq -er .cohort.shell_sha "$receipt")"
            echo "framework_ref=$(jq -er .cohort.framework_sha "$receipt")"
          } >> "$GITHUB_OUTPUT"

  sampled-standard-vm:
    if: ${{ needs.resolve-sample.outputs.sampled == 'true' }}
    needs: [resolve-sample]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/opl-first-run-vm.yml
    with:
      mode: execute
      release_tag: ${{ needs.resolve-sample.outputs.tag }}
      artifact_app_ref: ${{ needs.resolve-sample.outputs.app_ref }}
      shell_ref: ${{ needs.resolve-sample.outputs.shell_ref }}
      smoke_harness_ref: ${{ needs.resolve-sample.outputs.shell_ref }}
      framework_ref: ${{ needs.resolve-sample.outputs.framework_ref }}
      package_profile: standard
      diagnostic_scope: release_gate
      require_macos_gatekeeper: false
