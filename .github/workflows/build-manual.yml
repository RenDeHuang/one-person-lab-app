name: '🔨 Manual Build'

permissions:
  contents: read
  actions: read

on:
  workflow_call:
    inputs:
      invocation_mode:
        description: Audited reusable route; only stable_optional_follower is accepted.
        required: true
        type: string
      platform_policy:
        description: Audited contract policy ID.
        required: true
        type: string
      platform_ids:
        description: Canonical authority-bound JSON array of audited optional Stable platform IDs.
        required: true
        type: string
      app_ref:
        description: Exact App SHA from the completed Standard cohort.
        required: true
        type: string
      shell_ref:
        description: Exact Shell SHA from the completed Standard cohort.
        required: true
        type: string
      framework_ref:
        description: Exact Framework SHA from the completed Standard cohort.
        required: true
        type: string
      opl_release_version:
        description: Exact completed Standard display version.
        required: true
        type: string
      opl_updater_version:
        description: Exact completed Standard machine updater SemVer.
        required: true
        type: string
      source_run_id:
        description: Exact completed Standard source run.
        required: true
        type: string
      source_bundle_digest:
        description: Exact completed Standard Bundle digest.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      publication_mode:
        description: Build only, or publish one independent Windows Preview/RC.
        required: true
        type: choice
        options:
          - build_only
          - windows_preview_rc
        default: build_only
      branch:
        description: 'Branch to build from'
        required: true
        default: 'main'
        type: string
      platform:
        description: 'Platform to build'
        required: true
        type: choice
        options:
          - macos-arm64
          - macos-x64
          - macos-universal
          - windows-x64
          - windows-arm64
          - linux-x64
          - linux-arm64
          - all
        default: 'macos-arm64'
      skip_code_quality:
        description: 'Skip code quality checks (faster builds for debugging)'
        required: false
        type: boolean
        default: false
      opl_release_version:
        description: 'Release version stamped into package metadata. Empty uses workflow default.'
        required: false
        type: string
        default: ''
      shell_ref:
        description: 'Exact opl-aion-shell ref. Use a 40-character SHA for an RC cohort.'
        required: false
        type: string
        default: 'main'
      framework_ref:
        description: 'Exact OPL Framework 40-character SHA bound into Windows RC evidence.'
        required: false
        type: string
        default: ''
      immutable_release_capability_evidence:
        description: 'Base64 digest-bound immutable Releases capability evidence from the owner-authenticated pre-dispatch controller.'
        required: false
        type: string
        default: ''
      macos_x64_signed_development_validation:
        description: 'Development validation only: sign/notarize one macOS x64 build from the exact triggering App SHA; never publishes.'
        required: false
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BUN_INSTALL_REGISTRY: 'https://registry.npmjs.org/'

jobs:
  prepare-matrix:
    name: Prepare Build Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      platform_count: ${{ steps.set-matrix.outputs.platform_count }}
      platform_ids: ${{ steps.set-matrix.outputs.platform_ids }}
      artifact_names: ${{ steps.set-matrix.outputs.artifact_names }}
      artifact_pattern: ${{ steps.set-matrix.outputs.artifact_pattern }}
      app_ref: ${{ steps.set-matrix.outputs.app_ref }}
      validation_profile: ${{ steps.set-matrix.outputs.validation_profile }}
      publication_mode: ${{ steps.set-matrix.outputs.publication_mode }}
      macos_x64_signed_development_validation: ${{ steps.set-matrix.outputs.macos_x64_signed_development_validation }}

    steps:
      - name: Checkout requested App source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.app_ref || inputs.branch }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'

      - name: Generate build matrix
        id: set-matrix
        shell: bash
        run: |
          set -euo pipefail
          macos_x64_signed_development_validation=false
          if [ "$GITHUB_EVENT_NAME" = workflow_call ]; then
            test '${{ inputs.invocation_mode }}' = stable_optional_follower
            test '${{ inputs.platform_policy }}' = stable_optional
            [[ '${{ inputs.app_ref }}' =~ ^[0-9a-f]{40}$ ]]
            [[ '${{ inputs.shell_ref }}' =~ ^[0-9a-f]{40}$ ]]
            [[ '${{ inputs.framework_ref }}' =~ ^[0-9a-f]{40}$ ]]
            [[ '${{ inputs.source_run_id }}' =~ ^[1-9][0-9]*$ ]]
            [[ '${{ inputs.source_bundle_digest }}' =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ '${{ inputs.opl_updater_version }}' =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
            jq -e '
              . == ["linux-x64"]
              or . == ["windows-x64"]
              or . == ["linux-x64", "windows-x64"]
            ' <<< '${{ inputs.platform_ids }}' >/dev/null || {
              echo '::error::Stable optional publication accepts only the canonical Linux x64 and Windows x64 subsets.'
              exit 1
            }
            node --experimental-strip-types scripts/resolve-release-platform-matrix.ts \
              --policy stable_optional \
              --platforms-json '${{ inputs.platform_ids }}' \
              --github-output "$GITHUB_OUTPUT"
            {
              echo 'artifact_pattern=optional-*'
              echo 'validation_profile=stable'
              echo 'publication_mode=stable_optional_follower'
            } >> "$GITHUB_OUTPUT"
          else
            test '${{ inputs.invocation_mode }}' = ''
            case '${{ inputs.macos_x64_signed_development_validation }}' in
              true)
                test '${{ inputs.publication_mode }}' = build_only || {
                  echo '::error::macos_x64_signed_development_validation is build_only-only.'
                  exit 1
                }
                test '${{ inputs.platform }}' = macos-x64 || {
                  echo '::error::macos_x64_signed_development_validation accepts only macos-x64.'
                  exit 1
                }
                test '${{ inputs.branch }}' = "$GITHUB_SHA" || {
                  echo '::error::Signed macOS x64 development validation requires branch to equal the triggering github.sha.'
                  exit 1
                }
                [[ '${{ inputs.branch }}' =~ ^[0-9a-f]{40}$ ]]
                [[ '${{ inputs.shell_ref }}' =~ ^[0-9a-f]{40}$ ]] || {
                  echo '::error::Signed macOS x64 development validation requires a 40-character Shell SHA.'
                  exit 1
                }
                [[ '${{ inputs.framework_ref }}' =~ ^[0-9a-f]{40}$ ]] || {
                  echo '::error::Signed macOS x64 development validation requires a 40-character Framework SHA.'
                  exit 1
                }
                macos_x64_signed_development_validation=true
                ;;
              false|'') ;;
              *)
                echo '::error::macos_x64_signed_development_validation must be a boolean.'
                exit 1
                ;;
            esac
            case '${{ inputs.publication_mode }}' in
              build_only)
                policy=manual_all
                validation_profile=aggregate
                artifact_pattern='*'
                ;;
              windows_preview_rc)
                case '${{ inputs.platform }}' in
                  windows-x64|windows-arm64) ;;
                  *) echo '::error::Windows Preview/RC accepts only audited Windows platform IDs.'; exit 1 ;;
                esac
                [[ '${{ inputs.branch }}' =~ ^[0-9a-f]{40}$ ]]
                [[ '${{ inputs.shell_ref }}' =~ ^[0-9a-f]{40}$ ]]
                [[ '${{ inputs.framework_ref }}' =~ ^[0-9a-f]{40}$ ]]
                [[ '${{ inputs.opl_release_version }}' =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$ ]]
                policy=windows_preview
                validation_profile=windows-preview
                artifact_pattern='windows-preview-*'
                ;;
              *)
                echo '::error::Unsupported audited manual publication mode.'
                exit 1
                ;;
            esac
            node --experimental-strip-types scripts/resolve-release-platform-matrix.ts \
              --policy "$policy" \
              --platform '${{ inputs.platform }}' \
              --github-output "$GITHUB_OUTPUT"
            {
              echo "artifact_pattern=$artifact_pattern"
              echo "validation_profile=$validation_profile"
              echo "publication_mode=${{ inputs.publication_mode }}"
            } >> "$GITHUB_OUTPUT"
          fi
          app_ref="$(git rev-parse HEAD)"
          [[ "$app_ref" =~ ^[0-9a-f]{40}$ ]]
          if [ "$macos_x64_signed_development_validation" = true ]; then
            test "$app_ref" = "$GITHUB_SHA" || {
              echo '::error::Signed macOS x64 development validation checkout is not the triggering github.sha.'
              exit 1
            }
          fi
          echo "app_ref=$app_ref" >> "$GITHUB_OUTPUT"
          echo "macos_x64_signed_development_validation=$macos_x64_signed_development_validation" >> "$GITHUB_OUTPUT"

  build-pipeline:
    if: ${{ needs.prepare-matrix.outputs.platform_count != '0' }}
    needs: prepare-matrix
    uses: ./.github/workflows/_build-reusable.yml
    with:
      matrix: ${{ needs.prepare-matrix.outputs.matrix }}
      release_validation_profile: ${{ needs.prepare-matrix.outputs.validation_profile }}
      ref: ${{ needs.prepare-matrix.outputs.app_ref }}
      skip_code_quality: ${{ inputs.skip_code_quality }}
      append_commit_hash: true
      upload_installers_only: true
      opl_release_version: ${{ inputs.opl_release_version }}
      opl_updater_version: ${{ inputs.opl_updater_version || inputs.opl_release_version }}
      require_windows_updater_assets: ${{ needs.prepare-matrix.outputs.publication_mode == 'stable_optional_follower' && contains(needs.prepare-matrix.outputs.platform_ids, 'windows-x64') }}
      require_windows_authenticode: false
      require_macos_gatekeeper: ${{ needs.prepare-matrix.outputs.macos_x64_signed_development_validation == 'true' }}
      shell_ref: ${{ inputs.shell_ref }}
      framework_ref: ${{ inputs.framework_ref }}
    secrets: inherit

  publish-selected-platforms:
    if: ${{ needs.prepare-matrix.outputs.publication_mode != 'build_only' && needs.prepare-matrix.outputs.platform_count != '0' }}
    needs: [prepare-matrix, build-pipeline]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ needs.prepare-matrix.outputs.publication_mode == 'stable_optional_follower' && 'release-stable' || 'release-preview' }}
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout exact App publisher source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ needs.prepare-matrix.outputs.app_ref }}
          persist-credentials: false

      - name: Download exact selected platform assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: ${{ needs.prepare-matrix.outputs.artifact_pattern }}
          path: selected-platform-assets
          merge-multiple: true

      - name: Publish exact platform bytes as one immutable carrier
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_PREVIEW_RELEASE_TOKEN: ${{ secrets.OPL_WINDOWS_PREVIEW_RELEASE_TOKEN }}
          PUBLICATION_MODE: ${{ needs.prepare-matrix.outputs.publication_mode }}
          APP_REF: ${{ needs.prepare-matrix.outputs.app_ref }}
          SHELL_REF: ${{ inputs.shell_ref }}
          FRAMEWORK_REF: ${{ inputs.framework_ref }}
          VERSION: ${{ inputs.opl_release_version }}
          UPDATER_VERSION: ${{ inputs.opl_updater_version || inputs.opl_release_version }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id || github.run_id }}
          SOURCE_BUNDLE_DIGEST: ${{ inputs.source_bundle_digest }}
          PLATFORM_IDS: ${{ needs.prepare-matrix.outputs.platform_ids }}
          IMMUTABLE_RELEASE_CAPABILITY_EVIDENCE: ${{ inputs.immutable_release_capability_evidence }}
          DISPATCH_ACTOR: ${{ github.actor }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          [[ "$APP_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SHELL_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$FRAMEWORK_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          case "$PUBLICATION_MODE" in
            windows_preview_rc)
              test -n "$WINDOWS_PREVIEW_RELEASE_TOKEN" || {
                echo '::error::Windows Preview publication requires the release-preview owner token with contents and workflows write permission.'
                exit 1
              }
              export GH_TOKEN="$WINDOWS_PREVIEW_RELEASE_TOKEN"
              ;;
            stable_optional_follower)
              test -z "$WINDOWS_PREVIEW_RELEASE_TOKEN"
              ;;
          esac
          mkdir -p optional-publication-evidence
          printf '0\n' > optional-publication-evidence/mutation-attempt-count.txt
          printf 'publication_admission\n' > optional-publication-evidence/failure-stage.txt
          : > optional-publication-evidence/immutable-capability-evidence-digest.txt
          case "$PUBLICATION_MODE" in
            stable_optional_follower)
              test -z "$IMMUTABLE_RELEASE_CAPABILITY_EVIDENCE"
              [[ "$SOURCE_BUNDLE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
              base_tag="v${VERSION}"
              carrier_kind=stable_optional_adjunct
              manifest_name=opl-optional-platforms-manifest.json
              expected_prerelease=false
              capability_evidence_digest=
              gh api "repos/$GITHUB_REPOSITORY/releases/tags/$base_tag" > base-release.json
              jq -e --arg tag "$base_tag" --arg target "$APP_REF" '
                .tag_name == $tag
                and .target_commitish == $target
                and .draft == false
                and .prerelease == false
                and .immutable == false
              ' base-release.json >/dev/null || {
                echo "::error::Optional Stable publication requires the exact mutable base Stable Release used for same-tag Full append."
                exit 1
              }
              ;;
            windows_preview_rc)
              test -z "$SOURCE_BUNDLE_DIGEST"
              test "$GITHUB_EVENT_NAME" = workflow_dispatch
              test "$DISPATCH_ACTOR" = "$REPOSITORY_OWNER"
              test -n "$IMMUTABLE_RELEASE_CAPABILITY_EVIDENCE"
              [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$ ]]
              tag="windows-rc-${VERSION}"
              base_tag=
              carrier_kind=windows_preview_rc
              manifest_name=opl-windows-preview-platforms-manifest.json
              expected_prerelease=true
              printf '%s' "$IMMUTABLE_RELEASE_CAPABILITY_EVIDENCE" \
                | base64 --decode > optional-publication-evidence/immutable-release-capability.json
              test -s optional-publication-evidence/immutable-release-capability.json
              capability_evidence_digest="$(
                node --experimental-strip-types --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {
            validateGithubImmutableReleaseCapabilityEvidence,
          } from './scripts/stable-operation-control.ts';

          const evidence = validateGithubImmutableReleaseCapabilityEvidence(
            JSON.parse(fs.readFileSync(
              'optional-publication-evidence/immutable-release-capability.json',
              'utf8',
            )),
            process.env.GITHUB_REPOSITORY,
          );
          const checkedAt = Date.parse(evidence.checked_at);
          const ageMilliseconds = Date.now() - checkedAt;
          if (!Number.isFinite(checkedAt) || ageMilliseconds < -300_000 || ageMilliseconds > 21_600_000) {
            throw new Error('Immutable Releases capability evidence must be generated within six hours before publication.');
          }
          process.stdout.write(evidence.evidence_digest);
          NODE
              )"
              [[ "$capability_evidence_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
              printf '%s\n' "$capability_evidence_digest" \
                > optional-publication-evidence/immutable-capability-evidence-digest.txt
              ;;
            *)
              echo '::error::Unsupported selected-platform publication mode.'
              exit 1
              ;;
          esac
          operation_id="${PUBLICATION_MODE}-${SOURCE_RUN_ID}-${GITHUB_RUN_ID}"
          latest_before="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"

          printf 'asset_inventory\n' > optional-publication-evidence/failure-stage.txt
          windows_updater_selected="$(jq -r 'index("windows-x64") != null' <<<"$PLATFORM_IDS")"
          if [ "$PUBLICATION_MODE" = stable_optional_follower ] && [ "$windows_updater_selected" = true ]; then
            updater_validation_args=(
              --artifact-dir selected-platform-assets
              --release-version "$VERSION"
              --updater-version "$UPDATER_VERSION"
              --output selected-platform-assets/opl-windows-updater-assets.json
            )
            authenticode_receipt=selected-platform-assets/opl-windows-authenticode-receipt.json
            if [ -f "$authenticode_receipt" ]; then
              updater_validation_args+=(--authenticode-receipt "$authenticode_receipt")
            fi
            node --experimental-strip-types scripts/validate-windows-updater-assets.ts \
              "${updater_validation_args[@]}" \
              > optional-publication-evidence/windows-updater-validation.json
          else
            test -z "$(find selected-platform-assets -maxdepth 1 -type f \
              \( -name 'latest.yml' -o -name '*.exe.blockmap' -o -name 'opl-windows-updater-assets.json' \
                 -o -name 'opl-windows-authenticode-receipt.json' \) \
              -print -quit)" || {
                echo '::error::Windows updater assets are allowed only for an authority-selected Stable optional windows-x64 build.'
                exit 1
              }
          fi
          asset_paths=()
          while IFS= read -r file_path; do asset_paths+=("$file_path"); done < <(
            find selected-platform-assets -type f \
              \( -name '*.dmg' -o -name '*.deb' -o -name '*.exe' -o -name '*.msi' \
                 -o -name 'download-windows-preview.ps1' -o -name 'SHA256SUMS.txt' \) \
              -print | LC_ALL=C sort
          )
          if [ "$PUBLICATION_MODE" = stable_optional_follower ] && [ "$windows_updater_selected" = true ]; then
            for updater_name in latest.yml opl-windows-updater-assets.json; do
              updater_paths=()
              while IFS= read -r file_path; do updater_paths+=("$file_path"); done < <(
                find selected-platform-assets -maxdepth 1 -type f -name "$updater_name" -print
              )
              test "${#updater_paths[@]}" = 1
              asset_paths+=("${updater_paths[0]}")
            done
            if [ -f selected-platform-assets/opl-windows-authenticode-receipt.json ]; then
              asset_paths+=(selected-platform-assets/opl-windows-authenticode-receipt.json)
            fi
            blockmap_paths=()
            while IFS= read -r file_path; do blockmap_paths+=("$file_path"); done < <(
              find selected-platform-assets -maxdepth 1 -type f -name '*.exe.blockmap' -print
            )
            test "${#blockmap_paths[@]}" = 1
            asset_paths+=("${blockmap_paths[0]}")
          fi
          test "${#asset_paths[@]}" -gt 0
          jq -n '[]' > optional-publication-evidence/assets.json
          for asset_path in "${asset_paths[@]}"; do
            asset_name="$(basename "$asset_path")"
            asset_size="$(wc -c < "$asset_path" | tr -d ' ')"
            test "$asset_size" -gt 0
            asset_digest="sha256:$(shasum -a 256 "$asset_path" | awk '{print $1}')"
            [[ "$asset_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            jq \
              --arg name "$asset_name" --arg digest "$asset_digest" --argjson size "$asset_size" \
              --arg source_path "$asset_path" \
              '. + [{name:$name,digest:$digest,size_bytes:$size,source_path:$source_path}]' \
              optional-publication-evidence/assets.json \
              > optional-publication-evidence/assets.next.json
            mv optional-publication-evidence/assets.next.json optional-publication-evidence/assets.json
          done
          printf 'manifest_generation\n' > optional-publication-evidence/failure-stage.txt
          jq -S -n \
            --arg kind "$carrier_kind" \
            --arg source_run_id "$SOURCE_RUN_ID" \
            --arg bundle_digest "$SOURCE_BUNDLE_DIGEST" \
            --arg base_tag "$base_tag" \
            --arg capability_evidence_digest "$capability_evidence_digest" \
            --arg dispatch_actor "$DISPATCH_ACTOR" \
            --arg display_version "$VERSION" --arg updater_version "$UPDATER_VERSION" \
            --arg app "$APP_REF" --arg shell "$SHELL_REF" --arg framework "$FRAMEWORK_REF" \
            --argjson platforms "$PLATFORM_IDS" \
            --argjson assets "$(jq 'map(del(.source_path))' optional-publication-evidence/assets.json)" '
              {
                schema:"opl_app_immutable_platform_adjunct_manifest.v1",
                kind:$kind,
                source:{run_id:$source_run_id,bundle_digest:(if $bundle_digest == "" then null else $bundle_digest end)},
                base_release_tag:(if $base_tag == "" then null else $base_tag end),
                release_identity:{display_version:$display_version,updater_version:$updater_version},
                cohort:{app_sha:$app,shell_sha:$shell,framework_sha:$framework},
                platforms:$platforms,
                assets:$assets,
                publication_control:{
                  immutable_release_capability_evidence_digest:(
                    if $capability_evidence_digest == "" then null else $capability_evidence_digest end
                  ),
                  dispatch_actor:(if $capability_evidence_digest == "" then null else $dispatch_actor end)
                }
              }
            ' > "selected-platform-assets/$manifest_name"
          manifest_path="selected-platform-assets/$manifest_name"
          test -s "$manifest_path"
          jq -e \
            --arg kind "$carrier_kind" \
            --arg source_run_id "$SOURCE_RUN_ID" \
            --arg bundle_digest "$SOURCE_BUNDLE_DIGEST" \
            --arg base_tag "$base_tag" \
            --arg capability_evidence_digest "$capability_evidence_digest" \
            --arg dispatch_actor "$DISPATCH_ACTOR" \
            --arg display_version "$VERSION" --arg updater_version "$UPDATER_VERSION" \
            --arg app "$APP_REF" --arg shell "$SHELL_REF" --arg framework "$FRAMEWORK_REF" \
            --argjson platforms "$PLATFORM_IDS" '
              .schema == "opl_app_immutable_platform_adjunct_manifest.v1"
              and .kind == $kind
              and .source.run_id == $source_run_id
              and .source.bundle_digest == (if $bundle_digest == "" then null else $bundle_digest end)
              and .base_release_tag == (if $base_tag == "" then null else $base_tag end)
              and .release_identity == {display_version:$display_version,updater_version:$updater_version}
              and .cohort == {app_sha:$app,shell_sha:$shell,framework_sha:$framework}
              and .platforms == $platforms
              and (.assets | type == "array" and length > 0)
              and all(.assets[];
                (.name | type == "string" and length > 0)
                and (.digest | test("^sha256:[0-9a-f]{64}$"))
                and (.size_bytes | type == "number" and . > 0))
              and .publication_control.immutable_release_capability_evidence_digest
                == (if $capability_evidence_digest == "" then null else $capability_evidence_digest end)
              and .publication_control.dispatch_actor
                == (if $capability_evidence_digest == "" then null else $dispatch_actor end)
            ' "$manifest_path" >/dev/null
          manifest_size="$(wc -c < "$manifest_path" | tr -d ' ')"
          test "$manifest_size" -gt 0
          manifest_digest="sha256:$(shasum -a 256 "$manifest_path" | awk '{print $1}')"
          [[ "$manifest_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          jq \
            --arg name "$manifest_name" --arg digest "$manifest_digest" --argjson size "$manifest_size" \
            --arg source_path "$manifest_path" \
            '. + [{name:$name,digest:$digest,size_bytes:$size,source_path:$source_path}]' \
            optional-publication-evidence/assets.json \
            > optional-publication-evidence/assets.next.json
          mv optional-publication-evidence/assets.next.json optional-publication-evidence/assets.json
          if [ "$PUBLICATION_MODE" = stable_optional_follower ]; then
            manifest_hex="${manifest_digest#sha256:}"
            tag="${base_tag}-optional-${manifest_hex:0:12}"
            release_name="One Person Lab ${VERSION} optional platform adjunct"
            printf -v release_notes '%s\n\n%s\n%s\n%s\n' \
              "Immutable optional-platform adjunct for One Person Lab ${VERSION}." \
              "Base Stable Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${base_tag}" \
              "Bundle digest: ${SOURCE_BUNDLE_DIGEST}" \
              'Download the selected platform installers and machine manifest from this adjunct Release. The base Stable Release and Latest are unchanged.'
          else
            release_name="One Person Lab Windows Preview ${VERSION}"
            release_notes_template="$(
              cat <<'EOF'
          One Person Lab Windows Preview __VERSION__

          This is an opt-in Windows 11 x64 Preview. It is independent from Stable and never moves GitHub Latest.

          ## What changed

          - Added a persistent BITS download helper with visible progress, reconnect support, and fail-closed SHA-256 verification.
          - Bound the helper to this exact RC installer digest and size, removing the unauthenticated GitHub REST API rate-limit dependency from the download path.
          - Added actionable recovery when packaged runtime components are missing: recheck, safe diagnostics, local logs, support, and the official download page.
          - Kept Docker/WebUI as a separate installation path; this Desktop Preview does not install, modify, or take over Docker.

          ## Recommended download for slow or unstable networks

          Download these assets:

          - `download-windows-preview.ps1`
          - `SHA256SUMS.txt`

          Then run in a regular PowerShell window:

          ```powershell
          cd "$HOME\Downloads\OPL-RC"
          powershell -ExecutionPolicy Bypass -File ".\download-windows-preview.ps1" `
            -ReleaseTag "windows-rc-__VERSION__" `
            -AssetName "One-Person-Lab-__VERSION__-win-x64.exe"
          ```

          The helper uses a persistent Windows BITS job. It reports transferred bytes and percentage, keeps partial progress across temporary network loss or a closed PowerShell window, and verifies its release-bound installer digest and size plus `SHA256SUMS.txt` before exposing the final EXE. It does not require an unauthenticated GitHub API request.

          Direct browser download remains available as a fallback. If a click appears to do nothing, open the browser download list before clicking again.

          ## Security and release scope

          Do not disable Microsoft Defender or SmartScreen. This Preview may still show a SmartScreen prompt until production Authenticode signing and reputation are available.

          This Release is a prerelease, is not Stable, does not replace GitHub Latest, and does not update the in-App Stable channel, Homebrew, or WebUI Stable.
          EOF
            )"
            release_notes="${release_notes_template//__VERSION__/$VERSION}"
          fi

          fetch_release_including_drafts() {
            local target_tag="$1"
            local output_path="$2"
            local releases_path=optional-publication-evidence/owner-visible-releases.json
            local match_count
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$target_tag" \
              > "$output_path" 2>/dev/null; then
              return 0
            fi
            if ! gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --slurp > "$releases_path"; then
              return 2
            fi
            if ! match_count="$(
              jq -er --arg tag "$target_tag" \
                '[.[][] | select(.tag_name == $tag)] | length' "$releases_path"
            )"; then
              return 2
            fi
            if [ "$match_count" -gt 1 ]; then
              echo "::error::Multiple owner-visible Releases use tag $target_tag."
              return 2
            fi
            if [ "$match_count" = 0 ]; then
              rm -f "$output_path"
              return 1
            fi
            jq -e --arg tag "$target_tag" \
              'first(.[][] | select(.tag_name == $tag))' "$releases_path" \
              > "$output_path"
          }

          printf 'release_reconciliation\n' > optional-publication-evidence/failure-stage.txt
          release_json=selected-platform-release.json
          set +e
          fetch_release_including_drafts "$tag" "$release_json"
          release_lookup_status=$?
          set -e
          if [ "$release_lookup_status" -gt 1 ]; then
            echo "::error::Owner-visible Release reconciliation failed before mutation."
            exit "$release_lookup_status"
          fi
          if [ "$release_lookup_status" = 1 ]; then
            printf 'draft_release_creation\n' > optional-publication-evidence/failure-stage.txt
            jq -n \
              --arg tag "$tag" --arg target "$APP_REF" --arg name "$release_name" \
              --arg body "$release_notes" --argjson prerelease "$expected_prerelease" \
              '{tag_name:$tag,target_commitish:$target,name:$name,body:$body,draft:true,prerelease:$prerelease,make_latest:"false"}' \
              > release-create.json
            attempts="$(cat optional-publication-evidence/mutation-attempt-count.txt)"
            printf '%s\n' "$((attempts + 1))" > optional-publication-evidence/mutation-attempt-count.txt
            set +e
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              --input release-create.json > release-create-response.json
            create_status=$?
            set -e
            create_response_valid=false
            if [ "$create_status" = 0 ] \
              && jq -e '.id and .tag_name and .draft == true' \
                release-create-response.json >/dev/null 2>&1; then
              release_id="$(jq -er .id release-create-response.json)"
              if gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$release_json"; then
                create_response_valid=true
              fi
            fi
            if [ "$create_response_valid" = false ]; then
              set +e
              fetch_release_including_drafts "$tag" "$release_json"
              release_lookup_status=$?
              set -e
            else
              release_lookup_status=0
            fi
            if [ "$release_lookup_status" -ne 0 ]; then
              echo "::error::Draft Release creation result is unknown; no retry is allowed in this operation."
              if [ "$create_status" -eq 0 ]; then
                exit 1
              fi
              exit "$create_status"
            fi
          fi
          jq -e \
            --arg tag "$tag" --arg target "$APP_REF" --arg name "$release_name" \
            --arg body "$release_notes" --argjson prerelease "$expected_prerelease" '
              .tag_name == $tag
              and .target_commitish == $target
              and .name == $name
              and .body == $body
              and .prerelease == $prerelease
              and (.draft == true or (.draft == false and .immutable == true))
            ' "$release_json" >/dev/null
          release_id="$(jq -er .id "$release_json")"

          jq -e \
            --argjson expected "$(cat optional-publication-evidence/assets.json)" '
              . as $release
              | all(.assets[]?;
                  . as $remote
                  | any($expected[];
                      .name == $remote.name
                      and .digest == $remote.digest
                      and .size_bytes == $remote.size))
              and ([.assets[]?.name] | length == (unique | length))
            ' "$release_json" >/dev/null
          if [ "$(jq -r .draft "$release_json")" = true ]; then
            while IFS= read -r action; do
              asset_name="$(jq -r .name <<<"$action")"
              asset_path="$(jq -r .source_path <<<"$action")"
              asset_digest="$(jq -r .digest <<<"$action")"
              asset_size="$(jq -r .size_bytes <<<"$action")"
              remote_count="$(jq --arg name "$asset_name" '[.assets[] | select(.name == $name)] | length' "$release_json")"
              test "$remote_count" -le 1
              if [ "$remote_count" = 0 ]; then
                printf 'draft_asset_upload\n' > optional-publication-evidence/failure-stage.txt
                attempts="$(cat optional-publication-evidence/mutation-attempt-count.txt)"
                printf '%s\n' "$((attempts + 1))" > optional-publication-evidence/mutation-attempt-count.txt
                set +e
                gh release upload "$tag" "$asset_path" --repo "$GITHUB_REPOSITORY"
                upload_status=$?
                set -e
                gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$release_json" || {
                  echo "::error::Draft asset upload result is unknown; no retry is allowed in this operation."
                  if [ "$upload_status" -eq 0 ]; then
                    exit 1
                  fi
                  exit "$upload_status"
                }
              fi
              jq -e --arg name "$asset_name" --arg digest "$asset_digest" --argjson size "$asset_size" '
                [.assets[] | select(.name == $name)]
                | length == 1 and .[0].digest == $digest and .[0].size == $size
              ' "$release_json" >/dev/null
            done < <(jq -c '.[]' optional-publication-evidence/assets.json)
            jq -e \
              --argjson expected "$(cat optional-publication-evidence/assets.json)" '
                . as $release
                | (.assets | length) == ($expected | length)
                and all($expected[];
                  . as $asset
                  | any($release.assets[];
                      .name == $asset.name
                      and .digest == $asset.digest
                      and .size == $asset.size_bytes))
              ' "$release_json" >/dev/null
            printf 'immutable_release_publication\n' > optional-publication-evidence/failure-stage.txt
            jq -n '{draft:false,make_latest:"false"}' > release-publish.json
            attempts="$(cat optional-publication-evidence/mutation-attempt-count.txt)"
            printf '%s\n' "$((attempts + 1))" > optional-publication-evidence/mutation-attempt-count.txt
            set +e
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              --input release-publish.json > release-publish-response.json
            publish_status=$?
            set -e
            gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$release_json" || {
              echo "::error::Immutable publication result is unknown; no retry is allowed in this operation."
              if [ "$publish_status" -eq 0 ]; then
                exit 1
              fi
              exit "$publish_status"
            }
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > "$release_json"
          jq -e \
            --arg tag "$tag" --arg target "$APP_REF" --argjson prerelease "$expected_prerelease" \
            --argjson expected "$(cat optional-publication-evidence/assets.json)" '
              . as $release
              | .tag_name == $tag
              and .target_commitish == $target
              and .draft == false
              and .prerelease == $prerelease
              and .immutable == true
              and (.assets | length) == ($expected | length)
              and all($expected[];
                . as $asset
                | any($release.assets[];
                    .name == $asset.name
                    and .digest == $asset.digest
                    and .size == $asset.size_bytes))
            ' "$release_json" >/dev/null
          latest_after="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          test "$latest_after" = "$latest_before"
          test "$latest_after" != "$tag"
          release_url="$(jq -er .html_url "$release_json")"
          download_base="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag"
          jq -n \
            --arg operation_id "$operation_id" --arg mode "$PUBLICATION_MODE" \
            --arg source_run_id "$SOURCE_RUN_ID" --arg bundle_digest "$SOURCE_BUNDLE_DIGEST" \
            --arg app "$APP_REF" --arg shell "$SHELL_REF" --arg framework "$FRAMEWORK_REF" \
            --arg base_tag "$base_tag" --arg tag "$tag" --arg release_url "$release_url" \
            --arg download_base "$download_base" --arg manifest_name "$manifest_name" \
            --arg manifest_digest "$manifest_digest" \
            --arg display_version "$VERSION" --arg updater_version "$UPDATER_VERSION" \
            --arg capability_evidence_digest "$capability_evidence_digest" \
            --arg dispatch_actor "$DISPATCH_ACTOR" \
            --arg latest_before "$latest_before" --arg latest_after "$latest_after" \
            --argjson platforms "$PLATFORM_IDS" \
            --argjson assets "$(jq 'map(del(.source_path))' optional-publication-evidence/assets.json)" \
            --argjson mutation_attempt_count "$(cat optional-publication-evidence/mutation-attempt-count.txt)" '
              {
                schema:"opl_app_optional_platform_publication_receipt.v1",
                status:"passed",
                operation_id:$operation_id,
                mode:$mode,
                source:{run_id:$source_run_id,bundle_digest:(if $bundle_digest == "" then null else $bundle_digest end)},
                release_identity:{display_version:$display_version,updater_version:$updater_version},
                cohort:{app_sha:$app,shell_sha:$shell,framework_sha:$framework},
                publication_control:{
                  immutable_release_capability_evidence_digest:(
                    if $capability_evidence_digest == "" then null else $capability_evidence_digest end
                  ),
                  dispatch_actor:(if $capability_evidence_digest == "" then null else $dispatch_actor end)
                },
                release:{
                  carrier:"independent_immutable_release",
                  base_tag:(if $base_tag == "" then null else $base_tag end),
                  tag:$tag,
                  url:$release_url,
                  download_base_url:$download_base,
                  immutable:true,
                  make_latest:false,
                  platforms:$platforms,
                  assets:$assets,
                  manifest:{name:$manifest_name,digest:$manifest_digest}
                },
                mutation:{attempt_count:$mutation_attempt_count,retry_performed:false},
                invariants:{
                  base_stable_terminal_modified:false,
                  latest_modified:false,
                  latest_before:$latest_before,
                  latest_after:$latest_after
                }
              }
            ' > optional-publication-evidence/receipt.json
          printf 'passed\n' > optional-publication-evidence/failure-stage.txt

      - name: Persist typed optional publication failure
        if: ${{ failure() }}
        shell: bash
        run: |
          mkdir -p optional-publication-evidence
          attempts="$(cat optional-publication-evidence/mutation-attempt-count.txt 2>/dev/null || printf 0)"
          failure_stage="$(cat optional-publication-evidence/failure-stage.txt 2>/dev/null || printf publication_admission)"
          capability_evidence_digest="$(
            cat optional-publication-evidence/immutable-capability-evidence-digest.txt 2>/dev/null || true
          )"
          jq -n \
            --arg mode '${{ needs.prepare-matrix.outputs.publication_mode }}' \
            --arg source_run_id '${{ inputs.source_run_id || github.run_id }}' \
            --arg failure_stage "$failure_stage" \
            --arg capability_evidence_digest "$capability_evidence_digest" \
            --argjson attempts "$attempts" '
              {
                schema:"opl_app_optional_platform_publication_failure.v1",
                status:"failed",
                mode:$mode,
                source_run_id:$source_run_id,
                failure_stage:$failure_stage,
                immutable_release_capability_evidence_digest:(
                  if $capability_evidence_digest == "" then null else $capability_evidence_digest end
                ),
                mutation_attempt_count:$attempts,
                retry_performed:false,
                recovery:"start_distinct_operation_after_read_only_reconciliation"
              }
            ' > optional-publication-evidence/failure.json

      - name: Upload durable selected-platform publication receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: opl-selected-platform-publication-${{ github.run_id }}
          path: optional-publication-evidence
          if-no-files-found: error
          retention-days: 30
