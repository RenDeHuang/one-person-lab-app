name: '🔨 Manual Build'

permissions:
  contents: read
  actions: read

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from'
        required: true
        default: 'main'
        type: string
      platform:
        description: 'Platform to build'
        required: true
        type: choice
        options:
          - macos-arm64
          - macos-x64
          - macos-universal
          - windows-x64
          - windows-arm64
          - linux-x64
          - linux-arm64
          - all
        default: 'macos-arm64'
      skip_code_quality:
        description: 'Skip code quality checks (faster builds for debugging)'
        required: false
        type: boolean
        default: false
      opl_release_version:
        description: 'Release version stamped into package metadata. Empty uses workflow default.'
        required: false
        type: string
        default: ''
      shell_ref:
        description: 'Exact opl-aion-shell ref. Use a 40-character SHA for an RC cohort.'
        required: false
        type: string
        default: 'main'
      framework_ref:
        description: 'Exact OPL Framework 40-character SHA bound into Windows RC evidence.'
        required: false
        type: string
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BUN_INSTALL_REGISTRY: 'https://registry.npmjs.org/'

jobs:
  prepare-matrix:
    name: Prepare Build Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Generate build matrix
        id: set-matrix
        shell: bash
        run: |
          PLATFORM="${{ inputs.platform }}"

          MACOS_ARM64='{"platform":"macos-arm64","os":"macos-latest","command":"node scripts/build-with-builder.js arm64 --mac --arm64","artifact-name":"macos-build-arm64","arch":"arm64"}'
          MACOS_X64='{"platform":"macos-x64","os":"macos-latest","command":"node scripts/build-with-builder.js x64 --mac --x64","artifact-name":"macos-build-x64","arch":"x64"}'
          MACOS_UNIVERSAL='{"platform":"macos-universal","os":"macos-latest","command":"node scripts/build-with-builder.js universal --mac --universal","artifact-name":"macos-build-universal","arch":"universal","native_arch":"arm64"}'
          WINDOWS_X64='{"platform":"windows-x64","os":"windows-latest","command":"node scripts/build-with-builder.js x64 --win --x64","artifact-name":"windows-build-x64","arch":"x64"}'
          WINDOWS_ARM64='{"platform":"windows-arm64","os":"windows-latest","command":"node scripts/build-with-builder.js arm64 --win --arm64","artifact-name":"windows-build-arm64","arch":"arm64"}'
          LINUX_X64='{"platform":"linux-x64","os":"ubuntu-latest","command":"node scripts/build-with-builder.js x64 --linux --x64","artifact-name":"linux-build-x64","arch":"x64"}'
          LINUX_ARM64='{"platform":"linux-arm64","os":"ubuntu-latest","command":"node scripts/build-with-builder.js arm64 --linux --arm64","artifact-name":"linux-build-arm64","arch":"arm64"}'

          case "$PLATFORM" in
            macos-arm64)
              MATRIX="{\"include\":[$MACOS_ARM64]}"
              ;;
            macos-x64)
              MATRIX="{\"include\":[$MACOS_X64]}"
              ;;
            macos-universal)
              MATRIX="{\"include\":[$MACOS_UNIVERSAL]}"
              ;;
            windows-x64)
              MATRIX="{\"include\":[$WINDOWS_X64]}"
              ;;
            windows-arm64)
              MATRIX="{\"include\":[$WINDOWS_ARM64]}"
              ;;
            linux-x64)
              MATRIX="{\"include\":[$LINUX_X64]}"
              ;;
            linux-arm64)
              MATRIX="{\"include\":[$LINUX_ARM64]}"
              ;;
            all)
              MATRIX="{\"include\":[$MACOS_ARM64,$WINDOWS_X64,$WINDOWS_ARM64,$LINUX_X64,$LINUX_ARM64]}"
              ;;
            *)
              echo "::error::Unsupported App desktop build platform: $PLATFORM"
              exit 1
              ;;
          esac

          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "Generated matrix for platform '$PLATFORM':"
          echo "$MATRIX" | python3 -m json.tool

  build-pipeline:
    needs: prepare-matrix
    uses: ./.github/workflows/_build-reusable.yml
    with:
      matrix: ${{ needs.prepare-matrix.outputs.matrix }}
      ref: ${{ inputs.branch }}
      skip_code_quality: ${{ inputs.skip_code_quality }}
      append_commit_hash: true
      upload_installers_only: true
      opl_release_version: ${{ inputs.opl_release_version }}
      shell_ref: ${{ inputs.shell_ref }}
      framework_ref: ${{ inputs.framework_ref }}
    secrets: inherit
