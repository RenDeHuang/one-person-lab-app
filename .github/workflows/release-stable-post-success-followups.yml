name: OPL Stable Desktop Release Set Follow-up
run-name: Desktop Release Set follow-up for Stable run ${{ github.event.workflow_run.id }}

on:
  workflow_run:
    workflows:
      - OPL Stable Release Bundle
    types:
      - completed

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: opl-stable-desktop-release-set-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  admit:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_run_id: ${{ steps.source.outputs.source_run_id }}
      operation_kind: ${{ steps.source.outputs.operation_kind }}
      applicable: ${{ steps.source.outputs.applicable }}
      source_artifact: ${{ steps.source.outputs.source_artifact }}
      app_ref: ${{ steps.bind.outputs.app_ref }}
      shell_ref: ${{ steps.bind.outputs.shell_ref }}
      framework_ref: ${{ steps.bind.outputs.framework_ref }}
      version: ${{ steps.bind.outputs.version }}
      updater_version: ${{ steps.bind.outputs.updater_version }}
      source_bundle_digest: ${{ steps.bind.outputs.source_bundle_digest }}
      desktop_platforms: ${{ steps.bind.outputs.desktop_platforms }}
      release_id: ${{ steps.bind.outputs.release_id }}
      release_tag: ${{ steps.bind.outputs.release_tag }}
    steps:
      - name: Validate successful Stable source run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > source-run.json
          jq -e --arg run "$SOURCE_RUN_ID" --arg head "$SOURCE_HEAD_SHA" '
            (.id | tostring) == $run
            and .repository.full_name == "gaofeng21cn/one-person-lab-app"
            and .head_repository.full_name == "gaofeng21cn/one-person-lab-app"
            and .path == ".github/workflows/release-stable.yml"
            and .event == "workflow_dispatch"
            and .head_branch == "main"
            and .head_sha == $head
            and .run_attempt == 1
            and .status == "completed"
            and .conclusion == "success"
          ' source-run.json >/dev/null
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "opl-release-operation-admission-$SOURCE_RUN_ID" --dir operation-admission
          mapfile -t admissions < <(find operation-admission -type f -name release-operation-admission.json -print | LC_ALL=C sort)
          test "${#admissions[@]}" = 1
          operation_kind="$(jq -er '.operation | strings' "${admissions[0]}")"
          case "$operation_kind" in
            standard) artifact="opl-release-standard-checkpoint-$SOURCE_RUN_ID"; applicable=true ;;
            resume_standard) artifact="opl-release-standard-operation-checkpoint-$SOURCE_RUN_ID"; applicable=true ;;
            append_full) artifact=''; applicable=false ;;
            *) echo "::error::Unsupported structured Stable source operation: $operation_kind"; exit 1 ;;
          esac
          {
            echo "source_run_id=$SOURCE_RUN_ID"
            echo "source_head_sha=$SOURCE_HEAD_SHA"
            echo "source_artifact=$artifact"
            echo "operation_kind=$operation_kind"
            echo "applicable=$applicable"
          } >> "$GITHUB_OUTPUT"

      - name: Download exact Standard checkpoint
        if: ${{ steps.source.outputs.applicable == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ steps.source.outputs.source_artifact }}
          run-id: ${{ steps.source.outputs.source_run_id }}
          github-token: ${{ github.token }}
          path: standard-checkpoint

      - name: Bind one mutable Stable Release Set
        id: bind
        if: ${{ steps.source.outputs.applicable == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.source_run_id }}
          SOURCE_ARTIFACT: ${{ steps.source.outputs.source_artifact }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t checkpoints < <(find standard-checkpoint -type f -name checkpoint.json -print | LC_ALL=C sort)
          mapfile -t bundles < <(find standard-checkpoint -type f -name bundle.json -print | LC_ALL=C sort)
          mapfile -t controls < <(find standard-checkpoint -type f -name stable-operation-control.json -print | LC_ALL=C sort)
          test "${#checkpoints[@]}" = 1
          test "${#bundles[@]}" = 1
          test "${#controls[@]}" = 1
          checkpoint="${checkpoints[0]}"
          bundle="${bundles[0]}"
          control="${controls[0]}"
          case "$(jq -er .checkpoint_stage "$checkpoint")" in standard_built|standard_qualified) ;; *) exit 1 ;; esac
          jq -e '
            .release.channel == "stable"
            and .release.prerelease == false
            and (.release.version | test("^[0-9]{2}\\.[0-9]{1,2}\\.[0-9]{1,2}(?:-r[1-9][0-9]*)?$"))
            and (.release.tag == ("v" + .release.version))
            and (.sources.app.source_commit | test("^[0-9a-f]{40}$"))
            and (.sources.shell.source_commit | test("^[0-9a-f]{40}$"))
            and (.sources.framework.source_commit | test("^[0-9a-f]{40}$"))
          ' "$bundle" >/dev/null
          version="$(jq -er .release.version "$bundle")"
          updater="$(jq -er .release.updater_version "$bundle")"
          tag="$(jq -er .release.tag "$bundle")"
          app="$(jq -er .sources.app.source_commit "$bundle")"
          shell="$(jq -er .sources.shell.source_commit "$bundle")"
          framework="$(jq -er .sources.framework.source_commit "$bundle")"
          bundle_digest="$(jq -er .bundle_digest "$bundle")"
          platforms="$(jq -cer .desktop_additional_platforms "$control")"
          test "$platforms" = '["linux-x64","windows-x64"]'
          test "$(jq -er .cohort.app_sha "$control")" = "$app"
          test "$(jq -er .cohort.shell_sha "$control")" = "$shell"
          test "$(jq -er .cohort.framework_sha "$control")" = "$framework"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > stable-release.json
          jq -e --arg tag "$tag" --arg target "$app" '
            .tag_name == $tag and .target_commitish == $target
            and .draft == false and .prerelease == false and .immutable == false
            and ([.assets[].name] | length == (unique | length))
          ' stable-release.json >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > latest-release.json
          jq -e --arg tag "$tag" '.tag_name == $tag and .draft == false and .prerelease == false' latest-release.json >/dev/null
          {
            echo "source_run_id=$SOURCE_RUN_ID"
            echo "source_artifact=$SOURCE_ARTIFACT"
            echo "operation_kind=${{ steps.source.outputs.operation_kind }}"
            echo "applicable=true"
            echo "app_ref=$app"
            echo "shell_ref=$shell"
            echo "framework_ref=$framework"
            echo "version=$version"
            echo "updater_version=$updater"
            echo "source_bundle_digest=$bundle_digest"
            echo "desktop_platforms=$platforms"
            echo "release_id=$(jq -er .id stable-release.json)"
            echo "release_tag=$tag"
          } >> "$GITHUB_OUTPUT"

  build-desktop-platforms:
    if: ${{ needs.admit.outputs.applicable == 'true' }}
    needs: [admit]
    uses: ./.github/workflows/build-manual.yml
    with:
      invocation_mode: stable_release_set_build
      platform_policy: stable_desktop_additional
      app_ref: ${{ needs.admit.outputs.app_ref }}
      shell_ref: ${{ needs.admit.outputs.shell_ref }}
      framework_ref: ${{ needs.admit.outputs.framework_ref }}
      opl_release_version: ${{ needs.admit.outputs.version }}
      opl_updater_version: ${{ needs.admit.outputs.updater_version }}
      source_run_id: ${{ needs.admit.outputs.source_run_id }}
      source_bundle_digest: ${{ needs.admit.outputs.source_bundle_digest }}
      platform_ids: ${{ needs.admit.outputs.desktop_platforms }}
    secrets: inherit

  append-desktop-platforms:
    if: ${{ needs.admit.outputs.applicable == 'true' }}
    needs: [admit, build-desktop-platforms]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release-stable
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout exact Stable cohort publisher
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ needs.admit.outputs.app_ref }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - name: Install App root validation dependencies
        run: npm ci --ignore-scripts
      - name: Download exact Desktop platform artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: stable-desktop-*
          path: selected-platform-assets
          merge-multiple: true
      - name: Materialize exact Desktop Release Set append
        env:
          VERSION: ${{ needs.admit.outputs.version }}
          UPDATER_VERSION: ${{ needs.admit.outputs.updater_version }}
          APP_REF: ${{ needs.admit.outputs.app_ref }}
          SHELL_REF: ${{ needs.admit.outputs.shell_ref }}
          FRAMEWORK_REF: ${{ needs.admit.outputs.framework_ref }}
          SOURCE_RUN_ID: ${{ needs.admit.outputs.source_run_id }}
          SOURCE_BUNDLE_DIGEST: ${{ needs.admit.outputs.source_bundle_digest }}
          PLATFORM_IDS: ${{ needs.admit.outputs.desktop_platforms }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir desktop-release-assets
          find selected-platform-assets -type f \
            \( -name '*.deb' -o -name '*.exe' -o -name '*.exe.blockmap' -o -name 'latest.yml' -o -name 'opl-windows-updater-assets.json' \) \
            -exec cp {} desktop-release-assets/ \;
          test "$(find desktop-release-assets -maxdepth 1 -type f -name '*.deb' | wc -l | tr -d ' ')" = 1
          test "$(find desktop-release-assets -maxdepth 1 -type f -name '*.exe' | wc -l | tr -d ' ')" = 1
          test "$(find desktop-release-assets -maxdepth 1 -type f -name '*.exe.blockmap' | wc -l | tr -d ' ')" = 1
          test -f desktop-release-assets/latest.yml
          test -f desktop-release-assets/opl-windows-updater-assets.json
          node --experimental-strip-types scripts/validate-windows-updater-assets.ts \
            --artifact-dir desktop-release-assets --release-version "$VERSION" \
            --updater-version "$UPDATER_VERSION" \
            --output desktop-release-assets/opl-windows-updater-assets.json >/dev/null
          assets="$(for file in desktop-release-assets/*; do jq -n --arg name "$(basename "$file")" --arg digest "sha256:$(sha256sum "$file" | awk '{print $1}')" --argjson size "$(wc -c < "$file")" '{name:$name,digest:$digest,size:$size}'; done | jq -cs 'sort_by(.name)')"
          jq -S -n --arg version "$VERSION" --arg updater "$UPDATER_VERSION" \
            --arg app "$APP_REF" --arg shell "$SHELL_REF" --arg framework "$FRAMEWORK_REF" \
            --arg run "$SOURCE_RUN_ID" --arg bundle "$SOURCE_BUNDLE_DIGEST" \
            --argjson platforms "$PLATFORM_IDS" --argjson assets "$assets" \
            '{schema:"opl_app_desktop_release_set_manifest.v1",release:{version:$version,updater_version:$updater},source:{run_id:$run,bundle_digest:$bundle},cohort:{app_sha:$app,shell_sha:$shell,framework_sha:$framework},platforms:$platforms,assets:$assets}' \
            > desktop-release-assets/opl-desktop-platforms-manifest.json
      - name: Append exact Desktop assets to the same Stable Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node --experimental-strip-types scripts/append-stable-desktop-assets.ts
          --repository "$GITHUB_REPOSITORY"
          --release-id "${{ needs.admit.outputs.release_id }}"
          --tag "${{ needs.admit.outputs.release_tag }}"
          --target "${{ needs.admit.outputs.app_ref }}"
          --asset-dir desktop-release-assets
          --output stable-desktop-append.json
          --apply
      - name: Upload Desktop append receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: opl-stable-desktop-append-${{ needs.admit.outputs.source_run_id }}
          path: stable-desktop-append.json
          if-no-files-found: error
          retention-days: 30

  dispatch-full:
    if: ${{ needs.admit.outputs.applicable == 'true' }}
    needs: [admit, append-desktop-platforms]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    outputs:
      full_run_id: ${{ steps.full.outputs.full_run_id }}
    steps:
      - name: Dispatch and bind one same-tag Full append
        id: full
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ needs.admit.outputs.source_run_id }}
          SOURCE_ARTIFACT: ${{ needs.admit.outputs.source_artifact }}
          FRAMEWORK_REF: ${{ needs.admit.outputs.framework_ref }}
        run: |
          set -euo pipefail
          title_regex="^OPL Stable append_full source:${SOURCE_RUN_ID} run:[1-9][0-9]*$"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/workflows/release-stable.yml/runs?event=workflow_dispatch&branch=main&per_page=100" \
            > before-runs.json
          prior_ids="$(jq -c '[.[]?.workflow_runs[]? | select(.display_title | test($title)) | .id]' \
            --arg title "$title_regex" before-runs.json)"
          jq -n --arg ref main --arg framework_ref "$FRAMEWORK_REF" \
            --arg source_run_id "$SOURCE_RUN_ID" --arg source_artifact "$SOURCE_ARTIFACT" \
            '{ref:$ref,inputs:{operation:"append_full",version:"",include_full:"false",shell_ref:"",framework_ref:$framework_ref,source_run_id:$source_run_id,source_artifact:$source_artifact}}' \
            > dispatch.json
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/release-stable.yml/dispatches" --input dispatch.json

          full_run_id=''
          for _ in $(seq 1 60); do
            if ! gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/actions/workflows/release-stable.yml/runs?event=workflow_dispatch&branch=main&per_page=100" \
              > after-runs.json; then
              sleep 10
              continue
            fi
            matches="$(jq -c --arg title "$title_regex" --argjson prior "$prior_ids" '
              [.[]?.workflow_runs[]?
                | select(.display_title | test($title))
                | select((.id as $id | $prior | index($id)) | not)]
            ' after-runs.json)"
            count="$(jq 'length' <<<"$matches")"
            test "$count" -le 1 || { echo '::error::Full dispatch produced ambiguous successor runs.'; exit 1; }
            if [ "$count" = 1 ]; then
              full_run_id="$(jq -r '.[0].id' <<<"$matches")"
              break
            fi
            sleep 10
          done
          [[ "$full_run_id" =~ ^[1-9][0-9]*$ ]] || {
            echo '::error::Full dispatch outcome is unknown; do not redispatch before owner-authoritative reconciliation.'
            exit 1
          }
          for _ in $(seq 1 120); do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$full_run_id" > full-run.json
            status="$(jq -er .status full-run.json)"
            [ "$status" = completed ] && break
            sleep 10
          done
          jq -e --arg run "$full_run_id" --arg source "$SOURCE_RUN_ID" --arg title "$title_regex" '
            (.id | tostring) == $run
            and .path == ".github/workflows/release-stable.yml"
            and .event == "workflow_dispatch"
            and .head_branch == "main"
            and .run_attempt == 1
            and .status == "completed"
            and .conclusion == "success"
            and (.display_title | test($title))
          ' full-run.json >/dev/null
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs/$full_run_id/artifacts?per_page=100" \
            > full-artifacts.json
          jq -e --arg name "opl-release-full-published-${full_run_id}" '
            [.[]?.artifacts[]? | select(.name == $name and .expired == false)] | length == 1
          ' full-artifacts.json >/dev/null
          echo "full_run_id=$full_run_id" >> "$GITHUB_OUTPUT"

  receipt:
    if: ${{ always() && needs.admit.result != 'skipped' }}
    needs: [admit, build-desktop-platforms, append-desktop-platforms, dispatch-full]
    runs-on: ubuntu-latest
    steps:
      - name: Write Release Set follow-up receipt
        run: |
          jq -n \
            --arg source_run_id '${{ needs.admit.outputs.source_run_id }}' \
            --arg operation_kind '${{ needs.admit.outputs.operation_kind }}' \
            --arg applicable '${{ needs.admit.outputs.applicable }}' \
            --arg release_tag '${{ needs.admit.outputs.release_tag }}' \
            --arg desktop '${{ needs.append-desktop-platforms.result }}' \
            --arg full '${{ needs.dispatch-full.result }}' \
            --arg full_run_id '${{ needs.dispatch-full.outputs.full_run_id }}' \
            '{schema:"opl_app_stable_desktop_release_set_followup.v2",source_run_id:$source_run_id,operation_kind:$operation_kind,applicable:($applicable == "true"),release_tag:$release_tag,desktop_platform_append:$desktop,full_append:$full,full_run_id:$full_run_id,remaining:(if $applicable != "true" then [] elif $desktop == "success" and $full == "success" and ($full_run_id | test("^[1-9][0-9]*$")) then [] else ["followup_failure"] end)}' \
            > stable-release-set-followup.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: opl-stable-release-set-followup-${{ needs.admit.outputs.source_run_id }}
          path: stable-release-set-followup.json
          if-no-files-found: error
          retention-days: 30
