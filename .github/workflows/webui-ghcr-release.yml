name: OPL WebUI GHCR Release

on:
  workflow_dispatch:
    inputs:
      opl_version:
        description: OPL version tag to publish, for example 26.6.27
        required: true
        type: string
      shell_ref:
        description: opl-aion-shell ref to resolve before release work. Prefer a fixed SHA; main is resolved once by the source gate.
        required: false
        default: main
        type: string
      framework_ref:
        description: OPL Framework ref to resolve before release work. Prefer a fixed SHA; main is resolved once by the source gate.
        required: false
        default: main
        type: string
      opl_flow_ref:
        description: Immutable OPL Flow ref required by the WebUI configure-codex route.
        required: false
        default: 06cb8e15490e6a98b1196bfc6d526bd50471ecbc
        type: string

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: opl-webui-ghcr-release-${{ inputs.opl_version }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BUN_INSTALL_REGISTRY: 'https://registry.npmjs.org/'

jobs:
  publish-webui-ghcr:
    name: Build, verify, and publish WebUI GHCR image
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout App repo
        uses: actions/checkout@v6

      - name: Checkout active shell
        uses: actions/checkout@v6
        with:
          repository: gaofeng21cn/opl-aion-shell
          ref: ${{ inputs.shell_ref || 'main' }}
          path: shells/aionui

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install active shell dependencies
        shell: bash
        working-directory: shells/aionui
        run: bun install --frozen-lockfile

      - name: Checkout OPL Framework payload source
        uses: actions/checkout@v6
        with:
          repository: gaofeng21cn/one-person-lab
          ref: ${{ inputs.framework_ref || 'main' }}
          path: one-person-lab

      - name: Validate release source gate
        id: release-source-gate
        run: |
          npm run release:source-gate -- \
            --version "${{ inputs.opl_version }}" \
            --app-ref "$GITHUB_SHA" \
            --shell-ref "${{ inputs.shell_ref || 'main' }}" \
            --framework-ref "${{ inputs.framework_ref || 'main' }}" \
            --framework-root one-person-lab \
            --require-shell-format true \
            --run-shell-tests true \
            --output release-source-gate.json \
            --json
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('release-source-gate.json', 'utf8'));
          const outputs = {
            app_sha: report.app_head,
            shell_sha: report.shell_sha,
            framework_sha: report.framework_sha,
          };
          for (const [name, value] of Object.entries(outputs)) {
            if (typeof value !== 'string' || !/^[0-9a-f]{40}$/i.test(value)) {
              throw new Error(`release source gate did not resolve ${name} to a fixed SHA`);
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `${name}=${value}\n`);
          }
          NODE

      - name: Upload release source gate summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-source-gate-${{ inputs.opl_version }}
          path: release-source-gate.json
          if-no-files-found: error

      - name: Export WebUI release environment
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'OPL_VERSION=${{ inputs.opl_version }}'
            echo 'SHELL_SHA=${{ steps.release-source-gate.outputs.shell_sha }}'
            echo 'OPL_FRAMEWORK_SHA=${{ steps.release-source-gate.outputs.framework_sha }}'
            echo 'OPL_FLOW_SHA=${{ inputs.opl_flow_ref }}'
            echo 'WEBUI_CHANNEL_TAGS=stable'
            echo 'WEBUI_WORKFLOW_JOB=publish-webui-ghcr'
            echo 'WEBUI_BUILD_REUSE_MODE=webui_only_release_workflow'
            echo 'WEBUI_SOURCE_GATE=webui-ghcr-release'
            echo 'WEBUI_REPEATED_DOCKER_BUILD=false'
            echo 'RELEASE_MODE=new_release'
          } >> "$GITHUB_ENV"

      - name: Prepare WebUI GHCR publish records
        shell: bash
        run: bash scripts/webui-ghcr-release-step.sh prepare

      - name: Build WebUI Docker images
        shell: bash
        run: bash scripts/webui-ghcr-release-step.sh build

      - name: Inspect and validate WebUI runtime images
        shell: bash
        run: bash scripts/webui-ghcr-release-step.sh inspect

      - name: Smoke WebUI container runtime
        shell: bash
        run: bash scripts/webui-ghcr-release-step.sh smoke

      - name: Tag WebUI GHCR images
        shell: bash
        run: bash scripts/webui-ghcr-release-step.sh tag

      - name: Publish WebUI GHCR tags
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/webui-ghcr-release-step.sh publish

      - name: Upload Docker WebUI smoke artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: docker-webui-smoke-${{ inputs.opl_version }}
          path: |
            /tmp/opl-webui-index.html
            /tmp/opl-webui-manifest.webmanifest
            /tmp/opl-webui-image-inspect.json
            /tmp/opl-webui-slim-image-inspect.json
            /tmp/opl-webui-image-manifest.json
            /tmp/opl-webui-slim-image-manifest.json
            /tmp/opl-webui-seed-metadata.json
            /tmp/opl-webui-slim-seed-metadata.json
            /tmp/opl-webui-runtime-readback.txt
            /tmp/opl-webui-runtime-image-validation.json
            /tmp/opl-webui-slim-runtime-image-validation.json
            /tmp/opl-webui-image-size-bytes.txt
            /tmp/opl-webui-auth-user.json
            /tmp/opl-webui-startup-maintenance.json
            /tmp/opl-webui-update-status.json
            /tmp/opl-webui-projects-readback.txt
            /tmp/opl-webui-install-manifest.json
            /tmp/opl-webui-runtime-smoke-receipts-validation.json
            /tmp/opl-webui-container.log
            /tmp/docker-webui-smoke-gate-contract.json
          if-no-files-found: ignore

      - name: Upload WebUI GHCR publish summary
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: webui-ghcr-publish-${{ inputs.opl_version }}
          path: /tmp/opl-webui-ghcr-publish.json
          if-no-files-found: error
