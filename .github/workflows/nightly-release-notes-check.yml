name: Nightly release note writer check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  writers:
    permissions:
      contents: read
      copilot-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install fixed Copilot CLI
        run: npm install --global @github/copilot@1.0.95
      - name: Check live writers and injected fallback failures
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPL_RELEASE_NOTES_CODEX_API_KEY: ${{ secrets.OPL_RELEASE_NOTES_CODEX_API_KEY }}
        run: node --experimental-strip-types scripts/check-nightly-release-note-writers.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: nightly-release-note-writer-check
          path: nightly-note-writer-check
          if-no-files-found: error
          retention-days: 14
