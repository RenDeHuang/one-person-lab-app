name: OPL Full First-Install Release

on:
  workflow_dispatch:
    inputs:
      opl_version:
        description: OPL version to publish, for example 26.5.15
        required: true
        type: string
      framework_ref:
        description: OPL Framework ref to bundle. Empty means main.
        required: false
        default: main
        type: string
      shell_ref:
        description: opl-aion-shell ref to bundle. Empty means main.
        required: false
        default: main
        type: string
      publish_to_release:
        description: Upload Full first-install assets to an existing unpublished App draft
        required: false
        default: false
        type: boolean
      upload_full_package_artifact:
        description: Upload the complete Full output bundle for a downstream publisher; VM uses the DMG-only artifact
        required: false
        default: false
        type: boolean
      force_rebuild_runtime_cache:
        description: Ignore restored Full runtime layer cache and rebuild all layers
        required: false
        default: false
        type: boolean
      full_dmg_compression_level:
        description: zlib level for the Full DMG when full_dmg_format is UDZO.
        required: false
        default: '9'
        type: string
      full_dmg_format:
        description: Full DMG compression format. ULMO favors release size; UDZO keeps legacy zlib compatibility.
        required: false
        default: ULMO
        type: string
  workflow_call:
    inputs:
      opl_version:
        description: OPL version to publish, for example 26.5.15
        required: true
        type: string
      framework_ref:
        description: OPL Framework ref to bundle. Empty means main.
        required: false
        default: main
        type: string
      shell_ref:
        description: opl-aion-shell ref to bundle. Empty means main.
        required: false
        default: main
        type: string
      publish_to_release:
        description: Upload Full first-install assets to an existing unpublished App draft
        required: false
        default: false
        type: boolean
      release_mutation_owned_by_caller:
        description: The trusted caller already serializes all mutations for this App version
        required: false
        default: false
        type: boolean
      upload_full_package_artifact:
        description: Upload the complete Full output bundle for a downstream publisher; VM uses the DMG-only artifact
        required: false
        default: false
        type: boolean
      force_rebuild_runtime_cache:
        description: Ignore restored Full runtime layer cache and rebuild all layers
        required: false
        default: false
        type: boolean
      full_dmg_compression_level:
        description: zlib level for the Full DMG when full_dmg_format is UDZO.
        required: false
        default: '9'
        type: string
      full_dmg_format:
        description: Full DMG compression format. ULMO favors release size; UDZO keeps legacy zlib compatibility.
        required: false
        default: ULMO
        type: string
    secrets:
      BUILD_CERTIFICATE_BASE64:
        required: false
      P12_PASSWORD:
        required: false
      APPLE_ID:
        required: false
      APPLE_ID_PASSWORD:
        required: false
      TEAM_ID:
        required: false
      IDENTITY:
        required: false
      KEYCHAIN_PASSWORD:
        required: false
      APP_ID:
        required: false
      OPL_RELEASE_NOTES_CODEX_API_KEY:
        required: false
permissions:
  contents: read

concurrency:
  group: ${{ inputs.release_mutation_owned_by_caller && format('opl-full-first-install-embedded-{0}', github.run_id) || format('opl-app-release-mutation-{0}', inputs.opl_version) }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  full-first-install:
    name: Build App-owned Full first-install DMG
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Inspect optional Full release signing secrets
        shell: bash
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          IDENTITY: ${{ secrets.IDENTITY }}
        run: |
          set -euo pipefail
          missing=()
          for secret_name in BUILD_CERTIFICATE_BASE64 P12_PASSWORD APPLE_ID APPLE_ID_PASSWORD TEAM_ID IDENTITY; do
            if [ -z "${!secret_name:-}" ]; then
              missing+=("$secret_name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            missing_csv="$(IFS=', '; echo "${missing[*]}")"
            echo "::notice title=Full first-install local authorization mode::Missing optional Apple signing secrets: ${missing_csv}"
            echo "::notice::Stable Full assets will use local authorization evidence instead of Developer ID notarization."
            exit 0
          fi
          if ! printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode >/dev/null 2>&1; then
            echo "::error title=Full first-install release signing preflight failed::BUILD_CERTIFICATE_BASE64 is not valid base64."
            exit 1
          fi
          echo "Optional Full first-install release signing material is present."

      - name: Checkout App repo
        uses: actions/checkout@v6
        with:
          path: one-person-lab-app

      - name: Checkout active shell
        uses: actions/checkout@v6
        with:
          repository: gaofeng21cn/opl-aion-shell
          ref: ${{ inputs.shell_ref || 'main' }}
          path: one-person-lab-app/shells/aionui

      - name: Checkout OPL Framework payload source
        uses: actions/checkout@v6
        with:
          repository: gaofeng21cn/one-person-lab
          ref: ${{ inputs.framework_ref || 'main' }}
          path: one-person-lab

      - name: Checkout MAS
        uses: actions/checkout@v6
        with:
          repository: gaofeng21cn/med-autoscience
          ref: main
          path: med-autoscience

      - name: Checkout MAG
        uses: actions/checkout@v6
        with:
          repository: gaofeng21cn/med-autogrant
          ref: main
          path: med-autogrant

      - name: Checkout RCA
        uses: actions/checkout@v6
        with:
          repository: gaofeng21cn/redcube-ai
          ref: main
          path: redcube-ai

      - name: Checkout OPL Meta Agent
        uses: actions/checkout@v6
        with:
          repository: gaofeng21cn/opl-meta-agent
          ref: main
          path: opl-meta-agent

      - name: Checkout OPL BookForge
        uses: actions/checkout@v6
        with:
          repository: gaofeng21cn/opl-bookforge
          ref: main
          path: opl-bookforge

      - name: Checkout OPL Flow
        uses: actions/checkout@v6
        with:
          repository: gaofeng21cn/opl-flow
          ref: 06cb8e15490e6a98b1196bfc6d526bd50471ecbc
          path: opl-flow

      - name: Checkout OfficeCLI
        uses: actions/checkout@v6
        with:
          repository: iOfficeAI/OfficeCLI
          ref: main
          path: OfficeCLI

      - name: Checkout MinerU Ecosystem
        uses: actions/checkout@v6
        with:
          repository: opendatalab/MinerU-Ecosystem
          ref: main
          path: MinerU-Ecosystem

      - name: Checkout UI UX Pro Max skill
        uses: actions/checkout@v6
        with:
          repository: nextlevelbuilder/ui-ux-pro-max-skill
          ref: main
          path: ui-ux-pro-max-skill

      - name: Validate Full source roots
        shell: bash
        run: |
          set -euo pipefail
          required_paths=(
            one-person-lab/package.json
            one-person-lab-app/shells/aionui/package.json
            med-autoscience/pyproject.toml
            med-autogrant/pyproject.toml
            redcube-ai/package.json
            opl-meta-agent/package.json
            opl-bookforge/package.json
            opl-flow/.codex-plugin/plugin.json
            OfficeCLI/README.md
            MinerU-Ecosystem/README.md
            ui-ux-pro-max-skill/README.md
          )
          for required_path in "${required_paths[@]}"; do
            if [ ! -f "$GITHUB_WORKSPACE/$required_path" ]; then
              echo "::error::Required Full source is missing: $required_path"
              exit 1
            fi
          done

      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          echo "OPL_RELEASE_VERSION=${{ inputs.opl_version }}" >> "$GITHUB_ENV"
          echo "OPL_FULL_FRAMEWORK_REF=${{ inputs.framework_ref || 'main' }}" >> "$GITHUB_ENV"
          echo "OPL_FULL_WORKFLOW_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Setup Node.js
        id: node-cache
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            one-person-lab/package-lock.json
            redcube-ai/package-lock.json

      - name: Resolve latest stable OfficeCLI release
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types "$GITHUB_WORKSPACE/one-person-lab-app/scripts/prepare-officecli-release-source.ts" "$GITHUB_WORKSPACE/OfficeCLI"

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun install cache
        id: bun-cache
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: full-bun-install-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('one-person-lab-app/shells/aionui/package.json', 'one-person-lab-app/shells/aionui/bun.lock') }}
          restore-keys: |
            full-bun-install-${{ runner.os }}-${{ runner.arch }}-
            full-bun-install-${{ runner.os }}-

      - name: Cache Electron artifacts
        id: electron-cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/.cache/electron
            ${{ runner.temp }}/.cache/electron-builder
            ~/.cache/electron
            ~/.cache/electron-builder
          key: full-electron-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('one-person-lab-app/shells/aionui/package.json', 'one-person-lab-app/shells/aionui/bun.lock', 'one-person-lab-app/shells/aionui/packages/desktop/electron-builder.yml') }}
          restore-keys: |
            full-electron-cache-${{ runner.os }}-${{ runner.arch }}-
            electron-cache-macos-arm64-arm64-
            electron-cache-macos-arm64-

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache uv artifacts
        id: uv-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/uv
            ~/Library/Caches/uv
          key: full-uv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('med-autoscience/uv.lock', 'med-autoscience/pyproject.toml', 'med-autogrant/uv.lock', 'med-autogrant/pyproject.toml') }}
          restore-keys: |
            full-uv-${{ runner.os }}-${{ runner.arch }}-
            full-uv-${{ runner.os }}-

      - name: Setup Go
        id: go-cache
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: MinerU-Ecosystem/cli/mineru-open-api/go.sum

      - name: Install uv, zstd, Temporal CLI, Codex CLI, OfficeCLI, and MinerU
        shell: bash
        run: |
          set -euo pipefail
          brew install zstd temporal || true
          python -m pip install --upgrade pip uv
          uv python install 3.12
          codex_latest="$(npm view @openai/codex version)"
          npm install -g "@openai/codex@${codex_latest}" --fetch-retries=3 --fetch-retry-mintimeout=2000 --fetch-retry-maxtimeout=20000 --fetch-timeout=60000
          codex_version="$(codex --version)"
          [[ "$codex_version" == "codex-cli $codex_latest" ]]
          echo "OPL_FULL_CODEX_VERSION=$codex_latest" >> "$GITHUB_ENV"
          mineru_root="$GITHUB_WORKSPACE/MinerU-Ecosystem/cli/mineru-open-api"
          mineru_version="$(cat "$mineru_root/VERSION")"
          mineru_commit="$(git -C "$GITHUB_WORKSPACE/MinerU-Ecosystem" rev-parse --short HEAD)"
          mineru_built_at="$(git -C "$GITHUB_WORKSPACE/MinerU-Ecosystem" show -s --format=%cI HEAD)"
          (
            cd "$mineru_root"
            go install -ldflags "-X github.com/opendatalab/MinerU-Ecosystem/cli/mineru-open-api/cmd.version=$mineru_version -X github.com/opendatalab/MinerU-Ecosystem/cli/mineru-open-api/cmd.commit=$mineru_commit -X github.com/opendatalab/MinerU-Ecosystem/cli/mineru-open-api/cmd.date=$mineru_built_at" .
          )
          bash "$GITHUB_WORKSPACE/OfficeCLI/install.sh"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/go/bin:$HOME/.local/bin:$PATH"
          echo "$codex_version"
          officecli --version
          mineru-open-api version
          temporal --version
          temporal_version="$(temporal --version | awk '/^temporal version / { print $3; exit }')"
          if [ -z "$temporal_version" ]; then
            echo "::error::Unable to parse Temporal CLI version from: $(temporal --version)"
            exit 1
          fi
          temporal_archive="$RUNNER_TEMP/temporal_cli_${temporal_version}_darwin_arm64.tar.gz"
          curl -fL --retry 5 --retry-all-errors --retry-delay 5 \
            "https://github.com/temporalio/cli/releases/download/v${temporal_version}/temporal_cli_${temporal_version}_darwin_arm64.tar.gz" \
            -o "$temporal_archive"
          uv --version
          zstd --version
          echo "OPL_FULL_BUN_BIN=$(command -v bun)" >> "$GITHUB_ENV"
          echo "OPL_FULL_TEMPORAL_CLI_BIN=$(command -v temporal)" >> "$GITHUB_ENV"
          echo "OPL_FULL_TEMPORAL_CLI_ARCHIVE=$temporal_archive" >> "$GITHUB_ENV"
          echo "OPL_FULL_TOOLCHAIN_READY_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Install Framework dependencies
        working-directory: one-person-lab
        run: |
          npm ci
          echo "OPL_FULL_FRAMEWORK_DEPS_READY_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Build Framework CLI payload
        working-directory: one-person-lab
        run: |
          npm run build
          echo "OPL_FULL_FRAMEWORK_BUILD_READY_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Install App shell dependencies
        working-directory: one-person-lab-app/shells/aionui
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run postinstall || true
          echo "OPL_FULL_SHELL_NODE_DEPS_READY_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Verify App product profile against Shell consumer
        shell: bash
        run: |
          set -euo pipefail
          cd one-person-lab-app
          node --experimental-strip-types scripts/app-product-profile.ts
          cd shells/aionui
          bun vitest run tests/unit/common-config/oplProductProfile.test.ts

      - name: Verify Full bootstrap and Home readiness before packaging
        working-directory: one-person-lab-app/shells/aionui
        shell: bash
        run: |
          set -euo pipefail
          bun vitest run \
            tests/unit/opl-runtime/oplRuntimeBridge.test.ts \
            tests/unit/guid/oplHomeAssistants.test.ts
          VITEST_INCLUDE_DOM=1 bun vitest run --project dom \
            tests/unit/guid/HomeStarters.dom.test.tsx \
            tests/unit/guid/useGuidSend.oplWhitelist.dom.test.tsx

      - name: Resolve App shell Electron version
        id: shell-electron-version
        working-directory: one-person-lab-app/shells/aionui
        shell: bash
        run: |
          set -euo pipefail
          electron_version="$(node -p "require('./package.json').devDependencies.electron.replace(/^[~^]/, '')")"
          if [ -z "$electron_version" ] || [ "$electron_version" = "undefined" ]; then
            echo "Unable to resolve App shell Electron version from package.json." >&2
            exit 1
          fi
          echo "version=$electron_version" >> "$GITHUB_OUTPUT"
          echo "OPL_FULL_SHELL_ELECTRON_VERSION=$electron_version" >> "$GITHUB_ENV"

      - name: Rebuild App shell native modules for Electron
        working-directory: one-person-lab-app/shells/aionui
        shell: bash
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/.cache/electron-builder
          npm_config_disturl: https://electronjs.org/headers
          npm_config_runtime: electron
          npm_config_target: ${{ steps.shell-electron-version.outputs.version }}
          npm_config_target_arch: arm64
        run: |
          set -euo pipefail
          bunx electron-builder install-app-deps
          echo "OPL_FULL_SHELL_DEPS_READY_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Restore Full shell Vite output cache
        id: restore-shell-vite-output
        uses: actions/cache/restore@v5
        with:
          path: |
            one-person-lab-app/shells/aionui/out/main
            one-person-lab-app/shells/aionui/out/preload
            one-person-lab-app/shells/aionui/out/renderer
            one-person-lab-app/shells/aionui/out/.build-hash
          key: full-shell-vite-output-${{ runner.os }}-${{ runner.arch }}-${{ inputs.opl_version }}-${{ hashFiles('one-person-lab-app/shells/aionui/package.json', 'one-person-lab-app/shells/aionui/bun.lock', 'one-person-lab-app/shells/aionui/tsconfig.json', 'one-person-lab-app/shells/aionui/packages/desktop/electron.vite.config.ts', 'one-person-lab-app/shells/aionui/packages/desktop/src/**', 'one-person-lab-app/shells/aionui/public/**', 'one-person-lab-app/contracts/app-product-profile.json') }}
          restore-keys: |
            full-shell-vite-output-${{ runner.os }}-${{ runner.arch }}-${{ inputs.opl_version }}-

      - name: Prepare domain runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv sync --project med-autoscience --no-dev
          uv sync --project med-autogrant --no-dev
          npm ci --prefix redcube-ai
          npm install --prefix redcube-ai --no-save --package-lock=false "$GITHUB_WORKSPACE/one-person-lab"
          npm run --prefix redcube-ai build
          echo "OPL_FULL_DOMAIN_DEPS_READY_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Resolve Full runtime cache keys
        id: runtime-cache-keys
        working-directory: one-person-lab-app
        shell: bash
        run: |
          set -euo pipefail
          cache_dir="$GITHUB_WORKSPACE/.opl-full-runtime-cache"
          export OPL_FRAMEWORK_ROOT="$GITHUB_WORKSPACE/one-person-lab"
          export OPL_FULL_CODEX_ROOT="$(npm root -g)/@openai/codex"
          export OPL_FULL_BUN_BIN="${OPL_FULL_BUN_BIN:-$(command -v bun)}"
          export OPL_FULL_INCLUDE_BUN_RUNTIME="${OPL_FULL_INCLUDE_BUN_RUNTIME:-0}"
          export OPL_FULL_UV_BIN="$(command -v uv)"
          export OPL_FULL_TEMPORAL_CLI_BIN="${OPL_FULL_TEMPORAL_CLI_BIN:-$(command -v temporal)}"
          export OPL_FULL_MAS_ROOT="$GITHUB_WORKSPACE/med-autoscience"
          export OPL_FULL_MAG_ROOT="$GITHUB_WORKSPACE/med-autogrant"
          export OPL_FULL_RCA_ROOT="$GITHUB_WORKSPACE/redcube-ai"
          export OPL_FULL_META_AGENT_ROOT="$GITHUB_WORKSPACE/opl-meta-agent"
          export OPL_FULL_BOOKFORGE_ROOT="$GITHUB_WORKSPACE/opl-bookforge"
          export OPL_FULL_OPL_FLOW_ROOT="$GITHUB_WORKSPACE/opl-flow"
          export OPL_FULL_OFFICECLI_ROOT="$GITHUB_WORKSPACE/OfficeCLI"
          export OPL_FULL_MINERU_ROOT="$GITHUB_WORKSPACE/MinerU-Ecosystem"
          export OPL_FULL_MINERU_OPEN_API_BIN="$(command -v mineru-open-api)"
          export OPL_FULL_MINERU_DOCUMENT_EXTRACTOR_ROOT="$GITHUB_WORKSPACE/one-person-lab-app/assets/companion-skills/mineru-document-extractor"
          export OPL_FULL_UI_UX_PRO_MAX_ROOT="$GITHUB_WORKSPACE/ui-ux-pro-max-skill"
          npm --silent run release:full -- \
            --version "$OPL_RELEASE_VERSION" \
            --runtime-cache-dir "$cache_dir" \
            --runtime-cache-mode readwrite \
            --print-runtime-cache-keys > "$RUNNER_TEMP/opl-full-runtime-cache-keys.json"
          cat "$RUNNER_TEMP/opl-full-runtime-cache-keys.json"
          node - "$RUNNER_TEMP/opl-full-runtime-cache-keys.json" "$RUNNER_TEMP/opl-full-runtime-cache-aggregate-key.json" <<'NODE'
          const fs = require('node:fs');
          const input = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          fs.writeFileSync(process.argv[3], `${JSON.stringify(input.aggregate_key_input, null, 2)}\n`);
          NODE
          digest="$(shasum -a 256 "$RUNNER_TEMP/opl-full-runtime-cache-aggregate-key.json" | awk '{print $1}')"
          cache_key="opl-full-runtime-layers-${RUNNER_OS}-${RUNNER_ARCH}-${digest}"
          echo "cache_dir=$cache_dir" >> "$GITHUB_OUTPUT"
          echo "cache_digest=$digest" >> "$GITHUB_OUTPUT"
          echo "cache_key=$cache_key" >> "$GITHUB_OUTPUT"
          node - "$RUNNER_TEMP/opl-full-runtime-cache-keys.json" "$cache_dir" <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('node:fs');
          const path = require('node:path');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const cacheDir = process.argv[3];
          const outputNames = {
            toolchain: 'toolchain',
            'domain-runtime': 'domain_runtime',
            'opl-runtime': 'opl_runtime',
            skills: 'skills',
          };
          for (const [layerId, outputName] of Object.entries(outputNames)) {
            const key = report.layers[layerId];
            console.log(`${outputName}_cache_dir=${path.join(cacheDir, layerId)}`);
            console.log(`${outputName}_cache_key=opl-full-runtime-layer-${process.env.RUNNER_OS}-${process.env.RUNNER_ARCH}-${key}`);
          }
          NODE
          {
            echo "runtime_cache_key_report<<EOF"
            cat "$RUNNER_TEMP/opl-full-runtime-cache-keys.json"
            echo "EOF"
            echo "runtime_cache_aggregate_key_input<<EOF"
            cat "$RUNNER_TEMP/opl-full-runtime-cache-aggregate-key.json"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Restore Full toolchain runtime cache
        if: ${{ !inputs.force_rebuild_runtime_cache }}
        id: restore-runtime-cache-toolchain
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.runtime-cache-keys.outputs.toolchain_cache_dir }}
          key: ${{ steps.runtime-cache-keys.outputs.toolchain_cache_key }}

      - name: Restore Full domain runtime cache
        if: ${{ !inputs.force_rebuild_runtime_cache }}
        id: restore-runtime-cache-domain
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.runtime-cache-keys.outputs.domain_runtime_cache_dir }}
          key: ${{ steps.runtime-cache-keys.outputs.domain_runtime_cache_key }}

      - name: Restore Full OPL runtime cache
        if: ${{ !inputs.force_rebuild_runtime_cache }}
        id: restore-runtime-cache-opl
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.runtime-cache-keys.outputs.opl_runtime_cache_dir }}
          key: ${{ steps.runtime-cache-keys.outputs.opl_runtime_cache_key }}

      - name: Restore Full skills runtime cache
        if: ${{ !inputs.force_rebuild_runtime_cache }}
        id: restore-runtime-cache-skills
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.runtime-cache-keys.outputs.skills_cache_dir }}
          key: ${{ steps.runtime-cache-keys.outputs.skills_cache_key }}

      - name: Reset Full runtime layer cache when forced
        if: ${{ inputs.force_rebuild_runtime_cache }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${{ steps.runtime-cache-keys.outputs.cache_dir }}"
          mkdir -p "${{ steps.runtime-cache-keys.outputs.cache_dir }}"

      - name: Prepare optional macOS code signing
        shell: bash
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'temp-keychain-password' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          IDENTITY: ${{ secrets.IDENTITY }}
        run: |
          set -euo pipefail
          requires_distributable_assets="${{ inputs.publish_to_release || inputs.upload_full_package_artifact }}"
          echo "OPL_FULL_DISTRIBUTABLE_ASSETS=$requires_distributable_assets" >> "$GITHUB_ENV"
          echo "OPL_MAC_STRICT_SIGNING_CHECKS=false" >> "$GITHUB_ENV"
          echo "OPL_FULL_PACKAGE_NOTARIZED=false" >> "$GITHUB_ENV"

          if [ -z "${BUILD_CERTIFICATE_BASE64:-}" ] || [ -z "${P12_PASSWORD:-}" ]; then
            echo "::notice::No Developer ID certificate secrets configured; using Stable local authorization mode."
            exit 0
          fi

          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12

          if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_ID_PASSWORD:-}" ] && [ -n "${TEAM_ID:-}" ] && [ -n "${IDENTITY:-}" ]; then
            echo "OPL_MAC_STRICT_SIGNING_CHECKS=true" >> "$GITHUB_ENV"
            echo "OPL_FULL_PACKAGE_NOTARIZED=true" >> "$GITHUB_ENV"
          else
            echo "::notice::Developer ID certificate is available, but notarization identity secrets are incomplete; using Stable local authorization mode."
            exit 0
          fi

      - name: Build Full first-install package
        id: full_package_build
        working-directory: one-person-lab-app
        shell: bash
        env:
          OPL_RELEASE_VERSION: ${{ env.OPL_RELEASE_VERSION }}
          APP_ID: ${{ secrets.APP_ID }}
          appleId: ${{ secrets.APPLE_ID }}
          appleIdPassword: ${{ secrets.APPLE_ID_PASSWORD }}
          teamId: ${{ secrets.TEAM_ID }}
          identity: ${{ secrets.IDENTITY }}
          CSC_NAME: ${{ secrets.IDENTITY }}
          OPL_RUNTIME_CODESIGN_IDENTITY: ${{ secrets.IDENTITY }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          CI: true
          GH_TOKEN: ${{ github.token }}
          NODE_OPTIONS: '--max-old-space-size=8192'
          ELECTRON_CACHE: ${{ runner.temp }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/.cache/electron-builder
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
          npm_config_electron_builder_binaries_mirror: https://github.com/electron-userland/electron-builder-binaries/releases/download/
          ELECTRON_MIRROR: ''
          OPL_FULL_DMG_FORMAT: ${{ inputs.full_dmg_format || 'ULMO' }}
          OPL_FULL_DMG_COMPRESSION_LEVEL: ${{ inputs.full_dmg_compression_level || '9' }}
          npm_config_disturl: https://electronjs.org/headers
          npm_config_runtime: electron
          npm_config_target: ${{ steps.shell-electron-version.outputs.version }}
          npm_config_target_arch: arm64
        run: |
          set -euo pipefail
          ulimit -n 65536 || true
          export OPL_FRAMEWORK_ROOT="$GITHUB_WORKSPACE/one-person-lab"
          export OPL_FULL_CODEX_ROOT="$(npm root -g)/@openai/codex"
          export OPL_FULL_BUN_BIN="${OPL_FULL_BUN_BIN:-$(command -v bun)}"
          export OPL_FULL_INCLUDE_BUN_RUNTIME="${OPL_FULL_INCLUDE_BUN_RUNTIME:-0}"
          export OPL_FULL_UV_BIN="$(command -v uv)"
          export OPL_FULL_TEMPORAL_CLI_BIN="${OPL_FULL_TEMPORAL_CLI_BIN:-$(command -v temporal)}"
          export OPL_FULL_MAS_ROOT="$GITHUB_WORKSPACE/med-autoscience"
          export OPL_FULL_MAG_ROOT="$GITHUB_WORKSPACE/med-autogrant"
          export OPL_FULL_RCA_ROOT="$GITHUB_WORKSPACE/redcube-ai"
          export OPL_FULL_META_AGENT_ROOT="$GITHUB_WORKSPACE/opl-meta-agent"
          export OPL_FULL_BOOKFORGE_ROOT="$GITHUB_WORKSPACE/opl-bookforge"
          export OPL_FULL_OPL_FLOW_ROOT="$GITHUB_WORKSPACE/opl-flow"
          export OPL_FULL_OFFICECLI_ROOT="$GITHUB_WORKSPACE/OfficeCLI"
          export OPL_FULL_MINERU_ROOT="$GITHUB_WORKSPACE/MinerU-Ecosystem"
          export OPL_FULL_MINERU_OPEN_API_BIN="$(command -v mineru-open-api)"
          export OPL_FULL_MINERU_DOCUMENT_EXTRACTOR_ROOT="$GITHUB_WORKSPACE/one-person-lab-app/assets/companion-skills/mineru-document-extractor"
          export OPL_FULL_UI_UX_PRO_MAX_ROOT="$GITHUB_WORKSPACE/ui-ux-pro-max-skill"
          if [ "${{ steps.restore-shell-vite-output.outputs.cache-hit || 'false' }}" = "true" ]; then
            npm run release:full -- \
              --version "$OPL_RELEASE_VERSION" \
              --runtime-cache-dir "${{ steps.runtime-cache-keys.outputs.cache_dir }}" \
              --runtime-cache-mode readwrite \
              --reuse-gui-vite-output
          else
            npm run release:full -- \
              --version "$OPL_RELEASE_VERSION" \
              --runtime-cache-dir "${{ steps.runtime-cache-keys.outputs.cache_dir }}" \
              --runtime-cache-mode readwrite
          fi
          echo "OPL_FULL_PACKAGE_READY_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Verify Full package checksums and optional signing
        shell: bash
        run: |
          set -euo pipefail
          app_path="$GITHUB_WORKSPACE/one-person-lab-app/shells/aionui/out/mac-arm64/One Person Lab.app"
          runtime_root="$app_path/Contents/Resources/opl-full-runtime/runtime/current"
          dmg_path="$GITHUB_WORKSPACE/one-person-lab-app/dist/opl-full-release/One-Person-Lab-Full-${OPL_RELEASE_VERSION}-mac-arm64.dmg"
          mounted_app_dir="$(mktemp -d)"
          mounted_app_path=""
          mounted_full_dmg="false"
          cleanup_mounted_full_dmg() {
            if [ "$mounted_full_dmg" = "true" ]; then
              hdiutil detach "$mounted_app_dir" >/dev/null 2>&1 || true
            fi
            rm -rf "$mounted_app_dir"
          }
          trap cleanup_mounted_full_dmg EXIT
          hdiutil attach "$dmg_path" -nobrowse -readonly -mountpoint "$mounted_app_dir" >/dev/null
          mounted_full_dmg="true"
          mounted_app_path="$(find "$mounted_app_dir" -maxdepth 2 -type d -name 'One Person Lab.app' | sort | head -n 1)"
          if [ -z "$mounted_app_path" ]; then
            echo "::error::Full first-install DMG does not contain One Person Lab.app."
            exit 1
          fi
          mounted_runtime_root="$mounted_app_path/Contents/Resources/opl-full-runtime/runtime/current"
          node --experimental-strip-types one-person-lab-app/scripts/assert-full-runtime-currentness.ts \
            --runtime-root "$mounted_runtime_root" \
            --framework-root "$GITHUB_WORKSPACE/one-person-lab" \
            > one-person-lab-app/dist/opl-full-release/full-runtime-currentness-probe.json
          if [ "${OPL_MAC_STRICT_SIGNING_CHECKS:-false}" = "true" ]; then
            codesign --verify --deep --strict --verbose=2 "$app_path"
            codesign --verify --deep --strict --verbose=2 "$mounted_app_path"
            spctl --assess --type execute --verbose=4 "$app_path"
            node --experimental-strip-types one-person-lab-app/scripts/verify-full-runtime-native-trust.ts \
              --runtime-root "$runtime_root" \
              --require-spctl \
              --output one-person-lab-app/dist/opl-full-release/full-runtime-native-trust.json
            node -e 'const fs = require("node:fs"); const appPath = process.argv[1]; const runtimeTrust = JSON.parse(fs.readFileSync("one-person-lab-app/dist/opl-full-release/full-runtime-native-trust.json", "utf8")); fs.writeFileSync("one-person-lab-app/dist/opl-full-release/full-gatekeeper-launch-policy.json", `${JSON.stringify({ schema: "opl_gatekeeper_launch_policy.v1", package_kind: "app_full_first_install", app_path: appPath, codesign_status: "passed", spctl_status: "passed", runtime_native_trust_status: runtimeTrust.status, runtime_native_executable_count: runtimeTrust.executable_count }, null, 2)}\n`);' "$app_path"
          else
            echo "::notice::Skipping strict Gatekeeper checks because Stable Full assets use local authorization mode."
            codesign --verify --deep --strict --verbose=2 "$app_path" || true
            codesign --verify --deep --strict --verbose=2 "$mounted_app_path" || true
            spctl --assess --type execute --verbose=4 "$app_path" || true
          fi
          node --experimental-strip-types one-person-lab-app/scripts/local-authorization-policy.ts \
            --package-kind app_full_first_install \
            --app-path "$mounted_app_path" \
            --runtime-native-trust one-person-lab-app/dist/opl-full-release/full-runtime-native-trust.json \
            --output one-person-lab-app/dist/opl-full-release/full-local-authorization-policy.json
          node - "$OPL_RELEASE_VERSION" "$dmg_path" one-person-lab-app/dist/opl-full-release <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const version = process.argv[2];
          const dmgPath = process.argv[3];
          const outDir = process.argv[4];
          const readJson = (name) => JSON.parse(fs.readFileSync(path.join(outDir, name), 'utf8'));
          const fullDmgName = path.basename(dmgPath);
          const releaseManifest = {
            schema: 'opl_public_release_manifest.v1',
            package_kind: 'opl_full_first_install_macos_arm64',
            version,
            primary_install_asset: fullDmgName,
            assets: [
              {
                name: fullDmgName,
                role: 'full_first_install_carrier',
                size_bytes: fs.statSync(dmgPath).size,
                sha256: crypto.createHash('sha256').update(fs.readFileSync(dmgPath)).digest('hex'),
              },
            ],
            manifest: readJson('full-package-manifest.json'),
            evidence: {
              runtime_cache_events: readJson('runtime-cache-events.json'),
              runtime_currentness_probe: readJson('full-runtime-currentness-probe.json'),
              runtime_native_trust: readJson('full-runtime-native-trust.json'),
              app_bundle_trim_report: readJson('full-app-bundle-trim-report.json'),
              package_boundary_audit: readJson('full-package-boundary-audit.json'),
              local_authorization_policy: readJson('full-local-authorization-policy.json'),
              readme_text: fs.readFileSync(path.join(outDir, 'README-Full-First-Install.txt'), 'utf8'),
            },
            transition_legacy_assets: [
              'full-package-manifest.json',
              'runtime-cache-events.json',
              'full-runtime-currentness-probe.json',
              'full-runtime-native-trust.json',
              'full-app-bundle-trim-report.json',
              'full-package-boundary-audit.json',
            ],
          };
          fs.writeFileSync(path.join(outDir, 'opl-release-manifest.json'), `${JSON.stringify(releaseManifest, null, 2)}\n`);
          NODE
          hdiutil verify "$dmg_path"
          (
            cd "$GITHUB_WORKSPACE/one-person-lab-app/dist/opl-full-release"
            grep -Ev '(opl-release-manifest|full-gatekeeper-launch-policy|full-runtime-currentness-probe|full-runtime-native-trust|full-local-authorization-policy)\.json$' SHA256SUMS.txt > SHA256SUMS.next
            shasum -a 256 opl-release-manifest.json full-runtime-currentness-probe.json full-runtime-native-trust.json full-local-authorization-policy.json >> SHA256SUMS.next
            if [ "${OPL_MAC_STRICT_SIGNING_CHECKS:-false}" = "true" ]; then
              shasum -a 256 full-gatekeeper-launch-policy.json >> SHA256SUMS.next
            fi
            mv SHA256SUMS.next SHA256SUMS.txt
            shasum -a 256 -c SHA256SUMS.txt
          )
          echo "OPL_FULL_VERIFY_READY_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Summarize Full package size
        working-directory: one-person-lab-app
        shell: bash
        run: |
          set -euo pipefail
          dmg_path="$GITHUB_WORKSPACE/one-person-lab-app/dist/opl-full-release/One-Person-Lab-Full-${OPL_RELEASE_VERSION}-mac-arm64.dmg"
          dmg_size_bytes="$(stat -f%z "$dmg_path")"
          npm --silent run release:full:size -- \
            --full-dmg-size-bytes "$dmg_size_bytes" \
            --json > dist/opl-full-release/full-package-size-summary.json
          npm --silent run release:full:size -- \
            --full-dmg-size-bytes "$dmg_size_bytes" \
            --markdown > dist/opl-full-release/full-package-size-summary.md
          cat dist/opl-full-release/full-package-size-summary.md >> "$GITHUB_STEP_SUMMARY"
          node - dist/opl-full-release/full-package-size-summary.json <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('node:fs');
          const summary = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const compressed = summary.budget?.compressed_full_dmg || {};
          console.log('');
          console.log('## Full Size Release Coupling');
          console.log('');
          console.log(`- Full DMG review status: ${compressed.status || 'unknown'}`);
          console.log(`- Full DMG release-blocking by size alone: ${compressed.release_blocking === true}`);
          console.log('- Stable release clean evidence remains coupled to remote verification and VM smoke gates; Full size review alone is diagnostic unless a hard limit or offline first-install payload regression fails.');
          NODE

      - name: Summarize Full caches and timings
        shell: bash
        env:
          OPL_FULL_NPM_CACHE_HIT: ${{ steps.node-cache.outputs.cache-hit || 'unknown' }}
          OPL_FULL_BUN_CACHE_HIT: ${{ steps.bun-cache.outputs.cache-hit || 'false' }}
          OPL_FULL_UV_CACHE_HIT: ${{ steps.uv-cache.outputs.cache-hit || 'false' }}
          OPL_FULL_GO_CACHE_HIT: ${{ steps.go-cache.outputs.cache-hit || 'unknown' }}
          OPL_FULL_RUNTIME_CACHE_HIT: ${{ inputs.force_rebuild_runtime_cache && 'forced-rebuild' || format('toolchain:{0};domain-runtime:{1};opl-runtime:{2};skills:{3}', steps.restore-runtime-cache-toolchain.outputs.cache-hit || 'false', steps.restore-runtime-cache-domain.outputs.cache-hit || 'false', steps.restore-runtime-cache-opl.outputs.cache-hit || 'false', steps.restore-runtime-cache-skills.outputs.cache-hit || 'false') }}
        run: |
          set -euo pipefail
          telemetry_dir="$GITHUB_WORKSPACE/one-person-lab-app/dist/opl-full-release"
          telemetry_path="$telemetry_dir/full-workflow-telemetry.json"
          mkdir -p "$telemetry_dir"
          duration() {
            local start="$1"
            local end="$2"
            if [ -z "$start" ] || [ -z "$end" ]; then
              echo "n/a"
            else
              echo "$((end - start))s"
            fi
          }
          duration_json() {
            local start="$1"
            local end="$2"
            if [ -z "$start" ] || [ -z "$end" ]; then
              echo "null"
            else
              echo "$((end - start))"
            fi
          }
          node - "$telemetry_path" <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const outputPath = process.argv[2];
          const env = process.env;
          const telemetryDir = path.dirname(outputPath);
          const readJson = (name) => {
            const filePath = path.join(telemetryDir, name);
            if (!fs.existsSync(filePath)) return null;
            return JSON.parse(fs.readFileSync(filePath, 'utf8'));
          };
          const fullBuildTiming = readJson('full-package-build-timing.json');
          const fullManifest = readJson('full-package-manifest.json');
          const intValue = (value) => {
            const parsed = Number(value || '');
            return Number.isFinite(parsed) ? parsed : null;
          };
          const duration = (start, end) => {
            const left = intValue(start);
            const right = intValue(end);
            return left === null || right === null ? null : right - left;
          };
          const payload = {
            schema: 'opl_full_workflow_telemetry.v1',
            version: env.OPL_RELEASE_VERSION || null,
            run_id: env.GITHUB_RUN_ID || null,
            run_attempt: env.GITHUB_RUN_ATTEMPT || null,
            payload_refs: fullManifest?.resolved_refs ?? fullBuildTiming?.resolved_refs ?? null,
            resolved_refs: fullManifest?.resolved_refs ?? fullBuildTiming?.resolved_refs ?? null,
            cache: {
              npm_dependencies: '${{ steps.node-cache.outputs.cache-hit || 'unknown' }}',
              bun_install: '${{ steps.bun-cache.outputs.cache-hit || 'false' }}',
              uv_artifacts: '${{ steps.uv-cache.outputs.cache-hit || 'false' }}',
              go_modules_build: '${{ steps.go-cache.outputs.cache-hit || 'unknown' }}',
              electron_artifacts: '${{ steps.electron-cache.outputs.cache-hit || 'false' }}',
              shell_vite_output: '${{ steps.restore-shell-vite-output.outputs.cache-hit || 'false' }}',
              full_runtime_layers: env.OPL_FULL_RUNTIME_CACHE_HIT || 'unknown',
              full_runtime_cache_key: '${{ steps.runtime-cache-keys.outputs.cache_key }}',
              full_runtime_cache_digest: '${{ steps.runtime-cache-keys.outputs.cache_digest }}',
              full_runtime_layer_events: readJson('runtime-cache-events.json')?.events ?? null,
              full_runtime_layer_keys: readJson('runtime-cache-events.json')?.keys ?? null,
              full_runtime_layer_key_inputs: readJson('runtime-cache-events.json')?.key_inputs ?? null,
            },
            dmg_format: fullBuildTiming?.dmg_format ?? null,
            dmg_compression_level: fullBuildTiming?.dmg_compression_level ?? null,
            duration_seconds: {
              toolchain_install: duration(env.OPL_FULL_WORKFLOW_STARTED_AT, env.OPL_FULL_TOOLCHAIN_READY_AT),
              framework_npm_ci: duration(env.OPL_FULL_TOOLCHAIN_READY_AT, env.OPL_FULL_FRAMEWORK_DEPS_READY_AT),
              framework_build: duration(env.OPL_FULL_FRAMEWORK_DEPS_READY_AT, env.OPL_FULL_FRAMEWORK_BUILD_READY_AT),
              shell_dependencies: duration(env.OPL_FULL_FRAMEWORK_BUILD_READY_AT, env.OPL_FULL_SHELL_DEPS_READY_AT),
              shell_node_dependencies: duration(env.OPL_FULL_FRAMEWORK_BUILD_READY_AT, env.OPL_FULL_SHELL_NODE_DEPS_READY_AT),
              shell_electron_native_rebuild: duration(env.OPL_FULL_SHELL_NODE_DEPS_READY_AT, env.OPL_FULL_SHELL_DEPS_READY_AT),
              domain_dependencies: duration(env.OPL_FULL_SHELL_DEPS_READY_AT, env.OPL_FULL_DOMAIN_DEPS_READY_AT),
              full_package_build: fullBuildTiming?.duration_seconds?.full_package_build
                ?? duration(env.OPL_FULL_DOMAIN_DEPS_READY_AT, env.OPL_FULL_PACKAGE_READY_AT),
              full_package_build_breakdown: fullBuildTiming?.duration_seconds?.full_package_build_breakdown ?? null,
              checksum_signing_verify: duration(env.OPL_FULL_PACKAGE_READY_AT, env.OPL_FULL_VERIFY_READY_AT),
            },
          };
          fs.writeFileSync(outputPath, `${JSON.stringify(payload, null, 2)}\n`);
          NODE
          {
            echo
            echo "## Full Runtime Cache and Timing"
            echo
            echo "| Surface | Cache hit |"
            echo "| --- | --- |"
            echo "| npm dependencies | ${{ steps.node-cache.outputs.cache-hit || 'unknown' }} |"
            echo "| Bun install cache | ${{ steps.bun-cache.outputs.cache-hit || 'false' }} |"
            echo "| uv artifacts | ${{ steps.uv-cache.outputs.cache-hit || 'false' }} |"
            echo "| Go modules/build | ${{ steps.go-cache.outputs.cache-hit || 'unknown' }} |"
            echo "| Electron artifacts | ${{ steps.electron-cache.outputs.cache-hit || 'false' }} |"
            echo "| Shell Vite output | ${{ steps.restore-shell-vite-output.outputs.cache-hit || 'false' }} |"
            echo "| Full runtime layers | $OPL_FULL_RUNTIME_CACHE_HIT |"
            echo
            echo "## Full Payload Resolved Refs"
            echo
            if [ -f "$telemetry_dir/full-package-manifest.json" ]; then
              node -e 'const fs = require("node:fs"); const manifest = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); console.log("| Payload | Requested ref | Resolved commit |"); console.log("| --- | --- | --- |"); for (const ref of Object.values(manifest.resolved_refs || {})) console.log(`| ${ref.label || ref.repository} | ${ref.requested_ref || ""} | ${ref.resolved_commit || ""} |`);' "$telemetry_dir/full-package-manifest.json"
            else
              echo "| Payload | Requested ref | Resolved commit |"
              echo "| --- | --- | --- |"
              echo "| unavailable | unavailable | missing full-package-manifest.json |"
            fi
            echo
            echo "| Full runtime layer | Status |"
            echo "| --- | --- |"
            if [ -f "$telemetry_dir/runtime-cache-events.json" ]; then
              node -e 'const fs = require("node:fs"); const report = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); for (const event of report.events || []) console.log(`| ${event.layer_id} | ${event.status} |`);' "$telemetry_dir/runtime-cache-events.json"
            else
              echo "| unavailable | missing runtime-cache-events.json |"
            fi
            echo
            echo "| Step | Duration |"
            echo "| --- | --- |"
            echo "| Toolchain install | $(duration "${OPL_FULL_WORKFLOW_STARTED_AT:-}" "${OPL_FULL_TOOLCHAIN_READY_AT:-}") |"
            echo "| Framework npm ci | $(duration "${OPL_FULL_TOOLCHAIN_READY_AT:-}" "${OPL_FULL_FRAMEWORK_DEPS_READY_AT:-}") |"
            echo "| Framework build | $(duration "${OPL_FULL_FRAMEWORK_DEPS_READY_AT:-}" "${OPL_FULL_FRAMEWORK_BUILD_READY_AT:-}") |"
            echo "| Shell dependencies | $(duration "${OPL_FULL_FRAMEWORK_BUILD_READY_AT:-}" "${OPL_FULL_SHELL_DEPS_READY_AT:-}") |"
            echo "| Shell Node/Bun install | $(duration "${OPL_FULL_FRAMEWORK_BUILD_READY_AT:-}" "${OPL_FULL_SHELL_NODE_DEPS_READY_AT:-}") |"
            echo "| Shell Electron native rebuild | $(duration "${OPL_FULL_SHELL_NODE_DEPS_READY_AT:-}" "${OPL_FULL_SHELL_DEPS_READY_AT:-}") |"
            echo "| Domain dependencies | $(duration "${OPL_FULL_SHELL_DEPS_READY_AT:-}" "${OPL_FULL_DOMAIN_DEPS_READY_AT:-}") |"
            echo "| Full package build | $(duration "${OPL_FULL_DOMAIN_DEPS_READY_AT:-}" "${OPL_FULL_PACKAGE_READY_AT:-}") |"
            echo "| Full checksum/signing verify | $(duration "${OPL_FULL_PACKAGE_READY_AT:-}" "${OPL_FULL_VERIFY_READY_AT:-}") |"
            echo
            echo "## Full Package Build Breakdown"
            echo
            if [ -f "$telemetry_dir/full-package-build-timing.json" ]; then
              node -e 'const fs = require("node:fs"); const report = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); console.log("| Segment | Seconds |"); console.log("| --- | ---: |"); for (const [key, value] of Object.entries(report.duration_seconds?.full_package_build_breakdown || {})) console.log(`| ${key} | ${value} |`);' "$telemetry_dir/full-package-build-timing.json"
            else
              echo "| Segment | Seconds |"
              echo "| --- | ---: |"
              echo "| unavailable | missing full-package-build-timing.json |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Full workflow telemetry
        uses: actions/upload-artifact@v7
        with:
          name: opl-full-workflow-telemetry-${{ env.OPL_RELEASE_VERSION }}
          path: one-person-lab-app/dist/opl-full-release/full-workflow-telemetry.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload Full diagnostics artifact
        uses: actions/upload-artifact@v7
        with:
          name: opl-full-diagnostics-${{ env.OPL_RELEASE_VERSION }}
          path: |
            one-person-lab-app/dist/opl-full-release/full-workflow-telemetry.json
            one-person-lab-app/dist/opl-full-release/full-package-build-timing.json
            one-person-lab-app/dist/opl-full-release/full-package-manifest.json
            one-person-lab-app/dist/opl-full-release/full-package-size-summary.json
            one-person-lab-app/dist/opl-full-release/full-package-size-summary.md
            one-person-lab-app/dist/opl-full-release/runtime-cache-events.json
            one-person-lab-app/dist/opl-full-release/full-runtime-currentness-probe.json
            one-person-lab-app/dist/opl-full-release/full-runtime-native-trust.json
            one-person-lab-app/dist/opl-full-release/full-app-bundle-trim-report.json
            one-person-lab-app/dist/opl-full-release/full-package-boundary-audit.json
            one-person-lab-app/dist/opl-full-release/full-local-authorization-policy.json
            one-person-lab-app/dist/opl-full-release/SHA256SUMS.txt
            one-person-lab-app/dist/opl-full-release/README-Full-First-Install.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload Full local authorization policy
        if: ${{ inputs.publish_to_release || inputs.upload_full_package_artifact }}
        uses: actions/upload-artifact@v7
        with:
          name: opl-full-local-authorization-policy-${{ env.OPL_RELEASE_VERSION }}
          path: one-person-lab-app/dist/opl-full-release/full-local-authorization-policy.json
          if-no-files-found: error
          retention-days: 30

      - name: Save Full shell Vite output cache
        if: ${{ steps.restore-shell-vite-output.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: |
            one-person-lab-app/shells/aionui/out/main
            one-person-lab-app/shells/aionui/out/preload
            one-person-lab-app/shells/aionui/out/renderer
            one-person-lab-app/shells/aionui/out/.build-hash
          key: full-shell-vite-output-${{ runner.os }}-${{ runner.arch }}-${{ inputs.opl_version }}-${{ hashFiles('one-person-lab-app/shells/aionui/package.json', 'one-person-lab-app/shells/aionui/bun.lock', 'one-person-lab-app/shells/aionui/tsconfig.json', 'one-person-lab-app/shells/aionui/packages/desktop/electron.vite.config.ts', 'one-person-lab-app/shells/aionui/packages/desktop/src/**', 'one-person-lab-app/shells/aionui/public/**', 'one-person-lab-app/contracts/app-product-profile.json') }}

      - name: Save Full toolchain runtime cache
        if: ${{ inputs.force_rebuild_runtime_cache || steps.restore-runtime-cache-toolchain.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: ${{ steps.runtime-cache-keys.outputs.toolchain_cache_dir }}
          key: ${{ steps.runtime-cache-keys.outputs.toolchain_cache_key }}

      - name: Save Full domain runtime cache
        if: ${{ inputs.force_rebuild_runtime_cache || steps.restore-runtime-cache-domain.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: ${{ steps.runtime-cache-keys.outputs.domain_runtime_cache_dir }}
          key: ${{ steps.runtime-cache-keys.outputs.domain_runtime_cache_key }}

      - name: Save Full OPL runtime cache
        if: ${{ inputs.force_rebuild_runtime_cache || steps.restore-runtime-cache-opl.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: ${{ steps.runtime-cache-keys.outputs.opl_runtime_cache_dir }}
          key: ${{ steps.runtime-cache-keys.outputs.opl_runtime_cache_key }}

      - name: Save Full skills runtime cache
        if: ${{ inputs.force_rebuild_runtime_cache || steps.restore-runtime-cache-skills.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: ${{ steps.runtime-cache-keys.outputs.skills_cache_dir }}
          key: ${{ steps.runtime-cache-keys.outputs.skills_cache_key }}

      - name: Verify release upload plan
        if: ${{ inputs.publish_to_release }}
        working-directory: one-person-lab-app
        env:
          GH_TOKEN: ${{ github.token }}
          OPL_RELEASE_NOTES_MODE: template
        run: |
          npm run release:publish -- \
            --no-build \
            --dry-run \
            --version "$OPL_RELEASE_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --full-package-only \
            --include-full-package

      - name: Verify Full artifact plan without a release mutation
        if: ${{ !inputs.publish_to_release && inputs.upload_full_package_artifact }}
        working-directory: one-person-lab-app
        env:
          OPL_RELEASE_EXISTS: '0'
          OPL_RELEASE_NOTES_MODE: template
        run: |
          npm run release:publish -- \
            --no-build \
            --dry-run \
            --version "$OPL_RELEASE_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --full-package-only \
            --include-full-package

      - name: Verify existing standard updater metadata
        if: ${{ inputs.publish_to_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          is_draft="$(gh release view "v${OPL_RELEASE_VERSION}" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
          if [ "$is_draft" != "true" ]; then
            echo "::error::Full assets may be uploaded only before Stable promotion; v${OPL_RELEASE_VERSION} is already published and immutable."
            exit 1
          fi
          gh release download "v${OPL_RELEASE_VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'latest*.yml' \
            --dir "$tmpdir"
          if grep -R "One-Person-Lab-Full" "$tmpdir"/latest*.yml; then
            echo "::error::existing updater metadata must not reference Full assets"
            exit 1
          fi

      - name: Prepare Full release notes
        if: ${{ inputs.publish_to_release }}
        working-directory: one-person-lab-app
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          OPL_RELEASE_NOTES_MODE: ai
          OPL_RELEASE_NOTES_PROVIDER: openai_compatible
          OPL_RELEASE_NOTES_CODEX_BASE_URL: ${{ vars.OPL_RELEASE_NOTES_CODEX_BASE_URL || 'https://gflabtoken.cn/v1' }}
          OPL_RELEASE_NOTES_CODEX_API_KEY: ${{ secrets.OPL_RELEASE_NOTES_CODEX_API_KEY }}
          OPL_RELEASE_NOTES_MODEL: ${{ vars.OPL_RELEASE_NOTES_MODEL || 'gpt-5.4-mini' }}
          OPL_RELEASE_NOTES_AI_TIMEOUT_SECONDS: '30'
        run: |
          set -euo pipefail
          npm run release:notes -- \
            --version "$OPL_RELEASE_VERSION" \
            --channel stable \
            --repo "$GITHUB_REPOSITORY" \
            --shell-root shells/aionui \
            --include-full-package \
            --full-package-manifest dist/opl-full-release/full-package-manifest.json \
            --current-tag "v${OPL_RELEASE_VERSION}" \
            --evidence-output "$RUNNER_TEMP/full-release-notes-evidence.json" \
            --output "$RUNNER_TEMP/full-release-notes-template.md"
          ai_notes_ready=false
          if npm run release:notes:probe-ai && \
             npm run release:notes:prepare -- \
               --evidence "$RUNNER_TEMP/full-release-notes-evidence.json" \
               --output "$RUNNER_TEMP/full-release-notes.md"; then
            ai_notes_ready=true
          fi
          if [ "$ai_notes_ready" != "true" ]; then
            echo "::warning::AI release notes were unavailable; using the deterministic release-note template."
            OPL_RELEASE_NOTES_MODE=template npm run release:notes:prepare -- \
              --evidence "$RUNNER_TEMP/full-release-notes-evidence.json" \
              --input "$RUNNER_TEMP/full-release-notes-template.md" \
              --output "$RUNNER_TEMP/full-release-notes.md"
          fi

      - name: Upload Full package workflow artifact
        if: ${{ always() && steps.full_package_build.outcome == 'success' && (inputs.publish_to_release || inputs.upload_full_package_artifact) }}
        uses: actions/upload-artifact@v7
        with:
          name: opl-full-first-install-${{ env.OPL_RELEASE_VERSION }}-mac-arm64
          path: one-person-lab-app/dist/opl-full-release
          if-no-files-found: error
          retention-days: 14

      - name: Write Full build artifact cohort manifest
        if: ${{ always() && steps.full_package_build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          APP_SHA="$(git -C one-person-lab-app rev-parse HEAD)" \
          SHELL_SHA="$(git -C one-person-lab-app/shells/aionui rev-parse HEAD)" \
          FRAMEWORK_SHA="$(git -C one-person-lab rev-parse HEAD)" \
          OPL_BUILD_VERSION="$OPL_RELEASE_VERSION" \
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const output = path.join(process.env.RUNNER_TEMP, 'opl-build-cohort.json');
          fs.writeFileSync(output, `${JSON.stringify({
            schema: 'opl_app_build_artifact_cohort.v1',
            app_sha: process.env.APP_SHA,
            shell_sha: process.env.SHELL_SHA,
            framework_sha: process.env.FRAMEWORK_SHA,
            version: process.env.OPL_BUILD_VERSION,
          }, null, 2)}\n`);
          NODE

      - name: Upload Full build artifact cohort manifest
        if: ${{ always() && steps.full_package_build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: opl-full-first-install-dmg-${{ env.OPL_RELEASE_VERSION }}-mac-arm64-cohort
          path: ${{ runner.temp }}/opl-build-cohort.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload Full DMG-only workflow artifact
        if: ${{ always() && steps.full_package_build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: opl-full-first-install-dmg-${{ env.OPL_RELEASE_VERSION }}-mac-arm64
          path: one-person-lab-app/dist/opl-full-release/One-Person-Lab-Full-${{ env.OPL_RELEASE_VERSION }}-mac-arm64.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Upload prepared Full release notes for publish
        if: ${{ inputs.publish_to_release }}
        uses: actions/upload-artifact@v7
        env:
          OPL_RELEASE_NOTES_FILE: ${{ runner.temp }}/full-release-notes.md
        with:
          name: prepared-full-release-notes-${{ env.OPL_RELEASE_VERSION }}
          path: ${{ env.OPL_RELEASE_NOTES_FILE }}
          if-no-files-found: error

      - name: Upload Full release-note evidence
        if: ${{ inputs.publish_to_release }}
        uses: actions/upload-artifact@v7
        with:
          name: full-release-notes-evidence-${{ env.OPL_RELEASE_VERSION }}
          path: |
            ${{ runner.temp }}/full-release-notes.md
            ${{ runner.temp }}/full-release-notes-template.md
            ${{ runner.temp }}/full-release-notes-evidence.json
          if-no-files-found: error

      - name: Clean up keychain
        if: always()
        run: |
          if security list-keychains | grep -q build.keychain; then
            security delete-keychain build.keychain
          fi

  publish-full-release-assets:
    name: Publish Full GitHub Release assets
    needs: full-first-install
    if: ${{ inputs.publish_to_release }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout App repo
        uses: actions/checkout@v6
        with:
          path: one-person-lab-app

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Download Full package workflow artifact
        uses: actions/download-artifact@v8
        with:
          name: opl-full-first-install-${{ inputs.opl_version }}-mac-arm64
          path: one-person-lab-app/dist/opl-full-release

      - name: Download prepared Full release notes
        uses: actions/download-artifact@v8
        with:
          name: prepared-full-release-notes-${{ inputs.opl_version }}
          path: prepared-full-release-notes

      - name: Publish GitHub Release assets
        working-directory: one-person-lab-app
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          OPL_RELEASE_VERSION: ${{ inputs.opl_version }}
          OPL_RELEASE_NOTES_FILE: ${{ github.workspace }}/prepared-full-release-notes/full-release-notes.md
        run: |
          npm run release:publish -- \
            --no-build \
            --version "$OPL_RELEASE_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --full-package-only \
            --include-full-package \
            --release-notes-file "$OPL_RELEASE_NOTES_FILE"
