name: Release GitHub Admin Credentials Preflight

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: opl-release-github-admin-credentials-preflight
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Verify protected GitHub release-admin credential
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release-stable
    steps:
      - name: Checkout exact credential preflight source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'

      - name: Execute authenticated read-only immutable-release capability GET
        id: credential
        continue-on-error: true
        env:
          OPL_GITHUB_RELEASE_ADMIN_TOKEN: ${{ secrets.OPL_GITHUB_RELEASE_ADMIN_TOKEN }}
        run: >-
          node --experimental-strip-types scripts/verify-github-release-admin-credential.ts
          --output "$RUNNER_TEMP/github-release-admin-credential-preflight.json"

      - name: Upload sanitized GitHub release-admin credential preflight receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: opl-github-release-admin-credential-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/github-release-admin-credential-preflight.json
          if-no-files-found: warn
          retention-days: 30

      - name: Summarize and enforce diagnostic-only result
        if: ${{ always() }}
        env:
          OPL_CREDENTIAL_STEP_OUTCOME: ${{ steps.credential.outcome }}
          OPL_CREDENTIAL_RECEIPT: ${{ runner.temp }}/github-release-admin-credential-preflight.json
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const receipt = JSON.parse(fs.readFileSync(process.env.OPL_CREDENTIAL_RECEIPT, 'utf8'));
          const lines = [
            '## GitHub release-admin credential preflight',
            '',
            `- Status: ${receipt.status}`,
            `- Credential status: ${receipt.credential_status}`,
            `- Repository immutability enabled: ${receipt.setting?.enabled ?? 'not verified'}`,
            `- Repository owner enforcement: ${receipt.setting?.enforced_by_owner ?? 'not verified'}`,
            `- Failure code: ${receipt.failure?.code ?? 'none'}`,
            `- HTTP status: ${receipt.failure?.http_status ?? 200}`,
            '- Stable admission authority: false',
            '- Release or repository-setting mutation authorized: false',
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`);
          if (process.env.OPL_CREDENTIAL_STEP_OUTCOME !== 'success' || receipt.status !== 'passed') {
            process.exit(1);
          }
          NODE
