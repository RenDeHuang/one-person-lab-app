name: OPL Standard Bundle Build

on:
  workflow_call:
    inputs:
      mode:
        description: execute or canary
        required: false
        default: execute
        type: string
      operation:
        description: standard for the initial build operation
        required: false
        default: standard
        type: string
      channel:
        description: stable or nightly
        required: true
        type: string
      version:
        description: Stable version; Nightly resolves the current Shanghai-date revision when empty
        required: false
        default: ''
        type: string
      include_full:
        description: Bind intent for a later independent Full append operation
        required: false
        default: false
        type: boolean
      app_ref:
        description: Exact canonical App ref
        required: true
        type: string
      shell_ref:
        description: Exact Shell main SHA for Stable; Nightly resolves main once
        required: false
        default: ''
        type: string
      framework_ref:
        description: Exact Framework main SHA for Stable; Nightly resolves main once
        required: false
        default: ''
        type: string
      operation_started_at:
        description: Stable operation start; empty for Nightly
        required: false
        default: ''
        type: string
      operation_deadline_at:
        description: Stable operation mutation deadline; empty for Nightly
        required: false
        default: ''
        type: string
    outputs:
      source_run_id:
        description: Run containing the exported Standard checkpoint
        value: ${{ jobs.checkpoint-standard.outputs.source_run_id }}
      source_artifact:
        description: Exported Standard checkpoint artifact
        value: ${{ jobs.checkpoint-standard.outputs.source_artifact }}
      checkpoint_transport_executor:
        description: Executor that transported the Standard checkpoint
        value: ${{ jobs.checkpoint-standard.outputs.checkpoint_transport_executor }}
      transport_run_id:
        description: Run that transported the Standard checkpoint
        value: ${{ jobs.checkpoint-standard.outputs.transport_run_id }}
      completed_stage:
        description: Framework checkpoint export stage, passed through without App projection
        value: ${{ jobs.checkpoint-standard.outputs.completed_stage }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  OPL_FRAMEWORK_CANARY_MINIMUM_ABI_REF: ad09977d7cdfc6cb3d1c04f7f1e6fd9358a7a2fc
  OPL_RELEASE_BUNDLE_ARTIFACT: opl-release-bundle-${{ github.run_id }}
  OPL_STANDARD_CHECKPOINT_ARTIFACT: opl-release-standard-checkpoint-${{ github.run_id }}

jobs:
  startup-canary:
    if: ${{ inputs.mode == 'canary' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Prove reusable Standard build topology starts
        run: |
          test '${{ inputs.operation }}' = standard
          test '${{ inputs.channel }}' = canary
          test '${{ inputs.app_ref }}' = canary
          test '${{ inputs.framework_ref }}' = "$OPL_FRAMEWORK_CANARY_MINIMUM_ABI_REF"

  admission:
    if: ${{ inputs.mode == 'execute' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Admit one-shot Bundle build operation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-failure-evidence
          status=passed
          reason=admitted
          if [ "$GITHUB_RUN_ATTEMPT" != 1 ]; then status=failed; reason=workflow_rerun; fi
          if [ '${{ inputs.channel }}' = stable ]; then
            node <<'NODE' || { status=failed; reason=deadline_invalid; }
          const started = Date.parse('${{ inputs.operation_started_at }}');
          const deadline = Date.parse('${{ inputs.operation_deadline_at }}');
          if (!Number.isFinite(started) || !Number.isFinite(deadline) || Date.now() >= deadline) process.exit(1);
          NODE
          fi
          jq -n --arg status "$status" --arg reason "$reason" \
            --arg operation '${{ inputs.operation }}' --arg run_id "$GITHUB_RUN_ID" \
            '{schema:"opl_release_operation_admission_receipt.v1",status:$status,reason:$reason,operation:$operation,run_id:$run_id,run_attempt:env.GITHUB_RUN_ATTEMPT}' \
            > release-failure-evidence/operation-admission.json
          test "$status" = passed
      - name: Upload Bundle admission evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: opl-release-bundle-admission-${{ github.run_id }}
          path: release-failure-evidence
          if-no-files-found: error
          retention-days: 30

  full-notes-authority:
    if: ${{ inputs.mode == 'execute' && inputs.include_full && needs.admission.result == 'success' }}
    needs: [admission]
    runs-on: macos-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout exact App authority
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.app_ref }}
          fetch-depth: 0

      - name: Checkout exact Shell authority
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: gaofeng21cn/opl-aion-shell
          ref: ${{ inputs.shell_ref }}
          path: shells/aionui

      - name: Checkout exact Framework authority
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: gaofeng21cn/one-person-lab
          ref: ${{ inputs.framework_ref }}
          path: framework-source

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'

      - name: Materialize exact Shell AionCore authority
        working-directory: shells/aionui
        env:
          GH_TOKEN: ${{ github.token }}
          AIONUI_AIONCORE_CACHE_DIR: ${{ runner.temp }}/opl-release-notes-aioncore-${{ github.run_id }}
          AIONUI_BACKEND_ARCH: arm64
          AIONUI_BACKEND_RUN_ID: ''
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          test ! -e resources/bundled-aioncore/darwin-arm64
          aioncore_version="$(node -e '
            const value = JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).aioncoreVersion;
            if (typeof value !== "string" || !/^v[0-9]+\.[0-9]+\.[0-9]+$/.test(value)) process.exit(1);
            process.stdout.write(value);
          ')"
          AIONUI_BACKEND_VERSION="$aioncore_version" node scripts/prepareAioncore.js
          test -f resources/bundled-aioncore/darwin-arm64/manifest.json
          test -f resources/bundled-aioncore/darwin-arm64/managed-resources/manifest.json

      - name: Derive deep-validated Full notes payload authority
        run: |
          set -euo pipefail
          release_set_manifest="$(find framework-source/release/cohorts -mindepth 2 -maxdepth 2 -type f -name release-set.json -print | sort -V | tail -1)"
          test -n "$release_set_manifest"
          node --experimental-strip-types scripts/prepare-release-notes-full-payload-authority.ts \
            --app-root . \
            --app-ref '${{ inputs.app_ref }}' \
            --shell-root shells/aionui \
            --shell-ref '${{ inputs.shell_ref }}' \
            --framework-root framework-source \
            --framework-ref '${{ inputs.framework_ref }}' \
            --release-set-manifest "$release_set_manifest" \
            --third-party-source-manifest contracts/app-full-third-party-source-manifest.json \
            --output notes-full-payload-authority.json
          shasum -a 256 notes-full-payload-authority.json > notes-full-payload-authority.sha256

      - name: Upload exact Full notes payload authority
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: opl-release-full-notes-authority-${{ github.run_id }}
          path: |
            notes-full-payload-authority.json
            notes-full-payload-authority.sha256
          if-no-files-found: error
          retention-days: 30

  freeze:
    if: ${{ always() && inputs.mode == 'execute' && needs.admission.result == 'success' && (!inputs.include_full || needs['full-notes-authority'].result == 'success') }}
    needs: [admission, full-notes-authority]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.identity.outputs.version }}
      updater_version: ${{ steps.identity.outputs.updater_version }}
      tag: ${{ steps.identity.outputs.tag }}
      app_sha: ${{ steps.identity.outputs.app_sha }}
      shell_sha: ${{ steps.identity.outputs.shell_sha }}
      framework_sha: ${{ steps.identity.outputs.framework_sha }}
      opl_flow_sha: ${{ steps.identity.outputs.opl_flow_sha }}
      release_set_manifest: ${{ steps.identity.outputs.release_set_manifest }}
      bundle_digest: ${{ steps.bundle.outputs.bundle_digest }}
      operation_id: ${{ steps.bundle.outputs.operation_id }}
      operation_started_at: ${{ steps.bundle.outputs.operation_started_at }}
      operation_deadline_at: ${{ steps.bundle.outputs.operation_deadline_at }}
    steps:
      - name: Checkout canonical App source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.app_ref }}
          fetch-depth: 0

      - name: Checkout Shell source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: gaofeng21cn/opl-aion-shell
          ref: ${{ inputs.shell_ref || 'main' }}
          path: shells/aionui

      - name: Checkout Framework source and executor
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: gaofeng21cn/one-person-lab
          ref: ${{ inputs.framework_ref || 'main' }}
          path: framework-source

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm

      - name: Install cold-gate dependencies
        run: |
          npm ci --ignore-scripts
          npm --prefix framework-source ci --ignore-scripts

      - name: Freeze source, version, and Package identity
        id: identity
        env:
          CHANNEL: ${{ inputs.channel }}
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_SHELL_REF: ${{ inputs.shell_ref }}
          REQUESTED_FRAMEWORK_REF: ${{ inputs.framework_ref }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1 || { echo "::error::Bundle builds cannot be rerun."; exit 1; }
          case "$CHANNEL" in stable|nightly) ;; *) exit 1 ;; esac
          app_sha="$(git rev-parse HEAD)"
          shell_sha="$(git -C shells/aionui rev-parse HEAD)"
          framework_sha="$(git -C framework-source rev-parse HEAD)"
          canonical_app_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          canonical_shell_sha="$(git -C shells/aionui ls-remote origin refs/heads/main | awk '{print $1}')"
          canonical_framework_sha="$(git -C framework-source ls-remote origin refs/heads/main | awk '{print $1}')"
          [ "$app_sha" = "$canonical_app_sha" ] || { echo "::error::App source is not canonical main."; exit 1; }
          [ "$shell_sha" = "$canonical_shell_sha" ] || { echo "::error::Shell source is not canonical main."; exit 1; }
          [ "$framework_sha" = "$canonical_framework_sha" ] || { echo "::error::Framework source is not canonical main."; exit 1; }
          if [ "$CHANNEL" = stable ]; then
            version="$REQUESTED_VERSION"
            [ "$shell_sha" = "$REQUESTED_SHELL_REF" ] || exit 1
            [ "$framework_sha" = "$REQUESTED_FRAMEWORK_REF" ] || exit 1
            test -n "$version"
            published_releases_json="$RUNNER_TEMP/opl-published-releases-$GITHUB_RUN_ID.json"
            published_tags_txt="$RUNNER_TEMP/opl-published-tags-$GITHUB_RUN_ID.txt"
            stable_version_order_json="$RUNNER_TEMP/opl-stable-version-order-$GITHUB_RUN_ID.json"
            previous_latest_json="$RUNNER_TEMP/opl-previous-latest-$GITHUB_RUN_ID.json"
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$published_releases_json"
            git ls-remote --tags origin 'refs/tags/v*' > "$published_tags_txt"
            PUBLISHED_RELEASES_JSON="$published_releases_json" PUBLISHED_TAGS_TXT="$published_tags_txt" \
              BASE_VERSION="${version%-r*}" VERSION="$version" \
              node --experimental-strip-types --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { resolveStableReleaseVersion } from './scripts/release-version.ts';
          const pages = JSON.parse(fs.readFileSync(process.env.PUBLISHED_RELEASES_JSON, 'utf8'));
          const refs = Array.isArray(pages) ? pages.flat().map((release) => release.tag_name).filter(Boolean) : [];
          refs.push(...fs.readFileSync(process.env.PUBLISHED_TAGS_TXT, 'utf8').split(/\r?\n/).filter(Boolean));
          const resolved = resolveStableReleaseVersion(process.env.BASE_VERSION, refs);
          if (resolved.version !== process.env.VERSION) {
            throw new Error(`Stable must use next immutable same-day revision ${resolved.version}; got ${process.env.VERSION}.`);
          }
          NODE
            node --experimental-strip-types scripts/stable-release-version-order.ts \
              --target "$version" --published-releases-json "$published_releases_json" > "$stable_version_order_json"
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$version" >/dev/null 2>&1; then
              echo "::error::Stable v$version already exists; use resume_standard only with its exact checkpoint."
              exit 1
            fi
            git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1 && {
              echo "::error::Stable tag v$version already exists."
              exit 1
            }
          else
            base="$(TZ=Asia/Shanghai date '+%y.%-m.%-d')-nightly"
            nightly_tags_txt="$RUNNER_TEMP/opl-nightly-tags-$GITHUB_RUN_ID.txt"
            git ls-remote --tags origin 'refs/tags/v*-nightly*' > "$nightly_tags_txt"
            version="$(BASE="$base" NIGHTLY_TAGS_TXT="$nightly_tags_txt" node --experimental-strip-types --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { resolveNightlyReleaseVersion } from './scripts/release-version.ts';
          const refs = fs.readFileSync(process.env.NIGHTLY_TAGS_TXT, 'utf8').split(/\r?\n/).filter(Boolean);
          process.stdout.write(resolveNightlyReleaseVersion(process.env.BASE, refs).version);
          NODE
            )"
          fi
          version_json="$(node --experimental-strip-types scripts/release-version.ts --channel "$CHANNEL" --version "$version" --json)"
          updater_version="$(jq -er .updater_version <<<"$version_json")"
          if [ "$CHANNEL" = stable ]; then
            gh api "repos/$GITHUB_REPOSITORY/releases/latest" > "$previous_latest_json"
            previous_display="$(jq -er .tag_name "$previous_latest_json" | sed 's/^v//')"
            previous_json="$(node --experimental-strip-types scripts/release-version.ts --channel stable --version "$previous_display" --json)"
            previous_updater="$(jq -er .updater_version <<<"$previous_json")"
            TARGET="$updater_version" CURRENT="$previous_updater" node --experimental-strip-types --input-type=module <<'NODE'
          import { compareUpdaterMachineVersions } from './scripts/release-version.ts';
          if (compareUpdaterMachineVersions(process.env.TARGET, process.env.CURRENT) <= 0) {
            throw new Error(`Stable updater version ${process.env.TARGET} is not newer than Latest ${process.env.CURRENT}.`);
          }
          NODE
          fi
          release_set_manifest="$(find framework-source/release/cohorts -mindepth 2 -maxdepth 2 -type f -name release-set.json -print | sort -V | tail -1)"
          test -n "$release_set_manifest"
          release_set_manifest="${release_set_manifest#framework-source/}"
          opl_flow_sha="$(jq -er '.packages["opl-flow"].owner_source_commit' framework-source/contracts/opl-framework/bundled-full-runtime-package-catalog.json)"
          {
            echo "version=$version"
            echo "updater_version=$updater_version"
            echo "tag=v$version"
            echo "app_sha=$app_sha"
            echo "shell_sha=$shell_sha"
            echo "framework_sha=$framework_sha"
            echo "opl_flow_sha=$opl_flow_sha"
            echo "release_set_manifest=$release_set_manifest"
          } >> "$GITHUB_OUTPUT"

      - name: Validate Bundle contracts before paid work
        run: |
          npm run typecheck
          npm run validate:release-boundary
          node --experimental-strip-types --test tests/release/release-bundle-workflow-cutover.test.ts
          node --experimental-strip-types --test framework-source/tests/src/cli/cases/release-bundle.test.ts
          npm --prefix framework-source run typecheck

      - name: Download exact Full notes payload authority
        if: ${{ inputs.include_full }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: opl-release-full-notes-authority-${{ github.run_id }}
          path: ${{ runner.temp }}/opl-release-full-notes-authority

      - name: Verify Full notes payload authority transport
        if: ${{ inputs.include_full }}
        working-directory: ${{ runner.temp }}/opl-release-full-notes-authority
        run: shasum -a 256 -c notes-full-payload-authority.sha256

      - name: Prepare and validate online AI notes
        env:
          GH_TOKEN: ${{ github.token }}
          OPL_RELEASE_NOTES_MODE: ai
          OPL_RELEASE_NOTES_PROVIDER: openai_compatible
          OPL_RELEASE_NOTES_CODEX_BASE_URL: https://gflabtoken.cn/v1
          OPL_RELEASE_NOTES_CODEX_API_KEY: ${{ secrets.OPL_RELEASE_NOTES_CODEX_API_KEY }}
          OPL_RELEASE_NOTES_MODEL: gpt-5.6-luna
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPL_RELEASE_NOTES_CODEX_API_KEY" || { echo "::error::Online AI release-note credential is missing."; exit 1; }
          notes_intent_args=()
          if [[ '${{ inputs.include_full }}' == true ]]; then
            notes_intent_args+=(
              --include-full-package
              --full-package-manifest "$RUNNER_TEMP/opl-release-full-notes-authority/notes-full-payload-authority.json"
            )
          fi
          npm run release:notes -- \
            --version '${{ steps.identity.outputs.version }}' \
            --channel '${{ inputs.channel }}' \
            --repo "$GITHUB_REPOSITORY" \
            --shell-root shells/aionui \
            --current-tag '${{ steps.identity.outputs.tag }}' \
            --current-app-ref '${{ steps.identity.outputs.app_sha }}' \
            --current-shell-ref '${{ steps.identity.outputs.shell_sha }}' \
            "${notes_intent_args[@]}" \
            --evidence-output notes-evidence.json \
            --output notes-template.md
          npm run release:notes:prepare -- \
            --evidence notes-evidence.json \
            --output notes.md \
            --receipt-output notes-prepare-receipt.json

      - name: Upload notes preparation receipt
        if: ${{ always() && hashFiles('notes-prepare-receipt.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: opl-release-notes-prepare-${{ github.run_id }}
          path: notes-prepare-receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Freeze canonical Framework Bundle
        id: bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ inputs.channel }}' = stable ]; then
            node --experimental-strip-types scripts/release-operation-deadline.ts check \
              --operation '${{ inputs.operation }}' \
              --started-at '${{ inputs.operation_started_at }}' \
              --deadline-at '${{ inputs.operation_deadline_at }}'
          fi
          node --experimental-strip-types scripts/framework-release-adapter.ts freeze-request \
            --channel '${{ inputs.channel }}' \
            --version '${{ steps.identity.outputs.version }}' \
            --updater-version '${{ steps.identity.outputs.updater_version }}' \
            --app-root . \
            --shell-root shells/aionui \
            --framework-root framework-source \
            --notes notes.md \
            --notes-evidence notes-evidence.json \
            --include-full-package '${{ inputs.include_full }}' \
            --release-set-manifest 'framework-source/${{ steps.identity.outputs.release_set_manifest }}' \
            --output freeze-request.json
          framework-source/bin/opl release freeze \
            --request freeze-request.json \
            --source-root framework-source \
            --store "$RUNNER_TEMP/release-bundle-store" \
            --json > freeze-result.json
          bundle_digest="$(jq -er .release_bundle_freeze.bundle_digest freeze-result.json)"
          test "$bundle_digest" != sha256:91d5ea069757fca6bb9aa2280615dc952caeff55b6b4bc13e08e40df32378f49
          bundle_path="$(jq -er .release_bundle_freeze.bundle_path freeze-result.json)"
          cp "$bundle_path" release-bundle.json
          operation_id="gha-${GITHUB_RUN_ID}-standard"
          operation_started_at='${{ inputs.operation_started_at }}'
          operation_deadline_at='${{ inputs.operation_deadline_at }}'
          if [ '${{ inputs.channel }}' = nightly ]; then
            operation_created_at="$(timeout --foreground --signal=TERM --kill-after=5s 30s \
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)"
            node --experimental-strip-types scripts/release-operation-deadline.ts resolve \
              --operation standard --started-at "$operation_created_at" \
              --output nightly-operation-request.json > /dev/null
            operation_started_at="$(jq -er .started_at nightly-operation-request.json)"
            operation_deadline_at="$(jq -er .deadline_at nightly-operation-request.json)"
          fi
          framework-source/bin/opl release operation admit \
            --bundle "$bundle_digest" --operation standard \
            --operation-id "$operation_id" \
            --operation-started-at "$operation_started_at" \
            --operation-deadline-at "$operation_deadline_at" \
            --store "$RUNNER_TEMP/release-bundle-store" \
            --json > operation-admit-result.json
          test "$(jq -r .release_bundle_operation_admit.status operation-admit-result.json)" = complete
          {
            echo "bundle_digest=$bundle_digest"
            echo "operation_id=$operation_id"
            echo "operation_started_at=$operation_started_at"
            echo "operation_deadline_at=$operation_deadline_at"
          } >> "$GITHUB_OUTPUT"

      - name: Upload immutable Bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.OPL_RELEASE_BUNDLE_ARTIFACT }}
          path: |
            release-bundle.json
            freeze-request.json
            freeze-result.json
            operation-admit-result.json
            notes.md
            notes-evidence.json
          if-no-files-found: error
          retention-days: 30

  standard-build:
    if: ${{ inputs.mode == 'execute' }}
    needs: [freeze]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_build-reusable.yml
    with:
      mode: execute
      matrix: >-
        {"include":[{"platform":"macos-arm64","os":"macos-latest","command":"node scripts/build-with-builder.js arm64 --mac --arm64","artifact-name":"macos-build-arm64","arch":"arm64"}]}
      ref: ${{ needs.freeze.outputs.app_sha }}
      shell_ref: ${{ needs.freeze.outputs.shell_sha }}
      framework_ref: ${{ needs.freeze.outputs.framework_sha }}
      opl_flow_ref: ${{ needs.freeze.outputs.opl_flow_sha }}
      opl_release_version: ${{ needs.freeze.outputs.version }}
      opl_updater_version: ${{ needs.freeze.outputs.updater_version }}
      release_bundle_digest: ${{ needs.freeze.outputs.bundle_digest }}
      release_cohort_ref: ${{ needs.freeze.outputs.bundle_digest }}
      require_macos_gatekeeper: false
      operation: ${{ inputs.channel == 'stable' && inputs.operation || '' }}
      operation_started_at: ${{ inputs.channel == 'stable' && needs.freeze.outputs.operation_started_at || '' }}
      operation_deadline_at: ${{ inputs.channel == 'stable' && needs.freeze.outputs.operation_deadline_at || '' }}

  standard-qualification:
    if: ${{ inputs.mode == 'execute' }}
    needs: [freeze, standard-build]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/opl-first-run-vm.yml
    with:
      mode: execute
      release_artifact_name: macos-build-arm64-dmg
      release_artifact_run_id: ${{ github.run_id }}
      release_bundle_digest: ${{ needs.freeze.outputs.bundle_digest }}
      release_cohort_ref: ${{ needs.freeze.outputs.bundle_digest }}
      artifact_app_ref: ${{ needs.freeze.outputs.app_sha }}
      shell_ref: ${{ needs.freeze.outputs.shell_sha }}
      smoke_harness_ref: ${{ needs.freeze.outputs.shell_sha }}
      framework_ref: ${{ needs.freeze.outputs.framework_sha }}
      package_profile: standard
      diagnostic_scope: release_gate
      operation: ${{ inputs.channel == 'stable' && inputs.operation || '' }}
      operation_started_at: ${{ inputs.channel == 'stable' && needs.freeze.outputs.operation_started_at || '' }}
      operation_deadline_at: ${{ inputs.channel == 'stable' && needs.freeze.outputs.operation_deadline_at || '' }}

  checkpoint-standard:
    if: ${{ inputs.mode == 'execute' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [freeze, standard-build, standard-qualification]
    permissions:
      contents: read
      actions: read
    outputs:
      source_run_id: ${{ steps.provenance.outputs.source_run_id }}
      source_artifact: ${{ steps.provenance.outputs.source_artifact }}
      checkpoint_transport_executor: ${{ steps.provenance.outputs.checkpoint_transport_executor }}
      transport_run_id: ${{ steps.provenance.outputs.transport_run_id }}
      completed_stage: ${{ steps.provenance.outputs.completed_stage }}
    steps:
      - name: Recheck one-shot deadline before Standard checkpoint
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          if [ '${{ inputs.channel }}' = stable ]; then
            node <<'NODE'
          const deadline = Date.parse('${{ inputs.operation_deadline_at }}');
          if (!Number.isFinite(deadline) || Date.now() >= deadline) process.exit(1);
          NODE
          fi

      - name: Checkout App product adapter
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ needs.freeze.outputs.app_sha }}
          path: app-source

      - name: Checkout Framework checkpoint authority
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: gaofeng21cn/one-person-lab
          ref: ${{ needs.freeze.outputs.framework_sha }}
          path: framework-source

      - name: Download Bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.OPL_RELEASE_BUNDLE_ARTIFACT }}
          path: bundle

      - name: Download Standard build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: macos-build-arm64
          path: standard-assets

      - name: Download exact Standard qualification
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: opl-first-run-vm-standard-${{ github.run_id }}
          path: standard-qualification

      - name: Setup Framework runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: framework-source/package-lock.json

      - name: Install Framework runtime dependencies
        run: npm --prefix framework-source ci --ignore-scripts

      - name: Bind Standard bytes and export portable checkpoint
        env:
          BUNDLE_DIGEST: ${{ needs.freeze.outputs.bundle_digest }}
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types app-source/scripts/bind-standard-release-track.ts \
            --assets-dir standard-assets \
            --version '${{ needs.freeze.outputs.version }}' \
            --updater-version '${{ needs.freeze.outputs.updater_version }}' \
            --app-sha '${{ needs.freeze.outputs.app_sha }}' \
            --channel '${{ inputs.channel }}' \
            --repository "$GITHUB_REPOSITORY" \
            --component-manifest-script app-source/scripts/write-opl-app-component-manifest.ts \
            --component-manifest-output standard-assets/opl-app-component-manifest.json \
            --identity-receipt-output standard-identity-receipt.json
          node --experimental-strip-types app-source/scripts/framework-release-adapter.ts executor-receipt \
            --operation build --executor remote --attempt-id "gha-${GITHUB_RUN_ID}-standard-build" \
            --release-operation standard --operation-id '${{ needs.freeze.outputs.operation_id }}' \
            --remote-target "github-actions:${GITHUB_REPOSITORY}/runs/${GITHUB_RUN_ID}/standard-build" \
            --bundle bundle/release-bundle.json --track standard --outcome complete \
            --assets-dir standard-assets --output standard-build-receipt.json
          framework-source/bin/opl release freeze \
            --request bundle/freeze-request.json --source-root framework-source \
            --store "$RUNNER_TEMP/store" --json > /dev/null
          framework-source/bin/opl release operation admit \
            --bundle "$BUNDLE_DIGEST" --operation standard \
            --operation-id '${{ needs.freeze.outputs.operation_id }}' \
            --operation-started-at '${{ needs.freeze.outputs.operation_started_at }}' \
            --operation-deadline-at '${{ needs.freeze.outputs.operation_deadline_at }}' \
            --store "$RUNNER_TEMP/store" --json > operation-admit-result.json
          framework-source/bin/opl release build \
            --bundle "$BUNDLE_DIGEST" --executor-receipt standard-build-receipt.json \
            --operation standard --operation-id '${{ needs.freeze.outputs.operation_id }}' \
            --operation-started-at '${{ needs.freeze.outputs.operation_started_at }}' \
            --operation-deadline-at '${{ needs.freeze.outputs.operation_deadline_at }}' \
            --store "$RUNNER_TEMP/store" --json > standard-build-result.json
          legacy_receipt="$(find standard-qualification -type f -name artifact-qualification-receipt.json -print -quit)"
          test -n "$legacy_receipt" || { echo "::error::Standard qualification receipt is missing."; exit 1; }
          node --experimental-strip-types app-source/scripts/framework-release-adapter.ts qualification-receipt \
            --bundle bundle/release-bundle.json --track standard \
            --legacy-qualification "$legacy_receipt" --output standard-qualification-receipt.json
          framework-source/bin/opl release verify \
            --bundle "$BUNDLE_DIGEST" --track standard \
            --qualification-receipt standard-qualification-receipt.json \
            --operation standard --operation-id '${{ needs.freeze.outputs.operation_id }}' \
            --operation-started-at '${{ needs.freeze.outputs.operation_started_at }}' \
            --operation-deadline-at '${{ needs.freeze.outputs.operation_deadline_at }}' \
            --store "$RUNNER_TEMP/store" --json > standard-verify-result.json
          framework-source/bin/opl release checkpoint export \
            --bundle "$BUNDLE_DIGEST" --output standard-checkpoint \
            --store "$RUNNER_TEMP/store" --json > checkpoint-export.json

      - name: Expose Framework checkpoint result and transport provenance
        id: provenance
        shell: bash
        run: |
          set -euo pipefail
          completed_stage="$(jq -er .release_bundle_checkpoint_export.checkpoint_stage checkpoint-export.json)"
          {
            echo "source_run_id=$GITHUB_RUN_ID"
            echo "source_artifact=opl-release-standard-checkpoint-${GITHUB_RUN_ID}"
            echo "checkpoint_transport_executor=github_actions"
            echo "transport_run_id=$GITHUB_RUN_ID"
            echo "completed_stage=$completed_stage"
          } >> "$GITHUB_OUTPUT"

      - name: Upload portable Standard checkpoint
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.OPL_STANDARD_CHECKPOINT_ARTIFACT }}
          path: |
            standard-checkpoint
            standard-build-receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload Standard identity evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: opl-release-standard-identity-${{ github.run_id }}
          path: |
            standard-identity-receipt.json
            operation-admit-result.json
            standard-build-result.json
            standard-verify-result.json
            checkpoint-export.json
          if-no-files-found: error
          retention-days: 30

  publish-standard:
    if: ${{ inputs.mode == 'execute' }}
    needs: [freeze, checkpoint-standard]
    uses: ./.github/workflows/_release-standard-publish.yml
    with:
      mode: execute
      operation: standard
      source_run_id: ${{ github.run_id }}
      source_artifact: opl-release-standard-checkpoint-${{ github.run_id }}
      source_format: checkpoint_v1
      framework_executor_ref: ${{ needs.freeze.outputs.framework_sha }}
      operation_started_at: ${{ needs.freeze.outputs.operation_started_at }}
      operation_deadline_at: ${{ needs.freeze.outputs.operation_deadline_at }}
    secrets: inherit
