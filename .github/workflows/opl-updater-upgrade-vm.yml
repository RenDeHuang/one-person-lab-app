name: OPL Updater Upgrade VM

on:
  workflow_call:
    inputs:
      candidate_artifact_name:
        description: Same-run artifact containing the bound Standard asset set.
        required: true
        type: string
      candidate_artifact_run_id:
        description: Run that owns candidate_artifact_name.
        required: true
        type: string
      baseline_dmg_url:
        description: Exact public DMG URL for the installed predecessor.
        required: true
        type: string
      baseline_dmg_sha256:
        description: Exact SHA-256 of the installed predecessor DMG.
        required: true
        type: string
      baseline_display_version:
        description: Display/tag version of the installed predecessor.
        required: true
        type: string
      baseline_updater_version:
        description: Machine version exposed by the installed predecessor.
        required: true
        type: string
      candidate_display_version:
        description: Display/tag/asset version for the candidate.
        required: true
        type: string
      candidate_updater_version:
        description: Machine version carried by the candidate App and updater feed.
        required: true
        type: string
      release_bundle_digest:
        description: Exact immutable Framework Release Bundle digest.
        required: true
        type: string
      app_ref:
        description: Exact App source SHA in the Bundle.
        required: true
        type: string
      shell_ref:
        description: Exact Shell source SHA and updater harness.
        required: true
        type: string
      framework_ref:
        description: Exact Framework source SHA in the Bundle.
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: opl-updater-upgrade-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  upgrade:
    name: Upgrade installed predecessor with exact candidate ZIP
    runs-on: ${{ fromJson(vars.OPL_FIRST_RUN_RUNNER_LABELS || '["self-hosted","macOS","opl-gui-vm"]') }}
    timeout-minutes: 30
    env:
      OPL_FIRST_RUN_TART_SOURCE: ${{ vars.OPL_FIRST_RUN_TART_SOURCE }}
      OPL_FIRST_RUN_GUEST_USER: ${{ vars.OPL_FIRST_RUN_GUEST_USER }}
      OPL_FIRST_RUN_GUEST_SSH_KEY: ${{ vars.OPL_FIRST_RUN_GUEST_SSH_KEY }}
    steps:
      - name: Reject replay and invalid frozen identities
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1 || { echo "::error::Updater qualification is one-shot and cannot be rerun."; exit 1; }
          [[ '${{ inputs.baseline_dmg_sha256 }}' =~ ^[0-9a-f]{64}$ ]] || { echo "::error::baseline_dmg_sha256 must be exact."; exit 1; }
          [[ '${{ inputs.release_bundle_digest }}' =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::release_bundle_digest must be exact."; exit 1; }
          for sha in '${{ inputs.app_ref }}' '${{ inputs.shell_ref }}' '${{ inputs.framework_ref }}'; do
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Bundle source ref must be an exact SHA."; exit 1; }
          done

      - name: Checkout frozen Shell updater harness
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: gaofeng21cn/opl-aion-shell
          ref: ${{ inputs.shell_ref }}
          path: shell-source

      - name: Setup host Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'

      - name: Download exact bound Standard asset set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.candidate_artifact_name }}
          run-id: ${{ inputs.candidate_artifact_run_id }}
          github-token: ${{ github.token }}
          path: candidate

      - name: Download and fingerprint the installed predecessor
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p updater-inputs updater-evidence
          old_dmg="updater-inputs/One-Person-Lab-${{ inputs.baseline_updater_version }}-mac-arm64.dmg"
          curl --fail --location --retry 3 --retry-all-errors \
            '${{ inputs.baseline_dmg_url }}' --output "$old_dmg"
          observed="$(shasum -a 256 "$old_dmg" | awk '{print $1}')"
          test "$observed" = '${{ inputs.baseline_dmg_sha256 }}' || {
            echo "::error::Installed predecessor DMG digest mismatch: $observed"
            exit 1
          }
          metadata="$(find candidate -type f -name latest-arm64-mac.yml -print -quit)"
          test -n "$metadata" || { echo "::error::Bound Standard artifact has no updater metadata."; exit 1; }
          feed_dir="$(dirname "$metadata")"
          zip="$feed_dir/One-Person-Lab-${{ inputs.candidate_display_version }}-mac-arm64.zip"
          blockmap="$zip.blockmap"
          test -s "$zip" && test -s "$blockmap" || { echo "::error::Bound Standard artifact has no exact candidate ZIP feed."; exit 1; }
          echo "old_dmg=$old_dmg" >> "$GITHUB_OUTPUT"
          echo "feed_dir=$feed_dir" >> "$GITHUB_OUTPUT"
          {
            echo "baseline_dmg_sha256=$observed"
            echo "candidate_zip_sha256=$(shasum -a 256 "$zip" | awk '{print $1}')"
            echo "candidate_blockmap_sha256=$(shasum -a 256 "$blockmap" | awk '{print $1}')"
            echo "candidate_metadata_sha256=$(shasum -a 256 "$metadata" | awk '{print $1}')"
          } > updater-evidence/input-digests.txt

      - name: Run real predecessor-to-candidate updater qualification
        shell: bash
        run: |
          set -euo pipefail
          source_vm="${OPL_FIRST_RUN_TART_SOURCE:-}"
          test -n "$source_vm" || { echo "::error::OPL_FIRST_RUN_TART_SOURCE is not configured."; exit 1; }
          guest_user="${OPL_FIRST_RUN_GUEST_USER:-runner}"
          node_root="$(dirname "$(dirname "$(command -v node)")")"
          args=(
            --source-vm "$source_vm"
            --old-dmg '${{ steps.inputs.outputs.old_dmg }}'
            --feed-dir '${{ steps.inputs.outputs.feed_dir }}'
            --expected-current-display-version '${{ inputs.baseline_display_version }}'
            --expected-current-version '${{ inputs.baseline_updater_version }}'
            --expected-display-version '${{ inputs.candidate_display_version }}'
            --expected-updater-version '${{ inputs.candidate_updater_version }}'
            --guest-node-root "$node_root"
            --guest-user "$guest_user"
            --artifacts updater-evidence
            --timeout-ms 1500000
            --bundle-digest '${{ inputs.release_bundle_digest }}'
            --app-sha '${{ inputs.app_ref }}'
            --shell-sha '${{ inputs.shell_ref }}'
            --framework-sha '${{ inputs.framework_ref }}'
          )
          if [ -n "${OPL_FIRST_RUN_GUEST_SSH_KEY:-}" ]; then
            args+=(--ssh-key "$OPL_FIRST_RUN_GUEST_SSH_KEY")
          fi
          node shell-source/scripts/release/opl-updater-tart-smoke.mjs "${args[@]}"

      - name: Verify Latest activation receipt
        shell: bash
        run: |
          set -euo pipefail
          receipt=updater-evidence/updater-upgrade-qualification-receipt.json
          test "$(jq -r '.status' "$receipt")" = passed
          test "$(jq -r '.latest_activation_allowed' "$receipt")" = true
          test "$(jq -r '.baseline.display_version' "$receipt")" = '${{ inputs.baseline_display_version }}'
          test "$(jq -r '.baseline.updater_version' "$receipt")" = '${{ inputs.baseline_updater_version }}'
          test "$(jq -r '.candidate.display_version' "$receipt")" = '${{ inputs.candidate_display_version }}'
          test "$(jq -r '.candidate.updater_version' "$receipt")" = '${{ inputs.candidate_updater_version }}'
          test "$(jq -r '.qualification.same_candidate_zip_downloaded' "$receipt")" = true
          test "$(jq -r '.qualification.install_and_restart_completed' "$receipt")" = true
          test "$(jq -r '.qualification.second_check_no_update' "$receipt")" = true
          test "$(jq -r '.qualification.allow_downgrade' "$receipt")" = false
          shasum -a 256 "$receipt" > updater-evidence/updater-upgrade-qualification-receipt.sha256

      - name: Upload exact updater qualification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: opl-updater-upgrade-${{ github.run_id }}
          path: updater-evidence
          if-no-files-found: warn
          retention-days: 30
