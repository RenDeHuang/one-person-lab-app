name: OPL Nightly Standard Release

on:
  workflow_dispatch:
    inputs:
      skip_code_quality:
        description: Skip standard App code quality checks for emergency nightly rebuilds
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '17 18 * * *'

permissions:
  contents: write
  actions: read
  packages: write

concurrency:
  group: opl-nightly-standard-release
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BUN_INSTALL_REGISTRY: 'https://registry.npmjs.org/'

jobs:
  resolve-nightly:
    name: Resolve nightly semver prerelease target
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Resolve nightly version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(date -u +'%y.%-m.%-d')-nightly"
          tag="v${version}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-nightly$ ]]; then
            echo "::error::Invalid nightly version: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release-source-gate:
    name: Release source gate
    runs-on: ubuntu-latest
    needs: resolve-nightly

    steps:
      - name: Checkout App repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup active shell dependencies
        uses: ./.github/actions/setup-active-shell-deps
        with:
          shell-ref: main
          run-postinstall: 'false'

      - name: Checkout OPL Framework payload source
        uses: actions/checkout@v6
        with:
          repository: gaofeng21cn/one-person-lab
          ref: main
          path: one-person-lab

      - name: Validate release source gate
        run: |
          npm run release:source-gate -- \
            --version "${{ needs.resolve-nightly.outputs.version }}" \
            --app-ref "$GITHUB_SHA" \
            --shell-ref main \
            --framework-ref main \
            --framework-root one-person-lab \
            --require-shell-format true \
            --run-shell-tests true \
            --output release-source-gate.json \
            --json

      - name: Upload release source gate summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-source-gate-${{ needs.resolve-nightly.outputs.version }}
          path: release-source-gate.json
          if-no-files-found: error

  standard-build:
    name: Build standard App assets
    needs:
      - resolve-nightly
      - release-source-gate
    uses: ./.github/workflows/_build-reusable.yml
    with:
      matrix: >-
        {"include":[
          {"platform":"macos-arm64","os":"macos-latest","command":"node scripts/build-with-builder.js arm64 --mac --arm64","artifact-name":"macos-build-arm64","arch":"arm64"}
        ]}
      skip_code_quality: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_code_quality || false }}
      opl_release_version: ${{ needs.resolve-nightly.outputs.version }}
      require_macos_gatekeeper: false
    secrets: inherit

  prepare-nightly-release-notes:
    name: Prepare Nightly release notes
    runs-on: ubuntu-latest
    needs:
      - resolve-nightly
      - release-source-gate

    steps:
      - name: Checkout App repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout active shell
        uses: actions/checkout@v6
        with:
          repository: gaofeng21cn/opl-aion-shell
          ref: main
          path: shells/aionui

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Build and validate prepared Nightly release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPL_RELEASE_NOTES_MODE: ai
          OPL_RELEASE_NOTES_PROVIDER: openai_compatible
          OPL_RELEASE_NOTES_CODEX_BASE_URL: ${{ vars.OPL_RELEASE_NOTES_CODEX_BASE_URL || 'https://gflabtoken.cn/v1' }}
          OPL_RELEASE_NOTES_CODEX_API_KEY: ${{ secrets.OPL_RELEASE_NOTES_CODEX_API_KEY }}
          OPL_RELEASE_NOTES_MODEL: ${{ vars.OPL_RELEASE_NOTES_MODEL || 'gpt-5.4-mini' }}
          OPL_RELEASE_NOTES_EVIDENCE_OUTPUT: ${{ runner.temp }}/opl-nightly-notes-evidence.json
          OPL_RELEASE_VERSION: ${{ needs.resolve-nightly.outputs.version }}
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/opl-nightly-notes.md"
          template_notes_file="$RUNNER_TEMP/opl-nightly-template-notes.md"
          npm run release:notes:probe-ai
          node --experimental-strip-types scripts/generate-release-notes.ts \
            --version "$OPL_RELEASE_VERSION" \
            --channel nightly \
            --repo "$GITHUB_REPOSITORY" \
            --shell-root shells/aionui \
            --evidence-output "$OPL_RELEASE_NOTES_EVIDENCE_OUTPUT" \
            --output "$template_notes_file"
          node --experimental-strip-types scripts/release-notes-ai-writer.ts \
            --evidence "$OPL_RELEASE_NOTES_EVIDENCE_OUTPUT" \
            --output "$notes_file"

      - name: Upload prepared Nightly release notes
        uses: actions/upload-artifact@v7
        with:
          name: prepared-nightly-release-notes-${{ needs.resolve-nightly.outputs.version }}
          path: |
            ${{ runner.temp }}/opl-nightly-notes.md
            ${{ runner.temp }}/opl-nightly-template-notes.md
            ${{ runner.temp }}/opl-nightly-notes-evidence.json
          if-no-files-found: error

  publish-nightly:
    name: Publish standard Nightly prerelease
    runs-on: macos-latest
    permissions:
      contents: write
      actions: read
    needs:
      - resolve-nightly
      - prepare-nightly-release-notes
      - standard-build

    steps:
      - name: Checkout App repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout active shell
        uses: actions/checkout@v6
        with:
          repository: gaofeng21cn/opl-aion-shell
          ref: main
          path: shells/aionui

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Download standard build artifacts
        uses: actions/download-artifact@v8
        with:
          name: macos-build-arm64
          path: build-artifacts

      - name: Prepare standard release assets
        shell: bash
        run: node --experimental-strip-types scripts/prepare-release-assets.ts build-artifacts release-assets

      - name: Verify standard release assets
        shell: bash
        env:
          OPL_RELEASE_VERSION: ${{ needs.resolve-nightly.outputs.version }}
        run: node --experimental-strip-types scripts/validate-release.ts release-assets

      - name: Download prepared Nightly release notes
        uses: actions/download-artifact@v8
        with:
          name: prepared-nightly-release-notes-${{ needs.resolve-nightly.outputs.version }}
          path: prepared-nightly-release-notes

      - name: Create or refresh Nightly prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPL_RELEASE_VERSION: ${{ needs.resolve-nightly.outputs.version }}
          OPL_RELEASE_TAG: ${{ needs.resolve-nightly.outputs.tag }}
        run: |
          set -euo pipefail
          release_title="One Person Lab ${OPL_RELEASE_TAG}"
          git fetch --tags origin

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          remote_tag_sha="$(git ls-remote --tags origin "refs/tags/${OPL_RELEASE_TAG}" | awk '{print $1}')"
          git tag -f "${OPL_RELEASE_TAG}" "$GITHUB_SHA"
          if [ -n "$remote_tag_sha" ]; then
            git push --force-with-lease="refs/tags/${OPL_RELEASE_TAG}:${remote_tag_sha}" origin "refs/tags/${OPL_RELEASE_TAG}"
          else
            git push origin "refs/tags/${OPL_RELEASE_TAG}"
          fi

          notes_file="prepared-nightly-release-notes/opl-nightly-notes.md"

          if gh release view "${OPL_RELEASE_TAG}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "${OPL_RELEASE_TAG}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$release_title" \
              --notes-file "$notes_file" \
              --prerelease
          else
            gh release create "${OPL_RELEASE_TAG}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$release_title" \
              --notes-file "$notes_file" \
              --prerelease \
              --latest=false \
              --verify-tag
          fi

          gh release upload "${OPL_RELEASE_TAG}" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Verify remote standard Nightly assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPL_RELEASE_VERSION: ${{ needs.resolve-nightly.outputs.version }}
        run: |
          npm run verify-remote-release -- \
            --version "$OPL_RELEASE_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --summary-path remote-nightly-release-verification.json

      - name: Upload Nightly remote verification summary
        uses: actions/upload-artifact@v7
        with:
          name: remote-nightly-release-verification-${{ needs.resolve-nightly.outputs.version }}
          path: remote-nightly-release-verification.json
          if-no-files-found: error

  webui-ghcr-publish:
    name: Publish Nightly WebUI GHCR image
    runs-on: ubuntu-latest
    needs:
      - resolve-nightly
      - publish-nightly

    steps:
      - name: Checkout App repo
        uses: actions/checkout@v6

      - name: Checkout active shell
        uses: actions/checkout@v6
        with:
          repository: gaofeng21cn/opl-aion-shell
          ref: main
          path: shells/aionui

      - name: Build, verify, and publish Nightly WebUI image
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHELL_SHA="$(git -C shells/aionui rev-parse HEAD)"
          image_owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          ghcr_image="ghcr.io/${image_owner}/one-person-lab-webui"
          write_publish_summary() {
            local status="$1"
            local error_code="${2:-}"
            local error_message="${3:-}"
            node <<NODE
          const fs = require('node:fs');
          const payload = {
            status: '${status}',
            image: '${ghcr_image}',
            tags: ['${{ needs.resolve-nightly.outputs.version }}', '${{ needs.resolve-nightly.outputs.version }}-slim', 'nightly'],
            source_repository: 'https://github.com/${GITHUB_REPOSITORY}',
            package_access_required: {
              package_url: 'https://github.com/users/gaofeng21cn/packages/container/package/one-person-lab-webui/settings',
              required_actions_access_repository: 'gaofeng21cn/one-person-lab-app',
              required_actions_access_permission: 'write',
              configuration_surface: 'GitHub Packages settings Manage Actions access',
              failure_signal: 'docker push denied: permission_denied: write_package',
            },
          };
          if ('${error_code}') {
            payload.error = { code: '${error_code}', message: '${error_message}' };
          }
          fs.writeFileSync('/tmp/opl-webui-ghcr-publish.json', JSON.stringify(payload) + '\\n');
          NODE
          }
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${SHELL_SHA}" \
            -t "one-person-lab-webui:${{ needs.resolve-nightly.outputs.version }}" \
            shells/aionui
          docker build \
            --build-arg OPL_WEBUI_IMAGE_PROFILE=webui-slim \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${SHELL_SHA}" \
            -t "one-person-lab-webui:${{ needs.resolve-nightly.outputs.version }}-slim" \
            shells/aionui
          docker image inspect "one-person-lab-webui:${{ needs.resolve-nightly.outputs.version }}" > /tmp/opl-webui-image-inspect.json
          docker image inspect "one-person-lab-webui:${{ needs.resolve-nightly.outputs.version }}-slim" > /tmp/opl-webui-slim-image-inspect.json
          docker run --rm --entrypoint cat "one-person-lab-webui:${{ needs.resolve-nightly.outputs.version }}" \
            /opt/opl/image-manifest.json > /tmp/opl-webui-image-manifest.json
          docker run --rm --entrypoint cat "one-person-lab-webui:${{ needs.resolve-nightly.outputs.version }}" \
            /opt/opl/seed/metadata.json > /tmp/opl-webui-seed-metadata.json
          docker run --rm --entrypoint sh "one-person-lab-webui:${{ needs.resolve-nightly.outputs.version }}" -lc \
            'command -v opl && command -v codex && test "$(find /opt/opl/seed/payload -type f | wc -l)" -gt 0' \
            > /tmp/opl-webui-runtime-readback.txt
          docker run --rm --entrypoint cat "one-person-lab-webui:${{ needs.resolve-nightly.outputs.version }}-slim" \
            /opt/opl/image-manifest.json > /tmp/opl-webui-slim-image-manifest.json
          docker run --rm --entrypoint cat "one-person-lab-webui:${{ needs.resolve-nightly.outputs.version }}-slim" \
            /opt/opl/seed/metadata.json > /tmp/opl-webui-slim-seed-metadata.json
          node --experimental-strip-types scripts/validate-webui-runtime-image.ts \
            --image-inspect /tmp/opl-webui-image-inspect.json \
            --image-manifest /tmp/opl-webui-image-manifest.json \
            --seed-metadata /tmp/opl-webui-seed-metadata.json \
            --expected-profile webui-full \
            --summary-path /tmp/opl-webui-runtime-image-validation.json
          node --experimental-strip-types scripts/validate-webui-runtime-image.ts \
            --image-inspect /tmp/opl-webui-slim-image-inspect.json \
            --image-manifest /tmp/opl-webui-slim-image-manifest.json \
            --seed-metadata /tmp/opl-webui-slim-seed-metadata.json \
            --expected-profile webui-slim \
            --summary-path /tmp/opl-webui-slim-runtime-image-validation.json
          webui_smoke_dir="$(mktemp -d)"
          mkdir -p "$webui_smoke_dir/data" "$webui_smoke_dir/projects"
          printf '%s\n' "projects mount smoke" > "$webui_smoke_dir/projects/.opl-projects-smoke"
          container="$(docker run --rm -d -p 127.0.0.1::3000 \
            -v "$webui_smoke_dir/data:/data" \
            -v "$webui_smoke_dir/projects:/projects" \
            "one-person-lab-webui:${{ needs.resolve-nightly.outputs.version }}")"
          cleanup() {
            docker logs "$container" >/tmp/opl-webui-container.log 2>&1 || true
            docker rm -f "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          port="$(docker port "$container" 3000/tcp | sed -E 's/.*:([0-9]+)$/\1/')"
          for attempt in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:${port}/" >/tmp/opl-webui-index.html; then
              break
            fi
            sleep 2
          done
          curl -fsS "http://127.0.0.1:${port}/manifest.webmanifest" >/tmp/opl-webui-manifest.webmanifest
          auth_headers="$(mktemp)"
          auth_body="$(mktemp)"
          for attempt in $(seq 1 60); do
            if curl -fsS -D "$auth_headers" "http://127.0.0.1:${port}/api/auth/user" -o "$auth_body" \
              && grep -q '"success":[[:space:]]*true' "$auth_body" \
              && grep -iq '^set-cookie:' "$auth_headers"; then
              break
            fi
            sleep 2
          done
          grep -q '"success":[[:space:]]*true' "$auth_body"
          grep -iq '^set-cookie:' "$auth_headers"
          cp "$auth_body" /tmp/opl-webui-auth-user.json
          curl -fsS -X POST -H 'content-type: application/json' -d '{}' \
            "http://127.0.0.1:${port}/api/opl-runtime/startup-maintenance" \
            >/tmp/opl-webui-startup-maintenance.json
          curl -fsS -X POST -H 'content-type: application/json' -d '{}' \
            "http://127.0.0.1:${port}/api/opl-runtime/update-status" \
            >/tmp/opl-webui-update-status.json
          grep -q '"success":[[:space:]]*true' /tmp/opl-webui-startup-maintenance.json
          grep -q '"success":[[:space:]]*true' /tmp/opl-webui-update-status.json
          for attempt in $(seq 1 60); do
            if [ -s "$webui_smoke_dir/data/opl/state/install-manifest.json" ]; then
              break
            fi
            sleep 1
          done
          test -s "$webui_smoke_dir/data/opl/state/install-manifest.json"
          test -f "$webui_smoke_dir/projects/.opl-projects-smoke"
          docker exec "$container" cat /projects/.opl-projects-smoke >/tmp/opl-webui-projects-readback.txt
          grep -q 'projects mount smoke' /tmp/opl-webui-projects-readback.txt
          cp "$webui_smoke_dir/data/opl/state/install-manifest.json" /tmp/opl-webui-install-manifest.json
          node --experimental-strip-types scripts/validate-webui-runtime-smoke-receipts.ts \
            --startup-maintenance /tmp/opl-webui-startup-maintenance.json \
            --update-status /tmp/opl-webui-update-status.json \
            --install-manifest /tmp/opl-webui-install-manifest.json \
            --summary-path /tmp/opl-webui-runtime-smoke-receipts-validation.json
          docker logs "$container" >/tmp/opl-webui-container.log 2>&1
          grep -q 'running OPL seed apply' /tmp/opl-webui-container.log
          grep -Eq 'running OPL (runtime substrate )?startup maintenance' /tmp/opl-webui-container.log
          ! grep -q 'OPL maintenance CLI not found; skipping startup maintenance' /tmp/opl-webui-container.log

          docker tag "one-person-lab-webui:${{ needs.resolve-nightly.outputs.version }}" "${ghcr_image}:${{ needs.resolve-nightly.outputs.version }}"
          docker tag "one-person-lab-webui:${{ needs.resolve-nightly.outputs.version }}-slim" "${ghcr_image}:${{ needs.resolve-nightly.outputs.version }}-slim"
          docker tag "one-person-lab-webui:${{ needs.resolve-nightly.outputs.version }}" "${ghcr_image}:nightly"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if ! docker push "${ghcr_image}:${{ needs.resolve-nightly.outputs.version }}"; then
            write_publish_summary "failed" "ghcr_write_package_denied" "GHCR push failed. Ensure the one-person-lab-webui package grants write Actions access to gaofeng21cn/one-person-lab-app."
            exit 1
          fi
          if ! docker push "${ghcr_image}:${{ needs.resolve-nightly.outputs.version }}-slim"; then
            write_publish_summary "failed" "ghcr_write_package_denied" "GHCR slim tag push failed. Ensure the one-person-lab-webui package grants write Actions access to gaofeng21cn/one-person-lab-app."
            exit 1
          fi
          if ! docker push "${ghcr_image}:nightly"; then
            write_publish_summary "failed" "ghcr_write_package_denied" "GHCR nightly tag push failed. Ensure the one-person-lab-webui package grants write Actions access to gaofeng21cn/one-person-lab-app."
            exit 1
          fi
          write_publish_summary "published"

      - name: Upload Nightly WebUI GHCR publish summary
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: webui-ghcr-publish-${{ needs.resolve-nightly.outputs.version }}
          path: |
            /tmp/opl-webui-ghcr-publish.json
            /tmp/opl-webui-image-inspect.json
            /tmp/opl-webui-slim-image-inspect.json
            /tmp/opl-webui-image-manifest.json
            /tmp/opl-webui-slim-image-manifest.json
            /tmp/opl-webui-seed-metadata.json
            /tmp/opl-webui-slim-seed-metadata.json
            /tmp/opl-webui-runtime-readback.txt
            /tmp/opl-webui-runtime-image-validation.json
            /tmp/opl-webui-slim-runtime-image-validation.json
            /tmp/opl-webui-auth-user.json
            /tmp/opl-webui-startup-maintenance.json
            /tmp/opl-webui-update-status.json
            /tmp/opl-webui-projects-readback.txt
            /tmp/opl-webui-install-manifest.json
            /tmp/opl-webui-runtime-smoke-receipts-validation.json
            /tmp/opl-webui-container.log
          if-no-files-found: error
