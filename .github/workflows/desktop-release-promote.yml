name: OPL Desktop Release Promote

on:
  workflow_dispatch:
    inputs:
      opl_version:
        description: OPL draft release version to verify and publish, for example 26.5.20
        required: true
        type: string
      include_full_package:
        description: Verify Full first-install assets before publishing
        required: false
        default: true
        type: boolean
      require_docker_webui:
        description: Verify same-cohort Docker/WebUI add-on evidence before publishing
        required: false
        default: true
        type: boolean
      release_run_id:
        description: Desktop release workflow run id that produced the candidate record
        required: true
        type: string
      release_owner_verdict_ref:
        description: Optional same-cohort App release owner verdict ref to resolve a blocked owner gate without rerunning release evidence
        required: false
        default: ''
        type: string
      release_owner_receipt_ref:
        description: Optional same-cohort App release owner receipt ref to resolve a blocked owner gate without rerunning release evidence
        required: false
        default: ''
        type: string
      shell_ref:
        description: opl-aion-shell ref containing the first-run smoke scripts. Empty means main.
        required: false
        default: main
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: opl-desktop-release-promote-${{ inputs.opl_version }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  promote:
    name: Verify and publish draft release
    runs-on: macos-latest

    steps:
      - name: Checkout App repo
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Download release candidate record
        uses: actions/download-artifact@v8
        with:
          name: release-candidate-record-${{ inputs.opl_version }}
          run-id: ${{ inputs.release_run_id }}
          path: release-candidate-record-input
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download owner-resolution preflight input
        if: ${{ inputs.release_owner_verdict_ref != '' || inputs.release_owner_receipt_ref != '' }}
        uses: actions/download-artifact@v8
        with:
          name: release-preflight-summary-${{ inputs.opl_version }}
          run-id: ${{ inputs.release_run_id }}
          path: owner-resolution-inputs
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download owner-resolution readiness input
        if: ${{ inputs.release_owner_verdict_ref != '' || inputs.release_owner_receipt_ref != '' }}
        uses: actions/download-artifact@v8
        with:
          name: release-readiness-summary-${{ inputs.opl_version }}
          run-id: ${{ inputs.release_run_id }}
          path: owner-resolution-inputs
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download owner-resolution remote verification input
        if: ${{ inputs.release_owner_verdict_ref != '' || inputs.release_owner_receipt_ref != '' }}
        uses: actions/download-artifact@v8
        with:
          name: remote-release-verification-${{ inputs.opl_version }}
          run-id: ${{ inputs.release_run_id }}
          path: owner-resolution-inputs
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download add-on readiness input
        if: ${{ inputs.include_full_package || inputs.require_docker_webui }}
        uses: actions/download-artifact@v8
        with:
          name: release-addon-readiness-summary-${{ inputs.opl_version }}
          run-id: ${{ inputs.release_run_id }}
          path: owner-resolution-addon-inputs
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release owner gate
        if: ${{ inputs.release_owner_verdict_ref != '' || inputs.release_owner_receipt_ref != '' }}
        env:
          RELEASE_OWNER_VERDICT_REF: ${{ inputs.release_owner_verdict_ref }}
          RELEASE_OWNER_RECEIPT_REF: ${{ inputs.release_owner_receipt_ref }}
        run: |
          set -euo pipefail
          args=(
            npm run release:candidate-record:resolve-owner --
            --candidate-record release-candidate-record-input/release-candidate-record.json
            --preflight owner-resolution-inputs/release-preflight-summary.json
            --readiness owner-resolution-inputs/release-readiness-summary.json
            --remote-verification owner-resolution-inputs/remote-release-verification.json
            --output release-candidate-record-input/release-candidate-record.json
            --markdown release-candidate-record-input/release-candidate-record.md
          )
          if [ -n "${RELEASE_OWNER_VERDICT_REF}" ]; then
            args+=(--release-owner-verdict-ref "${RELEASE_OWNER_VERDICT_REF}")
          fi
          if [ -n "${RELEASE_OWNER_RECEIPT_REF}" ]; then
            args+=(--release-owner-receipt-ref "${RELEASE_OWNER_RECEIPT_REF}")
          fi
          "${args[@]}"

      - name: Verify same-cohort add-on readiness
        if: ${{ inputs.include_full_package || inputs.require_docker_webui }}
        run: |
          node --experimental-strip-types scripts/validate-release-addon-readiness.ts \
            --version "${{ inputs.opl_version }}" \
            --record owner-resolution-addon-inputs/release-addon-readiness-summary.json \
            --include-full-package "${{ inputs.include_full_package }}" \
            --run-vm-smoke true \
            --require-docker-webui "${{ inputs.require_docker_webui }}"

      - name: Verify release candidate record
        env:
          OPL_RELEASE_VERSION: ${{ inputs.opl_version }}
        run: npm run release:candidate-record:validate -- --record release-candidate-record-input/release-candidate-record.json

      - name: Verify remote release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPL_RELEASE_VERSION: ${{ inputs.opl_version }}
        run: |
          verify_args=(
            npm run verify-remote-release --
            --version "$OPL_RELEASE_VERSION"
            --repo "$GITHUB_REPOSITORY"
            --summary-path remote-release-verification.json
          )
          if [ "${{ inputs.include_full_package }}" = "true" ]; then
            verify_args+=(--include-full-package)
          fi
          "${verify_args[@]}"

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPL_RELEASE_VERSION: ${{ inputs.opl_version }}
        run: |
          set -euo pipefail
          gh release edit "v${OPL_RELEASE_VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest

      - name: Verify published release readback
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPL_RELEASE_VERSION: ${{ inputs.opl_version }}
        run: |
          set -euo pipefail
          tag="v${OPL_RELEASE_VERSION}"
          release_json="$RUNNER_TEMP/promoted-release-readback.json"
          latest_json="$RUNNER_TEMP/promoted-release-latest-readback.json"

          for attempt in {1..12}; do
            if gh release view "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --json tagName,isDraft,isPrerelease,publishedAt,assets \
              > "$release_json" \
              && gh release list \
                --repo "$GITHUB_REPOSITORY" \
                --limit 20 \
                --json tagName,isLatest,isDraft,isPrerelease,publishedAt \
                > "$latest_json" \
              && git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
              if RELEASE_JSON="$release_json" LATEST_JSON="$latest_json" EXPECTED_TAG="$tag" node --input-type=module <<'NODE'
              import fs from 'node:fs';

              const release = JSON.parse(fs.readFileSync(process.env.RELEASE_JSON, 'utf8'));
              const releaseList = JSON.parse(fs.readFileSync(process.env.LATEST_JSON, 'utf8'));
              const expectedTag = process.env.EXPECTED_TAG;
              const assets = Array.isArray(release.assets) ? release.assets : [];
              const listedRelease = Array.isArray(releaseList)
                ? releaseList.find((candidate) => candidate?.tagName === expectedTag)
                : null;
              function fail(message) {
                console.error(message);
                process.exit(1);
              }
              if (release.tagName !== expectedTag) fail(`Promoted release tag mismatch: ${release.tagName}`);
              if (release.isDraft) fail('Promoted release is still a draft.');
              if (release.isPrerelease) fail('Promoted Stable release is marked as a prerelease.');
              if (!release.publishedAt) fail('Promoted release does not expose publishedAt.');
              if (assets.length === 0) fail('Promoted release has no readable assets.');
              if (listedRelease?.isLatest !== true) fail('Promoted Stable release is not marked latest.');
          NODE
              then
                echo "Published release ${tag} is readable with tag and assets after attempt ${attempt}."
                exit 0
              fi
            fi
            echo "Published release ${tag} is not fully readable yet; retrying attempt ${attempt}."
            sleep 10
          done

          echo "::error::Published release ${tag} did not become readable with a matching tag before Homebrew tap update."
          exit 1

      - name: Upload remote verification summary
        uses: actions/upload-artifact@v7
        with:
          name: remote-release-verification-${{ inputs.opl_version }}
          path: |
            remote-release-verification.json
            release-candidate-record-input/release-candidate-record.json
            release-candidate-record-input/release-candidate-record.md
          if-no-files-found: error

  stable-homebrew-tap-update:
    name: Update Stable Homebrew tap
    needs: promote
    uses: ./.github/workflows/homebrew-tap-update.yml
    with:
      channel: stable
      package_kind: app_standard
      opl_version: ${{ inputs.opl_version }}
      release_repo: gaofeng21cn/one-person-lab-app
      tap_repo: gaofeng21cn/homebrew-one-person-lab
    secrets:
      OPL_HOMEBREW_TAP_TOKEN: ${{ secrets.OPL_HOMEBREW_TAP_TOKEN }}

  full-homebrew-tap-update:
    name: Update Full Homebrew tap
    needs:
      - promote
      - stable-homebrew-tap-update
    if: ${{ inputs.include_full_package && needs.stable-homebrew-tap-update.result == 'success' }}
    uses: ./.github/workflows/homebrew-tap-update.yml
    with:
      channel: stable
      package_kind: app_full_first_install
      opl_version: ${{ inputs.opl_version }}
      release_repo: gaofeng21cn/one-person-lab-app
      tap_repo: gaofeng21cn/homebrew-one-person-lab
    secrets:
      OPL_HOMEBREW_TAP_TOKEN: ${{ secrets.OPL_HOMEBREW_TAP_TOKEN }}

  homebrew-standard-first-run-vm-smoke:
    name: Run Homebrew standard first-run VM smoke
    needs:
      - stable-homebrew-tap-update
    if: ${{ always() && needs.stable-homebrew-tap-update.result == 'success' }}
    uses: ./.github/workflows/opl-first-run-vm.yml
    with:
      release_tag: v${{ inputs.opl_version }}
      package_profile: homebrew-standard
      shell_ref: ${{ inputs.shell_ref || 'main' }}
    secrets: inherit
