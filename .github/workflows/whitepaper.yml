name: OPL App Whitepaper

on:
  push:
    branches:
      - main
    paths:
      - docs/whitepapers/opl-app-whitepaper.md
      - contracts/whitepaper_profile.json
      - contracts/app-product-profile.json
      - contracts/app-gui-product-contract.json
      - contracts/app-page-state-matrix.json
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified bundle to GitHub Pages
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  whitepaper:
    uses: gaofeng21cn/one-person-lab/.github/workflows/reusable-whitepaper.yml@main
    with:
      profile: contracts/whitepaper_profile.json
      output_name: opl-app-whitepaper
      publish: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
