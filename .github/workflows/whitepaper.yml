      - contracts/whitepaper_profile.json
      - contracts/app-product-profile.json
      - contracts/app-gui-product-contract.json
      - contracts/app-page-state-matrix.json
permissions:
  contents: read

jobs:
  whitepaper:
    uses: gaofeng21cn/one-person-lab/.github/workflows/reusable-whitepaper.yml@64b1361ed76fecc82b8e32e3dd58d4a4c2fb95d9
    with:
      profile: contracts/whitepaper_profile.json
      output_name: opl-app-whitepaper
