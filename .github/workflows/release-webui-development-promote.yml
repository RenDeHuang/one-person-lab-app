name: OPL WebUI Development Promotion

on:
  workflow_dispatch:
    inputs:
      stable_authority_run_id:
        description: Exact terminal Stable run that owns the frozen development Bundle.
        required: true
        type: string
      carrier_follower_run_id:
        description: Exact first-attempt development run that published the immutable carrier.
        required: true
        type: string
      carrier_executor_ref:
        description: Exact App SHA that executed the immutable carrier publication.
        required: true
        type: string
      carrier_artifact_name:
        description: Exact unexpired carrier receipt artifact from the carrier run.
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: opl-webui-development-promotion-only-global
  cancel-in-progress: false

jobs:
  promote-webui-stable:
    permissions:
      contents: read
      actions: read
      packages: write
    uses: ./.github/workflows/release-webui-stable.yml
    with:
      mode: execute
      authority_mode: development_validation
      stable_authority_run_id: ${{ inputs.stable_authority_run_id }}
      carrier_follower_run_id: ${{ inputs.carrier_follower_run_id }}
      carrier_executor_ref: ${{ inputs.carrier_executor_ref }}
      carrier_artifact_name: ${{ inputs.carrier_artifact_name }}
