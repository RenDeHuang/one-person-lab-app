name: OPL WebUI Independent Preview Latest Promotion
run-name: Promote durable WebUI Preview record ${{ inputs.publication_record_ref }} to latest

on:
  workflow_dispatch:
    inputs:
      publication_record_ref:
        description: Exact durable GHCR WebUI Preview publication-record reference.
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: opl-webui-independent-preview-latest-global
  cancel-in-progress: false

jobs:
  promote-webui-latest:
    permissions:
      contents: read
      actions: read
      packages: write
    uses: ./.github/workflows/release-webui-stable.yml
    with:
      mode: execute
      authority_mode: independent_preview
      publication_record_ref: ${{ inputs.publication_record_ref }}
