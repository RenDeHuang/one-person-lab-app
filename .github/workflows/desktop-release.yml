name: OPL Desktop Release

on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: Create, draft, or refresh a release in place
        required: true
        default: refresh_existing
        type: choice
        options:
          - refresh_existing
          - new_release
          - draft_candidate
      opl_version:
        description: OPL version, for example 26.5.19
        required: true
        type: string
      include_full_package:
        description: Build and publish the Full first-install package after standard assets
        required: false
        default: true
        type: boolean
      framework_ref:
        description: OPL Framework ref to bundle in the Full package. Prefer a fixed SHA; main is resolved once by the source gate.
        required: false
        default: main
        type: string
      shell_ref:
        description: opl-aion-shell ref to build and verify. Prefer a fixed SHA; main is resolved once by the source gate.
        required: false
        default: main
        type: string
      force_rebuild_runtime_cache:
        description: Ignore restored Full runtime layer cache and rebuild all Full layers
        required: false
        default: false
        type: boolean
      run_vm_smoke:
        description: Run stable installation smokes after release assets are uploaded
        required: false
        default: true
        type: boolean
      publish_docker_webui:
        description: Build, verify, and publish the Docker WebUI image with this release
        required: false
        default: true
        type: boolean
      docker_webui_clean_linux_evidence_artifact:
        description: Optional same-run artifact name containing clean Linux VM Docker WebUI smoke evidence; empty runs the Ubuntu clean VM gate in this workflow
        required: false
        default: ''
        type: string
      docker_webui_clean_windows_evidence_artifact:
        description: Optional same-run artifact name containing clean Windows VM Docker WebUI smoke evidence for diagnostic import
        required: false
        default: ''
        type: string
      guide_screenshots:
        description: Capture user-guide screenshots in the clean Full first-run VM smoke artifacts
        required: false
        default: false
        type: boolean
      skip_code_quality:
        description: Skip standard App code quality checks for emergency rebuilds
        required: false
        default: false
        type: boolean
      release_owner_verdict_ref:
        description: Same-cohort App release owner verdict ref required before stable promotion
        required: false
        default: ''
        type: string
      release_owner_receipt_ref:
        description: Same-cohort App release owner receipt ref required before stable promotion
        required: false
        default: ''
        type: string
      release_owner_typed_blocker_ref:
        description: Same-cohort App release owner typed blocker ref when release-ready cannot be authorized
        required: false
        default: ''
        type: string
      release_owner_human_gate_ref:
        description: Same-cohort App release owner human gate ref when promotion needs manual approval
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: read
  packages: write

concurrency:
  group: opl-desktop-release-${{ inputs.release_mode }}-${{ inputs.opl_version }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BUN_INSTALL_REGISTRY: 'https://registry.npmjs.org/'

jobs:
  release-preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    outputs:
      release_target_kind: ${{ steps.release-preflight.outputs.release_target_kind }}
      homebrew_tap_update_required: ${{ steps.release-preflight.outputs.homebrew_tap_update_required }}
      homebrew_tap_token_required: ${{ steps.release-preflight.outputs.homebrew_tap_token_required }}
      homebrew_tap_update_owner: ${{ steps.release-preflight.outputs.homebrew_tap_update_owner }}

    steps:
      - name: Checkout App repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Run release preflight
        id: release-preflight
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPL_HOMEBREW_TAP_TOKEN_PRESENT: ${{ secrets.OPL_HOMEBREW_TAP_TOKEN != '' && 'true' || 'false' }}
        run: |
          npm run release:preflight -- \
            --version "${{ inputs.opl_version }}" \
            --release-mode "${{ inputs.release_mode }}" \
            --include-full-package "${{ inputs.include_full_package }}" \
            --run-vm-smoke "${{ inputs.run_vm_smoke }}" \
            --publish-docker-webui "${{ inputs.publish_docker_webui }}" \
            --docker-webui-clean-windows-evidence-artifact "${{ inputs.docker_webui_clean_windows_evidence_artifact }}" \
            --expected-app-head "$GITHUB_SHA" \
            --framework-ref "${{ inputs.framework_ref }}" \
            --shell-ref "${{ inputs.shell_ref }}" \
            --summary-path release-preflight-summary.json \
            --markdown-path release-preflight-summary.md
          cat release-preflight-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release preflight summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-preflight-summary-${{ inputs.opl_version }}
          path: |
            release-preflight-summary.json
            release-preflight-summary.md
          if-no-files-found: error

  release-workflow-contract:
    name: Release workflow contract
    runs-on: ubuntu-latest
    needs: release-source-gate

    steps:
      - name: Checkout App repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout active shell
        uses: actions/checkout@v6
        with:
          repository: gaofeng21cn/opl-aion-shell
          ref: ${{ needs.release-source-gate.outputs.shell_sha }}
          # Controller lock API consumption point: replace the dispatch default below with a locked SHA cohort.
          # shell_ref: ${{ inputs.shell_ref }}
          path: shells/aionui

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validate release workflow contract
        run: |
          npm run validate:release-boundary
          npm run test:release-boundary

  release-source-gate:
    name: Release source gate
    runs-on: ubuntu-latest
    needs: release-preflight
    outputs:
      app_sha: ${{ steps.release-source-gate.outputs.app_sha }}
      shell_sha: ${{ steps.release-source-gate.outputs.shell_sha }}
      framework_sha: ${{ steps.release-source-gate.outputs.framework_sha }}

    steps:
      - name: Checkout App repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup active shell dependencies
        uses: ./.github/actions/setup-active-shell-deps
        with:
          shell-ref: ${{ inputs.shell_ref }}
          run-postinstall: 'false'

      - name: Checkout OPL Framework payload source
        uses: actions/checkout@v6
        with:
          repository: gaofeng21cn/one-person-lab
          ref: ${{ inputs.framework_ref || 'main' }}
          path: one-person-lab

      - name: Validate release source gate
        id: release-source-gate
        run: |
          npm run release:source-gate -- \
            --version "${{ inputs.opl_version }}" \
            --app-ref "$GITHUB_SHA" \
            --shell-ref "${{ inputs.shell_ref || 'main' }}" \
            --framework-ref "${{ inputs.framework_ref || 'main' }}" \
            --framework-root one-person-lab \
            --require-shell-format true \
            --run-shell-tests true \
            --output release-source-gate.json \
            --json
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('release-source-gate.json', 'utf8'));
          const outputs = {
            app_sha: report.app_head,
            shell_sha: report.shell_sha,
            framework_sha: report.framework_sha,
          };
          for (const [name, value] of Object.entries(outputs)) {
            if (typeof value !== 'string' || !/^[0-9a-f]{40}$/i.test(value)) {
              throw new Error(`release source gate did not resolve ${name} to a fixed SHA`);
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `${name}=${value}\n`);
          }
          NODE

      - name: Upload release source gate summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-source-gate-${{ inputs.opl_version }}
          path: release-source-gate.json
          if-no-files-found: error

  standard-build:
    name: Build standard App assets
    needs:
      - release-workflow-contract
      - release-source-gate
    uses: ./.github/workflows/_build-reusable.yml
    with:
      matrix: >-
        {"include":[
          {"platform":"macos-arm64","os":"macos-latest","command":"node scripts/build-with-builder.js arm64 --mac --arm64","artifact-name":"macos-build-arm64","arch":"arm64"}
        ]}
      ref: ${{ needs.release-source-gate.outputs.app_sha }}
      skip_code_quality: ${{ inputs.skip_code_quality }}
      opl_release_version: ${{ inputs.opl_version }}
      shell_ref: ${{ needs.release-source-gate.outputs.shell_sha }}
      require_macos_gatekeeper: false
    secrets: inherit

  publish-standard:
    name: Publish standard App assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    needs:
      - release-source-gate
      - standard-build
    outputs:
      release_tag: ${{ steps.release-target.outputs.tag }}
      app_sha: ${{ steps.release-cohort.outputs.app_sha }}
      shell_sha: ${{ steps.release-cohort.outputs.shell_sha }}
      framework_sha: ${{ steps.release-cohort.outputs.framework_sha }}

    steps:
      - name: Checkout App repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout active shell
        uses: actions/checkout@v6
        with:
          repository: gaofeng21cn/opl-aion-shell
          ref: ${{ needs.release-source-gate.outputs.shell_sha }}
          # Controller lock API consumption point: replace the dispatch default below with a locked SHA cohort.
          # shell_ref: ${{ inputs.shell_ref }}
          path: shells/aionui

      - name: Record fixed release cohort refs
        id: release-cohort
        shell: bash
        env:
          APP_SHA: ${{ needs.release-source-gate.outputs.app_sha }}
          SHELL_SHA: ${{ needs.release-source-gate.outputs.shell_sha }}
          FRAMEWORK_SHA: ${{ needs.release-source-gate.outputs.framework_sha }}
        run: |
          set -euo pipefail
          echo "app_sha=$APP_SHA" >> "$GITHUB_OUTPUT"
          echo "shell_sha=$SHELL_SHA" >> "$GITHUB_OUTPUT"
          echo "framework_sha=$FRAMEWORK_SHA" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Download standard build artifacts
        uses: actions/download-artifact@v8
        with:
          name: macos-build-arm64
          path: build-artifacts

      - name: Prepare standard release assets
        shell: bash
        run: node --experimental-strip-types scripts/prepare-release-assets.ts build-artifacts release-assets

      - name: Verify standard release assets
        shell: bash
        env:
          OPL_RELEASE_VERSION: ${{ inputs.opl_version }}
        run: node --experimental-strip-types scripts/validate-release.ts release-assets

      - name: Resolve release target
        id: release-target
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_MODE: ${{ inputs.release_mode }}
          OPL_RELEASE_VERSION: ${{ inputs.opl_version }}
        run: |
          set -euo pipefail
          if ! [[ "$OPL_RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid OPL release version: $OPL_RELEASE_VERSION"
            exit 1
          fi

          tag="v${OPL_RELEASE_VERSION}"
          git fetch --tags origin

          case "$RELEASE_MODE" in
            new_release | draft_candidate)
              if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
                echo "::error::Tag $tag already exists; use refresh_existing to replace assets in place."
                exit 1
              fi
              if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                echo "::error::Release $tag already exists; use refresh_existing to replace assets in place."
                exit 1
              fi
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git tag "$tag" "$GITHUB_SHA"
              git push origin "$tag"
              ;;
            refresh_existing)
              gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null
              ;;
            *)
              echo "::error::Unsupported release mode: $RELEASE_MODE"
              exit 1
              ;;
          esac

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish standard assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_MODE: ${{ inputs.release_mode }}
          OPL_RELEASE_VERSION: ${{ inputs.opl_version }}
          OPL_RELEASE_NOTES_MODE: ai
          OPL_RELEASE_NOTES_PROVIDER: openai_compatible
          OPL_RELEASE_NOTES_OPENAI_COMPATIBLE_BASE_URL: ${{ vars.OPL_RELEASE_NOTES_OPENAI_COMPATIBLE_BASE_URL }}
          OPL_RELEASE_NOTES_OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OPL_RELEASE_NOTES_OPENAI_COMPATIBLE_API_KEY }}
          OPL_RELEASE_NOTES_OPENAI_COMPATIBLE_MODEL: ${{ vars.OPL_RELEASE_NOTES_OPENAI_COMPATIBLE_MODEL }}
          OPL_RELEASE_NOTES_CODEX_BASE_URL: ${{ vars.OPL_RELEASE_NOTES_CODEX_BASE_URL }}
          OPL_RELEASE_NOTES_CODEX_API_KEY: ${{ secrets.OPL_RELEASE_NOTES_CODEX_API_KEY }}
          OPL_RELEASE_NOTES_MODEL: ${{ vars.OPL_RELEASE_NOTES_MODEL }}
          OPL_RELEASE_NOTES_EVIDENCE_OUTPUT: ${{ runner.temp }}/standard-release-notes-evidence.json
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/release-notes-ai-writer.ts --probe-openai-compatible
          publish_args=(
            npm run release:publish --
            --no-build
            --version "$OPL_RELEASE_VERSION"
            --repo "$GITHUB_REPOSITORY"
            --standard-artifacts-dir release-assets
          )
          if [ "$RELEASE_MODE" = "new_release" ] || [ "$RELEASE_MODE" = "draft_candidate" ]; then
            publish_args+=(--draft)
          fi
          "${publish_args[@]}"

      - name: Upload standard release-note evidence
        uses: actions/upload-artifact@v7
        with:
          name: standard-release-notes-evidence-${{ inputs.opl_version }}
          path: ${{ runner.temp }}/standard-release-notes-evidence.json
          if-no-files-found: error

  full-first-install:
    name: Build Full first-install assets
    needs: standard-vm-smoke-gate-after-full
    if: ${{ !cancelled() && inputs.include_full_package && needs.standard-vm-smoke-gate-after-full.result == 'success' }}
    uses: ./.github/workflows/full-first-install-release.yml
    with:
      opl_version: ${{ inputs.opl_version }}
      framework_ref: ${{ needs.standard-vm-smoke-gate-after-full.outputs.framework_sha }}
      shell_ref: ${{ needs.standard-vm-smoke-gate-after-full.outputs.shell_sha }}
      publish_to_release: false
      force_rebuild_runtime_cache: ${{ inputs.force_rebuild_runtime_cache }}
    secrets: inherit

  publish-full-assets:
    name: Publish Full first-install assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    needs:
      - publish-standard
      - full-first-install
    if: ${{ !cancelled() && inputs.include_full_package && needs.publish-standard.result == 'success' && needs.full-first-install.result == 'success' }}

    steps:
      - name: Checkout App repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Download Full package workflow artifact
        uses: actions/download-artifact@v8
        with:
          name: opl-full-first-install-${{ inputs.opl_version }}-mac-arm64
          path: full-package-artifacts

      - name: Publish Full assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPL_RELEASE_VERSION: ${{ inputs.opl_version }}
          OPL_RELEASE_NOTES_MODE: ai
          OPL_RELEASE_NOTES_PROVIDER: openai_compatible
          OPL_RELEASE_NOTES_OPENAI_COMPATIBLE_BASE_URL: ${{ vars.OPL_RELEASE_NOTES_OPENAI_COMPATIBLE_BASE_URL }}
          OPL_RELEASE_NOTES_OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OPL_RELEASE_NOTES_OPENAI_COMPATIBLE_API_KEY }}
          OPL_RELEASE_NOTES_OPENAI_COMPATIBLE_MODEL: ${{ vars.OPL_RELEASE_NOTES_OPENAI_COMPATIBLE_MODEL }}
          OPL_RELEASE_NOTES_CODEX_BASE_URL: ${{ vars.OPL_RELEASE_NOTES_CODEX_BASE_URL }}
          OPL_RELEASE_NOTES_CODEX_API_KEY: ${{ secrets.OPL_RELEASE_NOTES_CODEX_API_KEY }}
          OPL_RELEASE_NOTES_MODEL: ${{ vars.OPL_RELEASE_NOTES_MODEL }}
          OPL_RELEASE_NOTES_EVIDENCE_OUTPUT: ${{ runner.temp }}/full-release-notes-evidence.json
        run: |
          node --experimental-strip-types scripts/release-notes-ai-writer.ts --probe-openai-compatible
          npm run release:publish -- \
            --no-build \
            --version "$OPL_RELEASE_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --full-package-only \
            --include-full-package \
            --full-package-dir full-package-artifacts

      - name: Upload Full release-note evidence
        uses: actions/upload-artifact@v7
        with:
          name: full-release-notes-evidence-${{ inputs.opl_version }}
          path: ${{ runner.temp }}/full-release-notes-evidence.json
          if-no-files-found: error

  remote-verify-standard:
    name: Verify remote standard release assets
    needs:
      - publish-standard
      - standard-first-run-vm-smoke-after-standard-only
    if: ${{ !cancelled() && !inputs.include_full_package && (!inputs.run_vm_smoke || needs.standard-first-run-vm-smoke-after-standard-only.result == 'success') }}
    runs-on: macos-latest

    steps:
      - name: Checkout App repo
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Verify remote standard assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPL_RELEASE_VERSION: ${{ inputs.opl_version }}
        run: |
          npm run verify-remote-release -- \
            --version "$OPL_RELEASE_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --summary-path remote-release-verification.json

      - name: Upload remote verification summary
        uses: actions/upload-artifact@v7
        with:
          name: remote-release-verification-${{ inputs.opl_version }}
          path: remote-release-verification.json
          if-no-files-found: error

  remote-verify-full:
    name: Verify remote standard and Full release assets
    needs:
      - publish-full-assets
      - standard-vm-smoke-gate-after-full
    if: ${{ !cancelled() && inputs.include_full_package && needs.publish-full-assets.result == 'success' && needs.standard-vm-smoke-gate-after-full.result == 'success' }}
    runs-on: macos-latest

    steps:
      - name: Checkout App repo
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Verify remote standard and Full assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPL_RELEASE_VERSION: ${{ inputs.opl_version }}
        run: |
          npm run verify-remote-release -- \
            --version "$OPL_RELEASE_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --include-full-package \
            --summary-path remote-release-verification.json

      - name: Upload remote verification summary
        uses: actions/upload-artifact@v7
        with:
          name: remote-release-verification-${{ inputs.opl_version }}
          path: remote-release-verification.json
          if-no-files-found: error

  stable-homebrew-tap-update:
    name: Update Stable Homebrew tap
    needs:
      - release-preflight
      - remote-verify-standard
      - remote-verify-full
      - standard-first-run-vm-smoke-after-standard-only
      - standard-vm-smoke-gate-after-full
    if: ${{ !cancelled() && inputs.run_vm_smoke && needs.release-preflight.outputs.homebrew_tap_update_required == 'true' && ((!inputs.include_full_package && needs.remote-verify-standard.result == 'success' && needs.standard-first-run-vm-smoke-after-standard-only.result == 'success') || (inputs.include_full_package && needs.remote-verify-full.result == 'success' && needs.standard-vm-smoke-gate-after-full.result == 'success')) }}
    uses: ./.github/workflows/homebrew-tap-update.yml
    with:
      channel: stable
      package_kind: app_standard
      opl_version: ${{ inputs.opl_version }}
      release_repo: gaofeng21cn/one-person-lab-app
      tap_repo: gaofeng21cn/homebrew-one-person-lab
    secrets:
      OPL_HOMEBREW_TAP_TOKEN: ${{ secrets.OPL_HOMEBREW_TAP_TOKEN }}

  full-homebrew-tap-update:
    name: Update Full Homebrew tap
    needs:
      - stable-homebrew-tap-update
      - remote-verify-full
      - full-first-run-vm-smoke
    if: ${{ !cancelled() && inputs.include_full_package && inputs.run_vm_smoke && inputs.release_mode == 'refresh_existing' && needs.stable-homebrew-tap-update.result == 'success' && needs.remote-verify-full.result == 'success' && needs.full-first-run-vm-smoke.result == 'success' }}
    uses: ./.github/workflows/homebrew-tap-update.yml
    with:
      channel: stable
      package_kind: app_full_first_install
      opl_version: ${{ inputs.opl_version }}
      release_repo: gaofeng21cn/one-person-lab-app
      tap_repo: gaofeng21cn/homebrew-one-person-lab
    secrets:
      OPL_HOMEBREW_TAP_TOKEN: ${{ secrets.OPL_HOMEBREW_TAP_TOKEN }}

  standard-first-run-vm-smoke-after-standard-only:
    name: Run clean standard first-run VM smoke
    needs: publish-standard
    if: ${{ !inputs.include_full_package && inputs.run_vm_smoke }}
    uses: ./.github/workflows/opl-first-run-vm.yml
    with:
      release_tag: v${{ inputs.opl_version }}
      release_artifact_name: macos-build-arm64-dmg
      package_profile: standard
      shell_ref: ${{ needs.publish-standard.outputs.shell_sha }}
    secrets: inherit

  standard-first-run-vm-smoke-after-full:
    name: Run clean standard first-run VM smoke
    needs: publish-standard
    if: ${{ inputs.include_full_package && inputs.run_vm_smoke }}
    uses: ./.github/workflows/opl-first-run-vm.yml
    with:
      release_tag: v${{ inputs.opl_version }}
      release_artifact_name: macos-build-arm64-dmg
      package_profile: standard
      shell_ref: ${{ needs.publish-standard.outputs.shell_sha }}
    secrets: inherit

  standard-vm-smoke-gate-after-full:
    name: Gate downstream Full release work on standard VM smoke
    needs:
      - publish-standard
      - standard-first-run-vm-smoke-after-full
    if: ${{ !cancelled() && inputs.include_full_package }}
    runs-on: ubuntu-latest
    outputs:
      app_sha: ${{ steps.release-cohort.outputs.app_sha }}
      shell_sha: ${{ steps.release-cohort.outputs.shell_sha }}
      framework_sha: ${{ steps.release-cohort.outputs.framework_sha }}

    steps:
      - name: Record fixed release cohort refs
        id: release-cohort
        shell: bash
        env:
          APP_SHA: ${{ needs.publish-standard.outputs.app_sha }}
          SHELL_SHA: ${{ needs.publish-standard.outputs.shell_sha }}
          FRAMEWORK_SHA: ${{ needs.publish-standard.outputs.framework_sha }}
        run: |
          set -euo pipefail
          echo "app_sha=$APP_SHA" >> "$GITHUB_OUTPUT"
          echo "shell_sha=$SHELL_SHA" >> "$GITHUB_OUTPUT"
          echo "framework_sha=$FRAMEWORK_SHA" >> "$GITHUB_OUTPUT"

      - name: Enforce standard VM fail-fast gate
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.run_vm_smoke }}" != "true" ]; then
            echo "Standard VM smoke disabled by dispatch input; downstream Full release work may continue without VM evidence."
            exit 0
          fi
          if [ "${{ needs.standard-first-run-vm-smoke-after-full.result }}" != "success" ]; then
            echo "::error::Standard VM smoke must pass before Full build, remote verification, Homebrew, operator evidence, or readiness aggregation can run. Result: ${{ needs.standard-first-run-vm-smoke-after-full.result }}"
            exit 1
          fi

  homebrew-standard-first-run-vm-smoke:
    name: Run Homebrew standard first-run VM smoke
    needs:
      - publish-standard
      - stable-homebrew-tap-update
    if: ${{ !cancelled() && inputs.run_vm_smoke && inputs.release_mode == 'refresh_existing' && needs.stable-homebrew-tap-update.result == 'success' }}
    uses: ./.github/workflows/opl-first-run-vm.yml
    with:
      release_tag: v${{ inputs.opl_version }}
      package_profile: homebrew-standard
      shell_ref: ${{ needs.publish-standard.outputs.shell_sha }}
    secrets: inherit

  full-first-run-vm-smoke:
    name: Run clean Full first-run VM smoke
    needs:
      - publish-full-assets
      - standard-vm-smoke-gate-after-full
    if: ${{ !cancelled() && inputs.include_full_package && inputs.run_vm_smoke && needs.standard-vm-smoke-gate-after-full.result == 'success' }}
    uses: ./.github/workflows/opl-first-run-vm.yml
    with:
      release_tag: v${{ inputs.opl_version }}
      release_artifact_name: opl-full-first-install-dmg-${{ inputs.opl_version }}-mac-arm64
      package_profile: full
      shell_ref: ${{ needs.standard-vm-smoke-gate-after-full.outputs.shell_sha }}
      guide_screenshots: ${{ inputs.guide_screenshots }}
    secrets: inherit

  one-shot-app-installer-smoke:
    name: Run one-shot App installer smoke
    needs:
      - publish-standard
      - standard-first-run-vm-smoke-after-standard-only
      - standard-vm-smoke-gate-after-full
    if: ${{ !cancelled() && inputs.run_vm_smoke && ((!inputs.include_full_package && needs.standard-first-run-vm-smoke-after-standard-only.result == 'success') || (inputs.include_full_package && needs.standard-vm-smoke-gate-after-full.result == 'success')) }}
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout App repo
        uses: actions/checkout@v6

      - name: Checkout OPL Framework installer source
        uses: actions/checkout@v6
        with:
          repository: gaofeng21cn/one-person-lab
          ref: ${{ needs.publish-standard.outputs.framework_sha }}
          path: one-person-lab

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Smoke App one-shot installer
        shell: bash
        env:
          OPL_INSTALL_SCRIPT_URL: file://${{ github.workspace }}/one-person-lab/install.sh
          OPL_INSTALL_DIR: ${{ runner.temp }}/opl-one-shot-install
          OPL_APP_INSTALL_MODE: app-first
        run: |
          set -euo pipefail
          chmod +x ./install.sh one-person-lab/install.sh
          bash -n ./install-stable.sh
          install_status=0
          initialize_status=0
          ./install.sh --complete --skip-modules || install_status=$?
          if [ "$install_status" -eq 0 ]; then
            "$OPL_INSTALL_DIR/bin/opl" system initialize --json >/tmp/opl-one-shot-system-initialize.json || initialize_status=$?
          fi
          smoke_status="$install_status"
          if [ "$smoke_status" -eq 0 ]; then
            smoke_status="$initialize_status"
          fi
          if [ "$smoke_status" -ne 0 ] && [ ! -s /tmp/opl-one-shot-system-initialize.json ]; then
            OPL_ONE_SHOT_INSTALL_EXIT_CODE="$install_status" \
            OPL_ONE_SHOT_INITIALIZE_EXIT_CODE="$initialize_status" \
            node <<'NODE'
          const fs = require('node:fs');
          const installExitCode = Number(process.env.OPL_ONE_SHOT_INSTALL_EXIT_CODE || 0);
          const initializeExitCode = Number(process.env.OPL_ONE_SHOT_INITIALIZE_EXIT_CODE || 0);
          const message = installExitCode !== 0
            ? `one-shot installer exited with ${installExitCode}`
            : `opl system initialize exited with ${initializeExitCode}`;
          fs.writeFileSync('/tmp/opl-one-shot-system-initialize.json', `${JSON.stringify({
            status: 'failed',
            error: {
              code: 'one_shot_app_installer_smoke_failed',
              message,
              install_exit_code: installExitCode,
              initialize_exit_code: initializeExitCode,
            },
          }, null, 2)}\n`);
          NODE
          fi
          exit "$smoke_status"

      - name: Upload one-shot installer smoke artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: one-shot-app-installer-smoke-${{ inputs.opl_version }}
          path: /tmp/opl-one-shot-system-initialize.json
          if-no-files-found: error

  docker-webui-smoke:
    name: Run Docker WebUI smoke and stage GHCR publish
    needs:
      - publish-standard
    if: ${{ !cancelled() && inputs.publish_docker_webui && inputs.run_vm_smoke && needs.publish-standard.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout App repo
        uses: actions/checkout@v6

      - name: Checkout active shell
        uses: actions/checkout@v6
        with:
          repository: gaofeng21cn/opl-aion-shell
          ref: ${{ needs.publish-standard.outputs.shell_sha }}
          # Controller lock API consumption point: replace the dispatch default below with a locked SHA cohort.
          # shell_ref: ${{ inputs.shell_ref }}
          path: shells/aionui

      - name: Build, verify, and publish Docker WebUI
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_MODE: ${{ inputs.release_mode }}
          OPL_FRAMEWORK_SHA: ${{ needs.publish-standard.outputs.framework_sha }}
          SHELL_SHA: ${{ needs.publish-standard.outputs.shell_sha }}
        run: |
          set -euo pipefail
          image_owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          ghcr_image="ghcr.io/${image_owner}/one-person-lab-webui"
          write_publish_summary() {
            local status="$1"
            local error_code="${2:-}"
            local error_message="${3:-}"
            node <<NODE
          const fs = require('node:fs');
          const payload = {
            status: '${status}',
            image: '${ghcr_image}',
            tags: ['${{ inputs.opl_version }}', '${{ inputs.opl_version }}-slim', 'stable', 'latest'],
            draft_candidate_push: false,
            source_repository: 'https://github.com/${GITHUB_REPOSITORY}',
            build_reuse: {
              mode: 'same_job_after_docker_webui_smoke',
              source_gate: 'docker-webui-smoke',
              repeated_docker_build: false,
              image_profiles: ['webui-full', 'webui-slim'],
            },
            package_access_required: {
              package_url: 'https://github.com/users/gaofeng21cn/packages/container/package/one-person-lab-webui/settings',
              required_actions_access_repository: 'gaofeng21cn/one-person-lab-app',
              required_actions_access_permission: 'write',
              configuration_surface: 'GitHub Packages settings Manage Actions access',
              failure_signal: 'docker push denied: permission_denied: write_package',
            },
          };
          if ('${error_code}') {
            payload.error = { code: '${error_code}', message: '${error_message}' };
          }
          fs.writeFileSync('/tmp/opl-webui-ghcr-publish.json', JSON.stringify(payload) + '\\n');
          NODE
          }
          node <<'NODE'
          const fs = require('node:fs');
          const policy = JSON.parse(fs.readFileSync('contracts/app-install-exposure-policy.json', 'utf8'));
          const dockerWebui = policy.installer_surfaces.find((surface) => surface.surface === 'docker_webui');
          const smokeGate = dockerWebui && dockerWebui.smoke_gate_contract;
          if (!smokeGate) {
            throw new Error('contracts/app-install-exposure-policy.json missing docker_webui.smoke_gate_contract');
          }
          const payload = {
            status: 'contract_record_only_not_live_smoke_evidence',
            source_policy: 'contracts/app-install-exposure-policy.json#installer_surfaces.docker_webui.smoke_gate_contract',
            workflow_job: 'docker-webui-smoke',
            workflow_artifact: smokeGate.workflow_artifact,
            required_gates: smokeGate.required_gates,
            health_check_surfaces: smokeGate.health_check_surfaces,
            diagnostic_bundle_artifacts: smokeGate.diagnostic_bundle_artifacts,
            false_ready_boundary: smokeGate.false_ready_boundary,
            note: 'This artifact declares Docker/WebUI smoke gates. Clean Linux Docker runtime evidence is release-blocking; clean Windows VM evidence is optional diagnostic import because Windows Docker host readiness belongs to Docker/Windows.',
          };
          fs.writeFileSync('/tmp/docker-webui-smoke-gate-contract.json', JSON.stringify(payload, null, 2) + '\n');
          NODE
          docker build \
            --build-arg OPL_FRAMEWORK_REF="${OPL_FRAMEWORK_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${SHELL_SHA}" \
            -t "one-person-lab-webui:${{ inputs.opl_version }}" \
            shells/aionui
          docker build \
            --build-arg OPL_WEBUI_IMAGE_PROFILE=webui-slim \
            --build-arg OPL_FRAMEWORK_REF="${OPL_FRAMEWORK_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${SHELL_SHA}" \
            -t "one-person-lab-webui:${{ inputs.opl_version }}-slim" \
            shells/aionui
          docker image inspect "one-person-lab-webui:${{ inputs.opl_version }}" \
            --format '{{.Size}}' > /tmp/opl-webui-image-size-bytes.txt
          docker image inspect "one-person-lab-webui:${{ inputs.opl_version }}" > /tmp/opl-webui-image-inspect.json
          docker image inspect "one-person-lab-webui:${{ inputs.opl_version }}-slim" > /tmp/opl-webui-slim-image-inspect.json
          docker run --rm --entrypoint cat "one-person-lab-webui:${{ inputs.opl_version }}" \
            /opt/opl/image-manifest.json > /tmp/opl-webui-image-manifest.json
          docker run --rm --entrypoint cat "one-person-lab-webui:${{ inputs.opl_version }}" \
            /opt/opl/seed/metadata.json > /tmp/opl-webui-seed-metadata.json
          docker run --rm --entrypoint sh "one-person-lab-webui:${{ inputs.opl_version }}" -lc \
            'command -v opl && command -v codex && test "$(find /opt/opl/seed/payload -type f | wc -l)" -gt 0' \
            > /tmp/opl-webui-runtime-readback.txt
          docker run --rm --entrypoint cat "one-person-lab-webui:${{ inputs.opl_version }}-slim" \
            /opt/opl/image-manifest.json > /tmp/opl-webui-slim-image-manifest.json
          docker run --rm --entrypoint cat "one-person-lab-webui:${{ inputs.opl_version }}-slim" \
            /opt/opl/seed/metadata.json > /tmp/opl-webui-slim-seed-metadata.json
          node --experimental-strip-types scripts/validate-webui-runtime-image.ts \
            --image-inspect /tmp/opl-webui-image-inspect.json \
            --image-manifest /tmp/opl-webui-image-manifest.json \
            --seed-metadata /tmp/opl-webui-seed-metadata.json \
            --expected-profile webui-full \
            --summary-path /tmp/opl-webui-runtime-image-validation.json
          node --experimental-strip-types scripts/validate-webui-runtime-image.ts \
            --image-inspect /tmp/opl-webui-slim-image-inspect.json \
            --image-manifest /tmp/opl-webui-slim-image-manifest.json \
            --seed-metadata /tmp/opl-webui-slim-seed-metadata.json \
            --expected-profile webui-slim \
            --summary-path /tmp/opl-webui-slim-runtime-image-validation.json
          webui_smoke_dir="$(mktemp -d)"
          mkdir -p "$webui_smoke_dir/data" "$webui_smoke_dir/projects"
          printf '%s\n' "projects mount smoke" > "$webui_smoke_dir/projects/.opl-projects-smoke"
          container="$(docker run --rm -d -p 127.0.0.1::3000 \
            -v "$webui_smoke_dir/data:/data" \
            -v "$webui_smoke_dir/projects:/projects" \
            "one-person-lab-webui:${{ inputs.opl_version }}")"
          cleanup() {
            docker logs "$container" >/tmp/opl-webui-container.log 2>&1 || true
            docker rm -f "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          port="$(docker port "$container" 3000/tcp | sed -E 's/.*:([0-9]+)$/\1/')"
          for attempt in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:${port}/" >/tmp/opl-webui-index.html; then
              break
            fi
            sleep 2
          done
          curl -fsS "http://127.0.0.1:${port}/manifest.webmanifest" >/tmp/opl-webui-manifest.webmanifest
          auth_headers="$(mktemp)"
          auth_body="$(mktemp)"
          for attempt in $(seq 1 60); do
            if curl -fsS -D "$auth_headers" "http://127.0.0.1:${port}/api/auth/user" -o "$auth_body" \
              && grep -q '"success":[[:space:]]*true' "$auth_body" \
              && grep -iq '^set-cookie:' "$auth_headers"; then
              break
            fi
            sleep 2
          done
          grep -q '"success":[[:space:]]*true' "$auth_body"
          grep -iq '^set-cookie:' "$auth_headers"
          cp "$auth_body" /tmp/opl-webui-auth-user.json
          curl -fsS -X POST -H 'content-type: application/json' -d '{}' \
            "http://127.0.0.1:${port}/api/opl-runtime/startup-maintenance" \
            >/tmp/opl-webui-startup-maintenance.json
          curl -fsS -X POST -H 'content-type: application/json' -d '{}' \
            "http://127.0.0.1:${port}/api/opl-runtime/update-status" \
            >/tmp/opl-webui-update-status.json
          grep -q '"success":[[:space:]]*true' /tmp/opl-webui-startup-maintenance.json
          grep -q '"success":[[:space:]]*true' /tmp/opl-webui-update-status.json
          for attempt in $(seq 1 60); do
            if [ -s "$webui_smoke_dir/data/opl/state/install-manifest.json" ]; then
              break
            fi
            sleep 1
          done
          test -s "$webui_smoke_dir/data/opl/state/install-manifest.json"
          test -f "$webui_smoke_dir/projects/.opl-projects-smoke"
          docker exec "$container" cat /projects/.opl-projects-smoke >/tmp/opl-webui-projects-readback.txt
          grep -q 'projects mount smoke' /tmp/opl-webui-projects-readback.txt
          cp "$webui_smoke_dir/data/opl/state/install-manifest.json" /tmp/opl-webui-install-manifest.json
          node --experimental-strip-types scripts/validate-webui-runtime-smoke-receipts.ts \
            --startup-maintenance /tmp/opl-webui-startup-maintenance.json \
            --update-status /tmp/opl-webui-update-status.json \
            --install-manifest /tmp/opl-webui-install-manifest.json \
            --summary-path /tmp/opl-webui-runtime-smoke-receipts-validation.json
          docker logs "$container" >/tmp/opl-webui-container.log 2>&1
          grep -q 'running OPL seed apply' /tmp/opl-webui-container.log
          grep -Eq 'running OPL (runtime substrate )?startup maintenance' /tmp/opl-webui-container.log
          ! grep -q 'OPL maintenance CLI not found; skipping startup maintenance' /tmp/opl-webui-container.log

          docker tag "one-person-lab-webui:${{ inputs.opl_version }}" "${ghcr_image}:${{ inputs.opl_version }}"
          docker tag "one-person-lab-webui:${{ inputs.opl_version }}-slim" "${ghcr_image}:${{ inputs.opl_version }}-slim"
          docker tag "one-person-lab-webui:${{ inputs.opl_version }}" "${ghcr_image}:stable"
          docker tag "one-person-lab-webui:${{ inputs.opl_version }}" "${ghcr_image}:latest"

          if [ "$RELEASE_MODE" = "draft_candidate" ]; then
            write_publish_summary "draft_not_pushed"
            exit 0
          fi

          if ! printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin; then
            write_publish_summary "failed" "ghcr_login_failed" "GHCR login failed before pushing one-person-lab-webui tags."
            exit 0
          fi
          if ! docker push "${ghcr_image}:${{ inputs.opl_version }}"; then
            write_publish_summary "failed" "ghcr_write_package_denied" "GHCR push failed. Ensure the one-person-lab-webui package grants write Actions access to gaofeng21cn/one-person-lab-app."
            exit 0
          fi
          if ! docker push "${ghcr_image}:${{ inputs.opl_version }}-slim"; then
            write_publish_summary "failed" "ghcr_write_package_denied" "GHCR slim tag push failed. Ensure the one-person-lab-webui package grants write Actions access to gaofeng21cn/one-person-lab-app."
            exit 0
          fi
          if ! docker push "${ghcr_image}:stable"; then
            write_publish_summary "failed" "ghcr_write_package_denied" "GHCR stable tag push failed. Ensure the one-person-lab-webui package grants write Actions access to gaofeng21cn/one-person-lab-app."
            exit 0
          fi
          if ! docker push "${ghcr_image}:latest"; then
            write_publish_summary "failed" "ghcr_write_package_denied" "GHCR latest tag push failed. Ensure the one-person-lab-webui package grants write Actions access to gaofeng21cn/one-person-lab-app."
            exit 0
          fi
          write_publish_summary "published"

      - name: Upload Docker WebUI smoke artifacts
        uses: actions/upload-artifact@v7
        with:
          name: docker-webui-smoke-${{ inputs.opl_version }}
          path: |
            /tmp/opl-webui-index.html
            /tmp/opl-webui-manifest.webmanifest
            /tmp/opl-webui-image-inspect.json
            /tmp/opl-webui-slim-image-inspect.json
            /tmp/opl-webui-image-manifest.json
            /tmp/opl-webui-slim-image-manifest.json
            /tmp/opl-webui-seed-metadata.json
            /tmp/opl-webui-slim-seed-metadata.json
            /tmp/opl-webui-runtime-readback.txt
            /tmp/opl-webui-runtime-image-validation.json
            /tmp/opl-webui-slim-runtime-image-validation.json
            /tmp/opl-webui-image-size-bytes.txt
            /tmp/opl-webui-auth-user.json
            /tmp/opl-webui-startup-maintenance.json
            /tmp/opl-webui-update-status.json
            /tmp/opl-webui-projects-readback.txt
            /tmp/opl-webui-install-manifest.json
            /tmp/opl-webui-runtime-smoke-receipts-validation.json
            /tmp/opl-webui-container.log
            /tmp/docker-webui-smoke-gate-contract.json
          if-no-files-found: error

      - name: Upload WebUI GHCR publish summary
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: webui-ghcr-publish-${{ inputs.opl_version }}
          path: /tmp/opl-webui-ghcr-publish.json
          if-no-files-found: error

  webui-ghcr-publish:
    name: Verify WebUI GHCR publish
    needs: docker-webui-smoke
    if: ${{ !cancelled() && inputs.publish_docker_webui && inputs.run_vm_smoke && needs.docker-webui-smoke.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout App repo
        uses: actions/checkout@v6

      - name: Download WebUI GHCR publish summary
        uses: actions/download-artifact@v8
        with:
          name: webui-ghcr-publish-${{ inputs.opl_version }}
          path: webui-ghcr-publish

      - name: Verify WebUI GHCR publish summary
        shell: bash
        env:
          RELEASE_MODE: ${{ inputs.release_mode }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const summary = JSON.parse(fs.readFileSync('webui-ghcr-publish/opl-webui-ghcr-publish.json', 'utf8'));
          const releaseMode = process.env.RELEASE_MODE;
          if (releaseMode === 'draft_candidate') {
            if (summary.status !== 'draft_not_pushed' || summary.draft_candidate_push !== false) {
              throw new Error(`Draft WebUI GHCR publish summary is invalid: ${summary.status}`);
            }
            process.exit(0);
          }
          if (summary.status !== 'published') {
            const message = summary.error?.message || `WebUI GHCR publish status is ${summary.status}`;
            throw new Error(message);
          }
          NODE

  docker-webui-clean-vm-evidence:
    name: Validate Docker WebUI clean VM evidence
    needs:
      - docker-webui-smoke
      - webui-ghcr-publish
    if: ${{ !cancelled() && inputs.publish_docker_webui && inputs.run_vm_smoke && needs.docker-webui-smoke.result == 'success' && needs.webui-ghcr-publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout App repo
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Download clean Linux VM Docker WebUI evidence
        if: ${{ inputs.docker_webui_clean_linux_evidence_artifact != '' }}
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ${{ inputs.docker_webui_clean_linux_evidence_artifact }}
          path: docker-webui-clean-vm-inputs/clean-linux-vm

      - name: Download clean Windows VM Docker WebUI evidence
        if: ${{ inputs.docker_webui_clean_windows_evidence_artifact != '' }}
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ${{ inputs.docker_webui_clean_windows_evidence_artifact }}
          path: docker-webui-clean-vm-inputs/clean-windows-vm

      - name: Import and validate clean VM evidence
        id: clean_vm_evidence
        shell: bash
        env:
          LINUX_ARTIFACT_NAME: ${{ inputs.docker_webui_clean_linux_evidence_artifact }}
          WINDOWS_ARTIFACT_NAME: ${{ inputs.docker_webui_clean_windows_evidence_artifact }}
        run: |
          set -euo pipefail
          output_dir="docker-webui-clean-vm-evidence"
          mkdir -p "$output_dir"

          if [ -z "$LINUX_ARTIFACT_NAME" ]; then
            linux_generated_dir="$output_dir/clean-linux-vm-generated"
            npm run smoke:docker-webui:linux-clean-vm -- \
              --artifacts "$linux_generated_dir" \
              --health-timeout 180 \
              --json > "$output_dir/clean-linux-vm-generated-output.json" || true
            LINUX_ARTIFACT_NAME="same_job_ubuntu_clean_vm_generated"
            export LINUX_ARTIFACT_NAME
          fi

          windows_raw_evidence="docker-webui-clean-vm-inputs/clean-windows-vm"
          windows_zip_evidence="$(find docker-webui-clean-vm-inputs/clean-windows-vm -maxdepth 1 -type f -name '*.zip' | sort | head -n 1 || true)"
          if [ -n "$WINDOWS_ARTIFACT_NAME" ] && [ -f "$windows_raw_evidence/windows-smoke-evidence.json" ] && [ ! -f "$windows_raw_evidence/docker-webui-smoke-gate-result.json" ]; then
            node --experimental-strip-types scripts/docker-webui-smoke-gate.ts \
              --gate clean_windows_vm \
              --evidence "$windows_raw_evidence" \
              --artifacts "$output_dir/clean-windows-vm-import" \
              --json > "$output_dir/clean-windows-vm-import-output.json" || true
          elif [ -n "$WINDOWS_ARTIFACT_NAME" ] && [ -n "$windows_zip_evidence" ] && [ ! -f "$windows_raw_evidence/docker-webui-smoke-gate-result.json" ]; then
            node --experimental-strip-types scripts/docker-webui-smoke-gate.ts \
              --gate clean_windows_vm \
              --evidence "$windows_zip_evidence" \
              --artifacts "$output_dir/clean-windows-vm-import" \
              --json > "$output_dir/clean-windows-vm-import-output.json" || true
          fi

          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { spawnSync } = require('node:child_process');
          const outputDir = 'docker-webui-clean-vm-evidence';
          const resultSchema = 'opl_docker_webui_clean_vm_evidence_validation.v1';
          const gates = [
            {
              gate: 'clean_linux_vm',
              label: 'clean Linux VM',
              inputDir: 'docker-webui-clean-vm-inputs/clean-linux-vm',
              importDir: path.join(outputDir, 'clean-linux-vm-generated'),
              artifactName: process.env.LINUX_ARTIFACT_NAME || '',
              missingCode: 'missing_clean_linux_vm_docker_webui_evidence_artifact',
              missingMessage: 'No clean Linux VM Docker WebUI smoke artifact was supplied or generated by the release workflow.',
              nextAction: 'Inspect the generated clean Linux VM smoke output, fix the installer/runtime issue, or supply docker_webui_clean_linux_evidence_artifact with a passing docker-webui-smoke-gate-result.json.',
              required: true,
            },
            {
              gate: 'clean_windows_vm',
              label: 'clean Windows VM',
              inputDir: 'docker-webui-clean-vm-inputs/clean-windows-vm',
              importDir: path.join(outputDir, 'clean-windows-vm-import'),
              artifactName: process.env.WINDOWS_ARTIFACT_NAME || '',
              missingCode: 'missing_clean_windows_vm_docker_webui_evidence_artifact',
              missingMessage: 'No same-run clean Windows VM Docker WebUI smoke artifact was supplied to the release workflow.',
              nextAction: 'Run scripts/install-docker-webui.ps1 -Yes -EvidenceDir windows-clean-evidence -EvidenceArchive windows-clean-evidence.zip in a clean Windows VM, upload the evidence zip or raw directory artifact, and rerun the release workflow with docker_webui_clean_windows_evidence_artifact set.',
              required: false,
            },
          ];

          function writeJson(file, payload) {
            fs.mkdirSync(path.dirname(file), { recursive: true });
            fs.writeFileSync(file, `${JSON.stringify(payload, null, 2)}\n`);
          }
          function blocker(config, code, message, nextAction) {
            return {
              schema: resultSchema,
              gate_id: config.gate,
              status: 'typed_blocker',
              artifact_name: config.artifactName || null,
              typed_blocker: {
                code,
                owner: 'release_or_install_validation_operator',
                message,
                required_next_action: nextAction,
              },
            };
          }
          function findResultFile(config) {
            const candidates = [
              path.join(config.inputDir, 'docker-webui-smoke-gate-result.json'),
              path.join(config.importDir || '', 'docker-webui-smoke-gate-result.json'),
            ];
            for (const candidate of candidates) {
              if (candidate && fs.existsSync(candidate)) return candidate;
            }
            return null;
          }
          function validate(config) {
            if (!config.artifactName) {
              if (!config.required) {
                return {
                  schema: resultSchema,
                  gate_id: config.gate,
                  status: 'skipped',
                  artifact_name: null,
                  optional: true,
                  message: `${config.label} evidence was not supplied; Docker/WebUI release readiness does not require Windows Docker host proof.`,
                };
              }
              return blocker(config, config.missingCode, config.missingMessage, config.nextAction);
            }
            const resultPath = findResultFile(config);
            if (!resultPath) {
              return blocker(
                config,
                `${config.gate}_result_missing`,
                `The ${config.label} artifact did not contain docker-webui-smoke-gate-result.json and could not be imported.`,
                config.nextAction,
              );
            }
            const validation = spawnSync(
              'node',
              ['--experimental-strip-types', 'scripts/docker-webui-smoke-gate.ts', '--validate-result', resultPath, '--json'],
              { encoding: 'utf8' },
            );
            let result = {};
            try {
              result = JSON.parse(fs.readFileSync(resultPath, 'utf8'));
            } catch (error) {
              return {
                schema: resultSchema,
                gate_id: config.gate,
                status: 'failed',
                artifact_name: config.artifactName,
                result_path: resultPath,
                error: `docker-webui-smoke-gate-result.json is not valid JSON: ${String(error)}`,
              };
            }
            let schemaValidation = null;
            try {
              schemaValidation = JSON.parse(validation.stdout || '{}');
            } catch (error) {
              schemaValidation = { status: 'failed', parse_error: String(error) };
            }
            if (validation.status !== 0 || schemaValidation.status !== 'passed') {
              return {
                schema: resultSchema,
                gate_id: config.gate,
                status: 'failed',
                artifact_name: config.artifactName,
                result_path: resultPath,
                validation: schemaValidation,
                error: validation.stderr || validation.stdout,
              };
            }
            if (result.gate_id !== config.gate || result.gate !== config.gate || result.status !== 'passed') {
              return blocker(
                config,
                `${config.gate}_not_passed`,
                `The ${config.label} artifact validated structurally but reported gate=${result.gate_id || result.gate} status=${result.status}.`,
                config.nextAction,
              );
            }
            return {
              schema: resultSchema,
              gate_id: config.gate,
              status: 'passed',
              artifact_name: config.artifactName,
              result_path: resultPath,
              validation: schemaValidation,
              observed_at: result.observed_at,
              required_environment: result.required_environment,
            };
          }

          const summaries = gates.map(validate);
          for (const summary of summaries) {
            writeJson(path.join(outputDir, `${summary.gate_id}-validation-summary.json`), summary);
          }
          const requiredSummaries = summaries.filter((summary) => gates.find((gate) => gate.gate === summary.gate_id)?.required);
          const aggregate = {
            schema: resultSchema,
            status: requiredSummaries.every((summary) => summary.status === 'passed') ? 'passed' : 'typed_blocker',
            required_gates: gates.filter((gate) => gate.required).map((gate) => gate.gate),
            optional_gates: gates.filter((gate) => !gate.required).map((gate) => gate.gate),
            summaries,
            release_readiness_policy: 'clean Linux Docker runtime evidence must validate as passed before release readiness aggregation; clean Windows VM evidence is optional diagnostic import.',
          };
          writeJson(path.join(outputDir, 'docker-webui-clean-vm-evidence-validation.json'), aggregate);
          if (aggregate.status !== 'passed') {
            process.exitCode = 1;
          }
          NODE

      - name: Upload clean VM evidence validation
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: docker-webui-clean-vm-evidence-${{ inputs.opl_version }}
          path: docker-webui-clean-vm-evidence
          if-no-files-found: error

  operator-evidence-bundle-validation:
    name: Validate operator evidence bundle
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && inputs.run_vm_smoke && ((!inputs.include_full_package && needs.remote-verify-standard.result == 'success' && needs.standard-first-run-vm-smoke-after-standard-only.result == 'success') || (inputs.include_full_package && needs.remote-verify-full.result == 'success' && needs.standard-vm-smoke-gate-after-full.result == 'success' && needs.full-first-run-vm-smoke.result == 'success')) }}
    needs:
      - remote-verify-standard
      - remote-verify-full
      - publish-standard
      - standard-first-run-vm-smoke-after-standard-only
      - standard-first-run-vm-smoke-after-full
      - standard-vm-smoke-gate-after-full
      - full-first-run-vm-smoke
      - docker-webui-clean-vm-evidence

    steps:
      - name: Checkout App repo
        uses: actions/checkout@v6

      - name: Checkout OPL Framework
        uses: actions/checkout@v6
        with:
          repository: gaofeng21cn/one-person-lab
          ref: ${{ needs.publish-standard.outputs.framework_sha }}
          path: one-person-lab

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install OPL Framework dependencies
        working-directory: one-person-lab
        run: npm ci

      - name: Download remote verification summary
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: remote-release-verification-${{ inputs.opl_version }}
          path: release-evidence-inputs/remote-release-verification-${{ inputs.opl_version }}

      - name: Download standard VM smoke summary
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: opl-first-run-vm-standard-${{ github.run_id }}
          path: release-evidence-inputs/opl-first-run-vm-standard-${{ github.run_id }}

      - name: Download Full VM smoke summary
        if: ${{ inputs.include_full_package }}
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: opl-first-run-vm-full-${{ github.run_id }}
          path: release-evidence-inputs/opl-first-run-vm-full-${{ github.run_id }}

      - name: Download Docker WebUI clean VM evidence
        if: ${{ inputs.publish_docker_webui }}
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: docker-webui-clean-vm-evidence-${{ inputs.opl_version }}
          path: release-evidence-inputs/docker-webui-clean-vm-evidence-${{ inputs.opl_version }}

      - name: Collect same-cohort operator evidence
        id: collect_operator_evidence
        continue-on-error: true
        shell: bash
        env:
          OPL_SKIP_SKILL_SYNC: '1'
        run: |
          set -euo pipefail
          bundle_dir="release-evidence/${{ inputs.opl_version }}"
          full_source_dir="release-evidence-inputs/opl-first-run-vm-full-${{ github.run_id }}"
          standard_source_dir="release-evidence-inputs/opl-first-run-vm-standard-${{ github.run_id }}"
          remote_source_dir="release-evidence-inputs/remote-release-verification-${{ inputs.opl_version }}"
          docker_webui_clean_vm_source_dir="release-evidence-inputs/docker-webui-clean-vm-evidence-${{ inputs.opl_version }}"
          collector_args=(
            --bundle-dir "$bundle_dir"
            --action-id developer_supervisor_refresh
            --execute-action
            --overwrite
            --opl-bin "$GITHUB_WORKSPACE/one-person-lab/bin/opl"
          )
          manifest_args=(
            --bundle-dir "$bundle_dir"
            --overwrite
          )
          if [ -d "$full_source_dir" ]; then
            collector_args+=(--evidence-source-dir "$full_source_dir")
            if [ -d "$full_source_dir/artifacts" ]; then
              collector_args+=(--evidence-source-dir "$full_source_dir/artifacts")
            fi
            if [ -f "$full_source_dir/artifacts/settings-pages/runtime-status.png" ]; then
              collector_args+=(--artifact "runtime_screenshot=$full_source_dir/artifacts/settings-pages/runtime-status.png")
            fi
          fi
          if [ -d "$standard_source_dir" ]; then
            collector_args+=(--evidence-source-dir "$standard_source_dir")
            if [ -d "$standard_source_dir/artifacts" ]; then
              collector_args+=(--evidence-source-dir "$standard_source_dir/artifacts")
            fi
            if [ ! -f "$full_source_dir/artifacts/settings-pages/runtime-status.png" ] && [ -f "$standard_source_dir/artifacts/settings-pages/runtime-status.png" ]; then
              collector_args+=(--artifact "runtime_screenshot=$standard_source_dir/artifacts/settings-pages/runtime-status.png")
            fi
          fi
          if [ -d "$remote_source_dir" ]; then
            collector_args+=(--evidence-source-dir "$remote_source_dir")
          fi
          if [ "${{ inputs.publish_docker_webui }}" = "true" ]; then
            collector_args+=(--require-conditional docker_webui_clean_vm_evidence)
            manifest_args+=(--require-conditional docker_webui_clean_vm_evidence)
            if [ -d "$docker_webui_clean_vm_source_dir" ]; then
              collector_args+=(--evidence-source-dir "$docker_webui_clean_vm_source_dir")
            fi
          fi
          node --experimental-strip-types scripts/collect-release-evidence.ts "${collector_args[@]}" > evidence-collection-summary.json
          node --experimental-strip-types scripts/write-release-evidence-manifest.ts "${manifest_args[@]}"

      - name: Validate operator evidence bundle
        if: ${{ steps.collect_operator_evidence.outcome == 'success' }}
        id: validate_operator_evidence
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          validation_args=(
            --bundle-dir "release-evidence/${{ inputs.opl_version }}"
          )
          if [ "${{ inputs.publish_docker_webui }}" = "true" ]; then
            validation_args+=(--require-conditional docker_webui_clean_vm_evidence)
          fi
          node --experimental-strip-types scripts/validate-release-evidence-bundle.ts \
            "${validation_args[@]}" \
            > evidence-validation-summary.json

      - name: Write failed operator evidence summary
        if: ${{ steps.collect_operator_evidence.outcome != 'success' || steps.validate_operator_evidence.outcome != 'success' }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const summary = {
            schema: 'opl_release_evidence_bundle_validation.v1',
            status: 'failed',
            bundle_dir: 'release-evidence/${{ inputs.opl_version }}',
            manifest_path: 'evidence-manifest.json',
            packaged_app_evidence: false,
            authority_boundary: 'refs_only_no_runtime_truth_domain_truth_artifact_or_quality_authority',
            forbidden_authority: [
              'runtime_truth',
              'provider_implementation',
              'domain_truth',
              'domain_quality_verdict',
              'domain_artifact_authority',
            ],
            verified_artifact_count: 0,
            missing_artifact_count: null,
            blocked_artifact_count: null,
            collection_outcome: '${{ steps.collect_operator_evidence.outcome }}',
            validation_outcome: '${{ steps.validate_operator_evidence.outcome }}',
            reason: 'operator evidence bundle collection or validation failed; inspect release-evidence-bundle artifact',
          };
          fs.writeFileSync('evidence-validation-summary.json', JSON.stringify(summary, null, 2) + '\n');
          NODE

      - name: Upload operator evidence validation summary
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-bundle-${{ inputs.opl_version }}
          path: |
            evidence-validation-summary.json
            evidence-collection-summary.json
            release-evidence/${{ inputs.opl_version }}
          if-no-files-found: error

  release-readiness-admission:
    name: Admit release readiness aggregation
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && inputs.run_vm_smoke && needs.release-preflight.result == 'success' && ((!inputs.include_full_package && needs.remote-verify-standard.result == 'success' && needs.standard-first-run-vm-smoke-after-standard-only.result == 'success') || (inputs.include_full_package && needs.standard-vm-smoke-gate-after-full.result == 'success' && needs.remote-verify-full.result == 'success' && needs.full-first-run-vm-smoke.result == 'success')) && (needs.release-preflight.outputs.homebrew_tap_update_required != 'true' || (needs.stable-homebrew-tap-update.result == 'success' && (!inputs.include_full_package || needs.full-homebrew-tap-update.result == 'success') && needs.homebrew-standard-first-run-vm-smoke.result == 'success')) && needs.one-shot-app-installer-smoke.result == 'success' && (!inputs.publish_docker_webui || (needs.docker-webui-smoke.result == 'success' && needs.webui-ghcr-publish.result == 'success' && needs.docker-webui-clean-vm-evidence.result == 'success')) }}
    needs:
      - release-preflight
      - remote-verify-standard
      - remote-verify-full
      - standard-first-run-vm-smoke-after-standard-only
      - standard-first-run-vm-smoke-after-full
      - standard-vm-smoke-gate-after-full
      - stable-homebrew-tap-update
      - full-homebrew-tap-update
      - homebrew-standard-first-run-vm-smoke
      - full-first-run-vm-smoke
      - one-shot-app-installer-smoke
      - docker-webui-smoke
      - webui-ghcr-publish
      - docker-webui-clean-vm-evidence
      - operator-evidence-bundle-validation

    steps:
      - name: Enforce release readiness fail-fast admission
        shell: bash
        run: |
          node <<'NODE'
          const includeFullPackage = '${{ inputs.include_full_package }}' === 'true';
          const publishDockerWebui = '${{ inputs.publish_docker_webui }}' === 'true';
          const runVmSmoke = '${{ inputs.run_vm_smoke }}' === 'true';
          const homebrewTapUpdateRequired = '${{ needs.release-preflight.outputs.homebrew_tap_update_required }}' === 'true';
          const results = {
            'release-preflight': '${{ needs.release-preflight.result }}',
            'remote-verify-standard': '${{ needs.remote-verify-standard.result }}',
            'remote-verify-full': '${{ needs.remote-verify-full.result }}',
            'standard-first-run-vm-smoke-after-standard-only': '${{ needs.standard-first-run-vm-smoke-after-standard-only.result }}',
            'standard-first-run-vm-smoke-after-full': '${{ needs.standard-first-run-vm-smoke-after-full.result }}',
            'standard-vm-smoke-gate-after-full': '${{ needs.standard-vm-smoke-gate-after-full.result }}',
            'stable-homebrew-tap-update': '${{ needs.stable-homebrew-tap-update.result }}',
            'full-homebrew-tap-update': '${{ needs.full-homebrew-tap-update.result }}',
            'homebrew-standard-first-run-vm-smoke': '${{ needs.homebrew-standard-first-run-vm-smoke.result }}',
            'full-first-run-vm-smoke': '${{ needs.full-first-run-vm-smoke.result }}',
            'one-shot-app-installer-smoke': '${{ needs.one-shot-app-installer-smoke.result }}',
            'docker-webui-smoke': '${{ needs.docker-webui-smoke.result }}',
            'webui-ghcr-publish': '${{ needs.webui-ghcr-publish.result }}',
            'docker-webui-clean-vm-evidence': '${{ needs.docker-webui-clean-vm-evidence.result }}',
            'operator-evidence-bundle-validation': '${{ needs.operator-evidence-bundle-validation.result }}',
          };

          const failures = [];
          function requireSuccess(job) {
            if (results[job] !== 'success') {
              failures.push(`${job}=${results[job] || 'unknown'}`);
            }
          }
          function requireSuccessOrSkipped(job) {
            if (results[job] !== 'success' && results[job] !== 'skipped') {
              failures.push(`${job}=${results[job] || 'unknown'}`);
            }
          }

          if (!runVmSmoke) {
            failures.push('run_vm_smoke=false prevents release readiness aggregation for stable clean evidence closeout');
          }
          requireSuccess('release-preflight');

          if (includeFullPackage) {
            requireSuccess('standard-vm-smoke-gate-after-full');
            requireSuccess('remote-verify-full');
            requireSuccess('full-first-run-vm-smoke');
          } else {
            requireSuccess('remote-verify-standard');
            requireSuccess('standard-first-run-vm-smoke-after-standard-only');
          }

          if (homebrewTapUpdateRequired) {
            requireSuccess('stable-homebrew-tap-update');
            if (includeFullPackage) {
              requireSuccess('full-homebrew-tap-update');
            } else {
              requireSuccessOrSkipped('full-homebrew-tap-update');
            }
            requireSuccess('homebrew-standard-first-run-vm-smoke');
          } else {
            requireSuccessOrSkipped('stable-homebrew-tap-update');
            requireSuccessOrSkipped('full-homebrew-tap-update');
            requireSuccessOrSkipped('homebrew-standard-first-run-vm-smoke');
          }
          requireSuccess('one-shot-app-installer-smoke');
          if (publishDockerWebui) {
            requireSuccess('docker-webui-smoke');
            requireSuccess('webui-ghcr-publish');
            requireSuccess('docker-webui-clean-vm-evidence');
          } else {
            requireSuccessOrSkipped('docker-webui-smoke');
            requireSuccessOrSkipped('webui-ghcr-publish');
            requireSuccessOrSkipped('docker-webui-clean-vm-evidence');
          }
          if (failures.length > 0) {
            console.error('Release readiness aggregation is blocked by failed, skipped, or missing required gates:');
            for (const failure of failures) console.error(`- ${failure}`);
            process.exit(1);
          }

          console.log('Release readiness aggregation admitted after all required same-cohort gates passed.');
          NODE

  release-readiness-summary:
    name: Summarize release readiness
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && needs.release-readiness-admission.result == 'success' }}
    needs:
      - full-first-install
      - remote-verify-standard
      - remote-verify-full
      - publish-standard
      - standard-first-run-vm-smoke-after-standard-only
      - standard-first-run-vm-smoke-after-full
      - standard-vm-smoke-gate-after-full
      - stable-homebrew-tap-update
      - full-homebrew-tap-update
      - homebrew-standard-first-run-vm-smoke
      - full-first-run-vm-smoke
      - one-shot-app-installer-smoke
      - docker-webui-smoke
      - webui-ghcr-publish
      - docker-webui-clean-vm-evidence
      - operator-evidence-bundle-validation
      - release-readiness-admission

    steps:
      - name: Checkout App repo
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Download remote verification summary
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: remote-release-verification-${{ inputs.opl_version }}
          path: release-readiness-inputs/remote-release-verification-${{ inputs.opl_version }}

      - name: Download release preflight summary
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: release-preflight-summary-${{ inputs.opl_version }}
          path: release-readiness-inputs/release-preflight-summary-${{ inputs.opl_version }}

      - name: Download standard VM smoke summary
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: opl-first-run-vm-standard-${{ github.run_id }}
          path: release-readiness-inputs/opl-first-run-vm-standard-${{ github.run_id }}

      - name: Download Homebrew VM smoke summary
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: opl-first-run-vm-homebrew-standard-${{ github.run_id }}
          path: release-readiness-inputs/opl-first-run-vm-homebrew-standard-${{ github.run_id }}

      - name: Download Stable Homebrew tap plan
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: homebrew-tap-plan-stable-app_standard-${{ inputs.opl_version }}
          path: release-readiness-inputs/homebrew-tap-plan-stable-app_standard-${{ inputs.opl_version }}

      - name: Download Full Homebrew tap plan
        if: ${{ inputs.include_full_package }}
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: homebrew-tap-plan-stable-app_full_first_install-${{ inputs.opl_version }}
          path: release-readiness-inputs/homebrew-tap-plan-stable-app_full_first_install-${{ inputs.opl_version }}

      - name: Download Full VM smoke summary
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: opl-first-run-vm-full-${{ github.run_id }}
          path: release-readiness-inputs/opl-first-run-vm-full-${{ github.run_id }}

      - name: Download one-shot installer smoke summary
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: one-shot-app-installer-smoke-${{ inputs.opl_version }}
          path: release-readiness-inputs/one-shot-app-installer-smoke-${{ inputs.opl_version }}

      - name: Download Docker WebUI smoke summary
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: docker-webui-smoke-${{ inputs.opl_version }}
          path: release-readiness-inputs/docker-webui-smoke-${{ inputs.opl_version }}

      - name: Download WebUI GHCR publish summary
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: webui-ghcr-publish-${{ inputs.opl_version }}
          path: release-readiness-inputs/webui-ghcr-publish-${{ inputs.opl_version }}

      - name: Download Docker WebUI clean VM evidence validation
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: docker-webui-clean-vm-evidence-${{ inputs.opl_version }}
          path: release-readiness-inputs/docker-webui-clean-vm-evidence-${{ inputs.opl_version }}

      - name: Download operator evidence validation summary
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: release-evidence-bundle-${{ inputs.opl_version }}
          path: release-readiness-inputs/release-evidence-bundle-${{ inputs.opl_version }}

      - name: Download Full workflow telemetry
        if: ${{ inputs.include_full_package }}
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: opl-full-workflow-telemetry-${{ inputs.opl_version }}
          path: release-readiness-inputs/opl-full-workflow-telemetry-${{ inputs.opl_version }}

      - name: Download Full diagnostics summary
        if: ${{ inputs.include_full_package }}
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: opl-full-diagnostics-${{ inputs.opl_version }}
          path: release-readiness-inputs/opl-full-diagnostics-${{ inputs.opl_version }}

      - name: Write release readiness job results
        shell: bash
        run: |
          cat > release-readiness-job-results.json <<'JSON'
          {
            "full-first-install": "${{ needs.full-first-install.result }}",
            "remote-verify-standard": "${{ needs.remote-verify-standard.result }}",
            "remote-verify-full": "${{ needs.remote-verify-full.result }}",
            "standard-first-run-vm-smoke-after-standard-only": "${{ needs.standard-first-run-vm-smoke-after-standard-only.result }}",
            "standard-first-run-vm-smoke-after-full": "${{ needs.standard-first-run-vm-smoke-after-full.result }}",
            "stable-homebrew-tap-update": "${{ needs.stable-homebrew-tap-update.result }}",
            "full-homebrew-tap-update": "${{ needs.full-homebrew-tap-update.result }}",
            "homebrew-standard-first-run-vm-smoke": "${{ needs.homebrew-standard-first-run-vm-smoke.result }}",
            "full-first-run-vm-smoke": "${{ needs.full-first-run-vm-smoke.result }}",
            "one-shot-app-installer-smoke": "${{ needs.one-shot-app-installer-smoke.result }}",
            "docker-webui-smoke": "${{ needs.docker-webui-smoke.result }}",
            "webui-ghcr-publish": "${{ needs.webui-ghcr-publish.result }}",
            "docker-webui-clean-vm-evidence": "${{ needs.docker-webui-clean-vm-evidence.result }}",
            "operator-evidence-bundle-validation": "${{ needs.operator-evidence-bundle-validation.result }}"
          }
          JSON

      - name: Build final release readiness summary
        shell: bash
        env:
          OPL_RELEASE_VERSION: ${{ inputs.opl_version }}
          OPL_RELEASE_MODE: ${{ inputs.release_mode }}
          OPL_INCLUDE_FULL_PACKAGE: ${{ inputs.include_full_package }}
          OPL_RUN_VM_SMOKE: ${{ inputs.run_vm_smoke }}
          OPL_PUBLISH_DOCKER_WEBUI: ${{ inputs.publish_docker_webui }}
        run: |
          node --experimental-strip-types scripts/summarize-release-readiness.ts \
            --version "$OPL_RELEASE_VERSION" \
            --release-mode "$OPL_RELEASE_MODE" \
            --include-full-package "$OPL_INCLUDE_FULL_PACKAGE" \
            --run-vm-smoke "$OPL_RUN_VM_SMOKE" \
            --publish-docker-webui "$OPL_PUBLISH_DOCKER_WEBUI" \
            --artifacts-dir release-readiness-inputs \
            --job-results release-readiness-job-results.json \
            --output release-readiness-summary.json \
            --markdown release-readiness-summary.md
          cat release-readiness-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Write release candidate record
        shell: bash
        env:
          OPL_RELEASE_VERSION: ${{ inputs.opl_version }}
          OPL_RELEASE_MODE: ${{ inputs.release_mode }}
          OPL_INCLUDE_FULL_PACKAGE: ${{ inputs.include_full_package }}
          OPL_RUN_VM_SMOKE: ${{ inputs.run_vm_smoke }}
          OPL_PUBLISH_DOCKER_WEBUI: ${{ inputs.publish_docker_webui }}
          OPL_SHELL_REF: ${{ needs.publish-standard.outputs.shell_sha }}
          OPL_FRAMEWORK_REF: ${{ needs.publish-standard.outputs.framework_sha }}
          OPL_APP_COMMIT: ${{ needs.publish-standard.outputs.app_sha }}
          OPL_RELEASE_OWNER_VERDICT_REF: ${{ inputs.release_owner_verdict_ref }}
          OPL_RELEASE_OWNER_RECEIPT_REF: ${{ inputs.release_owner_receipt_ref }}
          OPL_RELEASE_OWNER_TYPED_BLOCKER_REF: ${{ inputs.release_owner_typed_blocker_ref }}
          OPL_RELEASE_OWNER_HUMAN_GATE_REF: ${{ inputs.release_owner_human_gate_ref }}
        run: |
          node --experimental-strip-types scripts/write-release-candidate-record.ts \
            --version "$OPL_RELEASE_VERSION" \
            --release-mode "$OPL_RELEASE_MODE" \
            --include-full-package "$OPL_INCLUDE_FULL_PACKAGE" \
            --run-vm-smoke "$OPL_RUN_VM_SMOKE" \
            --shell-ref "$OPL_SHELL_REF" \
            --framework-ref "$OPL_FRAMEWORK_REF" \
            --app-commit "$OPL_APP_COMMIT" \
            --workflow-run-id "${{ github.run_id }}" \
            --preflight "release-readiness-inputs/release-preflight-summary-${{ inputs.opl_version }}/release-preflight-summary.json" \
            --readiness release-readiness-summary.json \
            --remote-verification "release-readiness-inputs/remote-release-verification-${{ inputs.opl_version }}/remote-release-verification.json" \
            --job-results release-readiness-job-results.json \
            --output release-candidate-record.json \
            --markdown release-candidate-record.md \
            --allow-blocked
          cat release-candidate-record.md >> "$GITHUB_STEP_SUMMARY"

      - name: Write release cohort manifest
        shell: bash
        env:
          OPL_RELEASE_VERSION: ${{ inputs.opl_version }}
          OPL_RELEASE_MODE: ${{ inputs.release_mode }}
        run: |
          node --experimental-strip-types scripts/write-release-cohort-manifest.ts \
            --version "$OPL_RELEASE_VERSION" \
            --release-mode "$OPL_RELEASE_MODE" \
            --candidate-record release-candidate-record.json \
            --readiness release-readiness-summary.json \
            --remote-verification "release-readiness-inputs/remote-release-verification-${{ inputs.opl_version }}/remote-release-verification.json" \
            --preflight "release-readiness-inputs/release-preflight-summary-${{ inputs.opl_version }}/release-preflight-summary.json" \
            --output release-cohort-manifest.json \
            --markdown release-cohort-manifest.md
          cat release-cohort-manifest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release readiness summary
        uses: actions/upload-artifact@v7
        with:
          name: release-readiness-summary-${{ inputs.opl_version }}
          path: |
            release-readiness-summary.json
            release-readiness-summary.md
          if-no-files-found: error

      - name: Upload release candidate record
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate-record-${{ inputs.opl_version }}
          path: |
            release-candidate-record.json
            release-candidate-record.md
          if-no-files-found: error

      - name: Upload release cohort manifest
        uses: actions/upload-artifact@v7
        with:
          name: release-cohort-manifest-${{ inputs.opl_version }}
          path: |
            release-cohort-manifest.json
            release-cohort-manifest.md
          if-no-files-found: error
