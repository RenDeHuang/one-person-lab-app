name: OPL Desktop Release Diagnostics

on:
  workflow_dispatch:
    inputs:
      opl_version:
        description: OPL version to diagnose, for example 26.6.21
        required: true
        type: string
      release_run_id:
        description: GitHub Actions desktop release run id to inspect
        required: false
        default: ''
        type: string
      run_vm_diagnostic:
        description: Run the first-run VM harness against an existing release, URL, or workflow artifact without rebuilding or publishing release assets
        required: false
        default: false
        type: boolean
      release_tag:
        description: GitHub release tag to diagnose. Empty means v<opl_version>.
        required: false
        default: ''
        type: string
      release_dmg_url:
        description: Direct DMG URL to diagnose. Overrides release_tag when set.
        required: false
        default: ''
        type: string
      release_artifact_name:
        description: Existing GitHub Actions artifact containing the DMG to diagnose.
        required: false
        default: ''
        type: string
      release_artifact_run_id:
        description: GitHub Actions run id that owns release_artifact_name. Defaults to release_run_id when empty.
        required: false
        default: ''
        type: string
      shell_ref:
        description: opl-aion-shell ref containing the first-run smoke scripts
        required: false
        default: main
        type: string
      package_profile:
        description: Install profile to diagnose
        required: false
        default: standard
        type: choice
        options:
          - standard
          - full
          - homebrew-standard
      tart_source_vm:
        description: Tart clean snapshot/base VM. Empty means repository variable OPL_FIRST_RUN_TART_SOURCE.
        required: false
        default: ''
        type: string
      keep_vm:
        description: Leave temporary Tart VM for debugging
        required: false
        default: false
        type: boolean
      guide_screenshots:
        description: Capture user-guide screenshots in the VM smoke artifacts
        required: false
        default: false
        type: boolean
      run_timeout_ms:
        description: Outer Tart run timeout passed to opl-first-run-tart-smoke.mjs
        required: false
        default: '900000'
        type: string
      smoke_timeout_ms:
        description: Guest smoke timeout passed to opl-first-run-tart-smoke.mjs
        required: false
        default: '900000'
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: opl-desktop-release-diagnostics-${{ inputs.opl_version }}-${{ inputs.release_run_id }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-diagnostics:
    name: Build release diagnostic harness outputs
    runs-on: ubuntu-latest
    if: ${{ inputs.release_run_id != '' }}

    steps:
      - name: Checkout App repo
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Build release closeout diagnostics
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPL_RELEASE_VERSION: ${{ inputs.opl_version }}
          OPL_RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          OPL_RELEASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          npm run release:closeout -- \
            --version "$OPL_RELEASE_VERSION" \
            --run-id "$OPL_RELEASE_RUN_ID" \
            --repo "$OPL_RELEASE_REPO" \
            --out-dir release-diagnostics \
            --artifact-profile diagnostics
          cat release-diagnostics/release-closeout.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build GitHub Actions timing diagnostics
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPL_RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          OPL_RELEASE_REPO: ${{ github.repository }}
        run: |
          npm run release:actions-timing -- \
            --repo "$OPL_RELEASE_REPO" \
            --run-id "$OPL_RELEASE_RUN_ID" \
            --output release-diagnostics/release-actions-timing.json \
            --markdown release-diagnostics/release-actions-timing.md
          cat release-diagnostics/release-actions-timing.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: release-diagnostics-${{ inputs.opl_version }}
          path: |
            release-diagnostics/release-closeout.json
            release-diagnostics/release-closeout.md
            release-diagnostics/release-monitor.json
            release-diagnostics/release-notification.json
            release-diagnostics/release-actions-timing.json
            release-diagnostics/release-actions-timing.md
          if-no-files-found: error

  vm-harness-diagnostics:
    name: Run first-run VM diagnostic harness
    if: ${{ inputs.run_vm_diagnostic }}
    uses: ./.github/workflows/opl-first-run-vm.yml
    with:
      release_tag: ${{ inputs.release_tag != '' && inputs.release_tag || format('v{0}', inputs.opl_version) }}
      release_dmg_url: ${{ inputs.release_dmg_url }}
      release_artifact_name: ${{ inputs.release_artifact_name }}
      release_artifact_run_id: ${{ inputs.release_artifact_run_id != '' && inputs.release_artifact_run_id || inputs.release_run_id }}
      shell_ref: ${{ inputs.shell_ref }}
      package_profile: ${{ inputs.package_profile }}
      tart_source_vm: ${{ inputs.tart_source_vm }}
      keep_vm: ${{ inputs.keep_vm }}
      guide_screenshots: ${{ inputs.guide_screenshots }}
      run_timeout_ms: ${{ inputs.run_timeout_ms }}
      smoke_timeout_ms: ${{ inputs.smoke_timeout_ms }}
    secrets: inherit
