name: OPL Non-Release Validation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opl-non-release-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-boundary:
    name: App release-boundary tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout App repo
        uses: actions/checkout@v6

      - name: Setup active shell
        uses: ./.github/actions/setup-active-shell-deps
        with:
          shell-ref: main
          install-dependencies: 'false'

      - name: Probe release-note online AI provider
        env:
          OPL_RELEASE_NOTES_OPENAI_COMPATIBLE_BASE_URL: ${{ vars.OPL_RELEASE_NOTES_OPENAI_COMPATIBLE_BASE_URL }}
          OPL_RELEASE_NOTES_OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OPL_RELEASE_NOTES_OPENAI_COMPATIBLE_API_KEY }}
          OPL_RELEASE_NOTES_OPENAI_COMPATIBLE_MODEL: ${{ vars.OPL_RELEASE_NOTES_OPENAI_COMPATIBLE_MODEL }}
          OPL_RELEASE_NOTES_CODEX_BASE_URL: ${{ vars.OPL_RELEASE_NOTES_CODEX_BASE_URL }}
          OPL_RELEASE_NOTES_CODEX_API_KEY: ${{ secrets.OPL_RELEASE_NOTES_CODEX_API_KEY }}
          OPL_RELEASE_NOTES_MODEL: ${{ vars.OPL_RELEASE_NOTES_MODEL }}
        run: node --experimental-strip-types scripts/release-notes-ai-writer.ts --probe-openai-compatible

      - name: Run release-boundary tests
        run: npm run test:release-boundary

      - name: Validate release-boundary contract
        run: npm run validate:release-boundary
