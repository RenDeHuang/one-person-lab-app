name: OPL Latest Docs

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/docs-latest.yml'
      - 'docs/guides/**'
      - 'docs/whitepapers/**'
      - 'docs/publishing/**'
      - 'docs/delivery/user-guides/**'
      - 'scripts/build-quarto-guide.ts'
      - 'scripts/build-docker-webui-guide.ts'
      - 'scripts/build-user-guide-slides.ts'
      - 'scripts/build-opl-app-whitepaper.ts'
      - 'scripts/validate-publishing-templates.ts'
      - 'package.json'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-latest
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install document tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils texlive-xetex fonts-noto-cjk libreoffice zip unzip
          curl -fsSL https://quarto.org/download/latest/quarto-linux-amd64.deb -o /tmp/quarto.deb
          sudo dpkg -i /tmp/quarto.deb
          curl -fsSL https://d.officecli.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build latest docs
        env:
          SOFFICE_BIN: libreoffice
        run: npm run docs:latest

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/site

      - name: Deploy Pages
        uses: actions/deploy-pages@v4
