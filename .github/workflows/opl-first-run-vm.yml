name: OPL GUI First-Run VM

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub release tag to test. Empty means latest release.'
        required: false
        type: string
      release_dmg_url:
        description: 'Direct DMG URL. Overrides release_tag when set.'
        required: false
        type: string
      release_artifact_name:
        description: 'Same-run GitHub Actions artifact containing the DMG. Used by release workflows before draft assets are externally visible.'
        required: false
        type: string
      release_artifact_run_id:
        description: 'GitHub Actions run id that owns release_artifact_name. Empty means the current workflow run.'
        required: false
        type: string
      shell_ref:
        description: 'opl-aion-shell ref containing the first-run smoke scripts. Empty means main.'
        required: false
        default: main
        type: string
      framework_ref:
        description: 'one-person-lab Framework ref to inject into the VM as the standard bootstrap source. Empty keeps the packaged installer default.'
        required: false
        type: string
      package_profile:
        description: 'Install profile to test.'
        required: false
        default: full
        type: choice
        options:
          - full
          - standard
          - homebrew-standard
      tart_source_vm:
        description: 'Tart clean snapshot/base VM. Empty means repository variable OPL_FIRST_RUN_TART_SOURCE.'
        required: false
        type: string
      guest_user:
        description: 'SSH user inside the VM. Empty means repository variable OPL_FIRST_RUN_GUEST_USER or runner.'
        required: false
        type: string
      guest_ssh_key_path:
        description: 'SSH private key path on the self-hosted runner.'
        required: false
        type: string
      no_graphics:
        description: 'Pass --no-graphics to tart run. Use only for VM images with a logged-in GUI session.'
        required: false
        type: boolean
        default: false
      keep_vm:
        description: 'Leave temporary Tart VM for debugging.'
        required: false
        type: boolean
        default: false
      guide_screenshots:
        description: 'Capture full-screen user-guide screenshots in the VM smoke artifacts.'
        required: false
        type: boolean
        default: false
      run_timeout_ms:
        description: 'Outer Tart run timeout passed to opl-first-run-tart-smoke.mjs.'
        required: false
        default: '3600000'
        type: string
      smoke_timeout_ms:
        description: 'Guest smoke timeout passed to opl-first-run-tart-smoke.mjs.'
        required: false
        default: '3600000'
        type: string
      codex_install_phase_timeout_ms:
        description: 'Codex install/setup phase timeout passed through to the active shell smoke. Empty inherits smoke_timeout_ms.'
        required: false
        type: string
      codex_readiness_phase_timeout_ms:
        description: 'Codex readiness/initialize phase timeout passed through to the active shell smoke. Empty inherits smoke_timeout_ms.'
        required: false
        type: string
      diagnostic_scope:
        description: 'VM diagnostic scope. release_gate runs the full release smoke; bootstrap_only skips Codex asset preseed and secondary checks to capture App launch/bootstrap blockers quickly.'
        required: false
        default: release_gate
        type: choice
        options:
          - release_gate
          - bootstrap_only
  workflow_call:
    inputs:
      release_tag:
        description: 'GitHub release tag to test. Empty means latest release.'
        required: false
        type: string
      release_dmg_url:
        description: 'Direct DMG URL. Overrides release_tag when set.'
        required: false
        type: string
      release_artifact_name:
        description: 'Same-run GitHub Actions artifact containing the DMG. Used by release workflows before draft assets are externally visible.'
        required: false
        type: string
      release_artifact_run_id:
        description: 'GitHub Actions run id that owns release_artifact_name. Empty means the caller workflow run.'
        required: false
        type: string
      shell_ref:
        description: 'opl-aion-shell ref containing the first-run smoke scripts. Empty means main.'
        required: false
        default: main
        type: string
      framework_ref:
        description: 'one-person-lab Framework ref to inject into the VM as the standard bootstrap source. Empty keeps the packaged installer default.'
        required: false
        type: string
      package_profile:
        description: 'Install profile to test: full, standard, or homebrew-standard.'
        required: false
        default: full
        type: string
      tart_source_vm:
        description: 'Tart clean snapshot/base VM. Empty means repository variable OPL_FIRST_RUN_TART_SOURCE.'
        required: false
        type: string
      guest_user:
        description: 'SSH user inside the VM. Empty means repository variable OPL_FIRST_RUN_GUEST_USER or runner.'
        required: false
        type: string
      guest_ssh_key_path:
        description: 'SSH private key path on the self-hosted runner.'
        required: false
        type: string
      no_graphics:
        description: 'Pass --no-graphics to tart run. Use only for VM images with a logged-in GUI session.'
        required: false
        type: boolean
        default: false
      keep_vm:
        description: 'Leave temporary Tart VM for debugging.'
        required: false
        type: boolean
        default: false
      guide_screenshots:
        description: 'Capture full-screen user-guide screenshots in the VM smoke artifacts.'
        required: false
        type: boolean
        default: false
      run_timeout_ms:
        description: 'Outer Tart run timeout passed to opl-first-run-tart-smoke.mjs.'
        required: false
        default: '3600000'
        type: string
      smoke_timeout_ms:
        description: 'Guest smoke timeout passed to opl-first-run-tart-smoke.mjs.'
        required: false
        default: '3600000'
        type: string
      codex_install_phase_timeout_ms:
        description: 'Codex install/setup phase timeout passed through to the active shell smoke. Empty inherits smoke_timeout_ms.'
        required: false
        type: string
      codex_readiness_phase_timeout_ms:
        description: 'Codex readiness/initialize phase timeout passed through to the active shell smoke. Empty inherits smoke_timeout_ms.'
        required: false
        type: string
      diagnostic_scope:
        description: 'VM diagnostic scope: release_gate or bootstrap_only.'
        required: false
        default: release_gate
        type: string
  schedule:
    - cron: '0 18 * * *'

concurrency:
  # Scheduled runs collapse to the latest queued run; manual and release-called
  # validation runs use caller-run/profile-scoped groups so stable release
  # profiles do not replace each other in GitHub's single pending slot.
  group: ${{ github.event_name == 'schedule' && 'opl-gui-first-run-vm-scheduled' || format('opl-gui-first-run-vm-{0}-{1}', github.run_id, inputs.package_profile || 'full') }}
  cancel-in-progress: ${{ github.event_name == 'schedule' }}

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-vm-inputs:
    name: Validate VM harness inputs
    runs-on: ubuntu-latest
    outputs:
      package_profile: ${{ steps.diagnostic_inputs.outputs.profile }}
      shell_ref: ${{ steps.diagnostic_inputs.outputs.shell_ref }}
      shell_sha: ${{ steps.shell_ref.outputs.shell_sha }}
      framework_sha: ${{ steps.framework_ref.outputs.framework_sha }}
      diagnostic_scope: ${{ steps.diagnostic_inputs.outputs.diagnostic_scope }}
      skip_vm: ${{ steps.scheduled_release_guard.outputs.skip_vm || 'false' }}
      skip_reason: ${{ steps.scheduled_release_guard.outputs.skip_reason || '' }}

    steps:
      - name: Checkout App repo
        uses: actions/checkout@v6

      - name: Skip scheduled VM while desktop release is active
        id: scheduled_release_guard
        if: ${{ github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          count_runs() {
            local status="$1"
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "OPL Desktop Release" \
              --status "$status" \
              --limit 20 \
              --json databaseId,status \
            | node -e "const fs=require('node:fs'); const runs=JSON.parse(fs.readFileSync(0,'utf8')); const current=Number(process.env.CURRENT_RUN_ID || 0); process.stdout.write(String(runs.filter((run)=>Number(run.databaseId)!==current).length));"
          }
          active_release_runs=""
          queued_release_runs=""
          guard_status="ok"
          active_release_runs="$(count_runs in_progress)" || guard_status="failed"
          if [ "$guard_status" = "ok" ]; then
            queued_release_runs="$(count_runs queued)" || guard_status="failed"
          fi
          if [ "$guard_status" != "ok" ]; then
            echo "skip_vm=true" >> "$GITHUB_OUTPUT"
            echo "skip_reason=desktop_release_guard_unavailable" >> "$GITHUB_OUTPUT"
            {
              echo "## OPL GUI first-run VM"
              echo
              echo "- Status: skipped"
              echo "- Reason: desktop release workflow activity could not be checked."
              echo "- Policy: scheduled maintenance must not occupy the self-hosted first-run VM runner when release activity is unknown."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$active_release_runs" != "0" ] || [ "$queued_release_runs" != "0" ]; then
            echo "skip_vm=true" >> "$GITHUB_OUTPUT"
            echo "skip_reason=desktop_release_active_or_queued" >> "$GITHUB_OUTPUT"
            {
              echo "## OPL GUI first-run VM"
              echo
              echo "- Status: skipped"
              echo "- Reason: desktop release workflow is active or queued."
              echo "- Active release runs: $active_release_runs"
              echo "- Queued release runs: $queued_release_runs"
              echo "- Policy: scheduled maintenance must not occupy the self-hosted first-run VM runner during stable release closeout."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip_vm=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Normalize diagnostic inputs
        id: diagnostic_inputs
        shell: bash
        run: |
          set -euo pipefail
          profile="${{ inputs.package_profile }}"
          if [ -z "$profile" ]; then
            if [ "${{ github.event_name }}" = "schedule" ]; then
              profile="standard"
            else
              profile="full"
            fi
          fi
          case "$profile" in
            full | standard | homebrew-standard)
              ;;
            *)
              echo "::error::Unsupported package_profile: $profile"
              exit 1
              ;;
          esac
          shell_ref="${{ inputs.shell_ref }}"
          if [ -z "$shell_ref" ]; then
            shell_ref="main"
          fi
          diagnostic_scope="${{ inputs.diagnostic_scope }}"
          if [ -z "$diagnostic_scope" ]; then
            if [ "${{ github.event_name }}" = "schedule" ]; then
              diagnostic_scope="bootstrap_only"
            else
              diagnostic_scope="release_gate"
            fi
          fi
          case "$diagnostic_scope" in
            release_gate | bootstrap_only)
              ;;
            *)
              echo "::error::Unsupported diagnostic_scope: $diagnostic_scope"
              exit 1
              ;;
          esac
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          echo "shell_ref=$shell_ref" >> "$GITHUB_OUTPUT"
          echo "diagnostic_scope=$diagnostic_scope" >> "$GITHUB_OUTPUT"

      - name: Validate active shell ref before VM runner work
        id: shell_ref
        shell: bash
        run: |
          set -euo pipefail
          shell_ref="${{ steps.diagnostic_inputs.outputs.shell_ref }}"
          repo_url="https://github.com/gaofeng21cn/opl-aion-shell.git"
          shell_sha="$(git ls-remote "$repo_url" "refs/heads/$shell_ref" "refs/tags/$shell_ref" "$shell_ref" | awk 'NR==1 {print $1}')"
          if [[ "$shell_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "shell_sha=$shell_sha" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$shell_ref" =~ ^[0-9a-fA-F]{7,39}$ ]] &&
             shell_sha="$(git ls-remote "$repo_url" | awk -v ref="$shell_ref" '$1 ~ "^" ref {print $1; exit}')" &&
             [[ "$shell_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "shell_sha=$shell_sha" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$shell_ref" =~ ^[0-9a-fA-F]{40}$ ]]; then
            tmp_dir="$(mktemp -d)"
            trap 'rm -rf "$tmp_dir"' EXIT
            git -C "$tmp_dir" init -q
            git -C "$tmp_dir" remote add origin "$repo_url"
            if git -C "$tmp_dir" fetch --depth=1 origin "$shell_ref" >/dev/null 2>&1; then
              shell_sha="$(git -C "$tmp_dir" rev-parse FETCH_HEAD)"
              echo "shell_sha=$shell_sha" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "::error::opl-aion-shell ref '$shell_ref' does not exist; fix shell_ref before occupying the first-run VM harness."
          exit 1

      - name: Validate Framework ref before VM runner work
        id: framework_ref
        if: ${{ inputs.framework_ref != '' }}
        shell: bash
        run: |
          set -euo pipefail
          framework_ref="${{ inputs.framework_ref }}"
          repo_url="https://github.com/gaofeng21cn/one-person-lab.git"
          framework_sha="$(git ls-remote "$repo_url" "refs/heads/$framework_ref" "refs/tags/$framework_ref" "$framework_ref" | awk 'NR==1 {print $1}')"
          if [[ "$framework_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "framework_sha=$framework_sha" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$framework_ref" =~ ^[0-9a-fA-F]{7,39}$ ]] &&
             framework_sha="$(git ls-remote "$repo_url" | awk -v ref="$framework_ref" '$1 ~ "^" ref {print $1; exit}')" &&
             [[ "$framework_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "framework_sha=$framework_sha" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$framework_ref" =~ ^[0-9a-fA-F]{40}$ ]]; then
            tmp_dir="$(mktemp -d)"
            trap 'rm -rf "$tmp_dir"' EXIT
            git -C "$tmp_dir" init -q
            git -C "$tmp_dir" remote add origin "$repo_url"
            if git -C "$tmp_dir" fetch --depth=1 origin "$framework_ref" >/dev/null 2>&1; then
              framework_sha="$(git -C "$tmp_dir" rev-parse FETCH_HEAD)"
              echo "framework_sha=$framework_sha" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "::error::one-person-lab ref '$framework_ref' does not exist; fix framework_ref before occupying the first-run VM harness."
          exit 1

      - name: Download build artifact cohort manifest
        if: ${{ inputs.release_artifact_name != '' }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.release_artifact_name }}-cohort
          run-id: ${{ inputs.release_artifact_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: artifacts/release-cohort

      - name: Reject cross-cohort artifact reuse before VM allocation
        if: ${{ inputs.release_artifact_name != '' }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.release_tag }}"
          version="${version#v}"
          version_args=()
          if [ -n "$version" ]; then
            version_args=(--version "$version")
          fi
          node --experimental-strip-types scripts/validate-build-artifact-cohort.ts \
            --manifest artifacts/release-cohort/opl-build-cohort.json \
            --app-sha "$GITHUB_SHA" \
            --shell-sha "${{ steps.shell_ref.outputs.shell_sha }}" \
            "${version_args[@]}"

  clean-vm-first-run:
    name: Clean VM first launch
    needs: validate-vm-inputs
    if: ${{ needs.validate-vm-inputs.outputs.skip_vm != 'true' }}
    runs-on: ${{ fromJson(vars.OPL_FIRST_RUN_RUNNER_LABELS || '["self-hosted","macOS","opl-gui-vm"]') }}
    timeout-minutes: 75
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      OPL_FIRST_RUN_RUNNER_LABELS: ${{ vars.OPL_FIRST_RUN_RUNNER_LABELS }}
      OPL_FIRST_RUN_TART_SOURCE: ${{ vars.OPL_FIRST_RUN_TART_SOURCE }}
      OPL_FIRST_RUN_HOMEBREW_TART_SOURCE: ${{ vars.OPL_FIRST_RUN_HOMEBREW_TART_SOURCE }}
      OPL_FIRST_RUN_GUEST_USER: ${{ vars.OPL_FIRST_RUN_GUEST_USER }}
      OPL_FIRST_RUN_GUEST_SSH_KEY: ${{ vars.OPL_FIRST_RUN_GUEST_SSH_KEY }}

    steps:
      - name: Resolve Tart source VM
        id: tart_source
        shell: bash
        run: |
          set -euo pipefail
          PROFILE="${{ needs.validate-vm-inputs.outputs.package_profile }}"
          SOURCE_VM="${{ inputs.tart_source_vm }}"
          if [ -z "$SOURCE_VM" ]; then
            if [ "$PROFILE" = "homebrew-standard" ]; then
              SOURCE_VM="${OPL_FIRST_RUN_HOMEBREW_TART_SOURCE:-}"
            else
              SOURCE_VM="${OPL_FIRST_RUN_TART_SOURCE:-}"
            fi
          fi
          if [ -z "$SOURCE_VM" ]; then
            {
              echo "## OPL GUI first-run VM"
              echo
              echo "- Status: failed"
              echo "- Reason: no Tart source VM configured."
              if [ "$PROFILE" = "homebrew-standard" ]; then
                echo '- Configure repository variable `OPL_FIRST_RUN_HOMEBREW_TART_SOURCE` with a Homebrew-ready clean VM, or pass workflow input `tart_source_vm`.'
              else
                echo '- Configure repository variable `OPL_FIRST_RUN_TART_SOURCE` or pass workflow input `tart_source_vm`.'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$PROFILE" = "homebrew-standard" ]; then
              echo "::error::Set workflow input tart_source_vm or repository variable OPL_FIRST_RUN_HOMEBREW_TART_SOURCE for package_profile=homebrew-standard."
            else
              echo "::error::Set workflow input tart_source_vm or repository variable OPL_FIRST_RUN_TART_SOURCE."
            fi
            exit 1
          fi
          echo "source_vm=$SOURCE_VM" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout active shell
        uses: actions/checkout@v6
        with:
          repository: gaofeng21cn/opl-aion-shell
          ref: ${{ needs.validate-vm-inputs.outputs.shell_sha }}
          path: shells/aionui
          fetch-depth: 1
          sparse-checkout: scripts

      - name: Checkout OPL Framework bootstrap source
        if: ${{ inputs.framework_ref != '' }}
        uses: actions/checkout@v6
        with:
          repository: gaofeng21cn/one-person-lab
          ref: ${{ needs.validate-vm-inputs.outputs.framework_sha }}
          path: one-person-lab
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Resolve host Node.js runtime for guest smoke
        id: host_node
        shell: bash
        run: |
          set -euo pipefail
          NODE_BIN="$(command -v node)"
          NODE_BIN_REAL="$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$NODE_BIN")"
          NODE_ROOT="$(cd "$(dirname "$NODE_BIN_REAL")/.." && pwd)"
          if [ ! -x "$NODE_ROOT/bin/node" ]; then
            echo "::error::Unable to resolve host Node.js runtime root from $NODE_BIN"
            exit 1
          fi
          echo "node_root=$NODE_ROOT" >> "$GITHUB_OUTPUT"
          echo "node_bin=$NODE_BIN" >> "$GITHUB_OUTPUT"

      - name: Validate smoke scripts
        shell: bash
        run: |
          node --check shells/aionui/scripts/opl-first-run-vm-smoke.mjs
          node --check shells/aionui/scripts/opl-first-run-tart-smoke.mjs

      - name: Prepare OPL Framework bootstrap archive
        id: framework_source
        if: ${{ inputs.framework_ref != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/opl-first-run-vm/framework-source
          archive_path="artifacts/opl-first-run-vm/framework-source/one-person-lab-framework.tar.gz"
          install_script_path="one-person-lab/install.sh"
          test -f "$install_script_path"
          git -C one-person-lab archive --format=tar.gz --prefix=one-person-lab/ HEAD -o "$GITHUB_WORKSPACE/$archive_path"
          chmod +x "$install_script_path"
          echo "archive_path=$archive_path" >> "$GITHUB_OUTPUT"
          echo "install_script_path=$install_script_path" >> "$GITHUB_OUTPUT"

      - name: Resolve package profile
        id: package_profile
        shell: bash
        run: |
          set -euo pipefail
          profile="${{ needs.validate-vm-inputs.outputs.package_profile }}"
          case "$profile" in
            full)
              echo "download_pattern=One-Person-Lab-Full-*-mac-arm64.dmg" >> "$GITHUB_OUTPUT"
              echo "find_args=-name 'One-Person-Lab-Full-*-mac-arm64.dmg'" >> "$GITHUB_OUTPUT"
              echo "runtime_profile=full" >> "$GITHUB_OUTPUT"
              echo "install_mode=dmg" >> "$GITHUB_OUTPUT"
              echo "homebrew_cask=" >> "$GITHUB_OUTPUT"
              ;;
            standard)
              echo "download_pattern=One-Person-Lab-*-mac-arm64.dmg" >> "$GITHUB_OUTPUT"
              echo "find_args=-name 'One-Person-Lab-*-mac-arm64.dmg' ! -name 'One-Person-Lab-Full-*'" >> "$GITHUB_OUTPUT"
              echo "runtime_profile=standard" >> "$GITHUB_OUTPUT"
              echo "install_mode=dmg" >> "$GITHUB_OUTPUT"
              echo "homebrew_cask=" >> "$GITHUB_OUTPUT"
              ;;
            homebrew-standard)
              echo "download_pattern=" >> "$GITHUB_OUTPUT"
              echo "find_args=" >> "$GITHUB_OUTPUT"
              echo "runtime_profile=standard" >> "$GITHUB_OUTPUT"
              echo "install_mode=homebrew-cask" >> "$GITHUB_OUTPUT"
              echo "homebrew_cask=gaofeng21cn/one-person-lab/one-person-lab" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unsupported package_profile: $profile"
              exit 1
              ;;
          esac
          echo "profile=$profile" >> "$GITHUB_OUTPUT"

      - name: Resolve first-run VM timeouts
        id: vm_timeouts
        shell: bash
        run: |
          set -euo pipefail

          positive_integer() {
            local name="$1"
            local value="$2"
            if [[ ! "$value" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::$name must be a positive integer number of milliseconds."
              exit 1
            fi
          }

          optional_positive_integer() {
            local name="$1"
            local value="$2"
            if [ -n "$value" ]; then
              positive_integer "$name" "$value"
            fi
          }

          RUN_TIMEOUT_MS="${{ inputs.run_timeout_ms }}"
          SMOKE_TIMEOUT_MS="${{ inputs.smoke_timeout_ms }}"
          CODEX_INSTALL_PHASE_TIMEOUT_MS="${{ inputs.codex_install_phase_timeout_ms }}"
          CODEX_READINESS_PHASE_TIMEOUT_MS="${{ inputs.codex_readiness_phase_timeout_ms }}"

          if [ -z "$RUN_TIMEOUT_MS" ]; then
            RUN_TIMEOUT_MS="3600000"
          fi
          if [ -z "$SMOKE_TIMEOUT_MS" ]; then
            SMOKE_TIMEOUT_MS="3600000"
          fi
          if [ -z "$CODEX_INSTALL_PHASE_TIMEOUT_MS" ]; then
            CODEX_INSTALL_PHASE_TIMEOUT_MS="$SMOKE_TIMEOUT_MS"
          fi
          if [ -z "$CODEX_READINESS_PHASE_TIMEOUT_MS" ]; then
            CODEX_READINESS_PHASE_TIMEOUT_MS="$SMOKE_TIMEOUT_MS"
          fi

          positive_integer "run_timeout_ms" "$RUN_TIMEOUT_MS"
          positive_integer "smoke_timeout_ms" "$SMOKE_TIMEOUT_MS"
          positive_integer "codex_install_phase_timeout_ms" "$CODEX_INSTALL_PHASE_TIMEOUT_MS"
          positive_integer "codex_readiness_phase_timeout_ms" "$CODEX_READINESS_PHASE_TIMEOUT_MS"

          echo "run_timeout_ms=$RUN_TIMEOUT_MS" >> "$GITHUB_OUTPUT"
          echo "smoke_timeout_ms=$SMOKE_TIMEOUT_MS" >> "$GITHUB_OUTPUT"
          echo "codex_install_phase_timeout_ms=$CODEX_INSTALL_PHASE_TIMEOUT_MS" >> "$GITHUB_OUTPUT"
          echo "codex_readiness_phase_timeout_ms=$CODEX_READINESS_PHASE_TIMEOUT_MS" >> "$GITHUB_OUTPUT"

      - name: Restore Codex install asset cache
        if: ${{ needs.validate-vm-inputs.outputs.diagnostic_scope != 'bootstrap_only' }}
        id: codex_install_asset_cache
        uses: actions/cache/restore@v5
        with:
          path: |
            artifacts/opl-first-run-vm/codex-npm-cache
            artifacts/opl-first-run-vm/codex-package-tarballs
          key: opl-first-run-codex-install-assets-${{ runner.os }}-${{ runner.arch }}-latest
          restore-keys: |
            opl-first-run-codex-install-assets-${{ runner.os }}-${{ runner.arch }}-

      - name: Download release DMG artifact
        if: ${{ inputs.release_artifact_name != '' }}
        id: release_artifact_download
        uses: actions/download-artifact@v8
        timeout-minutes: 10
        continue-on-error: true
        with:
          name: ${{ inputs.release_artifact_name }}
          run-id: ${{ inputs.release_artifact_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: artifacts/release

      - name: Resolve release DMG
        id: dmg
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/release
          artifact_download_outcome="${{ steps.release_artifact_download.outcome }}"
          if [ -n "${{ inputs.release_artifact_name }}" ] && [ "$artifact_download_outcome" != "success" ]; then
            echo "::warning::Workflow artifact download outcome was ${artifact_download_outcome:-unavailable}; removing partial artifact files and falling back to the GitHub Release asset."
            find artifacts/release -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          fi

          fetch_release_metadata_with_retry() {
            local repo="$1"
            local release_ref="$2"
            local output_path="$3"
            local attempt
            local max_attempts=8
            local delay_seconds=15
            for attempt in $(seq 1 "$max_attempts"); do
              if [ -n "$release_ref" ]; then
                if gh release view "$release_ref" --repo "$repo" --json tagName,assets > "$output_path"; then
                  return 0
                fi
              elif gh release view --repo "$repo" --json tagName,assets > "$output_path"; then
                return 0
              fi
              local status="$?"
              if [ "$attempt" -eq "$max_attempts" ]; then
                return "$status"
              fi
              echo "::warning::Release metadata fetch failed on attempt $attempt; retrying in ${delay_seconds}s."
              sleep "$delay_seconds"
              delay_seconds="$((delay_seconds * 2))"
            done
          }

          select_release_asset() {
            local metadata_path="$1"
            local download_pattern="$2"
            RELEASE_JSON="$metadata_path" DOWNLOAD_PATTERN="$download_pattern" node <<'NODE'
          const fs = require('node:fs');
          const metadata = JSON.parse(fs.readFileSync(process.env.RELEASE_JSON, 'utf8'));
          const pattern = process.env.DOWNLOAD_PATTERN;
          const regex = new RegExp(`^${pattern.split('*').map((part) => part.replace(/[|\\{}()[\]^$+?.]/g, '\\$&')).join('.*')}$`);
          const asset = (metadata.assets || []).find((candidate) => regex.test(candidate.name || ''));
          if (!asset) {
            console.error(`No release asset matched ${pattern}. Available assets: ${(metadata.assets || []).map((candidate) => candidate.name).join(', ')}`);
            process.exit(2);
          }
          const url = asset.apiUrl || asset.url || asset.browserDownloadUrl || asset.browser_download_url;
          if (!url) {
            console.error(`Release asset ${asset.name} did not include a downloadable URL.`);
            process.exit(2);
          }
          process.stdout.write([asset.name, url, asset.size || ''].join('\t'));
          NODE
          }

          download_asset_with_retry() {
            local asset_url="$1"
            local output_path="$2"
            local expected_size="${3:-}"
            local partial_path="${output_path}.part"
            local attempt
            local max_attempts=8
            local delay_seconds=15
            local status=1
            mkdir -p "$(dirname "$output_path")"
            for attempt in $(seq 1 "$max_attempts"); do
              curl_args=(-fL --retry 5 --retry-all-errors --retry-delay 10 --connect-timeout 30 --max-time 1800 --continue-at -)
              if [[ "$asset_url" == https://api.github.com/* ]]; then
                curl_args+=(-H "Accept: application/octet-stream" -H "X-GitHub-Api-Version: 2022-11-28")
                if [ -n "${GH_TOKEN:-}" ]; then
                  curl_args+=(-H "Authorization: Bearer ${GH_TOKEN}")
                fi
              fi
              if curl "${curl_args[@]}" "$asset_url" -o "$partial_path"; then
                mv "$partial_path" "$output_path"
                if [ -n "$expected_size" ]; then
                  actual_size="$(wc -c < "$output_path" | tr -d ' ')"
                  if [ "$actual_size" != "$expected_size" ]; then
                    echo "::warning::Release DMG size mismatch after attempt $attempt: expected ${expected_size}, got ${actual_size}."
                    rm -f "$output_path"
                    status=1
                  else
                    return 0
                  fi
                else
                  return 0
                fi
              else
                status="$?"
              fi
              if [ "$attempt" -eq "$max_attempts" ]; then
                return "$status"
              fi
              echo "::warning::Release DMG asset download failed on attempt $attempt; retrying in ${delay_seconds}s."
              sleep "$delay_seconds"
              delay_seconds="$((delay_seconds * 2))"
            done
          }

          download_release_with_retry() {
            local release_ref=""
            local repo="$GITHUB_REPOSITORY"
            local download_pattern=""
            local output_dir="artifacts/release"
            while [ "$#" -gt 0 ]; do
              case "$1" in
                --repo)
                  repo="$2"
                  shift 2
                  ;;
                --pattern)
                  download_pattern="$2"
                  shift 2
                  ;;
                --dir)
                  output_dir="$2"
                  shift 2
                  ;;
                *)
                  if [ -z "$release_ref" ]; then
                    release_ref="$1"
                    shift
                  else
                    echo "::error::Unexpected release download argument: $1"
                    return 2
                  fi
                  ;;
              esac
            done
            if [ -z "$download_pattern" ]; then
              echo "::error::Missing release download pattern."
              return 2
            fi
            local metadata_path="artifacts/release/release-metadata.json"
            fetch_release_metadata_with_retry "$repo" "$release_ref" "$metadata_path"
            local asset_info
            asset_info="$(select_release_asset "$metadata_path" "$download_pattern")"
            IFS=$'\t' read -r asset_name asset_url asset_size <<< "$asset_info"
            echo "Resolved release DMG asset: $asset_name"
            download_asset_with_retry "$asset_url" "$output_dir/$asset_name" "$asset_size"
          }

          if [ "${{ steps.package_profile.outputs.install_mode }}" = "homebrew-cask" ]; then
            echo "Using Homebrew cask install path: ${{ steps.package_profile.outputs.homebrew_cask }}"
          elif [ -n "${{ inputs.release_artifact_name }}" ] && find artifacts/release -type f | grep -q . && [ -n "${{ inputs.release_artifact_run_id }}" ]; then
            echo "Using source workflow run artifact: ${{ inputs.release_artifact_name }} from run ${{ inputs.release_artifact_run_id }}"
          elif [ -n "${{ inputs.release_artifact_name }}" ] && find artifacts/release -type f | grep -q .; then
            echo "Using same-run workflow artifact: ${{ inputs.release_artifact_name }}"
          elif [ -n "${{ inputs.release_dmg_url }}" ]; then
            DMG_PATH="artifacts/release/One-Person-Lab-${{ steps.package_profile.outputs.profile }}.dmg"
            download_asset_with_retry "${{ inputs.release_dmg_url }}" "$DMG_PATH"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            download_release_with_retry "${{ inputs.release_tag }}" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "${{ steps.package_profile.outputs.download_pattern }}" \
              --dir artifacts/release
          else
            download_release_with_retry \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "${{ steps.package_profile.outputs.download_pattern }}" \
              --dir artifacts/release
          fi

          if [ "${{ steps.package_profile.outputs.install_mode }}" = "homebrew-cask" ]; then
            DMG_PATH=""
          elif [ -n "${DMG_PATH:-}" ]; then
            true
          elif [ "${{ steps.package_profile.outputs.profile }}" = "standard" ]; then
            DMG_PATH="$(find artifacts/release -type f -name 'One-Person-Lab-*-mac-arm64.dmg' ! -name 'One-Person-Lab-Full-*' | sort | head -n 1)"
          else
            DMG_PATH="$(find artifacts/release -type f -name 'One-Person-Lab-Full-*-mac-arm64.dmg' | sort | head -n 1)"
          fi
          if [ "${{ steps.package_profile.outputs.install_mode }}" != "homebrew-cask" ] && [ -z "$DMG_PATH" ]; then
            echo "::error::No ${{ steps.package_profile.outputs.profile }} DMG artifact found for first-run VM smoke."
            exit 1
          fi
          echo "dmg_path=$DMG_PATH" >> "$GITHUB_OUTPUT"
          echo "Using DMG: $DMG_PATH"

      - name: Prefetch Codex package install assets
        if: ${{ needs.validate-vm-inputs.outputs.diagnostic_scope != 'bootstrap_only' }}
        id: codex_package_preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/opl-first-run-vm/codex-npm-cache
          mkdir -p artifacts/opl-first-run-vm/codex-package-tarballs

          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const { spawnSync } = require('node:child_process');

          const startedAt = new Date();
          const artifactRoot = 'artifacts/opl-first-run-vm';
          const npmCacheDir = path.join(artifactRoot, 'codex-npm-cache');
          const tarballPath = path.join(artifactRoot, 'codex-package-tarballs', 'openai-codex.tgz');
          const platformTarballPath = path.join(artifactRoot, 'codex-package-tarballs', 'openai-codex-darwin-arm64.tgz');
          const registryResponsePath = path.join(artifactRoot, 'codex-package-registry-response.json');
          const preflightPath = path.join(artifactRoot, 'codex-package-preflight.json');
          const packageName = '@openai/codex';
          const packageSpec = `${packageName}@latest`;

          function run(command, args = [], options = {}) {
            const started = new Date();
            const result = spawnSync(command, args, {
              encoding: 'utf8',
              timeout: options.timeout || 120000,
              maxBuffer: 64 * 1024 * 1024,
            });
            const ended = new Date();
            return {
              command: [command, ...args].join(' '),
              available: result.error?.code !== 'ENOENT',
              exit_code: typeof result.status === 'number' ? result.status : null,
              signal: result.signal || null,
              error: result.error ? String(result.error.message || result.error) : null,
              stdout: (result.stdout || '').trim(),
              stderr: (result.stderr || '').trim(),
              started_at: started.toISOString(),
              ended_at: ended.toISOString(),
              duration_ms: ended.getTime() - started.getTime(),
            };
          }

          function normalizeRegistryUrl(rawRegistry) {
            const registry = (rawRegistry || 'https://registry.npmjs.org/').trim();
            return registry.endsWith('/') ? registry : `${registry}/`;
          }

          function registryPackageMetadataUrl(registryUrl) {
            return new URL('@openai%2fcodex', registryUrl).toString();
          }

          function parseJson(stdout, label, failures) {
            try {
              return JSON.parse(stdout);
            } catch (error) {
              failures.push(`${label} did not return valid JSON: ${error.message}`);
              return null;
            }
          }

          function sha256File(filePath) {
            const hash = crypto.createHash('sha256');
            hash.update(fs.readFileSync(filePath));
            return hash.digest('hex');
          }

          const diagnostics = [];
          const blockingFailures = [];
          const npmRegistry = run('npm', ['config', 'get', 'registry']);
          if (npmRegistry.exit_code !== 0 || npmRegistry.error) {
            blockingFailures.push('npm config get registry failed');
          }
          const registryUrl = normalizeRegistryUrl(npmRegistry.stdout);
          const registryMetadataUrl = registryPackageMetadataUrl(registryUrl);
          const registryResponse = run('curl', [
            '-sS',
            '-L',
            '--connect-timeout',
            '30',
            '--max-time',
            '180',
            '-o',
            registryResponsePath,
            '-w',
            '%{http_code}',
            registryMetadataUrl,
          ], { timeout: 240000 });
          const registryStatusCode = Number(registryResponse.stdout);
          if (registryResponse.exit_code !== 0 || registryResponse.error) {
            diagnostics.push('registry package metadata request failed');
          }
          if (registryStatusCode !== 200) {
            diagnostics.push(`registry package metadata returned status ${registryResponse.stdout || 'unknown'}`);
          }

          const npmView = run('npm', [
            'view',
            packageSpec,
            'version',
            'dist.tarball',
            'dist.integrity',
            '--json',
          ], { timeout: 240000 });
          if (npmView.exit_code !== 0 || npmView.error) {
            blockingFailures.push('npm view @openai/codex@latest version dist.tarball failed');
          }
          const metadata = npmView.stdout ? parseJson(npmView.stdout, 'npm view @openai/codex@latest', blockingFailures) : null;
          const version = metadata?.version || null;
          const tarballUrl = metadata?.['dist.tarball'] || metadata?.dist?.tarball || null;
          const distIntegrity = metadata?.['dist.integrity'] || metadata?.dist?.integrity || null;
          const platformPackageSpec = version ? `${packageName}@${version}-darwin-arm64` : null;
          const platformPackageLabel = platformPackageSpec || '@openai/codex@<version>-darwin-arm64';
          let platformNpmView = null;
          let platformMetadata = null;
          let platformVersion = null;
          let platformTarballUrl = null;
          let platformDistIntegrity = null;
          let platformTarballUrlHost = null;
          let tarballUrlHost = null;
          if (!version) {
            blockingFailures.push('npm package metadata did not include version');
          }
          if (!tarballUrl) {
            blockingFailures.push('npm package metadata did not include dist.tarball');
          } else {
            try {
              tarballUrlHost = new URL(tarballUrl).host;
            } catch (error) {
              blockingFailures.push(`dist.tarball is not a valid URL: ${error.message}`);
            }
          }

          if (platformPackageSpec) {
            platformNpmView = run('npm', [
              'view',
              platformPackageSpec,
              'name',
              'version',
              'dist.tarball',
              'dist.integrity',
              '--json',
            ], { timeout: 240000 });
            if (platformNpmView.exit_code !== 0 || platformNpmView.error) {
              blockingFailures.push(`npm view ${platformPackageSpec} name version dist.tarball failed`);
            }
            platformMetadata = platformNpmView.stdout ? parseJson(platformNpmView.stdout, `npm view ${platformPackageSpec}`, blockingFailures) : null;
            platformVersion = platformMetadata?.version || null;
            platformTarballUrl = platformMetadata?.['dist.tarball'] || platformMetadata?.dist?.tarball || null;
            platformDistIntegrity = platformMetadata?.['dist.integrity'] || platformMetadata?.dist?.integrity || null;
            if (!platformVersion) {
              blockingFailures.push('npm platform package metadata did not include version');
            }
            if (!platformTarballUrl) {
              blockingFailures.push('npm platform package metadata did not include dist.tarball');
            } else {
              try {
                platformTarballUrlHost = new URL(platformTarballUrl).host;
              } catch (error) {
                blockingFailures.push(`platform dist.tarball is not a valid URL: ${error.message}`);
              }
            }
          }

          let tarballDownload = null;
          let tarballStatusCode = null;
          let tarballSha256 = null;
          let tarballSizeBytes = null;
          let platformTarballDownload = null;
          let platformTarballStatusCode = null;
          let platformTarballSha256 = null;
          let platformTarballSizeBytes = null;
          if (tarballUrl && tarballUrlHost) {
            const partialTarballPath = `${tarballPath}.part`;
            fs.rmSync(partialTarballPath, { force: true });
            tarballDownload = run('curl', [
              '-sS',
              '-fL',
              '--retry',
              '5',
              '--retry-all-errors',
              '--retry-delay',
              '10',
              '--connect-timeout',
              '30',
              '--max-time',
              '900',
              '-o',
              partialTarballPath,
              '-w',
              '%{http_code}',
              tarballUrl,
            ], { timeout: 960000 });
            tarballStatusCode = Number(tarballDownload.stdout);
            if (tarballDownload.exit_code === 0 && tarballStatusCode === 200) {
              fs.renameSync(partialTarballPath, tarballPath);
              const stat = fs.statSync(tarballPath);
              tarballSizeBytes = stat.size;
              tarballSha256 = sha256File(tarballPath);
              if (tarballSizeBytes <= 0) {
                blockingFailures.push('downloaded Codex package tarball is empty');
              }
            } else {
              fs.rmSync(partialTarballPath, { force: true });
              blockingFailures.push(`Codex package tarball download failed with status ${tarballDownload.stdout || 'unknown'}`);
            }
          }
          if (platformTarballUrl && platformTarballUrlHost) {
            const partialPlatformTarballPath = `${platformTarballPath}.part`;
            fs.rmSync(partialPlatformTarballPath, { force: true });
            platformTarballDownload = run('curl', [
              '-sS',
              '-fL',
              '--retry',
              '5',
              '--retry-all-errors',
              '--retry-delay',
              '10',
              '--connect-timeout',
              '30',
              '--max-time',
              '900',
              '-o',
              partialPlatformTarballPath,
              '-w',
              '%{http_code}',
              platformTarballUrl,
            ], { timeout: 960000 });
            platformTarballStatusCode = Number(platformTarballDownload.stdout);
            if (platformTarballDownload.exit_code === 0 && platformTarballStatusCode === 200) {
              fs.renameSync(partialPlatformTarballPath, platformTarballPath);
              const stat = fs.statSync(platformTarballPath);
              platformTarballSizeBytes = stat.size;
              platformTarballSha256 = sha256File(platformTarballPath);
              if (platformTarballSizeBytes <= 0) {
                blockingFailures.push('downloaded Codex platform package tarball is empty');
              }
            } else {
              fs.rmSync(partialPlatformTarballPath, { force: true });
              blockingFailures.push(`Codex platform package tarball download failed with status ${platformTarballDownload.stdout || 'unknown'}`);
            }
          }

          let npmCacheAdd = null;
          if (fs.existsSync(tarballPath)) {
            npmCacheAdd = run('npm', [
              'cache',
              'add',
              tarballPath,
              '--cache',
              npmCacheDir,
            ], { timeout: 300000 });
            if (npmCacheAdd.exit_code !== 0 || npmCacheAdd.error) {
              blockingFailures.push('npm cache add for Codex package tarball failed');
            }
          }
          let platformNpmCacheAdd = null;
          if (fs.existsSync(platformTarballPath)) {
            platformNpmCacheAdd = run('npm', [
              'cache',
              'add',
              platformTarballPath,
              '--cache',
              npmCacheDir,
            ], { timeout: 300000 });
            if (platformNpmCacheAdd.exit_code !== 0 || platformNpmCacheAdd.error) {
              blockingFailures.push('npm cache add for Codex platform package tarball failed');
            }
          }

          const endedAt = new Date();
          const cacheKeyPrefix = process.env.CACHE_KEY_PREFIX || 'opl-first-run-codex-install-assets';
          const cacheKey = version && tarballSha256 && platformTarballSha256
            ? `${cacheKeyPrefix}-${version}-${tarballSha256.slice(0, 8)}-${platformTarballSha256.slice(0, 8)}-${process.env.GITHUB_RUN_ID || 'local'}-${process.env.GITHUB_RUN_ATTEMPT || '1'}`
            : '';
          const preflight = {
            schema_version: 1,
            owner: 'one-person-lab-app',
            purpose: 'codex_install_asset_cache_preseed',
            status: blockingFailures.length === 0 ? 'ok' : 'failed',
            generated_at: endedAt.toISOString(),
            package: {
              name: packageName,
              requested_spec: packageSpec,
              version,
              tarball_url: tarballUrl,
              tarball_url_host: tarballUrlHost,
              dist_integrity: distIntegrity,
              platform_spec: platformPackageSpec,
              platform_version: platformVersion,
              platform_tarball_url: platformTarballUrl,
              platform_tarball_url_host: platformTarballUrlHost,
              platform_dist_integrity: platformDistIntegrity,
            },
            registry: {
              npm_registry: registryUrl,
              package_metadata_url: registryMetadataUrl,
              status_code: Number.isFinite(registryStatusCode) ? registryStatusCode : null,
              response_path: 'codex-package-registry-response.json',
              npm_view: npmView,
              platform_npm_view: platformNpmView,
              metadata_request: registryResponse,
            },
            tarball: {
              path: 'codex-package-tarballs/openai-codex.tgz',
              workflow_path: tarballPath,
              url_host: tarballUrlHost,
              response_status_code: Number.isFinite(tarballStatusCode) ? tarballStatusCode : null,
              sha256: tarballSha256,
              size_bytes: tarballSizeBytes,
              download: tarballDownload,
            },
            platform_tarball: {
              path: 'codex-package-tarballs/openai-codex-darwin-arm64.tgz',
              workflow_path: platformTarballPath,
              requested_spec: platformPackageLabel,
              version: platformVersion,
              url_host: platformTarballUrlHost,
              response_status_code: Number.isFinite(platformTarballStatusCode) ? platformTarballStatusCode : null,
              sha256: platformTarballSha256,
              size_bytes: platformTarballSizeBytes,
              download: platformTarballDownload,
            },
            cache: {
              npm_cache_dir: 'codex-npm-cache',
              workflow_npm_cache_dir: npmCacheDir,
              workflow_cache_key: cacheKey,
              restore: {
                cache_hit: process.env.CODEX_CACHE_RESTORE_HIT || '',
                primary_key: process.env.CODEX_CACHE_RESTORE_PRIMARY_KEY || '',
                matched_key: process.env.CODEX_CACHE_RESTORE_MATCHED_KEY || '',
              },
              npm_cache_add: npmCacheAdd,
              platform_npm_cache_add: platformNpmCacheAdd,
            },
            timings: {
              started_at: startedAt.toISOString(),
              ended_at: endedAt.toISOString(),
              elapsed_ms: endedAt.getTime() - startedAt.getTime(),
            },
            truth_boundary: 'install_asset_cache_preseed_not_app_readiness_truth_or_owner_receipt',
            diagnostics,
            blocking_failures: blockingFailures,
            warnings: diagnostics,
            failures: blockingFailures,
          };

          fs.writeFileSync(preflightPath, `${JSON.stringify(preflight, null, 2)}\n`);
          if (process.env.GITHUB_OUTPUT) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, [
              `preflight_json=${preflightPath}`,
              `tarball_path=${tarballPath}`,
              `platform_tarball_path=${platformTarballPath}`,
              `npm_cache_dir=${npmCacheDir}`,
              `package_version=${version || ''}`,
              `cache_key=${cacheKey}`,
            ].join('\n') + '\n');
          }

          console.log(JSON.stringify({
            preflight: preflightPath,
            status: preflight.status,
            package_version: version,
            tarball_host: tarballUrlHost,
            tarball_sha256: tarballSha256,
            tarball_size_bytes: tarballSizeBytes,
            platform_package_version: platformVersion,
            platform_tarball_host: platformTarballUrlHost,
            platform_tarball_sha256: platformTarballSha256,
            platform_tarball_size_bytes: platformTarballSizeBytes,
            elapsed_ms: preflight.timings.elapsed_ms,
          }, null, 2));

          for (const diagnostic of diagnostics) {
            console.error(`Codex package install asset diagnostic warning: ${diagnostic}`);
          }

          if (blockingFailures.length > 0) {
            console.error('Codex package install asset preflight failed:');
            for (const failure of blockingFailures) {
              console.error(`- ${failure}`);
            }
            process.exit(1);
          }
          NODE
        env:
          CACHE_KEY_PREFIX: opl-first-run-codex-install-assets-${{ runner.os }}-${{ runner.arch }}
          CODEX_CACHE_RESTORE_HIT: ${{ steps.codex_install_asset_cache.outputs.cache-hit }}
          CODEX_CACHE_RESTORE_PRIMARY_KEY: ${{ steps.codex_install_asset_cache.outputs.cache-primary-key }}
          CODEX_CACHE_RESTORE_MATCHED_KEY: ${{ steps.codex_install_asset_cache.outputs.cache-matched-key }}

      - name: Save Codex install asset cache
        if: ${{ needs.validate-vm-inputs.outputs.diagnostic_scope != 'bootstrap_only' && steps.codex_package_preflight.outputs.cache_key != '' }}
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: |
            artifacts/opl-first-run-vm/codex-npm-cache
            artifacts/opl-first-run-vm/codex-package-tarballs
          key: ${{ steps.codex_package_preflight.outputs.cache_key }}

      - name: Write first-run VM preflight summary
        shell: bash
        run: |
          set -euo pipefail

          GUEST_USER="${{ inputs.guest_user }}"
          if [ -z "$GUEST_USER" ]; then
            GUEST_USER="${OPL_FIRST_RUN_GUEST_USER:-runner}"
          fi

          SSH_KEY="${{ inputs.guest_ssh_key_path }}"
          if [ -z "$SSH_KEY" ]; then
            SSH_KEY="${OPL_FIRST_RUN_GUEST_SSH_KEY:-}"
          fi

          RUNNER_LABELS="${OPL_FIRST_RUN_RUNNER_LABELS:-}"
          if [ -z "$RUNNER_LABELS" ]; then
            RUNNER_LABELS='["self-hosted","macOS","opl-gui-vm"]'
          fi

          RELEASE_SOURCE="latest GitHub Release"
          if [ -n "${{ inputs.release_artifact_name }}" ]; then
            RELEASE_SOURCE="workflow artifact ${{ inputs.release_artifact_name }} from run ${{ inputs.release_artifact_run_id || github.run_id }}"
            if [ -n "${{ inputs.release_tag }}" ]; then
              RELEASE_SOURCE="$RELEASE_SOURCE; release tag ${{ inputs.release_tag }} kept for provenance"
            fi
          elif [ -n "${{ inputs.release_dmg_url }}" ]; then
            RELEASE_SOURCE="direct DMG URL"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            RELEASE_SOURCE="GitHub Release tag ${{ inputs.release_tag }}"
          fi

          SSH_KEY_STATUS="not configured"
          if [ -n "$SSH_KEY" ]; then
            SSH_KEY_STATUS="configured on runner"
          fi

          {
            echo "## OPL GUI first-run VM preflight"
            echo
            echo "- Gate: deterministic release-blocking clean VM first launch"
            echo "- Runner labels: \`$RUNNER_LABELS\`"
            echo "- Source VM: \`${{ steps.tart_source.outputs.source_vm }}\`"
            echo "- Guest user: \`$GUEST_USER\`"
            echo "- SSH key: $SSH_KEY_STATUS"
            echo "- Release source: $RELEASE_SOURCE"
            echo "- Package profile: \`${{ steps.package_profile.outputs.profile }}\`"
            echo "- Diagnostic scope: \`${{ needs.validate-vm-inputs.outputs.diagnostic_scope }}\`"
            echo "- Install mode: \`${{ steps.package_profile.outputs.install_mode }}\`"
            echo "- Runtime profile: \`${{ steps.package_profile.outputs.runtime_profile }}\`"
            echo "- DMG artifact path: \`${{ steps.dmg.outputs.dmg_path }}\`"
            echo "- Homebrew cask: \`${{ steps.package_profile.outputs.homebrew_cask }}\`"
            echo "- Codex package version: \`${{ steps.codex_package_preflight.outputs.package_version }}\`"
            echo "- Codex package preflight: \`${{ steps.codex_package_preflight.outputs.preflight_json }}\`"
            echo "- Codex package tarball: \`${{ steps.codex_package_preflight.outputs.tarball_path }}\`"
            echo "- Codex platform package tarball: \`${{ steps.codex_package_preflight.outputs.platform_tarball_path }}\`"
            echo "- Codex npm cache dir: \`${{ steps.codex_package_preflight.outputs.npm_cache_dir }}\`"
            echo "- Smoke profile: \`no-clt-clean-vm\`"
            echo "- Display: \`1920x1080px\`"
            if [ "${{ needs.validate-vm-inputs.outputs.diagnostic_scope }}" = "bootstrap_only" ]; then
              echo "- Settings smoke: disabled for bootstrap-only diagnostics"
            else
              echo "- Settings smoke: enabled"
            fi
            echo "- Artifact output: \`artifacts/opl-first-run-vm\`"
            echo "- Tart graphics: ${{ inputs.no_graphics && 'disabled (--no-graphics)' || 'enabled' }}"
            echo "- Temporary VM retention: ${{ inputs.keep_vm && 'keep for debugging' || 'clean up after run' }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record first-run VM wrapper diagnostics
        id: wrapper_diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/opl-first-run-vm
          DIAGNOSTICS_JSON="artifacts/opl-first-run-vm/app-wrapper-diagnostics.json"
          PREFLIGHT_LOG="artifacts/opl-first-run-vm/app-wrapper-preflight.log"

          node <<'NODE' 2>&1 | tee "$PREFLIGHT_LOG"
          const fs = require('node:fs');
          const { spawnSync } = require('node:child_process');

          const diagnosticsPath = 'artifacts/opl-first-run-vm/app-wrapper-diagnostics.json';
          const startedAt = new Date();
          const diagnosticScope = process.env.DIAGNOSTIC_SCOPE || 'release_gate';

          function run(command, args = []) {
            const started = new Date();
            const result = spawnSync(command, args, {
              encoding: 'utf8',
              timeout: 120000,
            });
            const ended = new Date();
            return {
              command: [command, ...args].join(' '),
              available: result.error?.code !== 'ENOENT',
              exit_code: typeof result.status === 'number' ? result.status : null,
              signal: result.signal || null,
              error: result.error ? String(result.error.message || result.error) : null,
              stdout: (result.stdout || '').trim(),
              stderr: (result.stderr || '').trim(),
              started_at: started.toISOString(),
              ended_at: ended.toISOString(),
              duration_ms: ended.getTime() - started.getTime(),
            };
          }

          const nodeVersion = run('node', ['--version']);
          const npmVersion = run('npm', ['--version']);
          const curlVersion = run('curl', ['--version']);
          const npmRegistry = run('npm', ['config', 'get', 'registry']);
          function skippedDiagnostic(label) {
            const now = new Date().toISOString();
            return {
              command: label,
              available: false,
              exit_code: 0,
              signal: null,
              error: null,
              stdout: '',
              stderr: '',
              skipped: true,
              reason: diagnosticScope,
              started_at: now,
              ended_at: now,
              duration_ms: 0,
            };
          }
          const codexPackagePreflight = (() => {
            const artifactPath = process.env.CODEX_PACKAGE_PREFLIGHT_JSON;
            if (!artifactPath) {
              if (diagnosticScope === 'bootstrap_only') {
                return {
                  path: '',
                  available: false,
                  parsed: false,
                  exit_code: 0,
                  skipped: true,
                  reason: 'bootstrap_only',
                };
              }
              return {
                path: '',
                available: false,
                parsed: false,
                exit_code: 1,
                error: 'CODEX_PACKAGE_PREFLIGHT_JSON is not configured',
              };
            }
            try {
              const available = fs.existsSync(artifactPath);
              return {
                path: artifactPath,
                available,
                parsed: true,
                exit_code: available ? 0 : 1,
                data: JSON.parse(fs.readFileSync(artifactPath, 'utf8')),
              };
            } catch (error) {
              return {
                path: artifactPath,
                available: fs.existsSync(artifactPath),
                parsed: false,
                exit_code: 1,
                error: String(error.message || error),
              };
            }
          })();
          const codexPackageMetadata =
            diagnosticScope === 'bootstrap_only'
              ? skippedDiagnostic('npm view @openai/codex@latest')
              : run('npm', [
                  'view',
                  '@openai/codex@latest',
                  'name',
                  'version',
                  'dist-tags',
                  'dist.tarball',
                  'dist.integrity',
                  'bin',
                  'engines',
                  '--json',
                ]);

          const endedAt = new Date();
          const diagnostics = {
            schema_version: 1,
            owner: 'one-person-lab-app',
            purpose: 'first_run_vm_app_wrapper_diagnostics',
            generated_at: endedAt.toISOString(),
            workflow: {
              name: 'OPL GUI First-Run VM',
              job: 'clean-vm-first-run',
              run_id: process.env.GITHUB_RUN_ID || null,
              run_attempt: process.env.GITHUB_RUN_ATTEMPT || null,
              repository: process.env.GITHUB_REPOSITORY || null,
              ref: process.env.GITHUB_REF || null,
              sha: process.env.GITHUB_SHA || null,
            },
            release_inputs: {
              package_profile: process.env.PACKAGE_PROFILE,
              diagnostic_scope: diagnosticScope,
              install_mode: process.env.INSTALL_MODE,
              runtime_profile: process.env.RUNTIME_PROFILE,
              release_tag: process.env.RELEASE_TAG || '',
              release_dmg_url_configured: process.env.RELEASE_DMG_URL_CONFIGURED === 'true',
              release_artifact_name: process.env.RELEASE_ARTIFACT_NAME || '',
              release_artifact_run_id: process.env.RELEASE_ARTIFACT_RUN_ID || '',
              shell_ref: process.env.SHELL_REF || 'main',
            },
            vm: {
              source_vm: process.env.SOURCE_VM,
              guest_user: process.env.GUEST_USER,
              ssh_key_configured: process.env.SSH_KEY_CONFIGURED === 'true',
              runner_labels: process.env.RUNNER_LABELS,
              no_graphics: process.env.NO_GRAPHICS === 'true',
              keep_vm: process.env.KEEP_VM === 'true',
              guide_screenshots: process.env.GUIDE_SCREENSHOTS === 'true',
            },
            timeouts: {
              job_timeout_minutes: 75,
              run_timeout_ms: Number(process.env.RUN_TIMEOUT_MS),
              smoke_timeout_ms: Number(process.env.SMOKE_TIMEOUT_MS),
              codex_install_phase_timeout_ms: Number(process.env.CODEX_INSTALL_PHASE_TIMEOUT_MS),
              codex_readiness_phase_timeout_ms: Number(process.env.CODEX_READINESS_PHASE_TIMEOUT_MS),
              codex_phase_timeout_interface: 'opl_aion_shell_phase_options',
            },
            host: {
              node: nodeVersion,
              npm: npmVersion,
              curl: curlVersion,
              npm_registry: npmRegistry,
              codex_package_preflight: codexPackagePreflight,
              codex_package_metadata: codexPackageMetadata,
            },
            artifact_paths: {
              diagnostics: 'app-wrapper-diagnostics.json',
              preflight_log: 'app-wrapper-preflight.log',
              codex_package_preflight: 'codex-package-preflight.json',
              codex_package_registry_response: 'codex-package-registry-response.json',
              codex_package_tarball: 'codex-package-tarballs/openai-codex.tgz',
              codex_platform_package_tarball: 'codex-package-tarballs/openai-codex-darwin-arm64.tgz',
              codex_npm_cache_dir: 'codex-npm-cache',
              smoke_command_preview: 'app-wrapper-smoke-command-preview.txt',
              smoke_stdout: 'app-wrapper-smoke.stdout.log',
              smoke_stderr: 'app-wrapper-smoke.stderr.log',
              tart_smoke_summary: 'tart-smoke-summary.json',
            },
            phase_timings: {
              app_wrapper_preflight: {
                started_at: startedAt.toISOString(),
                ended_at: endedAt.toISOString(),
                duration_ms: endedAt.getTime() - startedAt.getTime(),
              },
            },
            codex_install: {
              current_app_scope: 'required_from_tart_smoke_summary_or_shell_companion_diagnostics',
              shell_interface_status: 'implemented_opl_aion_shell_phase_options',
              install_asset_preseed: {
                preflight_json: process.env.CODEX_PACKAGE_PREFLIGHT_JSON,
                tarball_path: process.env.CODEX_PACKAGE_TARBALL,
                platform_tarball_path: process.env.CODEX_PLATFORM_PACKAGE_TARBALL,
                npm_cache_dir: process.env.CODEX_NPM_CACHE_DIR,
                truth_boundary: 'install_asset_cache_preseed_not_app_readiness_truth_or_owner_receipt',
              },
              required_fields: ['command_preview', 'stdout', 'stderr', 'exit_code', 'phase_timings'],
            },
          };

          fs.writeFileSync(diagnosticsPath, `${JSON.stringify(diagnostics, null, 2)}\n`);
          console.log(JSON.stringify({
            diagnostics: diagnosticsPath,
            npm_registry_exit_code: npmRegistry.exit_code,
            codex_package_metadata_exit_code: codexPackageMetadata.exit_code,
          }, null, 2));

          const requiredFailures = [
            ['node --version', nodeVersion],
            ['npm --version', npmVersion],
            ['curl --version', curlVersion],
            ['npm config get registry', npmRegistry],
            ['codex-package-preflight.json', codexPackagePreflight],
            ['npm view @openai/codex@latest', codexPackageMetadata],
          ].filter(
            ([, result]) =>
              result.skipped !== true &&
              (result.exit_code !== 0 || result.error || result.parsed === false || result.available === false)
          );

          if (requiredFailures.length > 0) {
            console.error('Required first-run VM wrapper diagnostics failed:');
            for (const [label, result] of requiredFailures) {
              console.error(`- ${label}: exit=${result.exit_code} error=${result.error || ''}`);
            }
            process.exit(1);
          }
          NODE
        env:
          PACKAGE_PROFILE: ${{ steps.package_profile.outputs.profile }}
          INSTALL_MODE: ${{ steps.package_profile.outputs.install_mode }}
          RUNTIME_PROFILE: ${{ steps.package_profile.outputs.runtime_profile }}
          SOURCE_VM: ${{ steps.tart_source.outputs.source_vm }}
          GUEST_USER: ${{ inputs.guest_user || vars.OPL_FIRST_RUN_GUEST_USER || 'runner' }}
          SSH_KEY_CONFIGURED: ${{ (inputs.guest_ssh_key_path != '' || vars.OPL_FIRST_RUN_GUEST_SSH_KEY != '') && 'true' || 'false' }}
          RUNNER_LABELS: ${{ vars.OPL_FIRST_RUN_RUNNER_LABELS || '["self-hosted","macOS","opl-gui-vm"]' }}
          NO_GRAPHICS: ${{ inputs.no_graphics && 'true' || 'false' }}
          KEEP_VM: ${{ inputs.keep_vm && 'true' || 'false' }}
          GUIDE_SCREENSHOTS: ${{ inputs.guide_screenshots && 'true' || 'false' }}
          RUN_TIMEOUT_MS: ${{ steps.vm_timeouts.outputs.run_timeout_ms }}
          SMOKE_TIMEOUT_MS: ${{ steps.vm_timeouts.outputs.smoke_timeout_ms }}
          CODEX_INSTALL_PHASE_TIMEOUT_MS: ${{ steps.vm_timeouts.outputs.codex_install_phase_timeout_ms }}
          CODEX_READINESS_PHASE_TIMEOUT_MS: ${{ steps.vm_timeouts.outputs.codex_readiness_phase_timeout_ms }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_DMG_URL_CONFIGURED: ${{ inputs.release_dmg_url != '' && 'true' || 'false' }}
          RELEASE_ARTIFACT_NAME: ${{ inputs.release_artifact_name }}
          RELEASE_ARTIFACT_RUN_ID: ${{ inputs.release_artifact_run_id }}
          SHELL_REF: ${{ inputs.shell_ref || 'main' }}
          DIAGNOSTIC_SCOPE: ${{ needs.validate-vm-inputs.outputs.diagnostic_scope }}
          CODEX_PACKAGE_PREFLIGHT_JSON: ${{ steps.codex_package_preflight.outputs.preflight_json }}
          CODEX_PACKAGE_TARBALL: ${{ steps.codex_package_preflight.outputs.tarball_path }}
          CODEX_PLATFORM_PACKAGE_TARBALL: ${{ steps.codex_package_preflight.outputs.platform_tarball_path }}
          CODEX_NPM_CACHE_DIR: ${{ steps.codex_package_preflight.outputs.npm_cache_dir }}

      - name: Run clean VM first launch smoke
        id: vm_smoke
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_VM="${{ steps.tart_source.outputs.source_vm }}"

          GUEST_USER="${{ inputs.guest_user }}"
          if [ -z "$GUEST_USER" ]; then
            GUEST_USER="${OPL_FIRST_RUN_GUEST_USER:-runner}"
          fi

          SSH_KEY="${{ inputs.guest_ssh_key_path }}"
          if [ -z "$SSH_KEY" ]; then
            SSH_KEY="${OPL_FIRST_RUN_GUEST_SSH_KEY:-}"
          fi

          CMD=(
            node shells/aionui/scripts/opl-first-run-tart-smoke.mjs
            --source-vm "$SOURCE_VM"
            --guest-user "$GUEST_USER"
            --artifacts artifacts/opl-first-run-vm
            --timeout-ms "${{ steps.vm_timeouts.outputs.run_timeout_ms }}"
            --smoke-timeout-ms "${{ steps.vm_timeouts.outputs.smoke_timeout_ms }}"
            --codex-install-phase-timeout-ms "${{ steps.vm_timeouts.outputs.codex_install_phase_timeout_ms }}"
            --codex-readiness-phase-timeout-ms "${{ steps.vm_timeouts.outputs.codex_readiness_phase_timeout_ms }}"
            --smoke-profile no-clt-clean-vm
            --display 1920x1080px
            --runtime-profile "${{ steps.package_profile.outputs.runtime_profile }}"
            --guest-node-root "${{ steps.host_node.outputs.node_root }}"
          )
          if [ -n "${{ steps.framework_source.outputs.archive_path }}" ]; then
            CMD+=(--framework-source-archive "${{ steps.framework_source.outputs.archive_path }}")
            CMD+=(--framework-install-script "${{ steps.framework_source.outputs.install_script_path }}")
          fi
          if [ "${{ needs.validate-vm-inputs.outputs.diagnostic_scope }}" != "bootstrap_only" ]; then
            CMD+=(--codex-package-tarball "${{ steps.codex_package_preflight.outputs.tarball_path }}")
            CMD+=(--codex-platform-package-tarball "${{ steps.codex_package_preflight.outputs.platform_tarball_path }}")
            CMD+=(--codex-npm-cache-dir "${{ steps.codex_package_preflight.outputs.npm_cache_dir }}")
            CMD+=(--settings-smoke)
            CMD+=(--assistant-route-smoke)
            CMD+=(--codex-functional-check)
            CMD+=(--codex-ai-self-check)
          fi
          if [ "${{ steps.package_profile.outputs.install_mode }}" = "homebrew-cask" ]; then
            CMD+=(--smoke-profile homebrew-standard-cask)
            CMD+=(--install-mode homebrew-cask)
            CMD+=(--homebrew-cask "${{ steps.package_profile.outputs.homebrew_cask }}")
          else
            CMD+=(--dmg "${{ steps.dmg.outputs.dmg_path }}")
          fi
          if [ -n "$SSH_KEY" ]; then
            CMD+=(--ssh-key "$SSH_KEY")
          fi
          if [ "${{ inputs.no_graphics }}" = "true" ]; then
            CMD+=(--no-graphics)
          fi
          if [ "${{ inputs.keep_vm }}" = "true" ]; then
            CMD+=(--keep-vm)
          fi
          if [ "${{ inputs.guide_screenshots }}" = "true" ]; then
            CMD+=(--guide-screenshots)
          fi

          mkdir -p artifacts/opl-first-run-vm
          COMMAND_PREVIEW="artifacts/opl-first-run-vm/app-wrapper-smoke-command-preview.txt"
          STDOUT_LOG="artifacts/opl-first-run-vm/app-wrapper-smoke.stdout.log"
          STDERR_LOG="artifacts/opl-first-run-vm/app-wrapper-smoke.stderr.log"
          printf '%q ' "${CMD[@]}" > "$COMMAND_PREVIEW"
          printf '\n' >> "$COMMAND_PREVIEW"

          SMOKE_STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          SMOKE_STARTED_SECONDS="$(date +%s)"
          set +e
          "${CMD[@]}" > >(tee "$STDOUT_LOG") 2> >(tee "$STDERR_LOG" >&2)
          SMOKE_STATUS="$?"
          set -e
          SMOKE_ENDED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          SMOKE_ENDED_SECONDS="$(date +%s)"
          SMOKE_DURATION_MS="$(((SMOKE_ENDED_SECONDS - SMOKE_STARTED_SECONDS) * 1000))"

          DIAGNOSTICS_JSON="artifacts/opl-first-run-vm/app-wrapper-diagnostics.json"
          if [ -f "$DIAGNOSTICS_JSON" ]; then
            SMOKE_STATUS="$SMOKE_STATUS" \
            SMOKE_STARTED_AT="$SMOKE_STARTED_AT" \
            SMOKE_ENDED_AT="$SMOKE_ENDED_AT" \
            SMOKE_DURATION_MS="$SMOKE_DURATION_MS" \
            COMMAND_PREVIEW="$COMMAND_PREVIEW" \
            STDOUT_LOG="$STDOUT_LOG" \
            STDERR_LOG="$STDERR_LOG" \
            node <<'NODE'
          const fs = require('node:fs');
          const diagnosticsPath = 'artifacts/opl-first-run-vm/app-wrapper-diagnostics.json';
          const diagnostics = JSON.parse(fs.readFileSync(diagnosticsPath, 'utf8'));
          diagnostics.smoke_command = {
            command_preview_path: process.env.COMMAND_PREVIEW,
            command_preview: fs.readFileSync(process.env.COMMAND_PREVIEW, 'utf8').trim(),
            stdout_path: process.env.STDOUT_LOG,
            stderr_path: process.env.STDERR_LOG,
            exit_code: Number(process.env.SMOKE_STATUS),
          };
          diagnostics.phase_timings = {
            ...(diagnostics.phase_timings || {}),
            app_wrapper_smoke: {
              started_at: process.env.SMOKE_STARTED_AT,
              ended_at: process.env.SMOKE_ENDED_AT,
              duration_ms: Number(process.env.SMOKE_DURATION_MS),
              exit_code: Number(process.env.SMOKE_STATUS),
            },
          };
          fs.writeFileSync(diagnosticsPath, `${JSON.stringify(diagnostics, null, 2)}\n`);
          NODE
          fi

          exit "$SMOKE_STATUS"

      - name: Write first-run VM critical diagnostics
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/write-first-run-vm-critical-diagnostics.ts
        env:
          PACKAGE_PROFILE: ${{ steps.package_profile.outputs.profile || needs.validate-vm-inputs.outputs.package_profile }}
          PACKAGE_PROFILE_CONCLUSION: ${{ steps.package_profile.conclusion || 'skipped' }}
          DIAGNOSTIC_SCOPE: ${{ needs.validate-vm-inputs.outputs.diagnostic_scope }}
          INSTALL_MODE: ${{ steps.package_profile.outputs.install_mode }}
          TART_SOURCE_CONCLUSION: ${{ steps.tart_source.conclusion || 'skipped' }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_DMG_URL_CONFIGURED: ${{ inputs.release_dmg_url != '' && 'true' || 'false' }}
          RELEASE_ARTIFACT_NAME: ${{ inputs.release_artifact_name }}
          RELEASE_ARTIFACT_RUN_ID: ${{ inputs.release_artifact_run_id }}
          RELEASE_ARTIFACT_EFFECTIVE_RUN_ID: ${{ inputs.release_artifact_run_id || github.run_id }}
          RELEASE_ARTIFACT_DOWNLOAD_OUTCOME: ${{ steps.release_artifact_download.outcome || 'skipped' }}
          DMG_CONCLUSION: ${{ steps.dmg.conclusion || 'skipped' }}
          CODEX_PACKAGE_PREFLIGHT_CONCLUSION: ${{ steps.codex_package_preflight.conclusion || 'skipped' }}
          VM_SMOKE_CONCLUSION: ${{ steps.vm_smoke.conclusion || 'skipped' }}

      - name: Upload first-run VM critical diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: opl-first-run-vm-critical-diagnostics-${{ steps.package_profile.outputs.profile || needs.validate-vm-inputs.outputs.package_profile }}-${{ github.run_id }}
          path: artifacts/opl-first-run-vm-critical-diagnostics
          if-no-files-found: error
          retention-days: 7

      - name: Prune VM preseed inputs before evidence upload
        if: ${{ always() }}
        shell: bash
        run: |
          rm -rf \
            artifacts/opl-first-run-vm/codex-npm-cache \
            artifacts/opl-first-run-vm/codex-package-tarballs \
            artifacts/opl-first-run-vm/framework-source

      - name: Upload first-run VM artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: opl-first-run-vm-${{ steps.package_profile.outputs.profile || needs.validate-vm-inputs.outputs.package_profile }}-${{ github.run_id }}
          path: artifacts/opl-first-run-vm
          if-no-files-found: warn

      - name: Clean stale first-run Tart VMs
        if: always() && inputs.keep_vm != true
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v tart >/dev/null 2>&1; then
            exit 0
          fi
          while IFS= read -r vm_name; do
            if [[ "$vm_name" == opl-first-run-20* ]]; then
              echo "Cleaning stale first-run VM: $vm_name"
              tart stop "$vm_name" || true
              tart delete "$vm_name" || true
            fi
          done < <(tart list --source local --quiet)

      - name: Summarize
        if: always()
        shell: bash
        run: |
          {
            echo "## OPL GUI first-run VM"
            echo
            echo "- Package profile: ${{ steps.package_profile.outputs.profile }}"
            echo "- Diagnostic scope: ${{ needs.validate-vm-inputs.outputs.diagnostic_scope }}"
            echo "- Install mode: ${{ steps.package_profile.outputs.install_mode }}"
            echo "- Runtime profile: ${{ steps.package_profile.outputs.runtime_profile }}"
            echo "- Tart source VM: ${{ steps.tart_source.outputs.source_vm }}"
            echo "- DMG: ${{ steps.dmg.outputs.dmg_path }}"
            echo "- Homebrew cask: ${{ steps.package_profile.outputs.homebrew_cask }}"
            echo "- Artifacts: artifacts/opl-first-run-vm"
            echo "- Job timeout: 75 minutes"
            echo "- Run timeout: ${{ steps.vm_timeouts.outputs.run_timeout_ms }} ms"
            echo "- Smoke timeout: ${{ steps.vm_timeouts.outputs.smoke_timeout_ms }} ms"
            echo "- Codex install phase timeout: ${{ steps.vm_timeouts.outputs.codex_install_phase_timeout_ms }} ms"
            echo "- Codex readiness phase timeout: ${{ steps.vm_timeouts.outputs.codex_readiness_phase_timeout_ms }} ms"
            echo "- Codex package preflight: ${{ steps.codex_package_preflight.outputs.preflight_json }}"
            echo "- Codex package tarball: ${{ steps.codex_package_preflight.outputs.tarball_path }}"
            echo "- Codex platform package tarball: ${{ steps.codex_package_preflight.outputs.platform_tarball_path }}"
            echo "- Codex npm cache dir: ${{ steps.codex_package_preflight.outputs.npm_cache_dir }}"
            echo "- Wrapper diagnostics: artifacts/opl-first-run-vm/app-wrapper-diagnostics.json"
            echo "- Wrapper smoke logs: artifacts/opl-first-run-vm/app-wrapper-smoke.stdout.log, artifacts/opl-first-run-vm/app-wrapper-smoke.stderr.log"
            if [ -d artifacts/opl-first-run-vm/artifacts/guide-screenshots ]; then
              echo "- Guide screenshots: artifacts/opl-first-run-vm/artifacts/guide-screenshots"
            fi
            if [ -f artifacts/opl-first-run-vm/tart-smoke-summary.json ]; then
              echo
              echo '```json'
              cat artifacts/opl-first-run-vm/tart-smoke-summary.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
