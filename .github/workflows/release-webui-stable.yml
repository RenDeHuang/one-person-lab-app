name: Promote WebUI Stable

on:
  workflow_call:
    inputs:
      mode:
        description: execute or canary validation-only startup
        required: false
        default: execute
        type: string
      stable_authority_run_id:
        description: Exact successful Stable run that activated Desktop Latest.
        required: true
        type: string
      carrier_artifact_name:
        description: Exact carrier artifact produced by the follower run.
        required: true
        type: string

permissions:
  actions: read
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ inputs.mode == 'execute' && 'opl-webui-stable-promotion-global' || format('opl-webui-stable-canary-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  startup-canary:
    if: ${{ inputs.mode == 'canary' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prove WebUI Stable follower starts without promotion
        shell: bash
        run: |
          set -euo pipefail
          test '${{ inputs.mode }}' = canary
          test '${{ inputs.stable_authority_run_id }}' = 424242
          test '${{ inputs.carrier_artifact_name }}' = canary

  admission:
    if: ${{ inputs.mode == 'execute' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      admission_artifact: ${{ steps.admission.outputs.admission_artifact }}
    steps:
      - name: Checkout canonical App promotion authority
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}

      - name: Reject noncanonical or partial promotion runs
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_AUTHORITY_RUN_ID: ${{ inputs.stable_authority_run_id }}
          TRIGGERED_BY_STABLE_RUN_ID: ${{ github.event.workflow_run.id }}
          CARRIER_FOLLOWER_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF" = refs/heads/main
          test "$STABLE_AUTHORITY_RUN_ID" = "$TRIGGERED_BY_STABLE_RUN_ID"
          [[ "$STABLE_AUTHORITY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CARRIER_FOLLOWER_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          canonical_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          test "$canonical_sha" = "$GITHUB_SHA"
          mkdir -p evidence
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STABLE_AUTHORITY_RUN_ID" \
            > evidence/stable-authority-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CARRIER_FOLLOWER_RUN_ID" \
            > evidence/carrier-follower-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CARRIER_FOLLOWER_RUN_ID/jobs?filter=latest&per_page=100" \
            > evidence/carrier-follower-jobs.json
          jq -e --arg run "$STABLE_AUTHORITY_RUN_ID" '
            (.id | tostring) == $run
            and .repository.full_name == "gaofeng21cn/one-person-lab-app"
            and .head_repository.full_name == "gaofeng21cn/one-person-lab-app"
            and .path == ".github/workflows/release-stable.yml"
            and .event == "workflow_dispatch"
            and .head_branch == "main"
            and .run_attempt == 1
            and .status == "completed"
            and .conclusion == "success"
            and (.head_sha | test("^[0-9a-f]{40}$"))
          ' evidence/stable-authority-run.json >/dev/null
          jq -e --arg run "$CARRIER_FOLLOWER_RUN_ID" --arg head "$GITHUB_SHA" '
            (.id | tostring) == $run
            and .repository.full_name == "gaofeng21cn/one-person-lab-app"
            and .head_repository.full_name == "gaofeng21cn/one-person-lab-app"
            and .path == ".github/workflows/release-webui-follower.yml"
            and .event == "workflow_run"
            and .head_branch == "main"
            and .run_attempt == 1
            and (.status == "in_progress" or .status == "completed")
            and .head_sha == $head
          ' evidence/carrier-follower-run.json >/dev/null
          jq -e --arg run "$CARRIER_FOLLOWER_RUN_ID" --arg head "$GITHUB_SHA" '
            [
              .jobs[]
              | select(
                  .name == "webui-carrier / publish-immutable-carrier"
                  and (.run_id | tostring) == $run
                  and .status == "completed"
                  and .conclusion == "success"
                  and .run_attempt == 1
                  and .head_sha == $head
                )
            ]
            | select(length == 1)
            | .[0]
          ' evidence/carrier-follower-jobs.json > evidence/carrier-follower-job.json

      - name: Download exact App WebUI carrier artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.carrier_artifact_name }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          path: intake/app-carrier

      - name: Materialize exactly one carrier receipt from the exact follower run
        env:
          CARRIER_FOLLOWER_RUN_ID: ${{ github.run_id }}
          CARRIER_ARTIFACT_NAME: ${{ inputs.carrier_artifact_name }}
        shell: bash
        run: |
          set -euo pipefail
          unique_regular_file() {
            local root="$1" name="$2" output="$3"
            local matches=()
            while IFS= read -r match; do matches+=("$match"); done < <(
              find "$root" -type f -name "$name" -print | LC_ALL=C sort
            )
            test "${#matches[@]}" -eq 1 || {
              echo "::error::$root must contain exactly one $name; found ${#matches[@]}."
              exit 1
            }
            test ! -L "${matches[0]}"
            cp "${matches[0]}" "$output"
            cmp "${matches[0]}" "$output"
            printf '%s\n' "${matches[0]}"
          }
          carrier_source="$(unique_regular_file intake/app-carrier carrier-receipt.json evidence/carrier-receipt.json)"
          version="$(jq -er '.release.version | select(test("^[0-9]{2}\\.[0-9]{1,2}\\.[0-9]{1,2}(-r[1-9][0-9]*)?$"))' \
            evidence/carrier-receipt.json)"
          carrier_artifact="$(basename "$(dirname "$carrier_source")")"
          test "$carrier_artifact" = "$CARRIER_ARTIFACT_NAME"
          test "$carrier_artifact" = "webui-carrier-${version}-${CARRIER_FOLLOWER_RUN_ID}-1"
          jq -n \
            --arg stable_authority_run_id '${{ inputs.stable_authority_run_id }}' \
            --arg carrier_follower_run_id "$CARRIER_FOLLOWER_RUN_ID" \
            --arg app_carrier_artifact "$carrier_artifact" \
            '{
              schema:"opl_app_webui_stable_artifact_intake.v3",
              stable_authority_run_id:$stable_authority_run_id,
              carrier_follower_run_id:$carrier_follower_run_id,
              app_carrier_artifact:$app_carrier_artifact
            }' > evidence/artifact-intake.json

      - name: Setup ORAS for anonymous descriptor admission
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6

      - name: Read immutable, version, and Stable authority
        shell: bash
        run: |
          set -euo pipefail
          observe_descriptor() {
            local ref="$1" output="$2"
            local repository="${ref%@*}" descriptor='' error='' status=unknown observed=null
            if [ "$repository" = "$ref" ]; then repository="${ref%:*}"; fi
            if descriptor="$(oras manifest fetch --descriptor "$ref" 2>"${output}.stderr")"; then
              observed="$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' <<<"$descriptor")" || observed=null
              if [ "$observed" != null ]; then status=present; fi
            else
              error="$(tr '\n' ' ' < "${output}.stderr")"
              if grep -Eqi 'manifest unknown|name unknown|not found|404' <<<"$error"; then
                status=absent
                if [[ "$ref" == *:stable ]]; then
                  if ! oras repo tags "$repository" > "${output}.tags" 2>"${output}.tags.stderr"; then
                    status=unknown
                  elif grep -Fx stable "${output}.tags" >/dev/null; then
                    status=unknown
                  fi
                fi
              fi
            fi
            jq -n --arg ref "$ref" --arg status "$status" --argjson digest "$(
              if [ "$observed" = null ]; then printf null; else jq -Rn --arg value "$observed" '$value'; fi
            )" '{schema:"opl_app_webui_descriptor_readback.v1",ref:$ref,status:$status,digest:$digest}' > "$output"
          }
          image_ref="$(jq -er '.carrier.ref | select(test("^ghcr.io/gaofeng21cn/one-person-lab-webui@sha256:[0-9a-f]{64}$"))' \
            evidence/carrier-receipt.json)"
          version="$(jq -er .release.version evidence/carrier-receipt.json)"
          observe_descriptor "$image_ref" evidence/immutable-readback.json
          observe_descriptor "ghcr.io/gaofeng21cn/one-person-lab-webui:${version}" \
            evidence/version-readback.json
          observe_descriptor ghcr.io/gaofeng21cn/one-person-lab-webui:stable \
            evidence/stable-prestate.json

      - name: Seal one immutable WebUI Stable admission
        id: admission
        env:
          STABLE_AUTHORITY_RUN_ID: ${{ inputs.stable_authority_run_id }}
          TRIGGERED_BY_STABLE_RUN_ID: ${{ github.event.workflow_run.id }}
          CARRIER_FOLLOWER_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/webui-stable-promotion.ts admit \
            --stable-authority-run evidence/stable-authority-run.json \
            --stable-authority-run-id "$STABLE_AUTHORITY_RUN_ID" \
            --triggered-by-stable-run-id "$TRIGGERED_BY_STABLE_RUN_ID" \
            --carrier-follower-run evidence/carrier-follower-run.json \
            --carrier-follower-run-id "$CARRIER_FOLLOWER_RUN_ID" \
            --carrier-follower-job evidence/carrier-follower-job.json \
            --promotion-app-sha "$GITHUB_SHA" \
            --carrier-receipt evidence/carrier-receipt.json \
            --immutable-readback evidence/immutable-readback.json \
            --version-readback evidence/version-readback.json \
            --stable-prestate evidence/stable-prestate.json \
            --output evidence/admission.json > evidence/admission-summary.json
          admission_artifact="opl-webui-stable-admission-${GITHUB_RUN_ID}"
          echo "admission_artifact=$admission_artifact" >> "$GITHUB_OUTPUT"

      - name: Upload immutable WebUI Stable admission
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.admission.outputs.admission_artifact }}
          path: evidence
          if-no-files-found: error
          retention-days: 90

  promote-webui-stable:
    if: ${{ inputs.mode == 'execute' }}
    needs: admission
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-stable
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - name: Checkout exact admitted App authority
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}

      - name: Reject partial rerun before GHCR mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF" = refs/heads/main

      - name: Download exact same-run admission
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.admission.outputs.admission_artifact }}
          path: evidence

      - name: Setup ORAS for one bounded CAS
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6

      - name: Re-read Stable prestate and derive CAS decision
        id: decision
        shell: bash
        run: |
          set -euo pipefail
          admission_files=()
          while IFS= read -r file; do admission_files+=("$file"); done < <(
            find evidence -type f -name admission.json -print | LC_ALL=C sort
          )
          test "${#admission_files[@]}" -eq 1
          admission="${admission_files[0]}"
          stable_ref="$(jq -er .target.stable_ref "$admission")"
          repository="${stable_ref%:*}"
          status=unknown
          observed=null
          if descriptor="$(oras manifest fetch --descriptor "$stable_ref" 2> current-stable.stderr)"; then
            observed="$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' <<<"$descriptor")" || observed=null
            if [ "$observed" != null ]; then status=present; fi
          elif grep -Eqi 'manifest unknown|name unknown|not found|404' current-stable.stderr; then
            if oras repo tags "$repository" > current-stable.tags 2> current-stable.tags.stderr \
              && ! grep -Fx stable current-stable.tags >/dev/null; then
              status=absent
            fi
          fi
          jq -n --arg ref "$stable_ref" --arg status "$status" --argjson digest "$(
            if [ "$observed" = null ]; then printf null; else jq -Rn --arg value "$observed" '$value'; fi
          )" '{schema:"opl_app_webui_descriptor_readback.v1",ref:$ref,status:$status,digest:$digest}' \
            > current-stable.json
          node --experimental-strip-types scripts/webui-stable-promotion.ts decide \
            --admission "$admission" --current current-stable.json --output decision.json \
            > decision-summary.json
          echo "decision=$(jq -er .decision decision.json)" >> "$GITHUB_OUTPUT"

      - name: Execute at most one WebUI Stable tag mutation and reconcile read-only
        env:
          GHCR_TOKEN: ${{ github.token }}
          CAS_DECISION: ${{ steps.decision.outputs.decision }}
        shell: bash
        run: |
          set -euo pipefail
          admission="$(find evidence -type f -name admission.json -print)"
          stable_ref="$(jq -er .target.stable_ref "$admission")"
          repository="$(jq -er .target.repository "$admission")"
          target_digest="$(jq -er .target.digest "$admission")"
          target_ref="${repository}@${target_digest}"
          mkdir -p terminal/readbacks
          jq -n '{
            schema:"opl_app_webui_stable_mutation_attempt.v1",
            status:"not_attempted",
            attempt_count:0,
            attempt_id:null,
            exit_code:null,
            stdout_sha256:null,
            stderr_sha256:null
          }' > terminal/mutation.json
          login_performed=false
          logout_before_readback=true
          if [ "$CAS_DECISION" = write_once ]; then
            if printf '%s' "$GHCR_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin; then
              login_performed=true
              set +e
              oras tag "$target_ref" stable > terminal/tag.stdout 2> terminal/tag.stderr
              tag_status=$?
              set -e
              mutation_status=accepted
              if [ "$tag_status" -ne 0 ]; then mutation_status=unknown; fi
              jq -n --arg status "$mutation_status" --arg attempt_id "gha-${GITHUB_RUN_ID}-webui-stable-tag" \
                --argjson exit_code "$tag_status" \
                --arg stdout_sha256 "sha256:$(shasum -a 256 terminal/tag.stdout | awk '{print $1}')" \
                --arg stderr_sha256 "sha256:$(shasum -a 256 terminal/tag.stderr | awk '{print $1}')" \
                '{
                  schema:"opl_app_webui_stable_mutation_attempt.v1",
                  status:$status,
                  attempt_count:1,
                  attempt_id:$attempt_id,
                  exit_code:$exit_code,
                  stdout_sha256:$stdout_sha256,
                  stderr_sha256:$stderr_sha256
                }' > terminal/mutation.json
            else
              jq -n '{
                schema:"opl_app_webui_stable_mutation_attempt.v1",
                status:"not_attempted",
                attempt_count:0,
                attempt_id:null,
                exit_code:null,
                stdout_sha256:null,
                stderr_sha256:null,
                failure:"registry_login_failed"
              }' > terminal/mutation.json
            fi
          fi
          if [ "$login_performed" = true ]; then
            if ! oras logout ghcr.io; then logout_before_readback=false; fi
          fi
          observe_stable() {
            local output="$1" status=unknown observed=null
            if descriptor="$(oras manifest fetch --descriptor "$stable_ref" 2>"${output}.stderr")"; then
              observed="$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' <<<"$descriptor")" || observed=null
              if [ "$observed" != null ]; then status=present; fi
            elif grep -Eqi 'manifest unknown|name unknown|not found|404' "${output}.stderr"; then
              if oras repo tags "$repository" > "${output}.tags" 2>"${output}.tags.stderr" \
                && ! grep -Fx stable "${output}.tags" >/dev/null; then
                status=absent
              fi
            fi
            jq -n --arg ref "$stable_ref" --arg status "$status" --argjson digest "$(
              if [ "$observed" = null ]; then printf null; else jq -Rn --arg value "$observed" '$value'; fi
            )" '{schema:"opl_app_webui_descriptor_readback.v1",ref:$ref,status:$status,digest:$digest}' > "$output"
          }
          if [ "$(jq -r .attempt_count terminal/mutation.json)" -eq 1 ]; then
            for attempt in 1 2 3; do
              readback="terminal/readbacks/${attempt}.json"
              observe_stable "$readback"
              if [ "$(jq -r .digest "$readback")" = "$target_digest" ]; then break; fi
              if [ "$attempt" -lt 3 ]; then sleep 2; fi
            done
            last_readback="$(find terminal/readbacks -type f -name '*.json' -print | LC_ALL=C sort | tail -n 1)"
            jq --argjson logout "$logout_before_readback" \
              '. + {logout_before_readback:$logout}' "$last_readback" > terminal/anonymous-readback.json
          else
            observe_stable terminal/anonymous-readback.json
            jq '. + {logout_before_readback:true}' terminal/anonymous-readback.json \
              > terminal/anonymous-readback.tmp
            mv terminal/anonymous-readback.tmp terminal/anonymous-readback.json
          fi
          jq -s '{
            schema:"opl_app_webui_stable_reconcile_readbacks.v1",
            observations:.
          }' terminal/readbacks/*.json > terminal/readbacks.json 2>/dev/null || \
            jq -n '{schema:"opl_app_webui_stable_reconcile_readbacks.v1",observations:[]}' \
              > terminal/readbacks.json

      - name: Write terminal WebUI Stable receipt
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          admission="$(find evidence -type f -name admission.json -print)"
          node --experimental-strip-types scripts/webui-stable-promotion.ts receipt \
            --admission "$admission" --decision decision.json \
            --mutation terminal/mutation.json --readbacks terminal/readbacks.json \
            --anonymous-readback terminal/anonymous-readback.json \
            --output terminal/webui-stable-promotion-receipt.json \
            > terminal/receipt-summary.json

      - name: Upload terminal WebUI Stable evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: opl-webui-stable-promotion-${{ github.run_id }}
          path: |
            current-stable.json
            decision.json
            decision-summary.json
            terminal
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce conclusive WebUI Stable terminal state
        shell: bash
        run: |
          set -euo pipefail
          status="$(jq -er .status terminal/webui-stable-promotion-receipt.json)"
          case "$status" in
            complete|idempotent|reconciled_complete) ;;
            *)
              echo "::error::WebUI Stable promotion ended $status; no second tag, rerun, redispatch, or cancel is authorized."
              exit 1
              ;;
          esac
