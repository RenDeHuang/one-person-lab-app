name: OPL Remote Release Verification

on:
  workflow_call:
    inputs:
      opl_version:
        description: OPL version to verify, for example 26.5.19
        required: true
        type: string
      opl_updater_version:
        description: Machine SemVer carried by updater metadata and the App; defaults to opl_version for legacy releases
        required: false
        default: ''
        type: string
      include_full_package:
        description: Verify Full first-install assets in addition to standard updater assets
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: opl-remote-release-verification-${{ inputs.opl_version }}-${{ inputs.include_full_package && 'full' || 'standard' }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify-remote-release:
    name: Verify remote GitHub Release assets
    runs-on: macos-latest

    steps:
      - name: Checkout App repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'

      - name: Verify remote release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPL_RELEASE_VERSION: ${{ inputs.opl_version }}
          OPL_UPDATER_VERSION: ${{ inputs.opl_updater_version }}
        run: |
          verify_args=(
            npm run verify-remote-release --
            --version "$OPL_RELEASE_VERSION"
            --updater-version "${OPL_UPDATER_VERSION:-$OPL_RELEASE_VERSION}"
            --repo "$GITHUB_REPOSITORY"
            --summary-path remote-release-verification.json
          )
          if [ "${{ inputs.include_full_package }}" = "true" ]; then
            verify_args+=(--include-full-package)
          fi
          "${verify_args[@]}"

      - name: Upload remote verification summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: remote-release-verification-${{ inputs.opl_version }}
          path: remote-release-verification.json
          if-no-files-found: error
