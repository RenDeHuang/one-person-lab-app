name: OPL Homebrew Tap Update

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Homebrew distribution channel to update
        required: true
        default: stable
        type: choice
        options:
          - stable
          - nightly
      package_kind:
        description: Package kind to write into the tap
        required: true
        default: app_standard
        type: choice
        options:
          - app_standard
          - app_full_first_install
      opl_version:
        description: OPL version, for example 26.6.4 or 26.6.4-nightly.123456789.1
        required: true
        type: string
      release_repo:
        description: GitHub Release repository that owns the downloadable assets
        required: false
        default: gaofeng21cn/one-person-lab-app
        type: string
      tap_repo:
        description: Homebrew tap repository to update
        required: false
        default: gaofeng21cn/homebrew-one-person-lab
        type: string
  workflow_call:
    inputs:
      channel:
        description: Homebrew distribution channel to update
        required: true
        type: string
      package_kind:
        description: Package kind to write into the tap
        required: true
        type: string
      opl_version:
        description: OPL version, for example 26.6.4 or 26.6.4-nightly.123456789.1
        required: true
        type: string
      release_repo:
        description: GitHub Release repository that owns the downloadable assets
        required: true
        type: string
      tap_repo:
        description: Homebrew tap repository to update
        required: true
        type: string
    secrets:
      OPL_HOMEBREW_TAP_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: opl-homebrew-tap-${{ inputs.channel }}-${{ inputs.opl_version }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-tap-direct:
    name: Plan and commit Homebrew tap update
    runs-on: ubuntu-latest

    steps:
      - name: Check Homebrew tap token
        id: tap-token
        shell: bash
        env:
          OPL_HOMEBREW_TAP_TOKEN: ${{ secrets.OPL_HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$OPL_HOMEBREW_TAP_TOKEN" ]; then
            echo "::error::OPL_HOMEBREW_TAP_TOKEN is required for Homebrew tap direct commits."
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Checkout App repo
        if: ${{ steps.tap-token.outputs.available == 'true' }}
        uses: actions/checkout@v6

      - name: Checkout Homebrew tap repo
        if: ${{ steps.tap-token.outputs.available == 'true' }}
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.tap_repo }}
          path: homebrew-tap
          ref: main
          token: ${{ secrets.OPL_HOMEBREW_TAP_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        if: ${{ steps.tap-token.outputs.available == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Resolve GitHub Release asset inputs
        if: ${{ steps.tap-token.outputs.available == 'true' }}
        id: release-assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OPL_HOMEBREW_CHANNEL: ${{ inputs.channel }}
          OPL_HOMEBREW_PACKAGE_KIND: ${{ inputs.package_kind }}
          OPL_RELEASE_REPO: ${{ inputs.release_repo }}
          OPL_RELEASE_VERSION: ${{ inputs.opl_version }}
        run: |
          set -euo pipefail
          if [ "$OPL_RELEASE_REPO" != "gaofeng21cn/one-person-lab-app" ]; then
            echo "::error::Homebrew tap updates must read assets from gaofeng21cn/one-person-lab-app"
            exit 1
          fi

          tag="v${OPL_RELEASE_VERSION}"
          release_json="$RUNNER_TEMP/homebrew-release-assets.json"
          gh release view "$tag" \
            --repo "$OPL_RELEASE_REPO" \
            --json tagName,isDraft,isPrerelease,assets \
            > "$release_json"

          RELEASE_JSON="$release_json" node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const release = JSON.parse(fs.readFileSync(process.env.RELEASE_JSON, 'utf8'));
          const version = process.env.OPL_RELEASE_VERSION;
          const channel = process.env.OPL_HOMEBREW_CHANNEL;
          const packageKind = process.env.OPL_HOMEBREW_PACKAGE_KIND;
          const repo = process.env.OPL_RELEASE_REPO;
          const assets = Array.isArray(release.assets) ? release.assets : [];

          function fail(message) {
            console.error(message);
            process.exit(1);
          }

          function assetByName(name) {
            const asset = assets.find((candidate) => candidate?.name === name);
            if (!asset) fail(`Missing GitHub Release asset: ${name}`);
            return asset;
          }

          function digestOf(asset) {
            const digest = String(asset.digest || '').trim();
            const match = digest.match(/^sha256:(?<hash>[a-f0-9]{64})$/i);
            if (!match?.groups?.hash) fail(`GitHub Release asset ${asset.name} must expose a sha256 digest.`);
            return match.groups.hash.toLowerCase();
          }

          function urlOf(asset) {
            const releaseUrl = `https://github.com/${repo}/releases/download/v${version}/${encodeURIComponent(asset.name)}`;
            const url = asset.browserDownloadUrl || asset.browser_download_url
              || (String(asset.url || '').startsWith(`https://github.com/${repo}/releases/download/v${version}/`) ? asset.url : releaseUrl);
            if (!String(url).startsWith(`https://github.com/${repo}/releases/download/v${version}/`)) {
              fail(`GitHub Release asset ${asset.name} resolved outside the App release download namespace.`);
            }
            return url;
          }

          const stableVersionPattern = /^[0-9]{2}\.(?:[1-9]|1[0-2])\.(?:[1-9]|[12][0-9]|3[01])$/;
          const nightlyVersionPattern = /^[0-9]{2}\.(?:[1-9]|1[0-2])\.(?:[1-9]|[12][0-9]|3[01])-nightly\.[1-9][0-9]*\.[1-9][0-9]*$/;
          if (channel === 'stable' && !stableVersionPattern.test(version)) {
            fail('Stable Homebrew tap updates must use YY.M.D without leading zeroes.');
          }
          if (channel === 'nightly' && !nightlyVersionPattern.test(version)) {
            fail('Nightly Homebrew tap updates must use YY.M.D-nightly.<run_id>.<run_attempt>.');
          }
          if (channel === 'stable' && release.isPrerelease) {
            fail('Stable Homebrew tap updates must read a non-prerelease GitHub Release.');
          }
          if (channel === 'nightly' && !release.isPrerelease) {
            fail('Nightly Homebrew tap updates must read a prerelease GitHub Release.');
          }
          if (release.isDraft) {
            fail('Homebrew tap updates must not read draft GitHub Releases.');
          }
          if (packageKind !== 'app_standard' && packageKind !== 'app_full_first_install') {
            fail('Homebrew tap updates support app_standard and app_full_first_install only; OPL Packages are Framework-managed.');
          }
          if (packageKind === 'app_full_first_install' && channel !== 'stable') {
            fail('Full first-install Homebrew cask updates must stay on the stable channel.');
          }

          const downloadAsset = packageKind === 'app_full_first_install'
            ? assetByName(`One-Person-Lab-Full-${version}-mac-arm64.dmg`)
            : assetByName(`One-Person-Lab-${version}-mac-arm64.dmg`);
          const manifestAsset = packageKind === 'app_full_first_install'
            ? assetByName('opl-release-manifest.json')
            : assetByName('latest-arm64-mac.yml');
          if (packageKind === 'app_standard') {
            assetByName('standard-local-authorization-policy.json');
          }

          const output = {
            download_url: urlOf(downloadAsset),
            manifest_url: urlOf(manifestAsset),
            checksum_sha256: digestOf(downloadAsset),
          };
          for (const [key, value] of Object.entries(output)) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`);
          }
          NODE

      - name: Write Homebrew tap files
        if: ${{ steps.tap-token.outputs.available == 'true' }}
        id: tap-plan
        shell: bash
        env:
          OPL_HOMEBREW_CHANNEL: ${{ inputs.channel }}
          OPL_HOMEBREW_PACKAGE_KIND: ${{ inputs.package_kind }}
          OPL_RELEASE_VERSION: ${{ inputs.opl_version }}
          OPL_DOWNLOAD_URL: ${{ steps.release-assets.outputs.download_url }}
          OPL_MANIFEST_URL: ${{ steps.release-assets.outputs.manifest_url }}
          OPL_CHECKSUM_SHA256: ${{ steps.release-assets.outputs.checksum_sha256 }}
        run: |
          set -euo pipefail
          if [ "$OPL_HOMEBREW_PACKAGE_KIND" != "app_standard" ] && [ "$OPL_HOMEBREW_PACKAGE_KIND" != "app_full_first_install" ]; then
            echo "::error::Homebrew tap updates are App cask-only; OPL Packages are Framework-managed."
            exit 1
          fi
          target=()
          if [ "$OPL_HOMEBREW_PACKAGE_KIND" = "app_full_first_install" ]; then
            if [ "$OPL_HOMEBREW_CHANNEL" != "stable" ]; then
              echo "::error::Full first-install Homebrew cask updates must stay on the stable channel."
              exit 1
            fi
            target=(--cask Casks/one-person-lab-full.rb)
          elif [ "$OPL_HOMEBREW_CHANNEL" = "nightly" ]; then
            target=(--cask Casks/one-person-lab-nightly.rb)
          else
            target=(--cask Casks/one-person-lab.rb)
          fi

          node --experimental-strip-types scripts/update-homebrew-tap.ts \
            --channel "$OPL_HOMEBREW_CHANNEL" \
            --package-kind "$OPL_HOMEBREW_PACKAGE_KIND" \
            --version "$OPL_RELEASE_VERSION" \
            --tap-root homebrew-tap \
            "${target[@]}" \
            --manifest-url "$OPL_MANIFEST_URL" \
            --checksum-sha256 "$OPL_CHECKSUM_SHA256" \
            --download-url "$OPL_DOWNLOAD_URL" \
            --summary-path "$RUNNER_TEMP/homebrew-tap-plan.json" \
            --remote-write-mode "direct_commit" \
            --write

          node --experimental-strip-types scripts/update-homebrew-tap.ts --self-check
          if git -C homebrew-tap diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Homebrew tap plan
        if: ${{ steps.tap-token.outputs.available == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: homebrew-tap-plan-${{ inputs.channel }}-${{ inputs.package_kind }}-${{ inputs.opl_version }}
          path: ${{ runner.temp }}/homebrew-tap-plan.json
          if-no-files-found: error

      - name: Commit Homebrew tap update directly
        if: ${{ steps.tap-token.outputs.available == 'true' && steps.tap-plan.outputs.changed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git -C homebrew-tap config user.name "github-actions[bot]"
          git -C homebrew-tap config user.email "github-actions[bot]@users.noreply.github.com"
          git -C homebrew-tap add Casks/one-person-lab.rb Casks/one-person-lab-nightly.rb Casks/one-person-lab-full.rb
          git -C homebrew-tap commit -m "Update OPL Homebrew tap for ${{ inputs.opl_version }} ${{ inputs.package_kind }}"
          for attempt in 1 2 3; do
            if git -C homebrew-tap push origin HEAD:main; then
              echo "Pushed Homebrew tap update on attempt ${attempt}."
              exit 0
            fi
            echo "Homebrew tap push failed on attempt ${attempt}; fetching and rebasing before retry."
            git -C homebrew-tap fetch origin main
            git -C homebrew-tap rebase origin/main
            sleep $((attempt * 5))
          done
          echo "::error::Homebrew tap direct commit push failed after rebase retries."
          exit 1

      - name: Summarize unchanged direct Homebrew tap update
        if: ${{ steps.tap-token.outputs.available == 'true' && steps.tap-plan.outputs.changed == 'false' }}
        shell: bash
        run: |
          echo "Homebrew tap already matches ${{ inputs.opl_version }} ${{ inputs.package_kind }}."
