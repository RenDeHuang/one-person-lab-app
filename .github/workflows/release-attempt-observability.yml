name: OPL Stable Attempt Observability
run-name: Observe Stable run ${{ github.event.workflow_run.id }}

on:
  workflow_run:
    workflows:
      - OPL Stable Release Bundle
    types:
      - completed

permissions:
  contents: read
  actions: read

concurrency:
  group: opl-stable-attempt-observation-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout observer bytes from the completed Stable head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Read the exact completed run and all jobs
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          [[ "$STABLE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STABLE_RUN_ID" > stable-run.json
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs/$STABLE_RUN_ID/jobs?per_page=100" \
            | jq '{jobs: [.[].jobs[]]}' > stable-jobs.json

      - name: Write one non-authoritative first-terminal observation
        run: |
          node --experimental-strip-types scripts/release-attempt-observability.ts \
            --run stable-run.json --jobs stable-jobs.json \
            --output release-attempt-observation.json

      - name: Upload append-only per-run observation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opl-release-attempt-observation-${{ github.event.workflow_run.id }}
          path: release-attempt-observation.json
          if-no-files-found: error
          retention-days: 90
