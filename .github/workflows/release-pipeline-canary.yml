name: Release Pipeline Canary

on:
  pull_request:
    paths:
      - '.github/workflows/release-pipeline-canary.yml'
      - '.github/workflows/desktop-release*.yml'
      - '.github/workflows/full-first-install-release.yml'
      - 'contracts/app-release-bundle.schema.json'
      - 'contracts/app-release-channel.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/artifact-qualification-receipt.ts'
      - 'scripts/build-artifact-cohort.ts'
      - 'scripts/release-bundle.ts'
      - 'scripts/release-version.ts'
      - 'scripts/validate-release-boundary/**'
      - 'tests/release/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-pipeline-canary.yml'
      - '.github/workflows/desktop-release*.yml'
      - '.github/workflows/full-first-install-release.yml'
      - 'contracts/app-release-bundle.schema.json'
      - 'contracts/app-release-channel.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/artifact-qualification-receipt.ts'
      - 'scripts/build-artifact-cohort.ts'
      - 'scripts/release-bundle.ts'
      - 'scripts/release-version.ts'
      - 'scripts/validate-release-boundary/**'
      - 'tests/release/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-pipeline-canary-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-bundle:
    name: Release Bundle contract and boundary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout App repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm

      - name: Setup active shell source
        uses: ./.github/actions/setup-active-shell-deps
        with:
          shell-ref: main
          install-dependencies: 'false'

      - name: Install validation dependencies
        run: npm ci --ignore-scripts

      - name: Type check App control entrypoints
        run: npm run typecheck

      - name: Test immutable Release Bundle
        run: npm run test:release-bundle

      - name: Validate release boundary
        run: npm run validate:release-boundary

  workflow-lint:
    name: GitHub Actions workflow lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout App repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.4'
          cache: false

      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/actionlint-bin"
          GOBIN="$RUNNER_TEMP/actionlint-bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$RUNNER_TEMP/actionlint-bin" >> "$GITHUB_PATH"

      - name: Lint GitHub Actions workflows
        run: actionlint -color -shellcheck= -pyflakes=
