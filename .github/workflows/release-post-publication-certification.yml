name: OPL Stable Desktop Release Set Certification
run-name: Desktop Release Set certification for follow-up ${{ github.event.workflow_run.id }}

on:
  workflow_run:
    workflows:
      - OPL Stable Desktop Release Set Follow-up
    types:
      - completed

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: opl-desktop-release-set-certification-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  resolve-release-set:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      applicable: ${{ steps.authority.outputs.applicable }}
      reason_code: ${{ steps.authority.outputs.reason_code }}
      source_run_id: ${{ steps.authority.outputs.source_run_id }}
      full_run_id: ${{ steps.followup.outputs.full_run_id }}
      tag: ${{ steps.identity.outputs.tag }}
      app_sha: ${{ steps.identity.outputs.app_sha }}
      shell_sha: ${{ steps.identity.outputs.shell_sha }}
      framework_sha: ${{ steps.identity.outputs.framework_sha }}
      component_manifest_digest: ${{ steps.identity.outputs.component_manifest_digest }}
      installer_name: ${{ steps.identity.outputs.installer_name }}
      installer_digest: ${{ steps.identity.outputs.installer_digest }}
      standard_artifact_name: ${{ steps.identity.outputs.standard_artifact_name }}
      standard_artifact_digest: ${{ steps.identity.outputs.standard_artifact_digest }}
      linux_artifact_name: ${{ steps.identity.outputs.linux_artifact_name }}
      linux_artifact_digest: ${{ steps.identity.outputs.linux_artifact_digest }}
      full_artifact_name: ${{ steps.identity.outputs.full_artifact_name }}
      full_artifact_digest: ${{ steps.identity.outputs.full_artifact_digest }}
    steps:
      - name: Checkout exact certification source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Admit one completed Desktop Release Set follow-up
        id: authority
        env:
          GH_TOKEN: ${{ github.token }}
          FOLLOWUP_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          [[ "$FOLLOWUP_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FOLLOWUP_RUN_ID" > followup-run.json
          jq -e --arg run "$FOLLOWUP_RUN_ID" '
            (.id | tostring) == $run
            and .repository.full_name == "gaofeng21cn/one-person-lab-app"
            and .head_repository.full_name == "gaofeng21cn/one-person-lab-app"
            and .path == ".github/workflows/release-stable-post-success-followups.yml"
            and .event == "workflow_run"
            and .head_branch == "main"
            and .run_attempt == 1
            and .status == "completed"
            and .conclusion == "success"
            and (.display_title | test("^Desktop Release Set follow-up for Stable run [1-9][0-9]*$"))
          ' followup-run.json >/dev/null
          source_run_id="$(jq -er '.display_title | capture("Stable run (?<run>[1-9][0-9]*)$").run' followup-run.json)"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$source_run_id" > source-run.json
          jq -e --arg run "$source_run_id" '
            (.id | tostring) == $run
            and .repository.full_name == "gaofeng21cn/one-person-lab-app"
            and .head_repository.full_name == "gaofeng21cn/one-person-lab-app"
            and .path == ".github/workflows/release-stable.yml"
            and .event == "workflow_dispatch"
            and .head_branch == "main"
            and .run_attempt == 1
            and .status == "completed"
          ' source-run.json >/dev/null
          if [ "$(jq -er .conclusion source-run.json)" != success ]; then
            {
              echo "applicable=false"
              echo "reason_code=source_run_not_successful"
              echo "source_run_id=$source_run_id"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh run download "$source_run_id" --repo "$GITHUB_REPOSITORY" \
            --name "opl-release-operation-admission-$source_run_id" --dir source-operation-admission
          mapfile -t admissions < <(find source-operation-admission -type f -name release-operation-admission.json -print | LC_ALL=C sort)
          test "${#admissions[@]}" = 1
          operation_kind="$(jq -er '.operation | strings' "${admissions[0]}")"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs/$FOLLOWUP_RUN_ID/artifacts?per_page=100" \
            > followup-artifacts.json
          jq -e --arg name "opl-stable-release-set-followup-${source_run_id}" \
            '[.[]?.artifacts[]? | select(.name == $name and .expired == false)] | length == 1' \
            followup-artifacts.json >/dev/null
          case "$operation_kind" in
            standard|resume_standard) ;;
            append_full) reason_code=source_operation_append_full ;;
            *) reason_code=source_operation_not_desktop_release_set ;;
          esac
          if [ "$operation_kind" != standard ] && [ "$operation_kind" != resume_standard ]; then
            {
              echo "applicable=false"
              echo "reason_code=$reason_code"
              echo "source_run_id=$source_run_id"
              echo "operation_kind=$operation_kind"
              echo "followup_receipt=opl-stable-release-set-followup-${source_run_id}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for name in "opl-stable-release-set-followup-${source_run_id}" "opl-stable-desktop-append-${source_run_id}"; do
            jq -e --arg name "$name" '[.[]?.artifacts[]? | select(.name == $name and .expired == false)] | length == 1' \
              followup-artifacts.json >/dev/null
          done
          {
            echo "applicable=true"
            echo "reason_code=desktop_release_set_followup"
            echo "source_run_id=$source_run_id"
            echo "operation_kind=$operation_kind"
            echo "followup_receipt=opl-stable-release-set-followup-${source_run_id}"
            echo "desktop_receipt=opl-stable-desktop-append-${source_run_id}"
          } >> "$GITHUB_OUTPUT"

      - name: Download exact Release Set follow-up receipt
        if: ${{ steps.authority.outputs.applicable == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.authority.outputs.followup_receipt }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: followup-receipt

      - name: Download exact Desktop append receipt
        if: ${{ steps.authority.outputs.applicable == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.authority.outputs.desktop_receipt }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: desktop-receipt

      - name: Bind completed follow-up identity
        if: ${{ steps.authority.outputs.applicable == 'true' }}
        id: followup
        env:
          SOURCE_RUN_ID: ${{ steps.authority.outputs.source_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t receipts < <(find followup-receipt -type f -name stable-release-set-followup.json -print)
          test "${#receipts[@]}" = 1
          receipt="${receipts[0]}"
          jq -e --arg source "$SOURCE_RUN_ID" '
            .schema == "opl_app_stable_desktop_release_set_followup.v2"
            and .source_run_id == $source
            and .applicable == true
            and (.operation_kind == "standard" or .operation_kind == "resume_standard")
            and (.release_tag | test("^v[0-9]+\\.[0-9]+\\.[0-9]+(?:-r[1-9][0-9]*)?$"))
            and .desktop_platform_append == "success"
            and .full_append == "success"
            and (.full_run_id | test("^[1-9][0-9]*$"))
            and .remaining == []
          ' "$receipt" >/dev/null
          {
            echo "source_run_id=$SOURCE_RUN_ID"
            echo "full_run_id=$(jq -er .full_run_id "$receipt")"
            echo "tag=$(jq -er .release_tag "$receipt")"
          } >> "$GITHUB_OUTPUT"

      - name: Download exact Full append publication evidence
        if: ${{ steps.authority.outputs.applicable == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: opl-release-full-published-${{ steps.followup.outputs.full_run_id }}
          run-id: ${{ steps.followup.outputs.full_run_id }}
          github-token: ${{ github.token }}
          path: full-publication

      - name: Bind one public Desktop Release Set
        if: ${{ steps.authority.outputs.applicable == 'true' }}
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ steps.followup.outputs.source_run_id }}
          FULL_RUN_ID: ${{ steps.followup.outputs.full_run_id }}
          EXPECTED_TAG: ${{ steps.followup.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t append_receipts < <(find desktop-receipt -type f -name stable-desktop-append.json -print)
          mapfile -t full_handoffs < <(find full-publication -type f -name homebrew-full-handoff.json -print)
          test "${#append_receipts[@]}" = 1
          test "${#full_handoffs[@]}" = 1
          append_receipt="${append_receipts[0]}"
          full_handoff="${full_handoffs[0]}"
          jq -e --arg tag "$EXPECTED_TAG" '
            .schema == "opl_app_stable_desktop_asset_append.v1"
            and .status == "complete"
            and .release.tag == $tag
            and .release.draft == false
            and .release.prerelease == false
            and (.release.target_commitish | test("^[0-9a-f]{40}$"))
            and .remaining == []
            and ([.assets[].name] | length == (unique | length))
            and ([.assets[].name] | index("opl-desktop-platforms-manifest.json") != null)
          ' "$append_receipt" >/dev/null
          app_sha="$(jq -er .release.target_commitish "$append_receipt")"
          release_id="$(jq -er .release.id "$append_receipt")"
          jq -e --arg run "$FULL_RUN_ID" --arg tag "$EXPECTED_TAG" --arg app "$app_sha" '
            .schema == "opl_homebrew_full_follower_handoff.v1"
            and .status == "ready"
            and .operation == "append_full"
            and .authority.run_id == $run
            and .release.standard_tag == $tag
            and .release.target_standard.tag == $tag
            and .release.target_standard.target_commitish == $app
            and .release.target_standard.immutable == false
            and .github_full_publication.status == "complete"
            and .homebrew_modified == false
            and .latest_modified == false
          ' "$full_handoff" >/dev/null
          shell_sha="$(jq -er .build_provenance.shell_sha "$full_handoff")"
          framework_sha="$(jq -er .build_provenance.framework_sha "$full_handoff")"
          test "$(jq -er .build_provenance.app_sha "$full_handoff")" = "$app_sha"
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > public-release.json
          jq -e --argjson id "$release_id" --arg tag "$EXPECTED_TAG" --arg target "$app_sha" '
            .id == $id and .tag_name == $tag and .target_commitish == $target
            and .draft == false and .prerelease == false and .immutable == false
            and ([.assets[].name] | length == (unique | length))
          ' public-release.json >/dev/null
          release_base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${EXPECTED_TAG}"
          curl --fail --location --retry 0 "$release_base/opl-app-component-manifest.json" --output component-manifest.json
          curl --fail --location --retry 0 "$release_base/opl-desktop-platforms-manifest.json" --output desktop-manifest.json
          node --experimental-strip-types scripts/read-opl-app-component-manifest-identity.ts \
            --manifest component-manifest.json --expected-tag "$EXPECTED_TAG" \
            --release-prerelease false --expected-source-commit "$app_sha" > component-identity.json
          jq -e --arg source "$SOURCE_RUN_ID" --arg app "$app_sha" --arg shell "$shell_sha" --arg framework "$framework_sha" '
            .schema == "opl_app_desktop_release_set_manifest.v1"
            and .source.run_id == $source
            and .cohort == {app_sha:$app,shell_sha:$shell,framework_sha:$framework}
            and .platforms == ["linux-x64","windows-x64"]
            and ([.assets[].name] | length == (unique | length))
          ' desktop-manifest.json >/dev/null
          desktop_manifest_digest="sha256:$(sha256sum desktop-manifest.json | awk '{print $1}')"
          jq -e --arg digest "$desktop_manifest_digest" '
            [.assets[] | select(.name == "opl-desktop-platforms-manifest.json" and .digest == $digest)] | length == 1
          ' public-release.json >/dev/null
          jq -e --argjson expected "$(jq .assets desktop-manifest.json)" '
            . as $release | all($expected[]; . as $asset | any($release.assets[]; .name == $asset.name and .digest == $asset.digest and .size == $asset.size))
          ' public-release.json >/dev/null
          version="${EXPECTED_TAG#v}"
          standard_name="One-Person-Lab-${version}-mac-arm64.dmg"
          linux_name="One-Person-Lab-${version}-linux-x64.deb"
          installer_name=opl-install.sh
          standard_digest="$(jq -er --arg name "$standard_name" '[.assets[] | select(.name == $name)] | select(length == 1) | .[0].digest' public-release.json)"
          linux_digest="$(jq -er --arg name "$linux_name" '[.assets[] | select(.name == $name)] | select(length == 1) | .[0].digest' public-release.json)"
          installer_digest="$(jq -er --arg name "$installer_name" '[.assets[] | select(.name == $name)] | select(length == 1) | .[0].digest' public-release.json)"
          full_name="$(jq -er .artifact.name "$full_handoff")"
          full_digest="$(jq -er .artifact.sha256 "$full_handoff")"
          jq -e --arg name "$full_name" --arg digest "$full_digest" '[.assets[] | select(.name == $name and .digest == $digest)] | length == 1' public-release.json >/dev/null
          {
            echo "tag=$EXPECTED_TAG"
            echo "app_sha=$app_sha"
            echo "shell_sha=$shell_sha"
            echo "framework_sha=$framework_sha"
            echo "component_manifest_digest=$(jq -er .component_manifest_digest component-identity.json)"
            echo "installer_name=$installer_name"
            echo "installer_digest=$installer_digest"
            echo "standard_artifact_name=$standard_name"
            echo "standard_artifact_digest=$standard_digest"
            echo "linux_artifact_name=$linux_name"
            echo "linux_artifact_digest=$linux_digest"
            echo "full_artifact_name=$full_name"
            echo "full_artifact_digest=$full_digest"
          } >> "$GITHUB_OUTPUT"

  certify-linux-x64:
    if: ${{ needs.resolve-release-set.outputs.applicable == 'true' }}
    needs: [resolve-release-set]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download and install exact same-tag Linux Desktop
        env:
          RELEASE_TAG: ${{ needs.resolve-release-set.outputs.tag }}
          ARTIFACT_NAME: ${{ needs.resolve-release-set.outputs.linux_artifact_name }}
          ARTIFACT_DIGEST: ${{ needs.resolve-release-set.outputs.linux_artifact_digest }}
          INSTALLER_NAME: ${{ needs.resolve-release-set.outputs.installer_name }}
          INSTALLER_DIGEST: ${{ needs.resolve-release-set.outputs.installer_digest }}
        shell: bash
        run: |
          set -euo pipefail
          release_base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          curl --fail --location --retry 0 "$release_base/$ARTIFACT_NAME" --output "$ARTIFACT_NAME"
          curl --fail --location --retry 0 "$release_base/$INSTALLER_NAME" --output "$INSTALLER_NAME"
          test "sha256:$(sha256sum "$ARTIFACT_NAME" | awk '{print $1}')" = "$ARTIFACT_DIGEST"
          test "sha256:$(sha256sum "$INSTALLER_NAME" | awk '{print $1}')" = "$INSTALLER_DIGEST"
          package="$(dpkg-deb -f "$ARTIFACT_NAME" Package)"
          version="$(dpkg-deb -f "$ARTIFACT_NAME" Version)"
          architecture="$(dpkg-deb -f "$ARTIFACT_NAME" Architecture)"
          test "$architecture" = amd64
          if dpkg-query -W "$package" >/dev/null 2>&1; then
            echo '::error::Linux certification requires a clean runner without the Desktop package preinstalled.'
            exit 1
          fi
          bash "$INSTALLER_NAME" --desktop --release-tag "$RELEASE_TAG" --no-open
          test "$(dpkg-query -W -f='\${Version}' "$package")" = "$version"
          test "$(dpkg-query -W -f='\${Architecture}' "$package")" = "$architecture"
          jq -n --arg tag "$RELEASE_TAG" --arg name "$ARTIFACT_NAME" --arg digest "$ARTIFACT_DIGEST" \
            --arg package "$package" --arg version "$version" --arg architecture "$architecture" \
            '{schema:"opl_app_linux_same_tag_desktop_install.v1",status:"passed",release_tag:$tag,artifact:{name:$name,digest:$digest},installed_package:{name:$package,version:$version,architecture:$architecture},rebuilt:false,remaining:[]}' \
            > linux-x64-same-tag-install.json
      - name: Upload Linux Desktop certification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opl-linux-desktop-certification-${{ github.run_id }}
          path: linux-x64-same-tag-install.json
          if-no-files-found: error
          retention-days: 30

  admit-macos-vm:
    if: ${{ needs.resolve-release-set.outputs.applicable == 'true' }}
    needs: [resolve-release-set]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      eligible: ${{ steps.capability.outputs.eligible }}
      reason_code: ${{ steps.capability.outputs.reason_code }}
    steps:
      - name: Admit exact Tart capability for post-publication certification
        id: capability
        env:
          GH_TOKEN: ${{ secrets.OPL_RUNNER_INVENTORY_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runners?per_page=100" > runners.json; then
            echo 'eligible=false' >> "$GITHUB_OUTPUT"
            echo 'reason_code=operator_deferred' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          eligible="$(jq -r '
            [.[]?.runners[]? | select(
              .status == "online" and .busy == false
              and ([.labels[].name] | index("self-hosted") != null)
              and ([.labels[].name] | index("macOS") != null)
              and ([.labels[].name] | index("ARM64") != null)
              and ([.labels[].name] | index("opl-cert-mac-tart") != null)
            )] | length > 0
          ' runners.json)"
          if [ "$eligible" = true ]; then
            echo 'eligible=true' >> "$GITHUB_OUTPUT"
            echo 'reason_code=admitted' >> "$GITHUB_OUTPUT"
          else
            echo 'eligible=false' >> "$GITHUB_OUTPUT"
            echo 'reason_code=operator_deferred' >> "$GITHUB_OUTPUT"
          fi

  certify-standard-vm:
    if: ${{ needs.resolve-release-set.outputs.applicable == 'true' && needs.admit-macos-vm.outputs.eligible == 'true' }}
    needs: [resolve-release-set, admit-macos-vm]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/opl-first-run-vm.yml
    with:
      mode: execute
      release_tag: ${{ needs.resolve-release-set.outputs.tag }}
      published_artifact_name: ${{ needs.resolve-release-set.outputs.standard_artifact_name }}
      published_artifact_digest: ${{ needs.resolve-release-set.outputs.standard_artifact_digest }}
      artifact_app_ref: ${{ needs.resolve-release-set.outputs.app_sha }}
      shell_ref: ${{ needs.resolve-release-set.outputs.shell_sha }}
      smoke_harness_ref: ${{ needs.resolve-release-set.outputs.shell_sha }}
      framework_ref: ${{ needs.resolve-release-set.outputs.framework_sha }}
      package_profile: standard
      diagnostic_scope: post_publication_optional_certification
      require_macos_gatekeeper: true

  certify-full-vm:
    if: ${{ needs.resolve-release-set.outputs.applicable == 'true' && needs.admit-macos-vm.outputs.eligible == 'true' }}
    needs: [resolve-release-set, admit-macos-vm]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/opl-first-run-vm.yml
    with:
      mode: execute
      release_tag: ${{ needs.resolve-release-set.outputs.tag }}
      published_artifact_name: ${{ needs.resolve-release-set.outputs.full_artifact_name }}
      published_artifact_digest: ${{ needs.resolve-release-set.outputs.full_artifact_digest }}
      artifact_app_ref: ${{ needs.resolve-release-set.outputs.app_sha }}
      shell_ref: ${{ needs.resolve-release-set.outputs.shell_sha }}
      smoke_harness_ref: ${{ needs.resolve-release-set.outputs.shell_sha }}
      framework_ref: ${{ needs.resolve-release-set.outputs.framework_sha }}
      package_profile: full
      diagnostic_scope: post_publication_optional_certification
      require_macos_gatekeeper: true

  receipt:
    if: ${{ always() }}
    needs: [resolve-release-set, certify-linux-x64, admit-macos-vm, certify-standard-vm, certify-full-vm]
    runs-on: ubuntu-latest
    steps:
      - name: Write Desktop Release Set certification receipt
        shell: bash
        run: |
          jq -n --arg tag '${{ needs.resolve-release-set.outputs.tag }}' \
            --arg source '${{ needs.resolve-release-set.outputs.source_run_id }}' \
            --arg applicable '${{ needs.resolve-release-set.outputs.applicable }}' \
            --arg reason '${{ needs.resolve-release-set.outputs.reason_code }}' \
            --arg linux '${{ needs.certify-linux-x64.result }}' \
            --arg admission '${{ needs.admit-macos-vm.outputs.reason_code }}' \
            --arg standard '${{ needs.certify-standard-vm.result }}' \
            --arg full '${{ needs.certify-full-vm.result }}' \
            '{schema:"opl_app_desktop_release_set_certification.v1",status:(if $applicable == "true" then "complete" else "not_applicable" end),applicable:($applicable == "true"),reason_code:$reason,release_tag:$tag,source_run_id:$source,linux_x64:$linux,macos_vm_admission:$admission,macos_standard:$standard,macos_full:$full,required_for_publication:false,remaining:[]}' \
            > desktop-release-set-certification.json
      - name: Upload Desktop Release Set certification receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opl-desktop-release-set-certification-${{ github.run_id }}
          path: desktop-release-set-certification.json
          if-no-files-found: error
          retention-days: 30
