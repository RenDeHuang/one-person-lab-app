name: OPL Full Runtime Cache Warmup

on:
  workflow_call:
    inputs:
      opl_version:
        description: OPL version stamp for the cache evidence. Empty uses the current UTC date version.
        required: false
        default: ''
        type: string
      framework_ref:
        description: OPL Framework ref to bundle. Empty means main.
        required: false
        default: main
        type: string
      shell_ref:
        description: opl-aion-shell ref to bundle. Empty means main.
        required: false
        default: main
        type: string
      force_rebuild_runtime_cache:
        description: Ignore restored Full runtime layer cache and rebuild all layers
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: opl-full-runtime-cache-warmup-${{ inputs.opl_version || 'current' }}-${{ inputs.framework_ref || 'main' }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  resolve-version:
    name: Resolve exact warmup cohort
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      app_sha: ${{ steps.cohort.outputs.app_sha }}
      framework_sha: ${{ steps.cohort.outputs.framework_sha }}
      shell_sha: ${{ steps.cohort.outputs.shell_sha }}

    steps:
      - name: Require canonical main writer
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main' || { echo "::error::Full runtime cache warmup is restricted to refs/heads/main."; exit 1; }

      - name: Checkout App cohort source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          path: app-source

      - name: Checkout Shell cohort source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: gaofeng21cn/opl-aion-shell
          ref: ${{ inputs.shell_ref || 'main' }}
          path: shell-source

      - name: Checkout Framework cohort source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: gaofeng21cn/one-person-lab
          ref: ${{ inputs.framework_ref || 'main' }}
          path: framework-source

      - name: Resolve exact cohort SHAs
        id: cohort
        shell: bash
        run: |
          set -euo pipefail
          app_sha="$(git -C app-source rev-parse HEAD)"
          shell_sha="$(git -C shell-source rev-parse HEAD)"
          framework_sha="$(git -C framework-source rev-parse HEAD)"
          for sha in "$app_sha" "$shell_sha" "$framework_sha"; do
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Warmup cohort did not resolve to exact SHAs."; exit 1; }
          done
          test "$app_sha" = "$GITHUB_SHA" || { echo "::error::Warmup App SHA drifted from the workflow controller SHA."; exit 1; }
          echo "app_sha=$app_sha" >> "$GITHUB_OUTPUT"
          echo "shell_sha=$shell_sha" >> "$GITHUB_OUTPUT"
          echo "framework_sha=$framework_sha" >> "$GITHUB_OUTPUT"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.opl_version }}"
          if [ -z "$version" ]; then
            version="$(date -u +'%y.%-m.%-d')"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid OPL release version: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  warmup:
    name: Warm Full runtime layer cache
    needs: resolve-version
    uses: ./.github/workflows/full-first-install-release.yml
    with:
      opl_version: ${{ needs.resolve-version.outputs.version }}
      framework_ref: ${{ needs.resolve-version.outputs.framework_sha }}
      shell_ref: ${{ needs.resolve-version.outputs.shell_sha }}
      artifact_app_sha: ${{ needs.resolve-version.outputs.app_sha }}
      controller_workflow_sha: ${{ needs.resolve-version.outputs.app_sha }}
      upload_full_package_artifact: false
      cache_only: true
      force_rebuild_runtime_cache: ${{ inputs.force_rebuild_runtime_cache == true }}
