name: Release Apple Credentials Preflight

on:
  workflow_dispatch:
    inputs:
      large_dmg_canary:
        description: Sign a synthetic Full-sized ULMO DMG without submitting it for notarization.
        required: true
        default: false
        type: boolean
      notary_submission_id:
        description: Optional exact existing Apple submission UUID to reconcile read-only.
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: opl-release-apple-credentials-preflight
  cancel-in-progress: false

jobs:
  validate:
    name: Diagnose protected Apple credential readiness
    runs-on: macos-latest
    timeout-minutes: 45
    environment: release-stable
    steps:
      - name: Checkout exact preflight source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Import Developer ID identity and authenticate notarization
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          IDENTITY: ${{ secrets.IDENTITY }}
          NOTARY_SUBMISSION_ID: ${{ inputs.notary_submission_id }}
          OPL_MACOS_RUNNER_LABEL: macos-latest
        run: |
          args=(--output "$RUNNER_TEMP/apple-release-credentials-preflight.json")
          if [ '${{ inputs.large_dmg_canary }}' = true ]; then
            args+=(--large-dmg-canary)
          fi
          if [ -n "$NOTARY_SUBMISSION_ID" ]; then
            args+=(--notary-submission-id "$NOTARY_SUBMISSION_ID")
          fi
          node --experimental-strip-types scripts/verify-apple-release-credentials.ts "${args[@]}"

      - name: Upload sanitized Apple credential preflight receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opl-apple-release-credentials-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/apple-release-credentials-preflight.json
          if-no-files-found: warn
          retention-days: 30

      - name: Summarize diagnostic-only result
        run: |
          notary_submission_id="$(jq -r '.notarization.submission_reconcile.submission_id // "not requested"' "$RUNNER_TEMP/apple-release-credentials-preflight.json")"
          notary_status="$(jq -r '.notarization.submission_reconcile.apple_status // "not requested"' "$RUNNER_TEMP/apple-release-credentials-preflight.json")"
          {
            echo '## Apple credential diagnostic passed'
            echo
            echo '- Stable admission authority: false'
            echo '- Standard dispatch performed: false'
            echo '- Notarization submission performed: false'
            echo "- Existing notarization submission: $notary_submission_id"
            echo "- Existing notarization status: $notary_status"
            echo '- Large DMG canary requested: ${{ inputs.large_dmg_canary }}'
            echo '- Signing runner: macos-latest (arm64)'
            echo '- Continue through the single release-stable.yml entry with an exact source qualification receipt.'
          } >> "$GITHUB_STEP_SUMMARY"
