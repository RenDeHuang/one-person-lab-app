name: Release Apple Credentials Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opl-release-apple-credentials-preflight
  cancel-in-progress: false

jobs:
  validate:
    name: Validate protected Apple release credentials
    runs-on: macos-14
    timeout-minutes: 10
    environment: release-stable

    steps:
      - name: Checkout exact preflight source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'

      - name: Import Developer ID identity and authenticate notarization
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          IDENTITY: ${{ secrets.IDENTITY }}
        run: |
          node --experimental-strip-types scripts/verify-apple-release-credentials.ts \
            --output "$RUNNER_TEMP/apple-release-credentials-preflight.json"

      - name: Upload sanitized Apple credential preflight receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: opl-apple-release-credentials-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/apple-release-credentials-preflight.json
          if-no-files-found: error
          retention-days: 30
