name: Release Apple Credentials Preflight

on:
  workflow_dispatch:
    inputs:
      base_version:
        description: Asia/Shanghai Stable base CalVer for allocator, for example 26.7.25
        required: true
        type: string
      shell_ref:
        description: Exact current Shell main SHA
        required: true
        type: string
      framework_ref:
        description: Exact current Framework main SHA
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: opl-release-apple-credentials-preflight
  cancel-in-progress: false

jobs:
  validate:
    name: Validate protected credentials and seal Stable admission
    runs-on: macos-14
    timeout-minutes: 15
    environment: release-stable
    outputs:
      manifest_digest: ${{ steps.admission.outputs.manifest_digest }}
      version: ${{ steps.admission.outputs.version }}
      updater_version: ${{ steps.admission.outputs.updater_version }}

    steps:
      - name: Checkout exact preflight source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'

      - name: Import Developer ID identity and authenticate notarization
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          IDENTITY: ${{ secrets.IDENTITY }}
        run: |
          node --experimental-strip-types scripts/verify-apple-release-credentials.ts \
            --output "$RUNNER_TEMP/apple-release-credentials-preflight.json"

      - name: Seal exact Stable admission manifest
        id: admission
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_VERSION: ${{ inputs.base_version }}
          SHELL_REF: ${{ inputs.shell_ref }}
          FRAMEWORK_REF: ${{ inputs.framework_ref }}
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/stable-release-admission-manifest.ts create \
            --base-version "$BASE_VERSION" \
            --app-ref "$GITHUB_SHA" \
            --shell-ref "$SHELL_REF" \
            --framework-ref "$FRAMEWORK_REF" \
            --admission-run-id "$GITHUB_RUN_ID" \
            --credential-receipt "$RUNNER_TEMP/apple-release-credentials-preflight.json" \
            --output "$RUNNER_TEMP/stable-release-admission-manifest.json"
          node - "$RUNNER_TEMP/stable-release-admission-manifest.json" "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY" <<'NODE'
          const fs = require('fs');
          const [manifestPath, outputPath, summaryPath] = process.argv.slice(2);
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          fs.appendFileSync(outputPath, [
            `manifest_digest=${manifest.manifest_digest}`,
            `version=${manifest.version.display}`,
            `updater_version=${manifest.version.updater}`,
            '',
          ].join('\n'));
          fs.appendFileSync(summaryPath, [
            '## Stable admission sealed',
            '',
            `- Version: ${manifest.version.display}`,
            `- Updater: ${manifest.version.updater}`,
            `- App: ${manifest.cohort.app_sha}`,
            `- Shell: ${manifest.cohort.shell_sha}`,
            `- Framework: ${manifest.cohort.framework_sha}`,
            `- Manifest: ${manifest.manifest_digest}`,
            '',
            'No Standard dispatch, notarization submission, tag, Release, or public asset mutation was performed.',
            '',
          ].join('\n'));
          NODE

      - name: Upload sanitized Apple credential preflight receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: opl-apple-release-credentials-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/apple-release-credentials-preflight.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload immutable Stable admission
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: opl-stable-admission-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/stable-release-admission-manifest.json
            ${{ runner.temp }}/apple-release-credentials-preflight.json
          if-no-files-found: error
          retention-days: 30
