name: Release Timestamp Authority Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opl-release-timestamp-authority-diagnostic
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  diagnose:
    name: Diagnose hosted Apple timestamp authority path
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact diagnostic source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"

      - name: Probe and verify Apple RFC3161 timestamp authority
        id: tsa
        continue-on-error: true
        run: >-
          node --experimental-strip-types scripts/diagnose-apple-timestamp-authority.ts
          --output "$RUNNER_TEMP/apple-timestamp-authority-diagnostic.json"

      - name: Upload typed timestamp authority diagnostic
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: opl-apple-timestamp-authority-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/apple-timestamp-authority-diagnostic.json
          if-no-files-found: error
          retention-days: 30

      - name: Summarize and enforce diagnostic result
        if: ${{ always() }}
        env:
          OPL_TSA_STEP_OUTCOME: ${{ steps.tsa.outcome }}
          OPL_TSA_RECEIPT: ${{ runner.temp }}/apple-timestamp-authority-diagnostic.json
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const receipt = JSON.parse(fs.readFileSync(process.env.OPL_TSA_RECEIPT, 'utf8'));
          const lines = [
            '## Apple timestamp authority diagnostic',
            '',
            `- Status: ${receipt.status}`,
            `- Endpoint: ${receipt.endpoint}`,
            `- HTTP: ${receipt.response?.http_status ?? 'not reached'}`,
            `- Duration: ${receipt.response?.duration_ms ?? 'unknown'} ms`,
            `- Query/response binding: ${receipt.verification?.query_response_binding}`,
            `- Signer chain to system root: ${receipt.verification?.signer_chain_to_system_root}`,
            `- Production credentials used: ${receipt.production_credentials_used}`,
            `- Release mutation authorized: ${receipt.mutation_authorized}`,
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`);
          if (process.env.OPL_TSA_STEP_OUTCOME !== 'success' || receipt.status !== 'passed') {
            console.error(`Apple timestamp authority diagnostic failed: ${receipt.failure?.code ?? 'unknown'}`);
            process.exit(1);
          }
          NODE
